        { q: "Žarenje čelika za redukciju napetosti provodi se", options: ["sporim ugrijavanjem na temperature ispod temperature prekristalizacije, držanje dovoljno dugo vremena te veoma sporo hlađenje kako bi se spriječilo nastajanje toplinskih napetosti", "sporim ugrijavanjem na temperature iznad temperature prekristalizacije, držanje dovoljno dugo vremena te veoma sporo hlađenje kako bi se spriječilo nastajanje toplinskih napetosti", "brzim ugrijavanjem na 150 ºC te brzim hlađenjem", "sporim ugrijavanjem na 150 ºC te brzim hlađenjem"], correct: [0], note: "Žarenje za redukciju napetosti: sporo zagrijavanje na temperaturu ispod A1 (oko 400–650 °C), držanje barem oko 2 h i vrlo sporo hlađenje, da ne nastanu nove toplinske napetosti." },
        { q: "Zavarivanje djeluje na čelik izazivajući", options: ["strukturne modifikacije", "promjene kemijskog sastava", "modifikacije specisičnog volumena", "promjene tvrdoće"], correct: [0, 1, 2, 3], note: "Zavarivanje mijenja strukturu (ZUT), kemijski sastav (miješanje, izgaranje elemenata), specifični volumen (fazne pretvorbe, napetosti) i tvrdoću." },
        { q: "Zona hladnog loma nalazi se", options: ["najbliže metalu zavara", "najdalje metalu zavara", "uz zonu pregrijavanja", "uz zonu rekristalizacije"], correct: [1, 3], note: "Ispravljeno: zona plavog (hladnog) loma (oko 200–500 °C) najudaljenija je zona ZUT-a od metala zavara i nalazi se uz zonu rekristalizacije. Zbirka je ovdje navodila samo „najdalje“, a u drugoj verziji pitanja oba odgovora." },
        { q: "Nestacionarno toplinsko polje tijekom polaganja sloja od početka do kraja u usporedbi s kvazistacionarnim poljem karakterizirano je", options: ["manjim brzinama hlađenja", "većim brzinama hlađenja", "jednakim brzinama hlađenja", "ovisnošću od slučaja do slučaja"], correct: [1], note: "Ispravljeno prema drugom izvoru iz zbirke: na početku zavara osnovni materijal još je hladan, pa nestacionarno polje ima veće brzine hlađenja od kvazistacionarnog. ⚠️ Izvori se ovdje razilaze (u ovoj zbirci stajalo je „manjim“), pa provjeri na slajdu." },
        { q: "Sitnozrnati čelici u odnosu na opće konstrukcijske imaju", options: ["višu granicu razvlačenja", "sitnije zrno", "veći mogul elastičnosti", "bolju lomnu žilavost"], correct: [0, 1, 3], note: "Sitnozrnati čelici imaju sitnije zrno, višu granicu razvlačenja i bolju (lomnu) žilavost. Modul elastičnosti je za sve čelike praktički isti." },
        { q: "Prijelazna temperatura je", options: ["temperatura kod koje je udarni rad loma optimalan", "temperatura ispod koje udarni rad loma naglo pada", "karakteristična za BCC materijale", "karakteristična za FCC materijale"], correct: [1, 2], note: "Ispravljeno: prijelazna temperatura je temperatura ispod koje udarni rad loma naglo pada (prijelaz iz žilavog u krhki lom), a karakteristična je za BCC materijale. FCC materijali (austenit, Al, Cu) nemaju takav prijelaz." },
        { q: "Kada se ocjenjuju mikrolegirani čelici najvažnija svojstva koja treba uzeti u obzir su:", options: ["vlačna čvrstoća", "granica popuštanja", "prijelazna temperatura", "tvrdoća"], correct: [1, 2], note: "Ispravljeno: kod mikrolegiranih čelika cilj je visoka granica razvlačenja (popuštanja) uz dobru žilavost, odnosno nisku prijelaznu temperaturu, i to se najviše ocjenjuje. To piše i u komentaru zbirke, iako je kao točnu označila vlačnu čvrstoću. ⚠️ Provjeri na slajdu (Tema 2.10, str. 20)." },
        { q: "Precipitacijski očvrstivi (PH) čelici su:", options: ["feritni", "ultračvrsti", "martenzitni", "za poboljšavanje"], correct: [1, 2], note: "PH (precipitacijski očvrstivi) nehrđajući čelici spadaju u ultračvrste i najčešće su martenzitni (npr. 17-4 PH), a postoje i poluaustenitni. Očvršćuju se starenjem, ne poboljšavanjem." },
        { q: "Koja karakteristika ukazuje na pukotine uslijed ponovnog žarenja", options: ["pucanje u ZUT-u tijekom naknadne toplinske obrade zavarenog spoja", "pucanje u MZ-a tijekom naknadne toplinske obrade zavarenog spoja", "pucanje po granicama zrna", "pucanje preko granica zrna"], correct: [0], note: "Pukotine zbog naknadnog žarenja (reheat cracking) nastaju u grubozrnatom ZUT-u tijekom PWHT-a ili rada na visokoj temperaturi. Kod CrMo(V) čelika uzrok je izlučivanje karbida unutar zrna." },
        { q: "Što je vodikom inducirana krhkost (HIC) kod HSLA čelika", options: ["poseban slučaj opće korozije metala", "poseban slučaj napetosne korozije metala", "poseban slučaj unutarnjeg oštećenja metalne konstrukcije", "interkristalna korozija"], correct: [1], note: "HIC (vodikom inducirano pucanje) kod HSLA čelika svrstava se kao poseban slučaj napetosne korozije: atomarni vodik iz korozijske reakcije (npr. u H2S) ulazi u čelik i uz naprezanje stvara pukotine. (U izvorniku je prvi odgovor bio oštećen.)" },
        { q: "Što se apsorbira u metalu i uzrokuje HIC", options: ["vodikov ion H*", "molekula vodika H2", "vodikov atom H", "molekula dušuka N2"], correct: [2], note: "U metal može ući samo atomarni vodik (H), jer je dovoljno malen za difuziju kroz rešetku. U čeliku se na uključcima spaja u molekule H2 pod velikim tlakom i stvara pukotine." },
        { q: "Implant je proba sklonosti", options: ["toplim pukotinama", "hladnim pukotinama", "koroziji", "vrućim pukotinama"], correct: [1], note: "Implant test (kao i Tekken, CTS i Lehigh) ispituje sklonost hladnim pukotinama. Za tople pukotine služe Varestraint i FISCO test." },
        { q: "Označite grupu elemenata koji svi povećavaju opasnost pojave pukotina u metalu zavara uslijed naknadnog žarenja za niskolegirane Cr-Mo čelike", options: ["P, S, N, Ti", "P, Sb, Sn, As", "P, O, Cu, Al", "P, C, Nb, Ti"], correct: [0], note: "Ključ iz zbirke (autor nesiguran). Pukotinama zbog naknadnog žarenja CrMo čelika pogoduju karbidotvorci (Ti, Nb, V) i nečistoće (P, S, N, Sb, Sn, As). ⚠️ U literaturi se često navodi i skupina P, Sb, Sn, As, pa provjeri na slajdu." },
        { q: "Niskolegirani čelici mogu se primjeniti na", options: ["lopatice parnih turbina", "lopatice plinskih turbina", "raketne motore", "kotlove"], correct: [0, 1, 3], note: "Ključ iz zbirke: niskolegirani (CrMo, CrMoV) čelici koriste se za kotlove i lopatice parnih turbina. ⚠️ Lopatice plinskih turbina danas se izrađuju od superlegura, pa je taj odgovor upitan." },
        { q: "Jamičastu ili rupičastu koroziju (Pitting) nerđajućih čelika izaziva", options: ["jaka kiselost vodene otopine", "prisutnost klorida i oksidansa npr O2, Fe 3+ u vodenoj otopini", "visoka temperatura vodene otopine", "brzo relativno gibanje vodene otopine u odnosu na čelik"], correct: [1], note: "Rupičastu koroziju nehrđajućih čelika izazivaju kloridni ioni uz prisutnost oksidansa (O2, Fe³⁺), koji lokalno razaraju pasivni sloj. Kiselost i povišena temperatura je ubrzavaju, ali nisu osnovni uzrok." },
        { q: "Izlučivanje Cr-karbida kod CrNi čelika je najintenzivnije pri temperaturi", options: ["100-200 ºC", "200-400 ºC", "900-1000 ºC", "400-900 ºC"], correct: [3], note: "Cr-karbidi (Cr23C6) najintenzivnije se izlučuju u području oko 450–850 °C, pa je od ponuđenih točno 400–900 °C. Ispod je difuzija prespora, a iznad 900–1000 °C karbidi se otapaju." },
        { q: "Koje tvrdnje su točne u pogledu trošenja abrazijom", options: ["glavni mehanizam trošenja kod toplog valjanja je abrazija", "normalno trošenje između cilindra i klipnih prstena je adhezijska abrazija", "iznos abrazije uslijed djelovanja abrazivnih čestica obično nije povezan s razinom naprezanja", "trošenje na zubima rovokopača i čekićima drobilice smatra se tipičnim abrazijskim trošenjem česticama"], correct: [3], note: "Zubi bagera i čekići drobilica tipičan su primjer abrazije tvrdim česticama (kamen). Kod toplog valjanja prevladavaju toplinski umor i oksidacija, a abrazija ovisi o naprezanju." },
        { q: "Umor površine pretežno nastaje kod", options: ["klizanja", "kotrljanja", "erozije kapljicama", "kavitacije"], correct: [1], note: "Umor površine nastaje pretežno kod kotrljanja (ležajevi, zupčanici): ciklička kontaktna naprezanja stvaraju pukotine ispod površine, iz kojih se onda odlamaju komadići (pitting)." },
        { q: "Pri zavarivanju platiranog čelika (ugljično-manganski čelik kao osnovni materijal i AISI 304 kao korozijski otporan sloj)", options: ["potrebno je primjeniti jednako predgrijavanje za osnovni materijal i korozijski otporan sloj", "prvi sloj platiranja može se izvesti s dodatnim materijalom kvalitete AISI 309", "cijeli sloj može se izvesti s dodatnim materijalom kvalitete AISI 309 ako je pristupačnost spoju otežana", "potrebno je izbjeći miješanje platiranog sloja s dodatnim materijalom kojim je zavaren osnovni materijal"], correct: [1, 2, 3], note: "Ispravljeno: kod platiranog čelika najvažnije je da se korozijski sloj ne pomiješa s dodatnim materijalom za ugljični čelik. Zato se prvi sloj na platiranoj strani izvodi s prelegiranim 309, a kad nema pristupa s obje strane, cijeli spoj se zavaruje s 309 (isto kao u pitanju o obloženim cijevima). Zbirka je navodila samo izbjegavanje miješanja." },
        { q: "Zavari visoke kakvoće (bez grešaka) pri spajanju dezoksidiranog bakra mogu se postići slijedećim postupcima", options: ["mekim lemljenjem", "TIG zavarivanjem s dvostranom zaštitom", "MIG zavarivanjem s posebnim DM koji sadrži veliki postotak dezoksidirajućih elemenata", "nista od navedenog nije točno"], correct: [1], note: "Dezoksidirani bakar (Cu-DHP) kvalitetno se zavaruje TIG postupkom uz plinsku zaštitu s obje strane (formiranje korijena). Meko lemljenje nije zavarivanje i ne daje čvrst spoj." },
        { q: "Mjed je legura", options: ["Cu-Zn", "Cu-Sn", "Cu-Al", "Cu-Zn-Sn-Pb"], correct: [0], note: "Mjed (mesing) je legura bakra i cinka (Cu-Zn). Cu-Sn i Cu-Al su bronce." },
        { q: "Hladnom deformacijom", options: ["nije moguće očvrsnuti Cu legure", "moguće je očvrsnuti Cu legure", "moguće je očvrsnuti Cu legure jer se javlja precipitacijsko očvršćavanje", "nije moguće očvrsnuti Cu legure jer se ne javlja precipitacijsko očvršćavanje"], correct: [1], note: "Cu legure se mogu očvrsnuti hladnom deformacijom, gibanjem i umnažanjem dislokacija; to nije precipitacijsko očvršćivanje." },
        { q: "Monel je legura Ni slijedećeg sastava", options: ["67% Ni, 30% Cu, 1.5% Fe, 1% Mn", "80% Ni, 15% Cr, 5% Fe", "90% Ni, 5% Cr, 5% Fe", "60% Ni, 20% Cr, 20% Fe"], correct: [0], note: "Monel (Alloy 400, NiCu30Fe) ima oko 67 % Ni i 30 % Cu. Sastav 80 % Ni, 15 % Cr, 5 % Fe je Inconel. (Četvrti odgovor u izvorniku bio je nečitak, pa je zamijenjen.)" },
        { q: "Sklonost vrućim pukotinama kod zavarivanja Ni legura ovisi najviše o:", options: ["sadržaju Mn", "sadržaju S", "sadržaju C", "sadržaju Cr"], correct: [1], note: "Sklonost toplim pukotinama kod Ni legura najviše ovisi o sumporu (nisko taljivi Ni3S2 eutektik na oko 637 °C). Štetni su i P, Pb, Bi i B." },
        { q: "Al legure imaju slijedeća svojstva", options: ["malu gustoću (2.7 kg/dm3)", "pogodnost za plastično preoblikovanje", "visoku toplinsku vodljivost", "malu gustoću (1.2kg/dm3)"], correct: [0, 1, 2], note: "Al legure imaju malu gustoću (oko 2,7 kg/dm³), dobro se plastično oblikuju i imaju visoku toplinsku vodljivost. Gustoću oko 1,7 kg/dm³ ima magnezij." },
        { q: "Al legure se obično upotrebljavaju u:", options: ["zrakoplovnoj industriji", "auto industriji", "kotlogradnji", "izradi svrdla za naftne bušotine"], correct: [0, 1], note: "Al legure se najviše koriste u zrakoplovnoj i auto industriji (mala masa). Za kotlove i svrdla nisu prikladne, zbog niske čvrstoće na visokim temperaturama i male tvrdoće." },
        { q: "Kod TIG zavarivanja Al legura uz primjenu DM:", options: ["preporučuje se predgrijavanje", "ne preporučuje se predgrijavanje", "uz dobru tehniku rada zavarivača, predgrijavanje nikada neće biti potrebno", "preporučuje se predgrijavanje samo kad je okolišna temperatura ispod 0 ºC"], correct: [0], note: "Aluminij jako odvodi toplinu, pa se kod debljih presjeka preporučuje predgrijavanje (umjereno, obično do oko 100–150 °C, ne previše zbog pada čvrstoće)." },
        { q: "Kod MIG zavarivanja Al legura uobičajeno se koristi", options: ["\"push-pull\" sistem dodavanja žice", "\"push-push\" sistem dodavanja žice", "\"pull-pull\" sistem dodavanja žice", "uređaji zavarivanja sa ravnom karakteristikom"], correct: [0, 3], note: "Aluminijska žica je mekana pa se lako izvija, zato se koristi push-pull sustav dodavanja. Izvor struje ima ravnu (CV) karakteristiku, kao kod svakog MIG zavarivanja." },
        { q: "Odabrati točnu tvrdnju", options: ["kakvoća i svojstva zavarenog spoja raznorodnih čelika u vrlo velikoj mjeri ovise o izboru DM", "kod zavarivanja spoja raznorodnih čelika, izbor DM nije bitan, osnovno je paziti na pripremu spoja", "raznorodne čelike nije moguće kvalitetno zavariti", "ukoliko se zavaruje ugljični čelik i austenitni visokolegirani, dolazi do difuzije ugljika iz ugljičnog čelika u austenitni visokolegirani čelik"], correct: [0, 3], note: "Kakvoća raznorodnog spoja najviše ovisi o izboru dodatnog materijala (prelegiran, 309 ili na bazi Ni). Ugljik pri povišenim temperaturama difundira iz ugljičnog čelika prema austenitnom, pa uz liniju staljivanja nastaje razugljičena zona." },
        { q: "Cr i Ni ekvivalent su pojmovi koji se upotrebljavaju kod", options: ["zavarivanja raznorodnih čelika", "primjeni Schaefflerovog dijagrama", "određivanju temperature predgrijavanja", "određivanju C ekv"], correct: [0, 1], note: "Cr- i Ni-ekvivalent koriste se u Schaefflerovom (i De Longovom, WRC) dijagramu, prvenstveno kod zavarivanja raznorodnih čelika. Za predgrijavanje služi Cekv." },
        { q: "Stupanj protaljivanja (miješanja) kod zavarivanja raznorodnih čelika znatno ovisi o", options: ["snazi izvora struje (unosu topline)", "toplinskim i fizikalnim svojstvima materijala", "oblikovanju spoja", "temperaturi okoline"], correct: [0, 1, 2], note: "Ispravljeno: dilucija ovisi o unosu topline, toplinskim i fizikalnim svojstvima materijala (vodljivost, talište) i obliku spoja. Zbirka je ovdje izostavila svojstva materijala, iako ih u drugoj verziji istog pitanja navodi kao točna." },
        { q: "100% bainitna struktura može se dobiti", options: ["kaljenjem", "klasičnim poboljšavanjem", "izotermičkim poboljšavanjem", "izotermičkim žarenjem"], correct: [2], note: "Potpuno bainitna struktura dobiva se izotermičkim poboljšavanjem (austempering): gašenjem u kupki iznad Ms i držanjem dok se sav austenit ne pretvori u bainit." },
        { q: "Kod kojeg osnovnog mehanizma trošenja početak trošenja se ne javlja na mjestu kontakta funkcionalnih dijelova", options: ["abrazije", "adhezije", "umora površine", "tribokorozije"], correct: [2], note: "Kod umora površine pukotine počinju ispod površine kontakta, gdje su smična naprezanja najveća. Abrazija, adhezija i tribokorozija počinju na samoj površini dodira." },
        { q: "Martenzitni PH čelici imaju:", options: ["1-10% Cr i 2-3% Ni", "14-17% Cr i 4-6% Ni", "10-12% Cr i 10-12% Ni", "12-13% Cr i 8-9% Ni"], correct: [1], note: "Martenzitni PH čelici (npr. 17-4 PH) imaju oko 14–17 % Cr, 4–6 % Ni, oko 3 % Cu i malo C. Bakar i Nb se pri starenju izlučuju i očvrsnu martenzit." },
        { q: "Koji se materijal može primjeniti za temperature -50 ºC", options: ["sivi lijev", "visokougljični čelici", "sitnozrnati čelici", "feritični nerđajući čelici"], correct: [2], note: "Za oko −50 °C koriste se sitnozrnati (mikrolegirani) čelici, jer sitno zrno snizuje prijelaznu temperaturu. Sivi lijev, visokougljični i feritni nehrđajući čelici na tim su temperaturama krhki." },
        { q: "Koji od navedenih elemenata ima najbolji utjecaj na prokaljivost", options: ["Cr", "Mn", "Al", "Cu"], correct: [0], note: "Ključ iz zbirke je Cr. Krom snažno povećava prokaljivost, a jak je i Mn, pa se ovo pitanje smatra nesigurnim. Al i Cu imaju mali utjecaj." },
        { q: "Dodavanje legirnih elemenata niskolegiranim feritnim čelicima općenito", options: ["povećava duktilnost", "smanjuje prokaljivost", "povećava prokaljivost", "smanjuje zavarljivost"], correct: [2, 3], note: "Ispravljeno: legirni elementi niskolegiranih čelika povećavaju prokaljivost (TTT krivulje idu udesno), a time i Cekv, pa smanjuju zavarljivost. Zbirka je ovdje navodila samo zavarljivost, a u drugoj verziji pitanja oba odgovora." },
        { q: "Razlozi zbog kojih je višeslojni zavar obično žilaviji od jednoslojnog su", options: ["stvaranje izvjesne količine martenzita", "toplina jednog prolaza normalizira prethodni", "toplina jednog prolaza usitnjuje zrna prethodnog prolaza", "toplina jednog prolaza povećava zrna prethodnog prolaza"], correct: [1, 2], note: "Svaki sljedeći prolaz zagrijava prethodni iznad A3 i normalizira ga, odnosno usitnjava zrno, pa je višeslojni zavar žilaviji. Martenzit i grubo zrno smanjuju žilavost." },
        { q: "Koje od navedenih tvrdnji o hladnim pukotinama izazvanim vodikom su točne", options: ["nerazorna ispitivanja se moraju obaviti što je moguće prije, odmah nakon završetka zavarivanja", "pukotine se mogu pojaviti i u ZUT i u MZ", "pukotine se mogu nekad izbjeći primjenom većeg unosa topline", "manji sadržaj ugljika u osnovnom metalu smanjuje opasnost od pojave pukotina"], correct: [1, 2, 3], note: "Ispravljeno: hladne pukotine javljaju se i u ZUT-u i u metalu zavara, veći unos topline (sporije hlađenje) ih može spriječiti, a manji udio ugljika smanjuje zakaljivost i opasnost. Nerazorna ispitivanja treba odgoditi (npr. 24–48 h), jer se pukotine javljaju sa zakašnjenjem." },
        { q: "Lamelarno trganje ovisi o/ izazvano je", options: ["kemijskim sastavom OM", "nezadovoljavajućim svojstvima u smjeru osi Z", "nezadovoljavajućim svojstvima u smjeru osi X-Y", "preniskom žilavošću"], correct: [0, 1], note: "Lamelarno trganje ovisi o kemijskom sastavu osnovnog materijala (sumpor, sulfidni uključci) i lošim svojstvima u smjeru debljine (os Z, mala kontrakcija ZD)." },
        { q: "Koje od navedenih kristalografskih rešetki sadrže gusto složene klizne ravnine", options: ["FCC", "HCP", "BCC", "CS"], correct: [0, 1], note: "FCC klizi po gusto složenim ravninama {111}, a HCP po gusto složenoj bazalnoj ravnini (0001), pa su točne obje. FCC ima više takvih kliznih sustava (12 prema 3), pa je duktilniji. BCC nema gusto složenu ravninu." },
        { q: "C-Mn čelik se opisuje kao uvjetno zavarljiv", options: ["kada je uz primjenu običnih postupaka zavarivanja potrebno predgrijavanje, toplinska obrada, kontrolirani unos topline", "kada se materijal jako deformira kod zavarivanja", "kada je nužna upotreba specijalnih postupaka zavarivanja", "u pravilu, svi materijali su dobro zavarljivi"], correct: [0, 2], note: "C-Mn čelik je uvjetno zavarljiv kad uz uobičajene postupke treba predgrijavanje, toplinsku obradu ili kontrolirani unos topline, ili kad treba poseban postupak zavarivanja." },
        { q: "Koji od navedenih čelika ima najlošiju zavarljivost", options: ["X10CrMoVNb9-1", "X20CrMoV11-1", "X10Ni9", "X2CrNi18-9"], correct: [1], note: "X20CrMoV11-1 ima oko 0,2 % C i 11 % Cr, pa je jako zakaljiv i najteže zavarljiv: traži visoko predgrijavanje i PWHT. P91 (X10CrMoVNb9-1) ima manje ugljika, a austenitni X2CrNi18-9 dobro se zavaruje." },
        { q: "Koji čimbenik uzrokuje pukotine izazvane napetosnom korozijom", options: ["veliki sadržaj ugljika", "velika tlačna naprezanja", "elektrolit koji sadrži kloride i fluoride", "velika vlačna naprezanja ili zaostala, izazvana zavarivanjem"], correct: [2, 3], note: "Napetosnu koroziju izaziva elektrolit s kloridima ili fluoridima uz vlačna, često zaostala naprezanja od zavarivanja. Tlačna naprezanja je sprječavaju." },
        { q: "Pougljičenje je dobro za", options: ["izjedanje (fretting)", "zupčanike", "ležajeve", "umor površine"], correct: [1, 3], note: "Ispravljeno: pougljičenje (cementiranje) daje tvrdu, otpornu površinu s tlačnim napetostima uz žilavu jezgru, pa je tipično za zupčanike i dobro protiv umora površine. Zbirka je ovdje navodila samo zupčanike, a u drugoj verziji pitanja oba odgovora." },
        { q: "Koje od navedenih mjera su učinkovite u smanjenju količine poroznosti kod zavarivanja Al i Al legura", options: ["Uporaba He u zaštitnom plinu", "Izbjegavati dodirivanje područja spoja i dodatnog materijala golim prstima", "primjenjivati zavarivanje u krutom stanju umjesto zavarivanja taljenjem", "zavarivati samo toplinski obradive Al legure"], correct: [0, 1], note: "Pore u Al stvara vodik: He u zaštitnom plinu daje topliju talinu iz koje plin lakše izađe, a dodirivanje golim prstima unosi masnoću i vlagu. Zavarivanje samo toplinski obradivih legura ne smanjuje poroznost." },
        { q: "Kako se zavaruje spoj niskolegiranog čelika otpornog na puzanje (10CrMo9-10) i CrNi legiranog (X6CrNiTi18-10)", options: ["s DM na bazi Ni primjenjujući metodu međusloja", "s austenitnim DM primjenjujući metodu međusloja", "bez predgrijavanja", "s velikim miješanjem"], correct: [0], note: "Spoj CrMo čelika (koji se toplinski obrađuje) i austenitnog čelika izvodi se dodatnim materijalom na bazi Ni (npr. ERNiCr-3) uz međusloj: Ni legura ima toplinsko istezanje između feritnog i austenitnog čelika i koči migraciju ugljika." },
        { q: "Koje od navedenih tvrdnji su točne u vezi s CTOD ispitivanja čelika", options: ["CTOD je kratica za Crack Transmission by Overload and Deformation", "CTOD se provodi u cilju procjene izduženja materijala pri istezanju na niskim temperaturama", "CTOD je kratica za Crack Tip Opening Displacement", "CTOD test se provodi u cilju mjerenja otpora materijala prema napredovanju pukotine"], correct: [2, 3], note: "CTOD (Crack Tip Opening Displacement), otvaranje vrha pukotine, mjeri otpornost materijala prema napredovanju pukotine (lomnu žilavost)." },
        { q: "Koja tvrdnja za ispitivanje tvrdoće po Brinellu (HB) je točna", options: ["moguće je preračunati HB tvrdoću u vlačnu čvrstoću koristeći tablice", "ispitivanje prema HB ne može u cijelosti zamijeniti vlačno ispitivanje jer mogu postojati velika odstupanja vlačne čvrstoće i vlačne čvrstoće izračunate prema tvrdoći", "mjeri se promjer otiska kojeg je ostavila kuglica", "kod HB ispitivanja koristi se čelična zakaljena kuglica"], correct: [2, 3], note: "Kod Brinella se zakaljena čelična (ili tvrdometalna) kuglica utiskuje u materijal i mjeri se promjer otiska. HB se tablicama može približno preračunati u Rm, ali to ne zamjenjuje vlačni pokus." },
        { q: "Zašto se u visoku peć kod proizvodnje željeza dodaje vapno", options: ["Da snizi talište nereduciranih oksida", "Da poveća talište nereduciranih oksida", "da snizi talište željeza", "da poveća talište željeza"], correct: [0], note: "Vapno (vapnenac) se dodaje da s jalovinom (nereduciranim oksidima, SiO2, Al2O3) stvori trosku nižeg tališta, koja se lako odvaja od taline i veže sumpor." },
        { q: "Koliki je postoak ugljika u sirovom željezu", options: ["veći od 2,03%", "veći od 4%", "veći od 0,8%", "manji od 4%"], correct: [0, 3], note: "Prema ključu zbirke sirovo željezo ima više od 2,03 % C (iznad granice čelika), a prema zbirci manje od 4 %. U praksi ima oko 3,5–4,5 % C." },
        { q: "Što proizvodimo od sivog sirovoga željeza", options: ["Sivi lijev", "nodularni lijev", "vermikularni lijev", "bijeli temper lijev"], correct: [0, 1, 2], note: "Sivo sirovo željezo (C u obliku grafita, više Si) koristi se za sivi, nodularni i vermikularni lijev. Temper lijev nastaje iz bijelog sirovog željeza." },
        { q: "Što proizvodimo od bijelog sirovoga željeza", options: ["Bijeli tvrdi lijev", "Temper bijeli lijev", "Temper crni lijev", "Čelike po potrebi"], correct: [0, 1, 2, 3], note: "Iz bijelog sirovog željeza (C vezan u Fe3C) dobivaju se bijeli tvrdi lijev i temper lijev (bijeli i crni, žarenjem), a ono je i glavna sirovina za proizvodnju čelika." },
        { q: "Koje greške mogu biti u čeličnome poluproizvodu", options: ["Unutrašnje", "Vanjske", "Mikrostrukturalne", "makroskoposke"], correct: [0, 1, 2], note: "Prema ključu zbirke greške poluproizvoda dijele se na unutrašnje (lunkeri, segregacije, uključci), vanjske (površinske pukotine, preklopi) i mikrostrukturne." },
        { q: "Čelici proizvedeni metalurgijom praha razlikuju se od običnih čelika:", options: ["imaju bolja svojstva", "imaju lošija svojstva", "imaju tragove segregacije", "nemaju tragove segregacije"], correct: [3], note: "Čelici dobiveni metalurgijom praha nemaju segregacija, jer nema skrućivanja velike taline. Ostala svojstva ovise o gustoći (poroznosti) i postupku." },
        { q: "Čime se provodi dezoksidacija nesmirenoga čelika", options: ["Ca, Si, Al", "CO2, CaO", "Mn i Mo", "P i S"], correct: [0], note: "Dezoksidacija (smirivanje) provodi se elementima jakog afiniteta prema kisiku: Ca, Si, Al (i Mn). CO2 i CaO nisu dezoksidansi, a P i S su nečistoće." },
        { q: "Epruveta za vlačni pokus okrugla ima promjer", options: ["20 mm", "10 mm", "5 mm", "nije definirano"], correct: [0, 1, 2], note: "Okrugle proporcionalne epruvete za vlačni pokus standardno imaju promjer 20, 10 ili 5 mm." },
        { q: "Dužine i površine presjeka epruvete smije biti", options: ["Lo= 5,65* √S0", "Lo= 11,3* √S0", "nije definirano", "smije biti razmjerno ako nije moguće izraditi standardnu epruvetu"], correct: [0, 1, 3], note: "Proporcionalne epruvete imaju L0 = 5,65·√S0 (kratka) ili L0 = 11,3·√S0 (duga). Kad se ne može izraditi standardna, dopuštena je proporcionalna epruveta drugih dimenzija." },
        { q: "Dubine epruvete V", options: ["1mm", "2mm", "3mm", "4mm"], correct: [1], note: "Charpy epruveta s V-zarezom (ISO 148) ima zarez dubine 2 mm, kut 45° i radijus vrha 0,25 mm." },
        { q: "Dubine epruvete U", options: ["1mm", "2mm", "3mm", "4mm"], correct: [2], note: "Ključ iz zbirke: epruveta s U-zarezom ima dubinu zareza 3 mm (stara DVM epruveta). ⚠️ Prema ISO 148 U-zarez je dubok 2 ili 5 mm." },
        { q: "Veze između atoma mogu biti", options: ["ionske", "kovalentne", "metalne", "magnetske"], correct: [0, 1, 2], note: "Primarne veze između atoma su ionska, kovalentna i metalna; sekundarne su Van der Waalsove (dipolne). Magnetska veza ne postoji." },
        { q: "Kationi imaju", options: ["pozitivan naboj", "negativan naboj", "veći polumjer od izvornoga atoma", "manji polumjer od izvornoga atoma"], correct: [0, 3], note: "Kation nastaje kad atom otpusti elektrone: ima pozitivan naboj i manji polumjer od neutralnog atoma, jer preostale elektrone jezgra jače privlači." },
        { q: "Što se događa kad se metal hladno (plastično) deformira, npr. hladnim valjanjem ili vučenjem? S porastom stupnja hladne deformacije raste:", options: ["čvrstoća", "granica razvlačenja", "tvrdoća", "istezljivost"], correct: [0, 1, 2], note: "Hladnom deformacijom raste gustoća dislokacija, pa rastu čvrstoća, granica razvlačenja i tvrdoća, a pada istezljivost." },
        { q: "S porastom stupnja deformacije pada", options: ["istezljivost", "kontrakcija ili suženje", "udarna žilavost", "modul elastičnosti"], correct: [0, 1, 2], note: "Ispravljeno: hladnom deformacijom padaju istezljivost, kontrakcija i udarna žilavost. Modul elastičnosti E ovisi o vezama među atomima i praktički se ne mijenja deformacijom." },
        { q: "Koliko ugljika može otopiti austenit max", options: ["0,025", "0,8", "2,03", "4,3"], correct: [2], note: "Austenit može otopiti najviše 2,03 % C (na 1147 °C). Vrijednosti 0,8 % i 4,3 % su eutektoid i eutektik, a 0,025 % je ferit." },
        { q: "Koliko ugljika može otopiti ferit max", options: ["0,025", "0,8", "2,03", "4,3"], correct: [0], note: "Ferit (α-Fe, BCC) može otopiti najviše oko 0,025 % C (na 723 °C), a na sobnoj temperaturi gotovo ništa." },
        { q: "Na koju temperaturu se vrši grijanje radi žarenja za redukciju zaostalih napetosti", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [0], note: "Ključ iz zbirke je 400–500 °C. ⚠️ U drugim izvorima žarenje za redukciju napetosti navodi se kao 400–650 °C, a PWHT čelika najčešće oko 550–650 °C, pa pazi kako je pitanje zadano." },
        { q: "Na koju temperaturu se vrši grijanje rekristalizacije", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [1], note: "Rekristalizacijsko žarenje provodi se oko 500–650 °C (ispod A1), iznad temperature rekristalizacije hladno deformiranog čelika." },
        { q: "Sferoidizacijsko žarenje ( meko žarenje)", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [2], note: "Sferoidizacijsko (meko) žarenje provodi se oko A1 (njihanjem oko A1 ili dugim držanjem tik ispod), da lamele cementita postanu kuglice." },
        { q: "Homogenizacijsko ili difuzijsko žarenje", options: ["iznad A3", "500-650 °C", "ispod A1", "ispod solidus linije"], correct: [0, 3], note: "Homogenizacijsko (difuzijsko) žarenje provodi se na visokoj temperaturi, iznad A3 a ispod solidusa (oko 1050–1250 °C), dugo, da difuzija izjednači sastav." },
        { q: "Zašto se prvovodi homogenizacijsko žarenje", options: ["da se uklone zaostale napetosti", "zbog rekristalziacije", "zbog normalizacije", "da se uklone segregacije nastale ohlađivanjem"], correct: [3], note: "Homogenizacija uklanja kristalne segregacije (nejednolik sastav) nastale pri skrućivanju i hlađenju odljevaka i ingota." },
        { q: "Sferoidizacijsko žarenje provodi se zbog", options: ["poboljšanja deformabilnosti nakon hladne deformacije", "otklanja segregacije", "povećava zrno radi lakše strojne obrade", "pobošava rezljivost čelika sa visokim sadržajem ugljika"], correct: [3], note: "Sferoidizacijsko žarenje poboljšava rezljivost (i hladnu oblikovljivost) čelika s višim udjelom ugljika, jer kuglasti cementit lakše reže nego lamelarni." },
        { q: "Normalizacijsko žarenje se provodi radi", options: ["usitnjaavanja grubozrnate strukture nastalu lijevanjem, zavarivanje i sl", "da se otklone zaostala naprezanja", "otklanja segregacija", "povećava zrno radi lakše strojne obrade"], correct: [0], note: "Normalizacija usitnjava grubozrnatu strukturu nastalu lijevanjem, zavarivanjem ili toplim oblikovanjem. Napetosti uklanja žarenje za redukciju napetosti, a segregacije homogenizacija." },
        { q: "Što je precipitacijsko očvrsnuće", options: ["to je povišenje granice tečenja i čvrstoće grijanjem do homogenizacije i otapanja percipita te gašenja tako da precipitati ostanu rastvoreni unutar zrna", "smanjenje granice tećenja i čvrstoće radi lakše obrade", "popuštanje zaostalih napetosti", "povećanje žilavosti brzim hlađenjem iz taline"], correct: [0], note: "Precipitacijsko očvršćivanje povisuje granicu tečenja i čvrstoću: rastvorno žarenje otopi precipitate, gašenje ih zadrži otopljene, a naknadnim starenjem (dozrijevanjem) izluče se sitni precipitati koji koče dislokacije. Odgovor iz zbirke opisuje prva dva koraka." },
        { q: "Legiranje i provođenje TO", options: ["Mjerenje temperature pri TO provodi se najčešće termoelementima, direktno na obrađivanom dijelu", "Reguliranje temperature provodi se najčešće P i D regulacijom", "Programiranje procesa provodi se primjenom različitih vrsta mikroprocesora programatora s različitim funkcijama", "Zapis provedenoga procea je dokaz provedene tehnologije"], correct: [0, 1, 2, 3], note: "Kod toplinske obrade temperatura se mjeri termoelementima na samom dijelu, regulira (PID) regulacijom, proces se programira mikroprocesorskim programatorima, a zapis je dokaz provedene tehnologije." },
        { q: "Nastanak hladnih pukotina potaknut je:", options: ["Malom deformabilnošću (plastičnosću) materijala", "velikom zrnom materijala", "Velikim sadržajem difuzijskoga vodika u metalu zavara", "Lokalnom koncentracijom naprezanja"], correct: [0, 2, 3], note: "Hladne pukotine potiču mala deformabilnost (krhka zakaljena struktura), difuzijski vodik i lokalna koncentracija naprezanja. Grubo zrno može doprinijeti, ali nije osnovni uzrok." },
        { q: "TTT dijagram može poslužiti za:", options: ["procjenu strukture zavarenoga spoja", "procjenu tvrdoće i drugih svojstava zavarenoga spoja ( ako ima odgovarajući TTT dijagram)", "određivanje temperature predgrijavanja i dogrijavanja", "odabir trajanja hlađenja od 800 do 500 °C"], correct: [0, 1, 3], note: "Iz TTT (CCT) dijagrama procjenjuju se struktura i tvrdoća zavarenog spoja te odabire dopušteno t8/5. Temperatura predgrijavanja određuje se iz Cekv i debljine (npr. EN 1011-2, Séférian)." },
        { q: "Prilikom ugrijavanja α željezo prelazi u γ željezo na temeperaturi:", options: ["770 °C", "898 °C", "1392 °C", "911 °C"], correct: [3], note: "Pri zagrijavanju α-Fe prelazi u γ-Fe na 911 °C (pri hlađenju zbog histereze niže, oko 898 °C). 770 °C je Curiejeva točka, a 1392 °C prijelaz γ u δ." },
        { q: "Izračunajte unešenu energiju (toplinski input) ako su izmjerene sljedeće vrijednosti parametara rel zavarivanja: i=160 A, U=25 V, v= 2 mm/s , dok je stupanj iskorištenja energije u električnom luku ƞ=0,8?", options: ["1600 J/mm", "1600 J/mm2", "1000 J/cm", "1,6 kJ/mm"], correct: [0, 3], note: "Q = η · U · I / v = 0,8 · 25 V · 160 A / 2 mm/s = 1600 J/mm = 1,6 kJ/mm. Jedinica je J/mm (energija po duljini zavara), ne J/mm²." }
    ];

    // Baza 4: Prošireni kviz za 2. ispit (stara pitanja + pitanja iz uvoda/vodiča za učenje i priprema za predavanja 1–28)
    const extendedQuestions2 = [
        ...oldQuestions2,
        { q: "Što vrijedi za prostorno centriranu kubičnu (BCC) rešetku?", options: ["2 atoma po jediničnoj ćeliji", "koordinacijski broj 8", "faktor popunjenosti 74 %", "koordinacijski broj 12"], correct: [0, 1], note: "BCC ima 2 atoma po ćeliji (8 · 1/8 u vrhovima + 1 u sredini), koordinacijski broj 8 i faktor popunjenosti 68 %. Vrijednosti 74 % i 12 vrijede za FCC i HCP." },
        { q: "Što vrijedi za plošno centriranu kubičnu (FCC) rešetku?", options: ["koordinacijski broj 8", "faktor popunjenosti 68 %", "4 atoma po jediničnoj ćeliji", "faktor popunjenosti 74 %"], correct: [2, 3], note: "FCC ima 4 atoma po ćeliji (8 · 1/8 + 6 · 1/2), koordinacijski broj 12 i faktor popunjenosti 74 %. Vrijednosti 8 i 68 % vrijede za BCC." },
        { q: "Koliko kliznih sustava ima HCP rešetka?", options: ["12", "3", "48", "8"], correct: [1], note: "HCP ima samo 3 klizna sustava (bazalna ravnina, 3 smjera), pa je slabo deformabilan (Mg, Zn). FCC ima 12 kliznih sustava." },
        { q: "Koji metali i faze imaju FCC rešetku (najduktilnija rešetka)?", options: ["Al, Cu, Ni", "austenit", "ferit", "martenzit"], correct: [0, 1], note: "FCC rešetku imaju Al, Cu, Ni i austenit (γ-Fe). Ferit je BCC, a martenzit BCT." },
        { q: "Dislokacije su:", options: ["točkaste greške rešetke", "površinske greške rešetke", "linijske greške rešetke", "volumne greške rešetke"], correct: [2], note: "Dislokacije su linijske greške rešetke. Točkaste su praznine i strani atomi, a površinske granice zrna." },
        { q: "Što vrijedi za dislokacije i očvršćivanje metala?", options: ["Gibanje dislokacija predstavlja plastičnu deformaciju", "Svi mehanizmi očvršćivanja ometaju gibanje dislokacija", "Dislokacije postoje samo u talini", "Očvršćivanje se postiže olakšavanjem gibanja dislokacija"], correct: [0, 1], note: "Plastična deformacija je gibanje dislokacija, a svi mehanizmi očvršćivanja (sitno zrno, mješanci, precipitati, hladna deformacija) to gibanje ometaju." },
        { q: "Eutektik u Fe-C dijagramu nalazi se na:", options: ["0,8 % C i 723 °C", "2,03 % C i 1147 °C", "4,3 % C i 1147 °C", "6,67 % C i 723 °C"], correct: [2], note: "Eutektik u Fe-C dijagramu je na 4,3 % C i 1147 °C: talina prelazi u ledeburit (austenit + cementit)." },
        { q: "Eutektoid u Fe-C dijagramu nalazi se na:", options: ["0,8 % C i 723 °C", "4,3 % C i 1147 °C", "0,025 % C i 911 °C", "2,03 % C i 723 °C"], correct: [0], note: "Eutektoid je na 0,8 % C i 723 °C: austenit prelazi u perlit (ferit + cementit)." },
        { q: "Koja je razlika između eutektičke i eutektoidne reakcije?", options: ["Eutektoid: talina prelazi u dvije čvrste faze", "Eutektik: talina prelazi u dvije čvrste faze", "Eutektik: jedna čvrsta faza prelazi u talinu", "Eutektoid: jedna čvrsta faza prelazi u dvije čvrste faze"], correct: [1, 3], note: "Eutektik: talina prelazi u dvije čvrste faze. Eutektoid: jedna čvrsta faza prelazi u dvije čvrste faze." },
        { q: "Maksimalna topljivost ugljika iznosi:", options: ["u austenitu 2,03 %", "u feritu 0,025 % (na 723 °C)", "u austenitu 0,8 %", "u feritu 0,8 %"], correct: [0, 1], note: "Najveća topljivost ugljika u austenitu je 2,03 % (1147 °C), a u feritu 0,025 % (723 °C). 0,8 % je eutektoidni sastav." },
        { q: "Što vrijedi za martenzit?", options: ["Nastaje difuzijskom pretvorbom pri sporom hlađenju", "To je prezasićena otopina C u Fe s BCT rešetkom", "Pretvorba je bezdifuzijska", "Nastaje hlađenjem brzinom većom od kritične"], correct: [1, 2, 3], note: "Martenzit je prezasićena otopina C u Fe s BCT rešetkom. Nastaje bezdifuzijski, kad je hlađenje brže od kritičnog." },
        { q: "Koja je razlika između TTT i CCT dijagrama?", options: ["TTT prikazuje izotermičku pretvorbu", "CCT prikazuje pretvorbu pri kontinuiranom hlađenju", "TTT prikazuje ravnotežne strukture kao Fe-C dijagram", "CCT vrijedi samo za aluminijske legure"], correct: [0, 1], note: "TTT dijagram prikazuje pretvorbe pri izotermnom držanju, a CCT pri kontinuiranom hlađenju. Ravnotežne strukture daje Fe-C dijagram." },
        { q: "Što vrijedi za bainit?", options: ["Postoje gornji i donji bainit", "Daje dobru kombinaciju čvrstoće i žilavosti", "To je ravnotežna faza iz Fe-C dijagrama", "Nastaje isključivo pri temperaturi iznad A3"], correct: [0, 1], note: "Bainit (gornji i donji) je neravnotežna struktura između perlita i martenzita s dobrom kombinacijom čvrstoće i žilavosti. Nije faza iz Fe-C dijagrama." },
        { q: "Kako se čelici dijele prema dezoksidaciji i što ih karakterizira?", options: ["Nesmireni – nehomogeni, lošijih svojstava", "Smireni – dezoksidirani sa Si i Mn", "Posebno smireni – dodatno Al, sitno zrno (AlN), najbolja žilavost", "Posebno smireni – bez ikakve dezoksidacije"], correct: [0, 1, 2], note: "Nesmireni čelici su nehomogeni (segregacije), smireni se dezoksidiraju sa Si i Mn, a posebno smireni još i Al, što daje sitno zrno (AlN) i najbolju žilavost." },
        { q: "Plastična rezerva čelika izražava se omjerom Re/Rm. Što vrijedi?", options: ["Uobičajeno iznosi oko 0,70–0,85", "Manji omjer znači veću plastičnu rezervu i sigurnost od krhkog loma", "Veći omjer znači veću plastičnu rezervu", "Uobičajeno iznosi oko 0,10–0,30"], correct: [0, 1], note: "Omjer Re/Rm obično je oko 0,70–0,85. Manji omjer znači veću plastičnu rezervu prije loma, dakle veću sigurnost od krhkog loma." },
        { q: "Mikrolegirani čelici:", options: ["sadrže Nb, V, Ti u udjelu manjem od oko 0,1 %", "imaju sitno zrno te višu čvrstoću i žilavost", "imaju lošu zavarljivost zbog visokog udjela ugljika", "legirani su s više od 12 % Cr"], correct: [0, 1], note: "Mikrolegirani čelici imaju malo Nb, V i Ti (ispod oko 0,1 %), koji daju sitno zrno, višu čvrstoću i žilavost. Imaju malo ugljika i dobro se zavaruju." },
        { q: "Što snizuje prijelaznu temperaturu čelika (žilavo → krhko)?", options: ["Sitnije zrno", "Dodatak Ni", "Manje P, S i N", "Veći udio P i S"], correct: [0, 1, 2], note: "Prijelaznu temperaturu snizuju sitno zrno, nikal i manji udio P, S i N. Više P i S je povisuje." },
        { q: "Koje se skupine čelika koriste za niske temperature?", options: ["Mikrolegirani sitnozrnati čelici do oko −50 °C", "Ni čelici (1,5–12 % Ni) do oko −200 °C; 9 % Ni za LNG", "Austenitni čelici do blizu apsolutne nule", "Nelegirani čelici s više od 0,6 % C do −196 °C"], correct: [0, 1, 2], note: "Za niske temperature: sitnozrnati mikrolegirani čelici do oko −50 °C, Ni čelici do oko −200 °C (9 % Ni za LNG), austenitni čelici do blizu apsolutne nule. Visokougljični čelici su krhki." },
        { q: "Kako glasi izraz za efektivni unos topline pri zavarivanju?", options: ["Eef = η · U · I · v", "Eef = η · U · I / v", "Eef = U / (η · I · v)", "Eef = η · I² · R"], correct: [1], note: "Efektivni unos topline: Eef = η · U · I / v (J/mm). Brzina zavarivanja je u nazivniku, jer brže zavarivanje unosi manje topline po milimetru." },
        { q: "Što uzrokuje veći unos topline pri zavarivanju čelika?", options: ["Sporije hlađenje (dulje t8/5)", "Grublje zrno u ZUT-u", "Manje zakaljivanja", "Brže hlađenje i više martenzita"], correct: [0, 1, 2], note: "Veći unos topline daje sporije hlađenje (dulje t8/5), pa manje zakaljivanja, ali i grublje zrno u ZUT-u." },
        { q: "Što predstavlja vrijeme t8/5?", options: ["Vrijeme zagrijavanja od 500 do 800 °C", "Vrijeme hlađenja od 800 do 500 °C", "Ključni parametar toplinskog ciklusa zavarivanja", "Vrijeme držanja pri žarenju"], correct: [1, 2], note: "t8/5 je vrijeme hlađenja od 800 do 500 °C; u tom području nastaje struktura ZUT-a, pa je to ključni parametar toplinskog ciklusa." },
        { q: "Kako viša temperatura predgrijavanja utječe na t8/5?", options: ["Skraćuje vrijeme hlađenja t8/5", "Ne utječe na t8/5", "Produljuje vrijeme hlađenja t8/5", "Utječe samo kod aluminija"], correct: [2], note: "Viša temperatura predgrijavanja usporava hlađenje, pa je t8/5 dulje." },
        { q: "Kada se za vođenje topline primjenjuje 2D, a kada 3D model?", options: ["2D (dvodimenzionalno) – tanki lim", "3D (trodimenzionalno) – debeli lim", "2D – debeli lim", "3D – tanki lim"], correct: [0, 1], note: "2D model vrijedi za tanki lim (toplina teče u ravnini), a 3D model za debeli lim (toplina teče u tri smjera)." },
        { q: "Što povećava brzinu hlađenja zavarenog spoja?", options: ["Manji unos topline", "Niža temperatura predgrijavanja", "Veća debljina lima", "Viša temperatura predgrijavanja"], correct: [0, 1, 2], note: "Hlađenje ubrzavaju manji unos topline, niža temperatura predgrijavanja i deblji lim." },
        { q: "Zona pregrijavanja u ZUT-u čelika:", options: ["zagrijana je na oko 1100–1450 °C", "ima grubo zrno", "ima najsitnije zrno u cijelom ZUT-u", "zagrijana je na 200–500 °C"], correct: [0, 1], note: "Zona pregrijavanja (oko 1100–1450 °C) je uz liniju staljivanja i ima grubo zrno; zato je najosjetljivija zona ZUT-a." },
        { q: "Zonu normalizacije u ZUT-u karakterizira:", options: ["grubo zrno", "sitno zrno", "rastaljeni metal", "plavi lom"], correct: [1], note: "Zona normalizacije zagrijana je malo iznad A3, pa pri hlađenju dobiva sitno zrno." },
        { q: "Zona starenja i plavog loma u ZUT-u nalazi se u temperaturnom području:", options: ["1100–1450 °C", "723–911 °C", "200–500 °C", "ispod 100 °C"], correct: [2], note: "Zona starenja i plavog loma je na oko 200–500 °C, najudaljenija od zavara. Tamo može doći do starenja i krhkosti." },
        { q: "Koje vrste zavarljivosti razlikujemo?", options: ["operativnu", "metaluršku (lokalnu)", "konstrukcijsku", "magnetsku"], correct: [0, 1, 2], note: "Razlikujemo operativnu, metaluršku (lokalnu) i konstrukcijsku (globalnu) zavarljivost." },
        { q: "Metalurška (lokalna) zavarljivost odnosi se na:", options: ["procjenu fizikalno-kemijskih pretvorbi u ZUT-u", "krutost i oblik konstrukcije", "dostupnost opreme i položaj zavarivanja", "cijenu dodatnog materijala"], correct: [0], note: "Metalurška zavarljivost razmatra fizikalno-kemijske pretvorbe u ZUT-u i metalu zavara. Oblik konstrukcije pripada konstrukcijskoj, a oprema operativnoj zavarljivosti." },
        { q: "Što se postiže predgrijavanjem?", options: ["Smanjuje se brzina hlađenja (veći t8/5)", "Omogućuje se izlazak vodika", "Smanjuju se naprezanja", "Povećava se brzina hlađenja"], correct: [0, 1, 2], note: "Predgrijavanje smanjuje brzinu hlađenja (dulje t8/5), omogućuje izlazak vodika i smanjuje naprezanja." },
        { q: "O čemu ovisi potrebna temperatura predgrijavanja?", options: ["Veći ekvivalent ugljika zahtijeva višu temperaturu", "Veća debljina zahtijeva višu temperaturu", "Veća debljina zahtijeva nižu temperaturu", "Ne ovisi o kemijskom sastavu"], correct: [0, 1], note: "Što su veći ekvivalent ugljika i debljina, to je potrebna viša temperatura predgrijavanja." },
        { q: "Koja tri uvjeta moraju biti ispunjena za nastanak hladnih pukotina?", options: ["Zakaljiva (krhka) struktura", "Difuzijski vodik", "Vlačno naprezanje", "Nisko taljivi filmovi S i P"], correct: [0, 1, 2], note: "Za hladne pukotine moraju istodobno postojati zakaljiva struktura, difuzijski vodik i vlačno naprezanje. Nisko taljivi filmovi S i P uzrok su toplih pukotina." },
        { q: "Kada i gdje nastaju hladne pukotine?", options: ["Ispod oko 200 °C", "Ponekad i nekoliko dana nakon zavarivanja", "U zoni taljenja i u ZUT-u", "Isključivo tijekom skrućivanja taline"], correct: [0, 1, 2], note: "Hladne pukotine nastaju ispod oko 200 °C, ponekad i nekoliko dana nakon zavarivanja, u zoni taljenja i ZUT-u." },
        { q: "Što smanjuje opasnost od hladnih pukotina?", options: ["Predgrijavanje", "Suhe / niskovodikove elektrode", "Dogrijavanje i PWHT", "Veća ukrućenost spoja i viši CE"], correct: [0, 1, 2], note: "Hladne pukotine smanjuju predgrijavanje, suhe niskovodikove elektrode, dogrijavanje i PWHT. Veća ukrućenost i viši CE ih povećavaju." },
        { q: "Gdje nastaju pojedine vrste toplih pukotina?", options: ["Kristalizacijske – u zoni taljenja", "Likvacijske – u ZUT-u", "Kristalizacijske – u osnovnom materijalu daleko od zavara", "Likvacijske – samo ispod 200 °C"], correct: [0, 1], note: "Kristalizacijske tople pukotine nastaju u zoni taljenja pri skrućivanju, a likvacijske u ZUT-u zbog rastaljenih filmova po granicama zrna." },
        { q: "Koji su uzroci toplih pukotina?", options: ["S i P (nisko taljivi filmovi po granicama zrna)", "Naprezanja pri skrućivanju", "Nepovoljan oblik zavara (odnos širine i dubine)", "Difuzijski vodik"], correct: [0, 1, 2], note: "Tople pukotine uzrokuju S i P (nisko taljivi filmovi), naprezanja pri skrućivanju i nepovoljan oblik zavara. Vodik uzrokuje hladne pukotine." },
        { q: "Što uzrokuje lamelarno odvajanje i kako se sprječava?", options: ["Naprezanje u smjeru debljine lima", "Nehomogenosti (sulfidi) u osnovnom materijalu", "Sprječava se primjenom čelika Z-kvalitete", "Sprječava se povećanjem udjela sumpora"], correct: [0, 1, 2], note: "Lamelarno odvajanje uzrokuju naprezanje u smjeru debljine i sulfidni uključci. Sprječava se čelikom Z-kvalitete (malo S) i oblikovanjem spoja." },
        { q: "Pukotine zbog naknadnog zagrijavanja tipične su za:", options: ["CrMo i CrMoV čelike pri toplinskoj obradi", "nelegirane čelike pri zavarivanju bez predgrijavanja", "aluminijske legure serije 5xxx", "sivi lijev"], correct: [0], note: "Pukotine zbog naknadnog zagrijavanja tipične su za CrMo i CrMoV čelike pri toplinskoj obradi nakon zavarivanja." },
        { q: "U kojim se jedinicama izražava difuzijski vodik u metalu zavara?", options: ["mg/kg", "ml/100 g metala zavara", "% volumena", "ppm po mm²"], correct: [1], note: "Difuzijski vodik izražava se u ml na 100 g metala zavara (npr. H5)." },
        { q: "Što je linija staljivanja?", options: ["Granica između zone taljenja i ZUT-a", "Granica između ZUT-a i nepromijenjenog osnovnog materijala", "Os simetrije zavara", "Linija na TTT dijagramu"], correct: [0], note: "Linija staljivanja je granica između zone taljenja (metala zavara) i ZUT-a." },
        { q: "Koji su uvjeti za kaljenje čelika?", options: ["Više od oko 0,35 % C", "Temperatura austenitizacije A3 + 30–70 °C (podeutektoidni čelici)", "Brzina hlađenja veća od kritične", "Brzina hlađenja manja od kritične"], correct: [0, 1, 2], note: "Za kaljenje treba dovoljno ugljika (više od oko 0,35 %), austenitizacija na A3 + 30–70 °C i hlađenje brže od kritične brzine." },
        { q: "Poboljšavanje čelika je:", options: ["kaljenje + visoko popuštanje", "normalizacija + sferoidizacija", "postupak kojim se postiže čvrstoća uz dobru žilavost", "žarenje za redukciju naprezanja"], correct: [0, 2], note: "Poboljšavanje je kaljenje i visoko popuštanje; daje visoku čvrstoću uz dobru žilavost." },
        { q: "Koja žarenja spadaju u žarenja I. vrste (ispod A1)?", options: ["Žarenje za redukciju naprezanja (400–650 °C)", "Rekristalizacijsko žarenje (500–650 °C)", "Normalizacijsko žarenje", "Homogenizacijsko žarenje"], correct: [0, 1], note: "Žarenja I. vrste (ispod A1) su žarenje za redukciju naprezanja i rekristalizacijsko žarenje. Normalizacija i homogenizacija su iznad A1/A3." },
        { q: "Koja žarenja spadaju u žarenja II. vrste (iznad A1)?", options: ["Normalizacijsko", "Homogenizacijsko", "Žarenje na grubo zrno", "Žarenje za redukciju naprezanja"], correct: [0, 1, 2], note: "Žarenja II. vrste (iznad A1) su normalizacijsko, homogenizacijsko, žarenje na grubo zrno i sferoidizacijsko." },
        { q: "Što vrijedi za toplinsku obradu nakon zavarivanja (PWHT)?", options: ["Smanjuje zaostala naprezanja i tvrdoću ZUT-a", "Omogućuje izlazak vodika", "Držanje na 600 °C traje oko 2–2,5 min/mm debljine", "Brzina zagrijavanja treba biti što veća (iznad 1000 °C/h)"], correct: [0, 1, 2], note: "PWHT smanjuje zaostala naprezanja i tvrdoću ZUT-a te omogućuje izlazak vodika. Držanje na 600 °C traje oko 2–2,5 min/mm. Zagrijavanje mora biti sporo (oko 50–250 °C/h)." },
        { q: "Što je puzanje?", options: ["Spora, nepovratna deformacija pri konstantnom opterećenju i visokoj temperaturi", "Javlja se pri T ≥ 0,3·Tt (kod čelika iznad oko 400–450 °C)", "Trenutni krhki lom pri niskoj temperaturi", "Elastična deformacija koja nestaje rasterećenjem"], correct: [0, 1], note: "Puzanje je spora, nepovratna deformacija pri konstantnom opterećenju na visokoj temperaturi (T ≥ 0,3·Tt, kod čelika iznad oko 400–450 °C)." },
        { q: "Koji su stadiji puzanja?", options: ["Primarni", "Sekundarni (stacionarni)", "Tercijarni (završava lomom)", "Eutektoidni"], correct: [0, 1, 2], note: "Puzanje ima tri stadija: primarni (usporavanje), sekundarni (stacionarni, konstantna brzina) i tercijarni (ubrzavanje do loma)." },
        { q: "Koji legirni elementi povećavaju otpornost na puzanje?", options: ["Mo", "V i W", "Cr", "S i P"], correct: [0, 1, 2], note: "Otpornost na puzanje povećavaju Mo, V, W i Cr (očvršćivanje mješanaca i stabilni karbidi). S i P su štetne nečistoće." },
        { q: "Do kojih se radnih temperatura koriste pojedine skupine čelika?", options: ["Nelegirani do oko 450 °C", "Mo i CrMo čelici do oko 550 °C", "Austenitni čelici oko 600–800 °C", "Nelegirani do oko 800 °C"], correct: [0, 1, 2], note: "Nelegirani čelici koriste se do oko 450 °C, Mo i CrMo do oko 550 °C, 12 % Cr do oko 600 °C, a austenitni oko 600–800 °C." },
        { q: "Što čini čelik nehrđajućim?", options: ["Više od oko 12 % Cr", "Pasivni oksidni sloj Cr2O3 debljine nekoliko nanometara", "Više od 2 % C", "Sloj cinka debljine 60 µm"], correct: [0, 1], note: "Čelik je nehrđajući kad ima više od oko 12 % Cr, jer se tada stvara pasivni sloj Cr2O3 debljine nekoliko nanometara." },
        { q: "Koji je tipičan problem pri zavarivanju pojedinih skupina nehrđajućih čelika?", options: ["Austenitni – tople pukotine i deformacije", "Feritni – grubo zrno u ZUT-u i krhkost", "Martenzitni – hladne pukotine, potrebna toplinska obrada", "Duplex – potpuno austenitna struktura zavara"], correct: [0, 1, 2], note: "Austenitni: tople pukotine i deformacije; feritni: grubo zrno i krhkost; martenzitni: hladne pukotine i potrebna toplinska obrada; duplex: feritizacija (previše ferita), ne austenit." },
        { q: "Što je senzibilizacija nehrđajućih čelika?", options: ["Izlučivanje Cr23C6 po granicama zrna (oko 500–850 °C)", "Osiromašenje kromom uz granice zrna i interkristalna korozija", "Stvaranje martenzita pri brzom hlađenju", "Izlučivanje grafita u obliku listića"], correct: [0, 1], note: "Senzibilizacija je izlučivanje Cr23C6 po granicama zrna (oko 500–850 °C); uz granice zrna ostaje premalo kroma, pa nastaje interkristalna korozija." },
        { q: "Kako se sprječava senzibilizacija (interkristalna korozija)?", options: ["Udio C manji od 0,03 %", "Stabilizacija s Ti i Nb", "Rastvorno žarenje 1050–1100 °C i gašenje", "Dugo zadržavanje na 650 °C"], correct: [0, 1, 2], note: "Senzibilizacija se sprječava niskim ugljikom (ispod 0,03 %), stabilizacijom s Ti i Nb i rastvornim žarenjem (1050–1100 °C) s gašenjem. Zadržavanje na 650 °C ju izaziva." },
        { q: "Po čemu se razlikuju Schaefflerov, De Longov i WRC-1992 dijagram?", options: ["De Long uzima u obzir dušik (N)", "WRC-1992 uzima u obzir bakar (Cu)", "WRC-1992 ne prikazuje martenzit", "Schaeffler se koristi samo za aluminij"], correct: [0, 1, 2], note: "De Longov dijagram uzima u obzir dušik, a WRC-1992 i bakar; WRC-1992 ne prikazuje martenzit. Schaeffler se koristi za čelike, ne za aluminij." },
        { q: "Kako glasi izraz za PREN (otpornost na rupičastu koroziju)?", options: ["PREN = %Cr + 3,3·%Mo + 16·%N", "PREN = %Ni + 30·%C + 0,5·%Mn", "PREN = C + Mn/6", "PREN = %Cr + %Mo + 1,5·%Si"], correct: [0], note: "PREN = %Cr + 3,3·%Mo + 16·%N; što je veći, čelik je otporniji na rupičastu koroziju." },
        { q: "Kako glase ekvivalenti prema WRC-1992 dijagramu?", options: ["Cr-ekv. = Cr + Mo + 0,7·Nb", "Ni-ekv. = Ni + 35·C + 20·N + 0,25·Cu", "Cr-ekv. = C + Mn/6", "Ni-ekv. = Ni + Cr"], correct: [0, 1], note: "WRC-1992: Cr-ekv. = Cr + Mo + 0,7·Nb, Ni-ekv. = Ni + 35·C + 20·N + 0,25·Cu." },
        { q: "Koji se feritni broj (FN) preporučuje za otpornost na tople pukotine kod austenitnog metala zavara?", options: ["FN ≈ 0", "FN ≈ 5", "FN ≈ 50", "FN ≈ 100"], correct: [1], note: "Za otpornost austenitnog metala zavara na tople pukotine preporučuje se FN oko 5 (otprilike 3–10 % δ-ferita)." },

    // =====================================================================
    // POPIS ISPITA – za novi ispit dodaj novu bazu pitanja i jedan unos ovdje
    // =====================================================================
    const exams = [
        {
            name: "1. ispit – Postupci zavarivanja i oprema",
            icon: "🔥",
            quizzes: [
                { key: 'old', label: "📜 Stara ispitna pitanja", title: "1. ispit – Stara ispitna pitanja", questions: oldQuestions },
                { key: 'extended', label: "🚀 Prošireni kviz (Stara pitanja + Skripte + Predavanja)", title: "1. ispit – Prošireni kviz", questions: extendedQuestions }
            ]
        },
        {
            name: "2. ispit – Materijali",
            icon: "🧪",
            quizzes: [
                { key: 'old', label: "📜 Stara ispitna pitanja (ispit 2013. A i B + zbirka)", title: "2. ispit – Stara ispitna pitanja", questions: oldQuestions2 },
                { key: 'extended', label: "🚀 Prošireni kviz (Stara pitanja + Pripreme za predavanja)", title: "2. ispit – Prošireni kviz", questions: extendedQuestions2 }
            ]
        }
    ];

    let currentExam = null;
    let activeQuestions = [];
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    // Statistika kruga: broj pitanja i bodovi po vrsti odgovora
    let stats = { correct: 0, partial: 0, wrong: 0, voided: 0, skipped: 0, partialPts: 0 };
    let currentSessionQuestions = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    const ALL_SCREENS = ['main-menu-screen', 'type-menu-screen', 'sub-menu-screen', 'quiz-screen', 'results-screen', 'review-screen'];

    function showScreen(id) {
        ALL_SCREENS.forEach(s => {
            document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
        });
        document.querySelector('.container').scrollTop = 0;
    }

    // Glavni izbornik: popis ispita
    function renderExamButtons() {
        const container = document.getElementById('exam-buttons-container');
        container.innerHTML = '';
        exams.forEach((exam, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `${exam.icon} ${exam.name}`;
            btn.onclick = () => selectExam(idx);
            container.appendChild(btn);
        });
    }

    // Korak 1: Korisnik bira ispit
    function selectExam(idx) {
        currentExam = exams[idx];
        goToTypeMenu();
    }

    function goToTypeMenu() {
        if (!currentExam) { goToMainMenu(); return; }
        document.getElementById('app-title').innerText = currentExam.name;

        const container = document.getElementById('type-buttons-container');
        container.innerHTML = '';
        currentExam.quizzes.forEach(quiz => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `${quiz.label} – ${quiz.questions.length} pitanja`;
            btn.onclick = () => selectQuizType(quiz.key);
            container.appendChild(btn);
        });

        showScreen('type-menu-screen');
    }

    // Korak 2: Korisnik bira vrstu kviza (stara pitanja / prošireni)
    function selectQuizType(type) {
        const quiz = currentExam.quizzes.find(qz => qz.key === type);
        activeQuestions = quiz.questions;
        document.getElementById('app-title').innerText = quiz.title;
        document.getElementById('sub-menu-desc').innerText = "Izaberite koliko pitanja želite rješavati:";

        const subMenuContainer = document.getElementById('sub-menu-buttons-container');
        subMenuContainer.innerHTML = '';

        const totalAvailable = activeQuestions.length;
        // Dinamički prilagođavamo opcije broja pitanja ovisno o bazi
        let optionsCount = [30, 60, 90, 150, 200].filter(c => c < totalAvailable);
        optionsCount.push(totalAvailable);

        optionsCount.forEach(count => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            if (count >= totalAvailable) {
                btn.innerText = `Sve (ukupno ${totalAvailable} pitanja)`;
            } else {
                btn.innerText = `${count} pitanja`;
            }
            btn.onclick = () => startQuiz(count);
            subMenuContainer.appendChild(btn);
        });

        showScreen('sub-menu-screen');
    }

    function goToMainMenu() {
        renderExamButtons();
        showScreen('main-menu-screen');
        document.getElementById('app-title').innerText = "IWE Kviz - Glavni Izbornik";
    }

    // Napomena uz pitanje (polje "note") – prikazuje se nakon odgovora
    function appendNote(parent, q) {
        if (!q.note) return;
        const noteDiv = document.createElement('div');
        noteDiv.className = 'q-note';
        noteDiv.innerText = `💡 Objašnjenje: ${q.note}`;
        parent.appendChild(noteDiv);
    }

    function goToSubMenu() {
        showScreen('sub-menu-screen');
    }

    function startQuiz(limit) {
        let shuffledAll = JSON.parse(JSON.stringify(activeQuestions));
        shuffle(shuffledAll);
        
        questions = shuffledAll.slice(0, Math.min(limit, shuffledAll.length));
        currentSessionQuestions = questions;
        
        currentIndex = 0;
        score = 0;
        stats = { correct: 0, partial: 0, wrong: 0, voided: 0, skipped: 0, partialPts: 0 };

        showScreen('quiz-screen');
        loadQuestion();
    }

    function confirmCancel() {
        if (confirm("Jeste li sigurni da želite odustati od ovog kruga i vratiti se nazad?")) {
            goToSubMenu();
        }
    }

    function openReviewAllFromMenu() {
        showReviewScreen(activeQuestions, "Pregled svih pitanja i točnih odgovora izabranog kviza");
    }

    function openReviewCurrentSession() {
        showReviewScreen(currentSessionQuestions, "Pregled pitanja i točnih odgovora iz ovog kruga");
    }

    function showReviewScreen(questionsArray, titleText) {
        showScreen('review-screen');

        document.getElementById('review-title').innerText = titleText;
        const container = document.getElementById('review-container');
        container.innerHTML = '';

        questionsArray.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'review-card';

            const title = document.createElement('div');
            title.className = 'review-q-title';
            title.innerText = `${idx + 1}. ${q.q}`;
            card.appendChild(title);

            q.options.forEach((opt, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'review-opt';
                
                let isCorrectAns = q.correct.includes(optIdx);
                if (isCorrectAns) {
                    optDiv.classList.add('is-correct');
                    optDiv.innerText = `✓ ${opt} (Točan odgovor)`;
                } else {
                    optDiv.innerText = `• ${opt}`;
                }
                card.appendChild(optDiv);
            });

            appendNote(card, q);
            container.appendChild(card);
        });
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        document.getElementById('question-counter').innerText = `Pitanje: ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('current-score').innerText = `Bodovi: ${score.toFixed(2)}`;
        
        const progressPercent = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;

        document.getElementById('question-text').innerText = q.q;

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        q.options.forEach((opt, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.id = `opt-item-${index}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'option-content';

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = 'quiz-option';
            input.value = index;
            input.id = `opt-${index}`;

            const label = document.createElement('label');
            label.htmlFor = `opt-${index}`;
            label.innerText = opt;
            label.style.width = '100%';
            label.style.cursor = 'pointer';

            contentDiv.appendChild(input);
            contentDiv.appendChild(label);
            li.appendChild(contentDiv);

            const tagSpan = document.createElement('span');
            tagSpan.id = `tag-${index}`;
            li.appendChild(tagSpan);
            
            li.onclick = (e) => {
                if (!input.disabled) {
                    if (e.target !== input) {
                        input.checked = !input.checked;
                    }
                }
            };

            optionsList.appendChild(li);
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'none';
        feedback.className = 'feedback';
        
        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `
            <button class="btn btn-cancel btn-small" id="cancel-btn" onclick="confirmCancel()">Odustani</button>
            <button class="btn btn-skip btn-small" id="skip-btn" onclick="skipQuestion()">Preskoči</button>
            <button class="btn btn-main" id="submit-btn" onclick="checkAnswer()">Potvrdi</button>
        `;
    }

    function skipQuestion() {
        const q = questions[currentIndex];
        const correctSet = new Set(q.correct);

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);

            if (isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '✓ Točan odgovor';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        feedback.innerText = `Pitanje je preskočeno (+0.00 bodova).`;
        feedback.className = 'feedback skipped';
        stats.skipped++;
        q.userSel = [];
        q.outcome = 'skipped';
        q.pts = 0;
        appendNote(feedback, q);

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function checkAnswer() {
        const q = questions[currentIndex];
        const inputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        
        if (inputs.length === 0) {
            alert("Molimo odaberite odgovor ili kliknite 'Preskoči' / 'Odustani'!");
            return;
        }

        let selectedIndices = Array.from(inputs).map(inp => parseInt(inp.value));
        
        let correctSet = new Set(q.correct);
        let selectedSet = new Set(selectedIndices);

        let points = 0;
        let totalCorrectNeeded = q.correct.length;
        let hasWrongSelection = false;

        selectedIndices.forEach(idx => {
            if (!correctSet.has(idx)) {
                hasWrongSelection = true;
            }
        });

        // Bodovanje: bez krivih = udio točnih; ima krivih: krivi > točni = -1, inače 0 (poništeno)
        const selCorrect = selectedIndices.filter(i => correctSet.has(i)).length;
        const selWrong = selectedIndices.length - selCorrect;
        let outcome;
        if (selWrong === 0) {
            points = selCorrect / totalCorrectNeeded;
            outcome = (selCorrect === totalCorrectNeeded) ? 'correct' : 'partial';
        } else if (selWrong > selCorrect) {
            points = -1;
            outcome = 'wrong';
        } else {
            // ima krivih, ali ne više od točnih -> poništeno (0 bodova)
            points = 0;
            outcome = 'void';
        }

        score += points;
        q.userSel = selectedIndices;
        q.outcome = outcome;
        q.pts = points;

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);
            let isSelected = selectedSet.has(index);

            if (isSelected && isCorrect) {
                itemElement.classList.add('user-correct');
                tagElement.className = 'tag tag-user-correct';
                tagElement.innerText = '✓ Tvoj odabir (Točno)';
            } else if (!isSelected && isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '⚠ Propušteno (Točno)';
            } else if (isSelected && !isCorrect) {
                itemElement.classList.add('user-wrong');
                tagElement.className = 'tag tag-user-wrong';
                tagElement.innerText = '✗ Tvoj odabir (Krivo)';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        
        if (outcome === 'correct') {
            stats.correct++;
            feedback.innerText = `Potpuno točno! Osvojeno bodova: +${points.toFixed(2)}`;
            feedback.className = 'feedback correct';
        } else if (outcome === 'partial') {
            stats.partial++;
            stats.partialPts += points;
            feedback.innerText = `Djelomično točno! Nisi označio/la sve točne odgovore. Bodovi: +${points.toFixed(2)}`;
            feedback.className = 'feedback partial';
        } else if (outcome === 'void') {
            stats.voided++;
            feedback.innerText = `Poništeno! Označen je i krivi odgovor (točnih: ${selCorrect}, krivih: ${selWrong}). Bodovi: 0.00`;
            feedback.className = 'feedback voided';
        } else {
            stats.wrong++;
            feedback.innerText = `Netočno! Više krivih nego točnih odgovora. Bodovi: ${points.toFixed(2)}`;
            feedback.className = 'feedback incorrect';
        }
        appendNote(feedback, q);

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function renderStats() {
        const boxes = [
            { cls: 'stat-correct', num: stats.correct, label: '✓ Točno', pts: `+${stats.correct.toFixed(2)} bodova` },
            { cls: 'stat-partial', num: stats.partial, label: '◐ Djelomično točno', pts: `+${stats.partialPts.toFixed(2)} bodova` },
            { cls: 'stat-wrong', num: stats.wrong, label: '✗ Netočno', pts: `−${stats.wrong.toFixed(2)} bodova` },
            { cls: 'stat-voided', num: stats.voided, label: '⊘ Poništeno', pts: '0 bodova' },
            { cls: 'stat-skipped', num: stats.skipped, label: '⏭ Preskočeno', pts: '0 bodova' }
        ];
        const grid = document.getElementById('stats-grid');
        grid.innerHTML = '';
        boxes.forEach(b => {
            const box = document.createElement('div');
            box.className = `stat-box ${b.cls}${b.cls === 'stat-skipped' ? ' full' : ''}`;
            box.innerHTML = `<div class="stat-num">${b.num}</div><div class="stat-label">${b.label}</div><div class="stat-pts">${b.pts}</div>`;
            grid.appendChild(box);
        });
    }

    function scrollToTop() {
        document.querySelector('.container').scrollTop = 0;
        window.scrollTo(0, 0);
    }

    const OUTCOME_LABEL = {
        correct: '✓ Točno',
        partial: '◐ Djelomično',
        wrong: '✗ Netočno',
        void: '⊘ Poništeno',
        skipped: '⏭ Preskočeno'
    };

    function renderResultList(mode) {
        document.getElementById('tab-mistakes').classList.toggle('active', mode === 'mistakes');
        document.getElementById('tab-all').classList.toggle('active', mode === 'all');

        const list = document.getElementById('result-list');
        list.innerHTML = '';

        const items = questions
            .map((q, idx) => ({ q, idx }))
            .filter(({ q }) => q.outcome && (mode === 'all' || q.outcome !== 'correct'));

        const mistakesCount = questions.filter(q => q.outcome && q.outcome !== 'correct').length;
        document.getElementById('tab-mistakes').innerText = `❌ Za ponoviti (${mistakesCount})`;
        document.getElementById('tab-all').innerText = `📋 Sva pitanja (${questions.filter(q => q.outcome).length})`;

        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'rv-empty';
            empty.innerText = 'Sve točno, nema pitanja za ponoviti! 🎉';
            list.appendChild(empty);
            return;
        }

        items.forEach(({ q, idx }) => {
            const card = document.createElement('div');
            card.className = 'review-card';

            const head = document.createElement('div');
            head.className = 'rv-head';
            const num = document.createElement('span');
            num.innerText = `Pitanje ${idx + 1}`;
            const badge = document.createElement('span');
            badge.className = `rv-badge ${q.outcome}`;
            const sign = q.pts > 0 ? '+' : '';
            badge.innerText = `${OUTCOME_LABEL[q.outcome]} (${sign}${q.pts.toFixed(2)})`;
            head.appendChild(num);
            head.appendChild(badge);
            card.appendChild(head);

            const title = document.createElement('div');
            title.className = 'review-q-title';
            title.innerText = q.q;
            card.appendChild(title);

            const sel = new Set(q.userSel || []);
            q.options.forEach((opt, i) => {
                const isC = q.correct.includes(i);
                const isS = sel.has(i);
                const row = document.createElement('div');
                row.className = 'rv-opt';
                const txt = document.createElement('span');
                txt.innerText = opt;
                row.appendChild(txt);
                let tag = '';
                if (isC && isS) { row.classList.add('ok'); tag = '✓ Tvoj odabir (točno)'; }
                else if (isC && !isS) { row.classList.add('missed'); tag = q.outcome === 'skipped' ? '✓ Točan odgovor' : '⚠ Točno – nisi označio'; }
                else if (!isC && isS) { row.classList.add('bad'); tag = '✗ Tvoj odabir (krivo)'; }
                if (tag) {
                    const t = document.createElement('span');
                    t.className = 'rv-tag';
                    t.innerText = tag;
                    row.appendChild(t);
                }
                card.appendChild(row);
            });

            appendNote(card, q);
            list.appendChild(card);
        });
    }

    function showResults() {
        showScreen('results-screen');
        
        let maxPossibleScore = questions.length;
        let percentage = (score / maxPossibleScore) * 100;
        if (percentage < 0) percentage = 0;

        document.getElementById('final-score').innerText = `Ukupno bodova: ${score.toFixed(2)} / ${maxPossibleScore}`;
        document.getElementById('percentage-display').innerText = `Postotak uspješnosti: ${percentage.toFixed(1)}%`;
        renderStats();
        renderResultList('mistakes');
    }

    window.onload = goToMainMenu;
</script>

</body>
</html>
