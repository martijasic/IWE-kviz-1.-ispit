        { q: "Zakaljivost čelika ovisi o", options: ["udjelu ugljika u čeliku", "nije bitno koliko ugljika čelik ima", "udjelu Cr i Ni u čeliku", "udjelu Mn i Si u čeliku"], correct: [0], note: "Zakaljivost (najveća tvrdoća koja se može postići kaljenjem) ovisi prvenstveno o udjelu ugljika. Legirni elementi (Cr, Ni, Mn) utječu na prokaljivost, tj. dubinu zakaljivanja." },
        { q: "Svrha normalizacijskog žarenja čelika je", options: ["usitnjavanje grubozrnate strukture nastale pri lijevanju, zavarivanju i toplom oblikovanju, radi postizanja više žilavosti i granice tečenja", "povećanje zrna radi više žilavosti i granice tečenja", "poboljšati rezljivost i oblikovljivost čelika", "hladno deformacijski očvrsnutom metalu vratiti deformabilnost kakvu je imao prije hladnog deformiranja"], correct: [0], note: "Normalizacija (A3 + 30–70 °C, hlađenje na zraku) usitnjava grubo zrno nastalo lijevanjem, zavarivanjem ili toplim oblikovanjem, pa raste žilavost i granica razvlačenja. Deformabilnost hladno očvrsnutom metalu vraća rekristalizacijsko žarenje." },
        { q: "Žarenje čelika za redukciju napetosti provodi se", options: ["sporim ugrijavanjem na temperature ispod temperature prekristalizacije, držanje dovoljno dugo vremena te veoma sporo hlađenje kako bi se spriječilo nastajanje toplinskih napetosti", "sporim ugrijavanjem na temperature iznad temperature prekristalizacije, držanje dovoljno dugo vremena te veoma sporo hlađenje kako bi se spriječilo nastajanje toplinskih napetosti", "brzim ugrijavanjem na 150 ºC te brzim hlađenjem", "sporim ugrijavanjem na 150 ºC te brzim hlađenjem"], correct: [0], note: "Žarenje za redukciju napetosti: sporo zagrijavanje na temperaturu ispod A1 (oko 400–650 °C), držanje barem oko 2 h i vrlo sporo hlađenje, da ne nastanu nove toplinske napetosti." },
        { q: "Zavarivanje djeluje na čelik izazivajući", options: ["strukturne modifikacije", "promjene kemijskog sastava", "modifikacije specisičnog volumena", "promjene tvrdoće"], correct: [0, 1, 2, 3], note: "Zavarivanje mijenja strukturu (ZUT), kemijski sastav (miješanje, izgaranje elemenata), specifični volumen (fazne pretvorbe, napetosti) i tvrdoću." },
        { q: "Zona hladnog loma nalazi se", options: ["najbliže metalu zavara", "najdalje metalu zavara", "uz zonu pregrijavanja", "uz zonu rekristalizacije"], correct: [1, 3], note: "Ispravljeno: zona plavog (hladnog) loma (oko 200–500 °C) najudaljenija je zona ZUT-a od metala zavara i nalazi se uz zonu rekristalizacije. Zbirka je ovdje navodila samo „najdalje“, a u drugoj verziji pitanja oba odgovora." },
        { q: "Nestacionarno toplinsko polje tijekom polaganja sloja od početka do kraja u usporedbi s kvazistacionarnim poljem karakterizirano je", options: ["manjim brzinama hlađenja", "većim brzinama hlađenja", "jednakim brzinama hlađenja", "ovisnošću od slučaja do slučaja"], correct: [1], note: "Ispravljeno prema drugom izvoru iz zbirke: na početku zavara osnovni materijal još je hladan, pa nestacionarno polje ima veće brzine hlađenja od kvazistacionarnog. ⚠️ Izvori se ovdje razilaze (u ovoj zbirci stajalo je „manjim“), pa provjeri na slajdu." },
        { q: "Sitnozrnati čelici u odnosu na opće konstrukcijske imaju", options: ["višu granicu razvlačenja", "sitnije zrno", "veći mogul elastičnosti", "bolju lomnu žilavost"], correct: [0, 1, 3], note: "Sitnozrnati čelici imaju sitnije zrno, višu granicu razvlačenja i bolju (lomnu) žilavost. Modul elastičnosti je za sve čelike praktički isti." },
        { q: "Prijelazna temperatura je", options: ["temperatura kod koje je udarni rad loma optimalan", "temperatura ispod koje udarni rad loma naglo pada", "karakteristična za BCC materijale", "karakteristična za FCC materijale"], correct: [1, 2], note: "Ispravljeno: prijelazna temperatura je temperatura ispod koje udarni rad loma naglo pada (prijelaz iz žilavog u krhki lom), a karakteristična je za BCC materijale. FCC materijali (austenit, Al, Cu) nemaju takav prijelaz." },
        { q: "Kada se ocjenjuju mikrolegirani čelici najvažnija svojstva koja treba uzeti u obzir su:", options: ["vlačna čvrstoća", "granica popuštanja", "prijelazna temperatura", "tvrdoća"], correct: [1, 2], note: "Ispravljeno: kod mikrolegiranih čelika cilj je visoka granica razvlačenja (popuštanja) uz dobru žilavost, odnosno nisku prijelaznu temperaturu, i to se najviše ocjenjuje. To piše i u komentaru zbirke, iako je kao točnu označila vlačnu čvrstoću. ⚠️ Provjeri na slajdu (Tema 2.10, str. 20)." },
        { q: "Precipitacijski očvrstivi (PH) čelici su:", options: ["feritni", "ultračvrsti", "martenzitni", "za poboljšavanje"], correct: [1, 2], note: "PH (precipitacijski očvrstivi) nehrđajući čelici spadaju u ultračvrste i najčešće su martenzitni (npr. 17-4 PH), a postoje i poluaustenitni. Očvršćuju se starenjem, ne poboljšavanjem." },
        { q: "Koja karakteristika ukazuje na pukotine uslijed ponovnog žarenja", options: ["pucanje u ZUT-u tijekom naknadne toplinske obrade zavarenog spoja", "pucanje u MZ-a tijekom naknadne toplinske obrade zavarenog spoja", "pucanje po granicama zrna", "pucanje preko granica zrna"], correct: [0, 1, 2], note: "Ispravljeno prema službenom ključu (MI 11279): pukotine zbog ponovnog žarenja javljaju se tijekom toplinske obrade nakon zavarivanja, najčešće u grubozrnatom ZUT-u, ali i u metalu zavara, i to po granicama zrna (interkristalno), jer karbidi ojačaju unutrašnjost zrna." },
        { q: "Što je vodikom inducirana krhkost (HIC) kod HSLA čelika", options: ["poseban slučaj opće korozije metala", "poseban slučaj napetosne korozije metala", "poseban slučaj unutarnjeg oštećenja metalne konstrukcije", "interkristalna korozija"], correct: [1], note: "HIC (vodikom inducirano pucanje) kod HSLA čelika svrstava se kao poseban slučaj napetosne korozije: atomarni vodik iz korozijske reakcije (npr. u H2S) ulazi u čelik i uz naprezanje stvara pukotine. (U izvorniku je prvi odgovor bio oštećen.)" },
        { q: "Što se apsorbira u metalu i uzrokuje HIC", options: ["vodikov ion H*", "molekula vodika H2", "vodikov atom H", "molekula dušuka N2"], correct: [2], note: "U metal može ući samo atomarni vodik (H), jer je dovoljno malen za difuziju kroz rešetku. U čeliku se na uključcima spaja u molekule H2 pod velikim tlakom i stvara pukotine." },
        { q: "Implant je proba sklonosti", options: ["toplim pukotinama", "hladnim pukotinama", "koroziji", "vrućim pukotinama"], correct: [1], note: "Implant test (kao i Tekken, CTS i Lehigh) ispituje sklonost hladnim pukotinama. Za tople pukotine služe Varestraint i FISCO test." },
        { q: "Označite grupu elemenata koji svi povećavaju opasnost pojave pukotina u metalu zavara uslijed naknadnog žarenja za niskolegirane Cr-Mo čelike", options: ["P, S, N, Ti", "P, Sb, Sn, As", "P, O, Cu, Al", "P, C, Nb, Ti"], correct: [0], note: "Ključ iz zbirke (autor nesiguran). Pukotinama zbog naknadnog žarenja CrMo čelika pogoduju karbidotvorci (Ti, Nb, V) i nečistoće (P, S, N, Sb, Sn, As). ⚠️ U literaturi se često navodi i skupina P, Sb, Sn, As, pa provjeri na slajdu." },
        { q: "Niskolegirani čelici mogu se primjeniti na", options: ["lopatice parnih turbina", "lopatice plinskih turbina", "raketne motore", "kotlove"], correct: [0, 1, 3], note: "Ključ iz zbirke: niskolegirani (CrMo, CrMoV) čelici koriste se za kotlove i lopatice parnih turbina. ⚠️ Lopatice plinskih turbina danas se izrađuju od superlegura, pa je taj odgovor upitan." },
        { q: "Jamičastu ili rupičastu koroziju (Pitting) nerđajućih čelika izaziva", options: ["jaka kiselost vodene otopine", "prisutnost klorida i oksidansa npr O2, Fe 3+ u vodenoj otopini", "visoka temperatura vodene otopine", "brzo relativno gibanje vodene otopine u odnosu na čelik"], correct: [0, 1, 2], note: "Ispravljeno: rupičastu koroziju nehrđajućih čelika izazivaju kloridi uz oksidanse (O2, Fe³⁺), a potiču je jaka kiselost (nizak pH) i povišena temperatura. Brzo gibanje otopine smanjuje opasnost, jer ne dopušta stvaranje lokalnih „ćelija“." },
        { q: "Izlučivanje Cr-karbida kod CrNi čelika je najintenzivnije pri temperaturi", options: ["100-200 ºC", "200-400 ºC", "900-1000 ºC", "400-900 ºC"], correct: [3], note: "Cr-karbidi (Cr23C6) najintenzivnije se izlučuju u području oko 450–850 °C, pa je od ponuđenih točno 400–900 °C. Ispod je difuzija prespora, a iznad 900–1000 °C karbidi se otapaju." },
        { q: "Koje tvrdnje su točne u pogledu trošenja abrazijom", options: ["glavni mehanizam trošenja kod toplog valjanja je abrazija", "normalno trošenje između cilindra i klipnih prstena je adhezijska abrazija", "iznos abrazije uslijed djelovanja abrazivnih čestica obično nije povezan s razinom naprezanja", "trošenje na zubima rovokopača i čekićima drobilice smatra se tipičnim abrazijskim trošenjem česticama"], correct: [3], note: "Zubi bagera i čekići drobilica tipičan su primjer abrazije tvrdim česticama (kamen). Kod toplog valjanja prevladavaju toplinski umor i oksidacija, a abrazija ovisi o naprezanju." },
        { q: "Umor površine pretežno nastaje kod", options: ["klizanja", "kotrljanja", "erozije kapljicama", "kavitacije"], correct: [1, 2, 3], note: "Ispravljeno: umor površine nastaje zbog cikličkih kontaktnih naprezanja: kod kotrljanja (ležajevi, zupčanici), kod erozije kapljicama i kod kavitacije (ponavljani udari). Klizanje uzrokuje adheziju i abraziju." },
        { q: "Pri zavarivanju platiranog čelika (ugljično-manganski čelik kao osnovni materijal i AISI 304 kao korozijski otporan sloj)", options: ["potrebno je primjeniti jednako predgrijavanje za osnovni materijal i korozijski otporan sloj", "prvi sloj platiranja može se izvesti s dodatnim materijalom kvalitete AISI 309", "cijeli sloj može se izvesti s dodatnim materijalom kvalitete AISI 309 ako je pristupačnost spoju otežana", "potrebno je izbjeći miješanje platiranog sloja s dodatnim materijalom kojim je zavaren osnovni materijal"], correct: [0, 1, 2, 3], note: "Ispravljeno prema službenom ključu (MI 1278): predgrijavanje se određuje prema osnovnom (C-Mn) materijalu i primjenjuje jednako na cijeli spoj. Prvi sloj na platiranoj strani izvodi se prelegiranim 309, a kod otežanog pristupa cijeli spoj s 309. Treba izbjeći miješanje platiranog sloja s dodatnim materijalom za ugljični čelik." },
        { q: "Zavari visoke kakvoće (bez grešaka) pri spajanju dezoksidiranog bakra mogu se postići slijedećim postupcima", options: ["mekim lemljenjem", "TIG zavarivanjem s dvostranom zaštitom", "MIG zavarivanjem s posebnim DM koji sadrži veliki postotak dezoksidirajućih elemenata", "nista od navedenog nije točno"], correct: [1, 2], note: "Ispravljeno: dezoksidirani bakar kvalitetno se zavaruje TIG postupkom s dvostranom zaštitom i MIG postupkom s dodatnim materijalom s mnogo dezoksidansa (Si, Mn, P), koji vežu kisik i sprječavaju pore. Meko lemljenje nije zavarivanje." },
        { q: "Mjed je legura", options: ["Cu-Zn", "Cu-Sn", "Cu-Al", "Cu-Zn-Sn-Pb"], correct: [0], note: "Mjed (mesing) je legura bakra i cinka (Cu-Zn). Cu-Sn i Cu-Al su bronce." },
        { q: "Hladnom deformacijom", options: ["nije moguće očvrsnuti Cu legure", "moguće je očvrsnuti Cu legure", "moguće je očvrsnuti Cu legure jer se javlja precipitacijsko očvršćavanje", "nije moguće očvrsnuti Cu legure jer se ne javlja precipitacijsko očvršćavanje"], correct: [1], note: "Cu legure se mogu očvrsnuti hladnom deformacijom, gibanjem i umnažanjem dislokacija; to nije precipitacijsko očvršćivanje." },
        { q: "Monel je legura Ni slijedećeg sastava", options: ["67% Ni, 30% Cu, 1.5% Fe, 1% Mn", "80% Ni, 15% Cr, 5% Fe", "90% Ni, 5% Cr, 5% Fe", "60% Ni, 20% Cr, 20% Fe"], correct: [0], note: "Monel (Alloy 400, NiCu30Fe) ima oko 67 % Ni i 30 % Cu. Sastav 80 % Ni, 15 % Cr, 5 % Fe je Inconel. (Četvrti odgovor u izvorniku bio je nečitak, pa je zamijenjen.)" },
        { q: "Sklonost vrućim pukotinama kod zavarivanja Ni legura ovisi najviše o:", options: ["sadržaju Mn", "sadržaju S", "sadržaju C", "sadržaju Cr"], correct: [1], note: "Sklonost toplim pukotinama kod Ni legura najviše ovisi o sumporu (nisko taljivi Ni3S2 eutektik na oko 637 °C). Štetni su i P, Pb, Bi i B." },
        { q: "Al legure imaju slijedeća svojstva", options: ["malu gustoću (2.7 kg/dm3)", "pogodnost za plastično preoblikovanje", "visoku toplinsku vodljivost", "malu gustoću (1.2kg/dm3)"], correct: [0, 1, 2], note: "Al legure imaju malu gustoću (oko 2,7 kg/dm³), dobro se plastično oblikuju i imaju visoku toplinsku vodljivost. Gustoću oko 1,7 kg/dm³ ima magnezij." },
        { q: "Al legure se obično upotrebljavaju u:", options: ["zrakoplovnoj industriji", "auto industriji", "kotlogradnji", "izradi svrdla za naftne bušotine"], correct: [0, 1], note: "Al legure se najviše koriste u zrakoplovnoj i auto industriji (mala masa). Za kotlove i svrdla nisu prikladne, zbog niske čvrstoće na visokim temperaturama i male tvrdoće." },
        { q: "Kod TIG zavarivanja Al legura uz primjenu DM:", options: ["preporučuje se predgrijavanje", "ne preporučuje se predgrijavanje", "uz dobru tehniku rada zavarivača, predgrijavanje nikada neće biti potrebno", "preporučuje se predgrijavanje samo kad je okolišna temperatura ispod 0 ºC"], correct: [0], note: "Aluminij jako odvodi toplinu, pa se kod debljih presjeka preporučuje predgrijavanje (umjereno, obično do oko 100–150 °C, ne previše zbog pada čvrstoće)." },
        { q: "Kod MIG zavarivanja Al legura uobičajeno se koristi", options: ["\"push-pull\" sistem dodavanja žice", "\"push-push\" sistem dodavanja žice", "\"pull-pull\" sistem dodavanja žice", "uređaji zavarivanja sa ravnom karakteristikom"], correct: [0, 3], note: "Aluminijska žica je mekana pa se lako izvija, zato se koristi push-pull sustav dodavanja. Izvor struje ima ravnu (CV) karakteristiku, kao kod svakog MIG zavarivanja." },
        { q: "Odabrati točnu tvrdnju", options: ["kakvoća i svojstva zavarenog spoja raznorodnih čelika u vrlo velikoj mjeri ovise o izboru DM", "kod zavarivanja spoja raznorodnih čelika, izbor DM nije bitan, osnovno je paziti na pripremu spoja", "raznorodne čelike nije moguće kvalitetno zavariti", "ukoliko se zavaruje ugljični čelik i austenitni visokolegirani, dolazi do difuzije ugljika iz ugljičnog čelika u austenitni visokolegirani čelik"], correct: [0, 3], note: "Kakvoća raznorodnog spoja najviše ovisi o izboru dodatnog materijala (prelegiran, 309 ili na bazi Ni). Ugljik pri povišenim temperaturama difundira iz ugljičnog čelika prema austenitnom, pa uz liniju staljivanja nastaje razugljičena zona." },
        { q: "Cr i Ni ekvivalent su pojmovi koji se upotrebljavaju kod", options: ["zavarivanja raznorodnih čelika", "primjeni Schaefflerovog dijagrama", "određivanju temperature predgrijavanja", "određivanju C ekv"], correct: [0, 1], note: "Cr- i Ni-ekvivalent koriste se u Schaefflerovom (i De Longovom, WRC) dijagramu, prvenstveno kod zavarivanja raznorodnih čelika. Za predgrijavanje služi Cekv." },
        { q: "Stupanj protaljivanja (miješanja) kod zavarivanja raznorodnih čelika znatno ovisi o", options: ["snazi izvora struje (unosu topline)", "toplinskim i fizikalnim svojstvima materijala", "oblikovanju spoja", "temperaturi okoline"], correct: [0, 1, 2], note: "Ispravljeno: dilucija ovisi o unosu topline, toplinskim i fizikalnim svojstvima materijala (vodljivost, talište) i obliku spoja. Zbirka je ovdje izostavila svojstva materijala, iako ih u drugoj verziji istog pitanja navodi kao točna." },
        { q: "100% bainitna struktura može se dobiti", options: ["kaljenjem", "klasičnim poboljšavanjem", "izotermičkim poboljšavanjem", "izotermičkim žarenjem"], correct: [2], note: "Potpuno bainitna struktura dobiva se izotermičkim poboljšavanjem (austempering): gašenjem u kupki iznad Ms i držanjem dok se sav austenit ne pretvori u bainit." },
        { q: "Kod kojeg osnovnog mehanizma trošenja početak trošenja se ne javlja na mjestu kontakta funkcionalnih dijelova", options: ["abrazije", "adhezije", "umora površine", "tribokorozije"], correct: [2], note: "Kod umora površine pukotine počinju ispod površine kontakta, gdje su smična naprezanja najveća. Abrazija, adhezija i tribokorozija počinju na samoj površini dodira." },
        { q: "Martenzitni PH čelici imaju:", options: ["1-10% Cr i 2-3% Ni", "14-17% Cr i 4-6% Ni", "10-12% Cr i 10-12% Ni", "12-13% Cr i 8-9% Ni"], correct: [1], note: "Martenzitni PH čelici (npr. 17-4 PH) imaju oko 14–17 % Cr, 4–6 % Ni, oko 3 % Cu i malo C. Bakar i Nb se pri starenju izlučuju i očvrsnu martenzit." },
        { q: "Koji se materijal može primjeniti za temperature -50 ºC", options: ["sivi lijev", "visokougljični čelici", "sitnozrnati čelici", "feritični nerđajući čelici"], correct: [2], note: "Za oko −50 °C koriste se sitnozrnati (mikrolegirani) čelici, jer sitno zrno snizuje prijelaznu temperaturu. Sivi lijev, visokougljični i feritni nehrđajući čelici na tim su temperaturama krhki." },
        { q: "Koji od navedenih elemenata ima najbolji utjecaj na prokaljivost", options: ["Cr", "Mn", "Al", "Cu"], correct: [0], note: "Ključ iz zbirke je Cr. Krom snažno povećava prokaljivost, a jak je i Mn, pa se ovo pitanje smatra nesigurnim. Al i Cu imaju mali utjecaj." },
        { q: "Dodavanje legirnih elemenata niskolegiranim feritnim čelicima općenito", options: ["povećava duktilnost", "smanjuje prokaljivost", "povećava prokaljivost", "smanjuje zavarljivost"], correct: [2, 3], note: "Ispravljeno: legirni elementi niskolegiranih čelika povećavaju prokaljivost (TTT krivulje idu udesno), a time i Cekv, pa smanjuju zavarljivost. Zbirka je ovdje navodila samo zavarljivost, a u drugoj verziji pitanja oba odgovora." },
        { q: "Razlozi zbog kojih je višeslojni zavar obično žilaviji od jednoslojnog su", options: ["stvaranje izvjesne količine martenzita", "toplina jednog prolaza normalizira prethodni", "toplina jednog prolaza usitnjuje zrna prethodnog prolaza", "toplina jednog prolaza povećava zrna prethodnog prolaza"], correct: [1, 2], note: "Svaki sljedeći prolaz zagrijava prethodni iznad A3 i normalizira ga, odnosno usitnjava zrno, pa je višeslojni zavar žilaviji. Martenzit i grubo zrno smanjuju žilavost." },
        { q: "Koje od navedenih tvrdnji o hladnim pukotinama izazvanim vodikom su točne", options: ["nerazorna ispitivanja se moraju obaviti što je moguće prije, odmah nakon završetka zavarivanja", "pukotine se mogu pojaviti i u ZUT i u MZ", "pukotine se mogu nekad izbjeći primjenom većeg unosa topline", "manji sadržaj ugljika u osnovnom metalu smanjuje opasnost od pojave pukotina"], correct: [1, 2, 3], note: "Ispravljeno: hladne pukotine javljaju se i u ZUT-u i u metalu zavara, veći unos topline (sporije hlađenje) ih može spriječiti, a manji udio ugljika smanjuje zakaljivost i opasnost. Nerazorna ispitivanja treba odgoditi (npr. 24–48 h), jer se pukotine javljaju sa zakašnjenjem." },
        { q: "Lamelarno trganje ovisi o/ izazvano je", options: ["kemijskim sastavom OM", "nezadovoljavajućim svojstvima u smjeru osi Z", "nezadovoljavajućim svojstvima u smjeru osi X-Y", "preniskom žilavošću"], correct: [0, 1], note: "Lamelarno trganje ovisi o kemijskom sastavu osnovnog materijala (sumpor, sulfidni uključci) i lošim svojstvima u smjeru debljine (os Z, mala kontrakcija ZD)." },
        { q: "Koje od navedenih kristalografskih rešetki sadrže gusto složene klizne ravnine", options: ["FCC", "HCP", "BCC", "CS"], correct: [0, 1], note: "FCC klizi po gusto složenim ravninama {111}, a HCP po gusto složenoj bazalnoj ravnini (0001), pa su točne obje. FCC ima više takvih kliznih sustava (12 prema 3), pa je duktilniji. BCC nema gusto složenu ravninu." },
        { q: "C-Mn čelik se opisuje kao uvjetno zavarljiv", options: ["kada je uz primjenu običnih postupaka zavarivanja potrebno predgrijavanje, toplinska obrada, kontrolirani unos topline", "kada se materijal jako deformira kod zavarivanja", "kada je nužna upotreba specijalnih postupaka zavarivanja", "u pravilu, svi materijali su dobro zavarljivi"], correct: [0, 2], note: "C-Mn čelik je uvjetno zavarljiv kad uz uobičajene postupke treba predgrijavanje, toplinsku obradu ili kontrolirani unos topline, ili kad treba poseban postupak zavarivanja." },
        { q: "Koji od navedenih čelika ima najlošiju zavarljivost", options: ["X10CrMoVNb9-1", "X20CrMoV11-1", "X10Ni9", "X2CrNi18-9"], correct: [1], note: "X20CrMoV11-1 ima oko 0,2 % C i 11 % Cr, pa je jako zakaljiv i najteže zavarljiv: traži visoko predgrijavanje i PWHT. P91 (X10CrMoVNb9-1) ima manje ugljika, a austenitni X2CrNi18-9 dobro se zavaruje." },
        { q: "Koji čimbenik uzrokuje pukotine izazvane napetosnom korozijom", options: ["veliki sadržaj ugljika", "velika tlačna naprezanja", "elektrolit koji sadrži kloride i fluoride", "velika vlačna naprezanja ili zaostala, izazvana zavarivanjem"], correct: [2, 3], note: "Napetosnu koroziju izaziva elektrolit s kloridima ili fluoridima uz vlačna, često zaostala naprezanja od zavarivanja. Tlačna naprezanja je sprječavaju." },
        { q: "Pougljičenje je dobro za", options: ["izjedanje (fretting)", "zupčanike", "ležajeve", "umor površine"], correct: [1, 3], note: "Ispravljeno: pougljičenje (cementiranje) daje tvrdu, otpornu površinu s tlačnim napetostima uz žilavu jezgru, pa je tipično za zupčanike i dobro protiv umora površine. Zbirka je ovdje navodila samo zupčanike, a u drugoj verziji pitanja oba odgovora." },
        { q: "Koje od navedenih mjera su učinkovite u smanjenju količine poroznosti kod zavarivanja Al i Al legura", options: ["koristiti samo He kao zaštitni plin", "izbjegavati dodirivanje područja spoja i dodatnog materijala golim prstima", "primijeniti zavarivanje u čvrstom stanju umjesto zavarivanja taljenjem", "zavarivati samo toplinski očvrstive Al-legure"], correct: [1, 2], note: "Ispravljeno prema službenom ključu (MI 1328): pore u Al stvara vodik iz vlage i masnoće, pa treba izbjegavati dodirivanje spoja golim prstima, a zavarivanje u čvrstom stanju (npr. FSW) uopće nema taline, pa nema ni pora. Čisti He ne uklanja poroznost, a vrsta legure nije rješenje." },
        { q: "Kako se zavaruje spoj niskolegiranog čelika otpornog na puzanje (10CrMo9-10) i CrNi legiranog (X6CrNiTi18-10)", options: ["s DM na bazi Ni primjenjujući metodu međusloja", "s austenitnim DM primjenjujući metodu međusloja", "bez predgrijavanja", "s velikim miješanjem"], correct: [0], note: "Spoj CrMo čelika (koji se toplinski obrađuje) i austenitnog čelika izvodi se dodatnim materijalom na bazi Ni (npr. ERNiCr-3) uz međusloj: Ni legura ima toplinsko istezanje između feritnog i austenitnog čelika i koči migraciju ugljika." },
        { q: "Koje od navedenih tvrdnji su točne u vezi s CTOD ispitivanja čelika", options: ["CTOD je kratica za Crack Transmission by Overload and Deformation", "CTOD se provodi u cilju procjene izduženja materijala pri istezanju na niskim temperaturama", "CTOD je kratica za Crack Tip Opening Displacement", "CTOD test se provodi u cilju mjerenja otpora materijala prema napredovanju pukotine"], correct: [2, 3], note: "CTOD (Crack Tip Opening Displacement), otvaranje vrha pukotine, mjeri otpornost materijala prema napredovanju pukotine (lomnu žilavost)." },
        { q: "Koja tvrdnja za ispitivanje tvrdoće po Brinellu (HB) je točna", options: ["moguće je preračunati HB tvrdoću u vlačnu čvrstoću koristeći tablice", "ispitivanje prema HB ne može u cijelosti zamijeniti vlačno ispitivanje jer mogu postojati velika odstupanja vlačne čvrstoće i vlačne čvrstoće izračunate prema tvrdoći", "mjeri se promjer otiska kojeg je ostavila kuglica", "kod HB ispitivanja koristi se čelična zakaljena kuglica"], correct: [2, 3], note: "Kod Brinella se zakaljena čelična (ili tvrdometalna) kuglica utiskuje u materijal i mjeri se promjer otiska. HB se tablicama može približno preračunati u Rm, ali to ne zamjenjuje vlačni pokus." },
        { q: "Zašto se u visoku peć kod proizvodnje željeza dodaje vapno", options: ["Da snizi talište nereduciranih oksida", "Da poveća talište nereduciranih oksida", "da snizi talište željeza", "da poveća talište željeza"], correct: [0], note: "Vapno (vapnenac) se dodaje da s jalovinom (nereduciranim oksidima, SiO2, Al2O3) stvori trosku nižeg tališta, koja se lako odvaja od taline i veže sumpor." },
        { q: "Koliki je postoak ugljika u sirovom željezu", options: ["veći od 2,03%", "veći od 4%", "veći od 0,8%", "manji od 4%"], correct: [0, 3], note: "Prema ključu zbirke sirovo željezo ima više od 2,03 % C (iznad granice čelika), a prema zbirci manje od 4 %. U praksi ima oko 3,5–4,5 % C." },
        { q: "Što proizvodimo od sivog sirovoga željeza", options: ["Sivi lijev", "nodularni lijev", "vermikularni lijev", "bijeli temper lijev"], correct: [0, 1, 2], note: "Sivo sirovo željezo (C u obliku grafita, više Si) koristi se za sivi, nodularni i vermikularni lijev. Temper lijev nastaje iz bijelog sirovog željeza." },
        { q: "Što proizvodimo od bijelog sirovoga željeza", options: ["Bijeli tvrdi lijev", "Temper bijeli lijev", "Temper crni lijev", "Čelike po potrebi"], correct: [0, 1, 2, 3], note: "Iz bijelog sirovog željeza (C vezan u Fe3C) dobivaju se bijeli tvrdi lijev i temper lijev (bijeli i crni, žarenjem), a ono je i glavna sirovina za proizvodnju čelika." },
        { q: "Koje greške mogu biti u čeličnome poluproizvodu", options: ["Unutrašnje", "Vanjske", "Mikrostrukturalne", "makroskoposke"], correct: [0, 1, 2], note: "Prema ključu zbirke greške poluproizvoda dijele se na unutrašnje (lunkeri, segregacije, uključci), vanjske (površinske pukotine, preklopi) i mikrostrukturne." },
        { q: "Čelici proizvedeni metalurgijom praha razlikuju se od običnih čelika:", options: ["imaju bolja svojstva", "imaju lošija svojstva", "imaju tragove segregacije", "nemaju tragove segregacije"], correct: [3], note: "Čelici dobiveni metalurgijom praha nemaju segregacija, jer nema skrućivanja velike taline. Ostala svojstva ovise o gustoći (poroznosti) i postupku." },
        { q: "Čime se provodi dezoksidacija nesmirenoga čelika", options: ["Ca, Si, Al", "CO2, CaO", "Mn i Mo", "P i S"], correct: [0], note: "Dezoksidacija (smirivanje) provodi se elementima jakog afiniteta prema kisiku: Ca, Si, Al (i Mn). CO2 i CaO nisu dezoksidansi, a P i S su nečistoće." },
        { q: "Epruveta za vlačni pokus okrugla ima promjer", options: ["20 mm", "10 mm", "5 mm", "nije definirano"], correct: [0, 1, 2], note: "Okrugle proporcionalne epruvete za vlačni pokus standardno imaju promjer 20, 10 ili 5 mm." },
        { q: "Dužine i površine presjeka epruvete smije biti", options: ["Lo= 5,65* √S0", "Lo= 11,3* √S0", "nije definirano", "smije biti razmjerno ako nije moguće izraditi standardnu epruvetu"], correct: [0, 1, 3], note: "Proporcionalne epruvete imaju L0 = 5,65·√S0 (kratka) ili L0 = 11,3·√S0 (duga). Kad se ne može izraditi standardna, dopuštena je proporcionalna epruveta drugih dimenzija." },
        { q: "Dubine epruvete V", options: ["1mm", "2mm", "3mm", "4mm"], correct: [1], note: "Charpy epruveta s V-zarezom (ISO 148) ima zarez dubine 2 mm, kut 45° i radijus vrha 0,25 mm." },
        { q: "Dubine epruvete U", options: ["1mm", "2mm", "3mm", "4mm"], correct: [2], note: "Ključ iz zbirke: epruveta s U-zarezom ima dubinu zareza 3 mm (stara DVM epruveta). ⚠️ Prema ISO 148 U-zarez je dubok 2 ili 5 mm." },
        { q: "Veze između atoma mogu biti", options: ["ionske", "kovalentne", "metalne", "magnetske"], correct: [0, 1, 2], note: "Primarne veze između atoma su ionska, kovalentna i metalna; sekundarne su Van der Waalsove (dipolne). Magnetska veza ne postoji." },
        { q: "Kationi imaju", options: ["pozitivan naboj", "negativan naboj", "veći polumjer od izvornoga atoma", "manji polumjer od izvornoga atoma"], correct: [0, 3], note: "Kation nastaje kad atom otpusti elektrone: ima pozitivan naboj i manji polumjer od neutralnog atoma, jer preostale elektrone jezgra jače privlači." },
        { q: "Što se događa kad se metal hladno (plastično) deformira, npr. hladnim valjanjem ili vučenjem? S porastom stupnja hladne deformacije raste:", options: ["čvrstoća", "granica razvlačenja", "tvrdoća", "istezljivost"], correct: [0, 1, 2], note: "Hladnom deformacijom raste gustoća dislokacija, pa rastu čvrstoća, granica razvlačenja i tvrdoća, a pada istezljivost." },
        { q: "S porastom stupnja deformacije pada", options: ["istezljivost", "kontrakcija ili suženje", "udarna žilavost", "modul elastičnosti"], correct: [0, 1, 2], note: "Ispravljeno: hladnom deformacijom padaju istezljivost, kontrakcija i udarna žilavost. Modul elastičnosti E ovisi o vezama među atomima i praktički se ne mijenja deformacijom." },
        { q: "Koliko ugljika može otopiti austenit max", options: ["0,025", "0,8", "2,03", "4,3"], correct: [2], note: "Austenit može otopiti najviše 2,03 % C (na 1147 °C). Vrijednosti 0,8 % i 4,3 % su eutektoid i eutektik, a 0,025 % je ferit." },
        { q: "Koliko ugljika može otopiti ferit max", options: ["0,025", "0,8", "2,03", "4,3"], correct: [0], note: "Ferit (α-Fe, BCC) može otopiti najviše oko 0,025 % C (na 723 °C), a na sobnoj temperaturi gotovo ništa." },
        { q: "Na koju temperaturu se vrši grijanje radi žarenja za redukciju zaostalih napetosti", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [0], note: "Ključ iz zbirke je 400–500 °C. ⚠️ U drugim izvorima žarenje za redukciju napetosti navodi se kao 400–650 °C, a PWHT čelika najčešće oko 550–650 °C, pa pazi kako je pitanje zadano." },
        { q: "Na koju temperaturu se vrši grijanje rekristalizacije", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [1], note: "Rekristalizacijsko žarenje provodi se oko 500–650 °C (ispod A1), iznad temperature rekristalizacije hladno deformiranog čelika." },
        { q: "Sferoidizacijsko žarenje ( meko žarenje)", options: ["400-500 °C", "500-650 °C", "oko A1", "oko A3"], correct: [2], note: "Sferoidizacijsko (meko) žarenje provodi se oko A1 (njihanjem oko A1 ili dugim držanjem tik ispod), da lamele cementita postanu kuglice." },
        { q: "Homogenizacijsko ili difuzijsko žarenje", options: ["iznad A3", "500-650 °C", "ispod A1", "ispod solidus linije"], correct: [0, 3], note: "Homogenizacijsko (difuzijsko) žarenje provodi se na visokoj temperaturi, iznad A3 a ispod solidusa (oko 1050–1250 °C), dugo, da difuzija izjednači sastav." },
        { q: "Zašto se prvovodi homogenizacijsko žarenje", options: ["da se uklone zaostale napetosti", "zbog rekristalziacije", "zbog normalizacije", "da se uklone segregacije nastale ohlađivanjem"], correct: [3], note: "Homogenizacija uklanja kristalne segregacije (nejednolik sastav) nastale pri skrućivanju i hlađenju odljevaka i ingota." },
        { q: "Sferoidizacijsko žarenje provodi se zbog", options: ["poboljšanja deformabilnosti nakon hladne deformacije", "otklanja segregacije", "povećava zrno radi lakše strojne obrade", "pobošava rezljivost čelika sa visokim sadržajem ugljika"], correct: [3], note: "Sferoidizacijsko žarenje poboljšava rezljivost (i hladnu oblikovljivost) čelika s višim udjelom ugljika, jer kuglasti cementit lakše reže nego lamelarni." },
        { q: "Normalizacijsko žarenje se provodi radi", options: ["usitnjaavanja grubozrnate strukture nastalu lijevanjem, zavarivanje i sl", "da se otklone zaostala naprezanja", "otklanja segregacija", "povećava zrno radi lakše strojne obrade"], correct: [0], note: "Normalizacija usitnjava grubozrnatu strukturu nastalu lijevanjem, zavarivanjem ili toplim oblikovanjem. Napetosti uklanja žarenje za redukciju napetosti, a segregacije homogenizacija." },
        { q: "Što je precipitacijsko očvrsnuće", options: ["to je povišenje granice tečenja i čvrstoće grijanjem do homogenizacije i otapanja percipita te gašenja tako da precipitati ostanu rastvoreni unutar zrna", "smanjenje granice tećenja i čvrstoće radi lakše obrade", "popuštanje zaostalih napetosti", "povećanje žilavosti brzim hlađenjem iz taline"], correct: [0], note: "Precipitacijsko očvršćivanje povisuje granicu tečenja i čvrstoću: rastvorno žarenje otopi precipitate, gašenje ih zadrži otopljene, a naknadnim starenjem (dozrijevanjem) izluče se sitni precipitati koji koče dislokacije. Odgovor iz zbirke opisuje prva dva koraka." },
        { q: "Legiranje i provođenje TO", options: ["Mjerenje temperature pri TO provodi se najčešće termoelementima, direktno na obrađivanom dijelu", "Reguliranje temperature provodi se najčešće P i D regulacijom", "Programiranje procesa provodi se primjenom različitih vrsta mikroprocesora programatora s različitim funkcijama", "Zapis provedenoga procea je dokaz provedene tehnologije"], correct: [0, 1, 2, 3], note: "Kod toplinske obrade temperatura se mjeri termoelementima na samom dijelu, regulira (PID) regulacijom, proces se programira mikroprocesorskim programatorima, a zapis je dokaz provedene tehnologije." },
        { q: "Nastanak hladnih pukotina potaknut je:", options: ["Malom deformabilnošću (plastičnosću) materijala", "velikom zrnom materijala", "Velikim sadržajem difuzijskoga vodika u metalu zavara", "Lokalnom koncentracijom naprezanja"], correct: [0, 1, 2, 3], note: "Ispravljeno prema službenom ključu (MI 347): hladne pukotine potiču mala deformabilnost (zakaljena struktura), grubo zrno (lakše se zakali i krhkije je), difuzijski vodik i lokalna koncentracija naprezanja." },
        { q: "TTT dijagram može poslužiti za:", options: ["procjenu strukture zavarenoga spoja", "procjenu tvrdoće i drugih svojstava zavarenoga spoja ( ako ima odgovarajući TTT dijagram)", "određivanje temperature predgrijavanja i dogrijavanja", "odabir trajanja hlađenja od 800 do 500 °C"], correct: [0, 1, 3], note: "Iz TTT (CCT) dijagrama procjenjuju se struktura i tvrdoća zavarenog spoja te odabire dopušteno t8/5. Temperatura predgrijavanja određuje se iz Cekv i debljine (npr. EN 1011-2, Séférian)." },
        { q: "Prilikom ugrijavanja α željezo prelazi u γ željezo na temeperaturi:", options: ["770 °C", "898 °C", "1392 °C", "911 °C"], correct: [3], note: "Pri zagrijavanju α-Fe prelazi u γ-Fe na 911 °C (pri hlađenju zbog histereze niže, oko 898 °C). 770 °C je Curiejeva točka, a 1392 °C prijelaz γ u δ." },
        { q: "Izračunajte unešenu energiju (toplinski input) ako su izmjerene sljedeće vrijednosti parametara rel zavarivanja: i=160 A, U=25 V, v= 2 mm/s , dok je stupanj iskorištenja energije u električnom luku ƞ=0,8?", options: ["1600 J/mm", "1600 J/mm2", "1000 J/cm", "1,6 kJ/mm"], correct: [0, 3], note: "Q = η · U · I / v = 0,8 · 25 V · 160 A / 2 mm/s = 1600 J/mm = 1,6 kJ/mm. Jedinica je J/mm (energija po duljini zavara), ne J/mm²." },
        { q: "Intersticijske mješance tvore:", options: ["Fe i Ni", "Fe i Cr", "Fe i C", "Fe i B"], correct: [2, 3], note: "Intersticijske mješance tvore mali atomi koji ulaze u međuprostore rešetke željeza: C, N, H i B. Ni i Cr imaju atome slične veličine kao Fe, pa tvore supstitucijske mješance." },
        { q: "Kristalne rešetke metala. Odabrati točnu(e) tvrdnju(e):", options: ["prostorno centriranu kubnu rešetku (BCC) posjeduju α-Fe, W, Mo", "prostorno centriranu kubnu rešetku (FCC) posjeduju α-Fe, W, Mo", "plošno centriranu kubnu rešetku (FCC) posjeduju γ-Fe, Cu, Al", "kompaktnu heksagonsku rešetku (HCP) posjeduju γ-Fe, Cu, Al, Mg"], correct: [0, 2], note: "BCC (prostorno centriranu kubnu) rešetku imaju α-Fe, W, Mo i Cr, a FCC (plošno centriranu) γ-Fe, Cu, Al i Ni. Mg je HCP, a γ-Fe, Cu i Al nisu HCP." },
        { q: "Znanost o materijalima istražuje:", options: ["ponašanje metala", "različite vrste kemijskih veza", "vodljivost metala", "značajke (svojstva) metala"], correct: [0, 3], note: "Znanost o materijalima istražuje ponašanje i svojstva materijala (metala) i njihovu vezu sa strukturom. Kemijske veze i vodljivost samo su dijelovi toga, pa međunarodni ključ priznaje ponašanje i svojstva." },
        { q: "Koliki je koordinacijski broj prostorno centrirane kubične (BCC) rešetke?", options: ["12", "8", "6", "4"], correct: [1], note: "U BCC rešetki svaki atom ima 8 najbližih susjeda (koordinacijski broj 8). FCC i HCP imaju koordinacijski broj 12." },
        { q: "Koja su značajna obilježja čistog metala?", options: ["metalna veza", "elastično i plastično se deformira", "čisti metal normalno je stanje u prirodi", "kovalentna veza"], correct: [0, 1], note: "Čisti metal ima metalnu vezu (slobodni elektroni) i može se elastično i plastično deformirati. U prirodi se metali uglavnom nalaze kao rude (oksidi, sulfidi), a kovalentna veza je svojstvo nemetala." },
        { q: "Smanjenje veličine zrna može dovesti do:", options: ["povećanja žilavosti", "povećanja sklonosti pukotinama i zakaljivosti", "bolje uporabljivosti pri niskim radnim temperaturama", "povećanja vlačne čvrstoće"], correct: [0, 2, 3], note: "Sitnije zrno istodobno povećava čvrstoću (Hall-Petch) i žilavost te snižava prijelaznu temperaturu, pa je materijal bolji na niskim temperaturama. Sklonost pukotinama i zakaljivost se ne povećavaju." },
        { q: "Atomi ugljika i dušika pri umjereno povišenim temperaturama difundiraju dovoljno brzo da sustignu dislokacije u gibanju i privremeno ih blokiraju. Odaberite točnu tvrdnju.", options: ["ta pojava uzrokuje pad granice razvlačenja", "pojava se naziva dinamičko deformacijsko starenje i prati je smanjenje duktilnosti", "atomi ugljika i dušika ne mogu znatnije difundirati ispod donje temperature pretvorbe", "pojava se naziva rekristalizacija i povećava duktilnost"], correct: [1], note: "Kad atomi C i N stižu dislokacije u gibanju i blokiraju ih, to je dinamičko deformacijsko starenje (plavi lom, oko 200–300 °C): raste čvrstoća, a pada duktilnost. Granica razvlačenja ne pada." },
        { q: "Što je kod niskolegiranog čelika odgovorno za pojavu izražene granice razvlačenja?", options: ["klizanje granica zrna preko više dislokacija", "gibanje granica zrna zbog prekoračenja granice razvlačenja materijala", "oslobađanje i gibanje dislokacija blokiranih intersticijskim atomima ugljika i/ili dušika", "dislokacije su trajno blokirane na granicama zrna pa plastična deformacija više nije moguća"], correct: [2], note: "Izražena granica razvlačenja nastaje kad se dislokacije blokirane atomima C i N (Cottrellovi oblaci) naglo oslobode i krenu, pa naprezanje na trenutak padne." },
        { q: "Koji je jedini mehanizam očvrsnuća koji istodobno povećava čvrstoću i žilavost?", options: ["očvrsnuće kristalima mješancima", "precipitacijsko očvrsnuće", "hladna deformacija", "usitnjenje zrna"], correct: [3], note: "Usitnjenje zrna jedini je mehanizam koji istodobno povećava čvrstoću i žilavost. Mješanci, precipitati i hladna deformacija povećavaju čvrstoću, ali smanjuju žilavost." },
        { q: "Koje oznake označavaju neku rešetku kristalne strukture?", options: ["BCC", "FCC", "HCP", "BCP"], correct: [0, 1, 2], note: "Kratice kristalnih rešetki metala su BCC (prostorno centrirana kubna), FCC (plošno centrirana kubna) i HCP (heksagonska gusto slagana). „BCP“ i „FCP“ ne postoje." },
        { q: "Nesavršenosti kristala: VAKANCIJA je:", options: ["prazno mjesto – nema jednog mjesta u rešetki", "ima jedan strani atom unutar rešetki veliki", "ima jedan strani atom unutar rešetki mali", "pojava dislokacije u rešetki"], correct: [0], note: "Vakancija je prazno mjesto u rešetki, točkasta nesavršenost. Strani atomi su intersticijske ili supstitucijske točkaste nesavršenosti, a dislokacije su linijske." },
        { q: "Uključine, pore i pukotine su:", options: ["točkaste nesavršenosti", "linijske nesavršenosti", "površinske nesavršenosti", "volumenske nesavršenosti"], correct: [3], note: "Uključci, pore i pukotine su volumenske (trodimenzionalne) nesavršenosti. Točkaste su praznine i strani atomi, linijske dislokacije, a površinske granice zrna." },
        { q: "Koje vrste kristalizacije imamo?", options: ["homogena", "heterogena", "polikristalna", "monokristalna"], correct: [0, 1], note: "Kristalizacija (nukleacija) može biti homogena, kad se klice stvaraju u samoj talini, ili heterogena, kad nastaju na stijenkama kalupa i stranim česticama. Polikristal i monokristal su rezultati kristalizacije, a ne vrste." },
        { q: "Koje vrste kristala nalazimo u legurama?", options: ["kristale mješance – supstitucijske (zamjena atoma) i intersticijske (atomi unutar rešetke)", "miješane kristale – svaki ima svoju rešetku", "kristale intermetalnog spoja – nova vrsta rešetke", "kristale kemijskog spoja"], correct: [0, 1, 2, 3], note: "U legurama nalazimo kristale mješance (supstitucijske i intersticijske), miješane kristale (smjesa kristala, svaki sa svojom rešetkom) te kristale intermetalnih i kemijskih spojeva s novom rešetkom." },
        { q: "Iz Fe-C dijagrama za metastabilnu kristalizaciju vidi se da ferit sadrži najviše ugljika na temperaturi:", options: ["723 °C", "911 °C", "1147 °C", "1536 °C"], correct: [0], note: "α-ferit otapa najviše ugljika (oko 0,025 %) na eutektoidnoj temperaturi od 723 °C. Na sobnoj temperaturi gotovo ništa." },
        { q: "Prema Fe-C dijagramu za metastabilnu kristalizaciju, mikrostruktura nelegiranog čelika s 0,4 % C na 500 °C sastoji se od:", options: ["30 % primarnog ferita i 70 % perlita", "primarnog ferita i perlita", "ferita i eutektoidnog cementita", "ferita i sekundarnog cementita"], correct: [1], note: "Podeutektoidni čelik s 0,4 % C ispod 723 °C ima primarni ferit i perlit, prema pravilu poluge oko 50 : 50. Zato je odgovor s 30 % ferita i 70 % perlita kriv, a cementit (sekundarni) imaju tek nadeutektoidni čelici." },
        { q: "Linija koja u dijagramu stanja označava početak kristalizacije pri hlađenju zove se:", options: ["likvidus", "solidus", "solvus", "eutektička linija"], correct: [0], note: "Likvidus je linija iznad koje je sve tekuće; pri hlađenju na njoj počinje kristalizacija. Na solidusu kristalizacija završava, a solvus je granica topljivosti u krutom stanju." },
        { q: "Na apscisi dijagrama stanja nalazi se:", options: ["maseni udio komponente B (legirnog elementa)", "temperatura", "vrijeme", "tlak"], correct: [0], note: "Na apscisi (x-os) binarnog dijagrama stanja je sastav, tj. maseni udio komponente B, a na ordinati (y-os) temperatura." },
        { q: "Dijagrami stanja konstruiraju se pomoću:", options: ["krivulja hlađenja", "TTT dijagrama", "Schaefflerova dijagrama", "pravila poluge"], correct: [0], note: "Dijagrami stanja konstruiraju se iz krivulja hlađenja legura različitog sastava: zastoji i lomovi na krivuljama daju temperature likvidusa, solidusa i pretvorbi. Pravilo poluge se koristi za čitanje dijagrama, ne za njegovu konstrukciju." },
        { q: "Maseni udio pojedinih faza u dvofaznom području dijagrama stanja određuje se pomoću:", options: ["pravila poluge", "Gibbsova pravila faza", "krivulja hlađenja", "Schaefflerova dijagrama"], correct: [0], note: "Udio faza u dvofaznom području određuje se pravilom poluge: udio faze razmjeran je duljini suprotnog kraka poluge na izotermi." },
        { q: "Legure bakra i nikla imaju:", options: ["izomorfni dijagram stanja (potpuna topivost u tekućem i krutom stanju)", "eutektički dijagram stanja", "peritektički dijagram stanja", "dijagram s intermetalnim spojem"], correct: [0], note: "Cu i Ni imaju istu (FCC) rešetku i sličan atomski promjer, pa su potpuno topljivi u tekućem i krutom stanju; to je izomorfni dijagram (dijagram s „lećom“)." },
        { q: "Bakar i olovo tvore:", options: ["odvojene faze (praktički se ne miješaju)", "potpunu topivost u krutom stanju", "intermetalni spoj", "eutektoid"], correct: [0], note: "Bakar i olovo praktički se ne miješaju ni u krutom ni u tekućem stanju, pa tvore odvojene faze (zato je olovo u bakrenim legurama rasuto kao zasebne kapljice)." },
        { q: "Sustave s potpunom topivošću u rastaljenom i djelomičnom topivošću u krutom stanju opisuju dijagrami stanja:", options: ["eutektički", "peritektički", "eutektoidni", "izomorfni"], correct: [0, 1], note: "Potpunu topljivost u talini i djelomičnu u krutom stanju opisuju eutektički i peritektički dijagrami. Eutektoidna pretvorba odvija se u krutom stanju, a izomorfni dijagram ima potpunu topljivost i u krutom stanju." },
        { q: "Fe-C dijagram stanja koji se najčešće koristi je:", options: ["metastabilan", "stabilan", "monotektički", "peritektički"], correct: [0], note: "U praksi se najviše koristi metastabilni Fe-Fe3C dijagram (ugljik vezan u cementit), jer tako skrućuju čelici i bijeli lijev. Stabilni Fe-C (grafit) vrijedi za sivi lijev." },
        { q: "Primarna kristalizacija je:", options: ["eutektička pretvorba", "eutektoidna pretvorba", "peritektička pretvorba", "skrućivanje"], correct: [0, 2, 3], note: "Primarna kristalizacija je prijelaz iz taline u krutinu: skrućivanje, uključujući eutektičku i peritektičku pretvorbu, u kojima sudjeluje talina. Eutektoidna pretvorba odvija se u krutom stanju (sekundarna kristalizacija)." },
        { q: "Kristalne segregacije nastaju pri:", options: ["kaljenju", "gnječenju", "popuštanju", "neravnotežnom skrućivanju"], correct: [3], note: "Kristalne segregacije (nejednolik sastav unutar zrna) nastaju pri neravnotežnom, prebrzom skrućivanju, kad difuzija ne stigne izjednačiti sastav. Uklanjaju se homogenizacijskim žarenjem." },
        { q: "Koje rešetke nemaju najgušće moguće slaganje atoma?", options: ["BCC", "FCC", "HCP", "tetragonska"], correct: [0, 3], note: "Najgušće slaganje (74 %) imaju FCC i HCP. BCC ima 68 %, a tetragonska rešetka također nije najgušće složena." },
        { q: "Sitnozrnatost u pravilu:", options: ["povećava talište", "smanjuje čvrstoću", "povećava čvrstoću", "smanjuje tvrdoću"], correct: [2], note: "Sitno zrno povećava čvrstoću (Hall-Petch) i tvrdoću, a ne mijenja talište." },
        { q: "Samo jedna klica kristalizacije:", options: ["daje sitno zrno", "daje krupnije zrno", "daje monokristal", "daje dendrite"], correct: [2], note: "Ako raste samo jedna klica kristalizacije, cijeli komad postane jedan kristal, monokristal (tako se rade npr. lopatice turbina). Mnogo klica daje sitno zrno." },
        { q: "Kratica TTT znači:", options: ["Tungsten Threshold Tolerance", "Time Temperature Transformation (vrijeme – temperatura – pretvorba)", "Time Temperature Thickness", "Temperature Thickness Tolerance"], correct: [1], note: "TTT znači Time – Temperature – Transformation: vrijeme, temperatura i pretvorba." },
        { q: "TTT dijagrami daju odnos između:", options: ["legirnih elemenata čelika i njegove tvrdoće", "vremena, temperature i pretvorbe", "sastava i strukture", "vremena, temperature i sastava"], correct: [1], note: "TTT dijagram povezuje vrijeme, temperaturu i pretvorbu austenita u druge strukture." },
        { q: "U TTT dijagramu sav materijal lijevo od krivulje (početka pretvorbe) je:", options: ["austenit", "perlit", "bainit", "martenzit"], correct: [0], note: "Lijevo od krivulje početka pretvorbe austenit se još nije počeo pretvarati, pa je ondje sav materijal austenit (pothlađeni)." },
        { q: "Niskolegirani čelik:", options: ["uvijek ima istu faznu strukturu na sobnoj temperaturi", "prolazi kroz pretvorbu u čvrstom stanju", "sadrži α-željezo kao strukturni sastojak", "ima austenitnu strukturu na sobnoj temperaturi"], correct: [0, 1], note: "Ključ međunarodnog ispita (MI 316): niskolegirani čelik prolazi kroz faznu pretvorbu u čvrstom stanju (austenit pri hlađenju prelazi u ferit, perlit, bainit ili martenzit). ⚠️ Odgovor a) vjerojatno je loše preveden, jer struktura na sobnoj temperaturi ovisi o hlađenju, a ferit (α-Fe) u njemu redovito postoji, pa ovo pitanje pamti prema ključu." },
        { q: "Zakaljivost (prokaljivost) čelika ovisi o:", options: ["sadržaju ugljika", "ostalim legirnim elementima", "talištu čelika", "brzini hlađenja čelika"], correct: [0, 1], note: "Prokaljivost je svojstvo čelika i ovisi o kemijskom sastavu: ugljiku i legirnim elementima. Brzina hlađenja određuje koja će se struktura postići, ali ne mijenja prokaljivost (službeni ključ MI 350)." },
        { q: "Martenzitna pretvorba:", options: ["odvija se samo u sustavu legura željezo – željezni karbid", "temelji se na difuziji", "količina nastalog martenzita ne ovisi o vremenu zadržavanja materijala na određenoj temperaturi", "ovisi o brzini hlađenja iz austenitnog područja"], correct: [2, 3], note: "Martenzitna pretvorba je bezdifuzijska i atermička: količina martenzita ovisi o temperaturi do koje se ohladi (između Ms i Mf), a ne o vremenu držanja. Nastaje samo ako je hlađenje iz austenita dovoljno brzo. Ne odvija se samo u Fe-C sustavu (postoji i u Ti, Cu legurama)." },
        { q: "Zakaljivost čelika najviše ovisi o:", options: ["sadržaju ugljika", "prisutnosti legirnih elemenata", "brzini hlađenja pri kaljenju", "brzini zagrijavanja pri kaljenju"], correct: [0], note: "Zakaljivost (najveća postiziva tvrdoća kaljenjem) najviše ovisi o ugljiku. Legirni elementi utječu na prokaljivost (dubinu zakaljivanja), a brzina hlađenja na to hoće li se martenzit uopće postići." },
        { q: "Žareni čelik s 0,2 % ugljika ima mikrostrukturu sastavljenu od:", options: ["ferita i perlita", "ferita i željeznog karbida", "mikrostrukture ovisne o debljini dijela", "djelomično bainitne mikrostrukture"], correct: [0], note: "Žareni (sporo hlađeni) čelik s 0,2 % C ima ferit i perlit, prema pravilu poluge oko 75 % ferita i 25 % perlita." },
        { q: "Koje su tvrdnje točne?", options: ["eutektoidna temperatura ugljičnog čelika je 723 °C", "perlit je spoj željeza i ugljika", "čelik s 0,4 % C sadrži približno 50 % ferita i 50 % perlita", "niskougljični čelik (0,25 % C) bit će iznad 723 °C potpuno austenitan"], correct: [0, 2], note: "Eutektoidna temperatura je 723 °C, a čelik s 0,4 % C ima oko 50 % ferita i 50 % perlita. Perlit je smjesa ferita i cementita, a ne spoj, a čelik s 0,25 % C između 723 °C i A3 ima ferit i austenit." },
        { q: "Što se događa ako je temperatura završetka martenzitne pretvorbe (Mf) na TTT dijagramu ispod sobne temperature?", options: ["pretvorba u martenzit neće biti završena na sobnoj temperaturi i uzorak će sadržavati zaostali austenit", "pretvorba u martenzit neće biti završena, a preostali austenit izotermno će se pretvoriti u donji bainit", "pretvorba u martenzit neće biti završena, a preostali austenit pretvorit će se u ferit jer nema difuzije karbida", "pretvorba u martenzit bit će završena već iznad sobne temperature"], correct: [0], note: "Ako je Mf ispod sobne temperature, pretvorba se na sobnoj temperaturi ne završi i ostaje zaostali austenit (tipično kod čelika s više od oko 0,6 % C). Uklanja se dubokim hlađenjem." },
        { q: "Što je TTT dijagram?", options: ["odnos vremena i temperature za morfologiju ZUT-a nastalu pri zadanoj brzini hlađenja", "odnos vremena i temperature faznih pretvorbi u uzorcima austenitiziranima i gašenima različitim brzinama", "prikaz pretvorbi u uzorcima koji su austenitizirani, ohlađeni na određenu temperaturu i na njoj držani (izotermno)", "prikaz mogućih metalografskih struktura za različite kemijske sastave pri zadanoj brzini hlađenja"], correct: [2], note: "TTT (izotermički) dijagram dobiva se tako da se uzorci austenitiziraju, brzo ohlade na određenu temperaturu i drže na njoj dok se pretvorba ne završi. Za kontinuirano hlađenje služi CCT dijagram." },
        { q: "Što je bainit?", options: ["sporo hlađena inačica perlita u kojoj su lamele zaobljenije i isprekidane", "oblik koji martenzit poprima popuštanjem", "morfologija koja nastaje kad je brzina hlađenja prevelika za dovoljnu difuziju potrebnu za stvaranje lamela karbida (perlita)", "oblik austenita koji se uz odgovarajući sastav i brzinu hlađenja može zadržati na sobnoj temperaturi"], correct: [2], note: "Bainit nastaje kad je hlađenje prebrzo da bi difuzija stvorila lamele perlita, a presporo za martenzit: dobiva se igličasti ferit s finim karbidima." },
        { q: "Koja je razlika između TTT i CCT dijagrama?", options: ["TTT dijagram dobiva se gašenjem uzorka na određenu temperaturu i potpunom pretvorbom u izotermnim uvjetima, a CCT dijagram prikazuje strukture nastale kontinuiranim hlađenjem različitim brzinama", "TTT dijagram odnosi se na različite kemijske sastave čelika, a CCT dijagram na jedan određeni sastav", "TTT i CCT dijagrami su isti dijagram s različitim nazivima", "CCT dijagram prikazuje ravnotežne strukture, a TTT neravnotežne"], correct: [0], note: "TTT opisuje izotermnu pretvorbu (gašenje na temperaturu i držanje), a CCT pretvorbe pri kontinuiranom hlađenju različitim brzinama. Oba vrijede za jedan određeni sastav čelika." },
        { q: "Zaokruži temperature eutektičke i eutektoidne pretvorbe u Fe-Fe₃C dijagramu:", options: ["1536 °C", "1147 °C", "911 °C", "723 °C"], correct: [1, 3], note: "Eutektička pretvorba (ledeburit) odvija se na 1147 °C, a eutektoidna (perlit) na 723 °C. 1536 °C je talište željeza, a 911 °C prijelaz α u γ." },
        { q: "Što je bainit?", options: ["isto što i perlit samo igličaste strukture", "isto što i austenit samo iskrivljene rešetke", "isto što i martenzit samo igličaste strukture", "isto što i ferit samo igličaste strukture"], correct: [0], note: "Bainit je kao i perlit smjesa ferita i karbida, ali nelamelarna, igličaste strukture. Martenzit nije smjesa nego prezasićena čvrsta otopina." },
        { q: "Što je martenzit?", options: ["intersticijski kristal mješanac ugljika u prostorno centriranoj tetragonskoj rešetki", "supstitucijski kristal BCC rešetke", "kristal intermetalnog spoja", "kristal kemijskog spoja"], correct: [0], note: "Martenzit je intersticijski kristal mješanac (prezasićena otopina) ugljika u prostorno centriranoj tetragonskoj (BCT) rešetki." },
        { q: "Kolika je približno temperatura taljenja čelika?", options: ["1200 °C", "1850 °C", "1500 °C", "900 °C"], correct: [2], note: "Čelik se tali približno na 1500 °C (ovisno o udjelu ugljika oko 1450–1530 °C); čisto željezo na 1536 °C." },
        { q: "Grafit se pojavljuje u:", options: ["metastabilno skrućenim legurama", "stabilno skrućenim legurama", "čeliku", "sivom lijevu"], correct: [1, 3], note: "Grafit se pojavljuje pri stabilnom skrućivanju Fe-C legura, npr. u sivom (i nodularnom) lijevu. U čeliku i metastabilno skrućenim legurama ugljik je vezan u cementit." },
        { q: "Ugljik se u stabilno skrućenim Fe-C legurama pojavljuje u:", options: ["grafitu", "cementitu", "feritu", "austenitu"], correct: [0, 2, 3], note: "Pri stabilnom skrućivanju višak ugljika izlučuje se kao grafit, a dio je otopljen u feritu i austenitu (intersticijski kristali mješanci). Cementita nema." },
        { q: "Ugljik se u metastabilno skrućenim Fe-C legurama pojavljuje u:", options: ["grafitu", "cementitu", "feritu", "austenitu"], correct: [1, 2, 3], note: "Pri metastabilnom skrućivanju ugljik je vezan u cementitu (Fe3C) i otopljen u feritu i austenitu. Grafita nema." },
        { q: "Ledeburit je:", options: ["metastabilni eutektikum", "stabilni eutektikum", "eutektoid", "kristal mješanac"], correct: [0], note: "Ledeburit je metastabilni eutektikum: eutektička smjesa austenita i cementita (4,3 % C, 1147 °C). Eutektoid je perlit." },
        { q: "Bainit je:", options: ["eutektikum", "tvrđi od martenzita", "nelamelarni eutektoid", "tvrđi od perlita"], correct: [2, 3], note: "Bainit je nelamelarni eutektoid (ferit + karbidi bez lamela) i tvrđi je od perlita, ali mekši od martenzita." },
        { q: "Pri stabilnoj kristalizaciji Fe-C legura ugljik (C) koji nije otopljen u kristalima mješancima kristalizira u obliku:", options: ["grafita", "cementita", "ledeburita", "perlita"], correct: [0], note: "Pri stabilnoj kristalizaciji ugljik koji nije otopljen izlučuje se kao grafit. Cementit, ledeburit i perlit produkti su metastabilne kristalizacije." },
        { q: "Ledeburit se sastoji od:", options: ["austenita i cementita (γ + Fe₃C)", "ferita i cementita", "ferita i grafita", "austenita i ferita"], correct: [0], note: "Ledeburit je eutektička smjesa austenita i cementita (γ + Fe3C). Ispod 723 °C austenit u njemu prelazi u perlit. Ferit i cementit čine perlit." },
        { q: "Sadržaj ugljika (C) u perlitu je:", options: ["0,8 %", "0,025 %", "2,03 %", "4,3 %"], correct: [0], note: "Perlit ima 0,8 % C (eutektoidni sastav). 0,025 % je najveća topljivost C u feritu, 2,03 % u austenitu, a 4,3 % je ledeburit." },
        { q: "Perlit je:", options: ["metastabilni eutektoid", "metastabilni eutektikum", "kristal mješanac", "intermetalni spoj"], correct: [0], note: "Perlit je metastabilni eutektoid: lamelarna smjesa ferita i cementita (0,8 % C, 723 °C). Metastabilni eutektikum je ledeburit." },
        { q: "Austenit:", options: ["ima deformiranu BCC rešetku", "je intersticijski kristal mješanac", "može otopiti više od 1 % C", "je željezo s FCC rešetkom"], correct: [1, 2], note: "Austenit je intersticijski kristal mješanac ugljika u γ-željezu (FCC) i otapa do 2,03 % C. Deformiranu (tetragonsku) rešetku ima martenzit, a čisto γ-željezo bez ugljika nije austenit." },
        { q: "Ferit:", options: ["ima deformiranu BCC rešetku", "je intersticijski kristal mješanac", "može otopiti više od 1 % C", "je željezo s FCC rešetkom"], correct: [1], note: "Ispravljeno: ferit je intersticijski kristal mješanac ugljika u α-željezu (BCC) i otapa najviše 0,025 % C. Rešetka mu nije deformirana; deformiranu (tetragonsku) rešetku ima martenzit. Izvor je kao točno označio i „deformiranu BCC rešetku“." },
        { q: "Martenzit može nastati (samo) iz:", options: ["austenita", "ferita", "perlita", "cementita"], correct: [0], note: "Martenzit nastaje samo iz austenita, bezdifuzijskom pretvorbom pri brzom hlađenju između Ms i Mf." },
        { q: "Proizvodnja čelika i čeličnih proizvoda. Odabrati točnu(e) tvrdnju(e):", options: ["pročišćavanjem sirovog željeza dobiva se sirovi čelik, a dezoksidacijom sirovog čelika dobiva se čelik", "dezoksidacijom sirovog željeza dobiva se sirovi čelik, a pročišćavanjem sirovog čelika dobiva se čelik", "pročišćavanjem željezne rude dobiva se sirovi čelik", "legiranjem sirovog čelika dobiva se čelik"], correct: [0], note: "Pročišćavanjem (oksidacijom viška C, Si, P, S) sirovog željeza dobiva se sirovi čelik, a njegovom dezoksidacijom (smirivanjem) gotovi čelik. Legiranje nije ono što čelik čini čelikom." },
        { q: "Prema HRI CEN ISO/TR 15608 (Zavarivanje – Upute za sustav razvrstavanja metalnih materijala) grupa 9 odnosi se na:", options: ["austenitno-feritne nehrđajuće čelike (dupleks)", "termomehanički obrađene sitnozrnate čelike i čelične lijevove s minimalnom granicom razvlačenja ReH > 360 N/mm²", "čelike legirane niklom (Ni ≤ 10,0 %)", "precipitacijski otvrdnute nehrđajuće čelike"], correct: [2], note: "Prema CEN ISO/TR 15608 grupa 9 su čelici legirani niklom (Ni ≤ 10 %). Grupa 10 su duplex čelici, a grupa 2 termomehanički obrađeni sitnozrnati čelici." },
        { q: "Što prema EN 10027 znači broj 355 u oznaci čelika S355JRG2?", options: ["ReL", "ReH (najmanja gornja granica razvlačenja u N/mm²)", "najmanju lomnu čvrstoću", "najveću lomnu čvrstoću"], correct: [1], note: "Broj u oznaci S355 je najmanja gornja granica razvlačenja ReH u N/mm² (za najmanje debljine), a ne vlačna čvrstoća." },
        { q: "Pri proizvodnji čelika Thomasovim postupkom:", options: ["uporaba sirovog željeza s mnogo fosfora daje vrlo krhak čelik na sobnoj temperaturi", "odvija se faza stvaranja fosforne troske i oksidacije", "potrebna energija za pretvorbu dobiva se izgaranjem goriva", "toplina se unosi upuhivanjem čistog kisika pod tlakom kroz koplje"], correct: [1], note: "Thomasov postupak prerađuje sirovo željezo bogato fosforom u konverteru s bazičnom oblogom, uz stvaranje fosforne troske i oksidaciju nečistoća upuhanim zrakom. Toplina dolazi iz oksidacije primjesa, a ne izgaranjem goriva; čisti kisik kroz koplje je LD postupak." },
        { q: "Aluminij dodan čeliku pri taljenju ili lijevanju omogućuje:", options: ["dezoksidaciju taline i usitnjenje zrna", "lakšu obradu odvajanjem čestica i kaljenje", "povećanje mehaničke čvrstoće", "povećanje otpornosti na trošenje"], correct: [0], note: "Aluminij je jak dezoksidans, a s dušikom stvara AlN koji koči rast zrna, pa daje dezoksidaciju taline i sitno zrno (posebno smireni čelici)." },
        { q: "Umirivanje čelika je postupak:", options: ["popuštanja", "dezoksidacije", "hladne deformacije", "toplinske obrade"], correct: [1], note: "Umirivanje (smirivanje) čelika je dezoksidacija: vezanje kisika (i dušika) u talini dodavanjem Mn, Si i Al." },
        { q: "Koja je prednost LD postupka proizvodnje čelika?", options: ["veća korozijska postojanost čelika", "vrlo visoka ekonomičnost i kvaliteta čelika", "bolja proizvodnja alatnih čelika", "prikladan je samo za proizvodnju austenitnih čelika"], correct: [1], note: "LD postupak (upuhivanje čistog kisika kopljem) vrlo je ekonomičan i brz, a daje čelik dobre kvalitete s malo dušika. Zato je danas glavni postupak proizvodnje čelika iz sirovog željeza." },
        { q: "Koji od četiri čelika odgovara umirenom čeliku?", options: ["100 ppm kisika", "1000 ppm kisika", "20 ppm kisika", "10 000 ppm kisika"], correct: [2], note: "Umireni (dezoksidirani) čelik ima vrlo malo kisika, desetak do nekoliko desetaka ppm, pa je točno 20 ppm. Nesmireni čelici imaju stotine do tisuće ppm kisika." },
        { q: "Pri konverterskom postupku s kisikom uložak se sastoji od:", options: ["hladnog sirovog željeza i talila", "sirovog željeza, starog željeza (otpada) i talila", "talila i hladnog starog željeza", "kisika, talila i sirovog željeza"], correct: [1], note: "Kod konvertera s kisikom (LD) uložak je tekuće sirovo željezo, staro željezo (otpad, za hlađenje) i talila (vapno); kisik se upuhuje, nije dio uloška." },
        { q: "Zašto je sivo sirovo željezo sivo?", options: ["zbog visokog udjela silicija, koji je grafitizator, pa ugljik kristalizira kao grafit", "zbog visokog udjela mangana, koji stabilizira cementit, pa kristalizacija teče metastabilno", "zbog visokog udjela aluminija, koji daje sivu boju", "zbog niskog udjela silicija"], correct: [0], note: "Sivo sirovo željezo ima mnogo silicija, koji potiče grafitizaciju, pa ugljik kristalizira kao grafit i prijelom je siv. Mangan stabilizira cementit (bijelo sirovo željezo)." },
        { q: "Što je umireni čelik?", options: ["dezoksidiran", "razugljičen", "normaliziran", "poboljšan"], correct: [0], note: "Umireni (smireni) čelik je dezoksidiran, najčešće sa Si, Mn i Al." },
        { q: "Što ima čelik oznake Č 0361?", options: ["zajamčena mehanička svojstva", "zajamčen sadržaj Mn i Si", "zajamčenu homogenost (nije dvoplatan)", "zajamčen kemijski sastav i žilavost na −40 °C"], correct: [0], note: "Č 0361 (danas S235JRG1) opći je konstrukcijski čelik sa zajamčenim mehaničkim svojstvima (Rm, Re, istezanje), ali bez zajamčenog kemijskog sastava i žilavosti na niskim temperaturama." },
        { q: "Koje mogu biti greške mikrostrukture konstrukcijskih čelika?", options: ["razugljičenje površine", "Widmannstättenova struktura", "trakasta struktura", "nodularna struktura"], correct: [0, 1, 2], note: "Greške mikrostrukture konstrukcijskih čelika su razugljičenje površine, Widmanstättenova struktura (pregrijavanje) i trakasta struktura (valjanje). Nodularna struktura (kuglasti grafit) svojstvena je nodularnom lijevu." },
        { q: "Nemetalni uključci mogu biti:", options: ["MnS", "SiO₂", "Al₂O₃", "CaO"], correct: [0, 1, 2], note: "Nemetalni uključci u čeliku su sulfidni (MnS), oksidni (SiO2, Al2O3) i silikatni. CaO je sastojak troske." },
        { q: "Koja je slovna oznaka za konstrukcijske čelike?", options: ["S (S355J2)", "P (P265B)", "L (L360QB)", "B (E355)"], correct: [0], note: "Prema EN 10027-1 slovo S označava konstrukcijske čelike, P čelike za tlačne posude, L čelike za cjevovode, a E čelike za strojogradnju." },
        { q: "Što pri zavarivanju znači unos topline?", options: ["izlaznu snagu izvora po jedinici duljine", "toplinu unesenu po jedinici duljine zavara", "energiju luka", "toplinu unesenu po jedinici vremena"], correct: [1], note: "Unos topline je toplina unesena po jedinici duljine zavara (J/mm ili kJ/mm): Q = η · U · I / v." },
        { q: "t8/5 je parametar koji se često koristi pri analizi toplinskih ciklusa zavarivanja. On predstavlja:", options: ["srednju temperaturu u određenoj točki zavarenog spoja", "vrijeme potrebno za prolaz od 500 do 800 °C pri zagrijavanju", "najvišu temperaturu preporučenu u ZUT-u za izbjegavanje porasta zrna", "vrijeme potrebno za prolaz od 800 do 500 °C pri hlađenju"], correct: [3], note: "t8/5 je vrijeme hlađenja od 800 do 500 °C, temperaturnog područja u kojem nastaje struktura ZUT-a." },
        { q: "Vrijeme hlađenja između 800 i 500 °C kod ugljičnog čelika daje uvid u:", options: ["zavarljivost materijala", "žilavost zavara", "razinu naprezanja u spoju", "čvrstoću zavara"], correct: [1, 3], note: "t8/5 određuje strukturu ZUT-a i metala zavara, a time njihovu čvrstoću i žilavost (kratko t8/5: tvrdo i krhko; dugo: mekše, grubo zrno). Zavarljivost materijala ovisi o sastavu (Cekv)." },
        { q: "Predgrijavanje zavarenog spoja provodi se kako bi se:", options: ["smanjio unos topline u zavar", "povećao unos topline u zavar", "smanjili problemi s (prevelikom) brzinom hlađenja u ZUT-u", "povećala brzina hlađenja u ZUT-u"], correct: [2], note: "Predgrijavanjem se smanjuje brzina hlađenja u ZUT-u, pa nema prevelike zakaljenosti i hladnih pukotina. Unos topline zavarivanja ostaje isti." },
        { q: "Metal zavara može se legirati:", options: ["dodatnim materijalom", "zaštitnom atmosferom Ar, He", "mješavinom zaštitnih plinova", "praškom ili oblogom elektrode"], correct: [0, 3], note: "Metal zavara može se legirati dodatnim materijalom (žica, elektroda) i elementima iz praška ili obloge. Inertni plinovi Ar i He ne legiraju." },
        { q: "Metal zavara označava:", options: ["osnovni materijal izvan utjecaja topline", "dodatni materijal", "rastaljeni materijal (dodatni materijal + osnovni materijal)", "ZUT – zonu utjecaja topline"], correct: [2], note: "Metal zavara je rastaljeni i skrućeni materijal: mješavina dodatnog i rastaljenog osnovnog materijala. ZUT nije talio." },
        { q: "Zavaruje se strujom 200 A, naponom 25 V i brzinom zavarivanja 2 mm/s. Unesena energija u kJ/m iznosi:", options: ["25", "400", "2500", "62 500"], correct: [2], note: "E = U · I / v = 25 V · 200 A / 2 mm/s = 2500 J/mm = 2500 kJ/m (2,5 kJ/mm)." },
        { q: "Ekvivalent ugljika važan je pojam metalurgije zavarivanja. Što se može procijeniti pomoću ekvivalenta ugljika?", options: ["tvrdoća metala zavara", "opasnost od hladnih pukotina u ZUT-u", "opasnost od pukotina pri skrućivanju u metalu zavara", "zakaljivost čelika"], correct: [1, 3], note: "Ekvivalent ugljika procjenjuje zakaljivost čelika, a time i opasnost od hladnih pukotina u ZUT-u. Pukotine pri skrućivanju (tople) ovise o S, P i obliku zavara." },
        { q: "Kakav je utjecaj veličine austenitnog zrna kod zavarljivih čelika?", options: ["grubo austenitno zrno smanjuje žilavost čelika", "grubo austenitno zrno smanjuje čvrstoću i žilavost čelika", "što je austenitno zrno sitnije, sitniji su i konačni produkti pretvorbe", "veličina austenitnog zrna nema utjecaja na zavarljivost i svojstva zavarenih spojeva"], correct: [0, 1, 2], note: "Grubo austenitno zrno daje grube produkte pretvorbe, pa smanjuje žilavost i čvrstoću. Što je austenitno zrno sitnije, sitnija je i konačna struktura." },
        { q: "U kojem se području ZUT-a nakon zavarivanja može naći martenzit?", options: ["u području porasta zrna uz liniju staljivanja", "u normaliziranom području blizu A3", "u području ZUT-a zagrijanom malo iznad A1", "u uskoj liniji između ZUT-a i osnovnog materijala"], correct: [2], note: "Ključ međunarodne banke (MI): u interkritičnom području ZUT-a (malo iznad A1) austenit obogaćen ugljikom pri hlađenju prelazi u martenzit (M-A otočići). ⚠️ Najveća tvrdoća u ZUT-u inače je u zoni grubog zrna uz liniju staljivanja." },
        { q: "Ekvivalent ugljika CE ugljičnog čelika daje uvid u:", options: ["zavarljivost materijala", "žilavost zavara", "razinu naprezanja u spoju", "sklonost spoja pukotinama"], correct: [0, 3], note: "Ekvivalent ugljika daje uvid u zavarljivost čelika i sklonost spoja (hladnim) pukotinama. O žilavosti i razini naprezanja ne govori izravno." },
        { q: "Koji su razlozi primjene predgrijavanja prije zavarivanja?", options: ["izbjegavanje hladnih pukotina u ZUT-u zakaljivih čelika", "povećanje žilavosti zavarenog spoja i otpornosti na nepovoljne uvjete rada (udarno opterećenje, niske temperature)", "ublažavanje učinka vodika koji ulazi u metal zavara i ZUT osnovnog materijala", "postizanje željenih mehaničkih ili fizikalnih svojstava zavarenog čelika"], correct: [0, 2], note: "Predgrijavanje se primjenjuje da se izbjegnu hladne pukotine u ZUT-u zakaljivih čelika i da se ublaži djelovanje vodika (sporije hlađenje, vodik ima vremena izaći)." },
        { q: "Pri brzom hlađenju zavara:", options: ["može nastati zakaljena struktura", "zakaljivanje čelika uvijek se izbjegava", "hladne pukotine uvijek se izbjegavaju", "opasnost od toplih pukotina znatno se smanjuje"], correct: [0], note: "Brzim hlađenjem može nastati zakaljena (martenzitna) struktura, pa raste opasnost od hladnih pukotina. Tople pukotine ovise o skrućivanju, a ne o brzini hlađenja nakon njega." },
        { q: "Ekvivalent ugljika (CE):", options: ["izražava utjecaj legirnih elemenata na zakaljivost čelika", "računska je (fiktivna) veličina", "može se izmjeriti ispitivanjem", "ovisi o brzini hlađenja"], correct: [0, 1], note: "Ekvivalent ugljika je računska (fiktivna) veličina koja preračunava utjecaj legirnih elemenata na zakaljivost u ekvivalentni udio ugljika. Ne mjeri se i ne ovisi o brzini hlađenja." },
        { q: "Temperatura predgrijavanja:", options: ["potrebna je samo prije početka zavarivanja", "najniža je temperatura zone zavara tijekom cijelog ciklusa zavarivanja", "za pripojno zavarivanje nikada nije viša nego za zavarivanje samog spoja", "primjenjuje se kako bi se iz materijala koji se zavaruje uklonila sva vlaga"], correct: [1], note: "Ispravljeno: temperatura predgrijavanja je najniža temperatura zone zavara koja se mora održavati tijekom cijelog zavarivanja. Za pripojno zavarivanje (heftanje) predgrijavanje je jednako ili čak više nego za sam spoj (kratki zavari brzo se hlade), pa tvrdnja „nikada nije viša“ nije točna. Izvor ju je označio kao točnu." },
        { q: "Parametar Δt8/5 raste s povećanjem:", options: ["debljine spoja", "predgrijavanja", "unosa topline", "toplinske vodljivosti"], correct: [1, 2], note: "t8/5 raste s predgrijavanjem i unosom topline (sporije hlađenje). Veća debljina i veća toplinska vodljivost ubrzavaju hlađenje, pa skraćuju t8/5." },
        { q: "Koje čimbenike s metalurškog stajališta treba uzeti u obzir pri određivanju temperature predgrijavanja C-Mn čelika?", options: ["unos topline", "ekvivalent ugljika (CE)", "debljinu spoja", "sadržaj fosfora i sumpora"], correct: [0, 1, 2], note: "Temperatura predgrijavanja C-Mn čelika određuje se iz unosa topline, ekvivalenta ugljika i debljine spoja (te vodika), npr. prema EN 1011-2. P i S utječu na tople pukotine." },
        { q: "Parametri WPS-a (bez faktora učinkovitosti postupka): prolaz 1, strana 1, DC+, struja 145 A, brzina žice 3,1 m/min, slobodni kraj žice 12 mm, napon 26 V, brzina zavarivanja 0,43 m/min, protok plina 15 l/min. Unesena energija iznosi:", options: ["0,53 kJ/mm", "0,17 kJ/mm", "5,03 kJ/mm", "1,7 kJ/mm"], correct: [0], note: "E = U · I / v = 26 V · 145 A / (430 mm / 60 s) ≈ 526 J/mm ≈ 0,53 kJ/mm." },
        { q: "Stacionarno i nestacionarno temperaturno polje. Odabrati točne tvrdnje:", options: ["stacionarno temperaturno polje ne ovisi o vremenu, T(x, y, z)", "nestacionarno temperaturno polje ovisi o vremenu, T(x, y, z, t)", "stacionarno polje javlja se na početku i kraju zavara", "nestacionarno polje javlja se samo kod predgrijavanja"], correct: [0, 1], note: "Stacionarno polje ne ovisi o vremenu, T(x, y, z), a nestacionarno ovisi, T(x, y, z, t). Kvazistacionarno polje javlja se dalje od početka i kraja zavara, a nestacionarno upravo na početku i kraju." },
        { q: "Za čelik s visokim ekvivalentom ugljika (CE) smatra se da ima:", options: ["dobru zavarljivost", "smanjenu zavarljivost", "CE nije važan za ocjenu zavarljivosti", "ne može se zavarivati"], correct: [1], note: "Visok Cekv znači veću zakaljivost i sklonost hladnim pukotinama, dakle smanjenu zavarljivost; čelik se i dalje može zavarivati uz mjere (predgrijavanje)." },
        { q: "Kod dvodimenzijskog odvođenja topline t8/5 može se povećati:", options: ["povećanjem struje zavarivanja", "smanjenjem brzine zavarivanja", "povećanjem brzine zavarivanja", "snižavanjem temperature predgrijavanja"], correct: [0, 1], note: "Kod 2D odvođenja topline t8/5 ∝ (q/v)², pa se povećava većom strujom (veći q) i manjom brzinom zavarivanja (manji v). Niža temperatura predgrijavanja ga skraćuje." },
        { q: "Što karakterizira toplinski ciklus zavarivanja?", options: ["raspodjela temperature u nekoj točki zavarenog spoja u ovisnosti o vremenu i udaljenosti od izvora topline", "snaga izvora topline tijekom zavarivanja", "promjena temperature predgrijavanja tijekom zavarivanja", "brzina zavarivanja"], correct: [0], note: "Toplinski ciklus je promjena temperature u nekoj točki zavarenog spoja s vremenom (zagrijavanje, vršna temperatura, hlađenje), ovisno i o udaljenosti od izvora topline." },
        { q: "Koji čimbenici utječu na pogrubljenje austenitnog zrna u zavarenom spoju čelika?", options: ["kemijski sastav čelika koji se zavaruje", "početna veličina austenitnog zrna i primijenjeni toplinski input", "režim toplinske obrade (predgrijavanje, toplinski input, toplinska obrada nakon zavarivanja) i početna veličina zrna", "vrsta struje zavarivanja (stalna ili impulsna)"], correct: [0, 1, 2], note: "Pogrubljenje austenitnog zrna ovisi o kemijskom sastavu (npr. Ti, Nb, Al koče rast zrna), početnoj veličini zrna i toplinskom režimu (unos topline, predgrijavanje, PWHT). Vrsta struje nema bitan utjecaj." },
        { q: "Koja se nepoželjna struktura stvara između nanesenog materijala i osnovnog materijala pri jednoslojnom zavarivanju (zavarivanje u zaštiti plina, sporo hlađenje)?", options: ["grubo zrno", "normalizirana struktura", "poboljšana struktura", "sitnozrnata struktura"], correct: [0], note: "Kod jednoslojnog zavarivanja sa sporim hlađenjem uz liniju staljivanja nastaje grubo zrno (pregrijana zona). Nema sljedećeg prolaza koji bi ga normalizirao." },
        { q: "Kako brzina zavarivanja utječe na strukturu skrućivanja?", options: ["s povećanjem brzine zavarivanja oblik taline mijenja se od eliptičnog prema kapljičastom", "pri većoj brzini zavarivanja kristali ne mijenjaju smjer rasta, dok se pri manjim brzinama zakrivljuju", "pri većoj brzini zavarivanja hlađenje je brže, a segregacije su izraženije", "brzina zavarivanja nema utjecaja na skrućivanje"], correct: [0, 1, 2], note: "S većom brzinom zavarivanja talina se iz eliptične mijenja u kapljičastu, kristali rastu ravno prema osi i sudaraju se u sredini, a segregacije u osi zavara su izraženije. Pri manjoj brzini kristali se zakrivljuju prema smjeru zavarivanja." },
        { q: "Ispod koje se temperature okoline ne smije zavarivati bez predgrijavanja?", options: ["ispod −30 °C", "ispod 0 °C", "ispod +5 °C", "ne postoji pravilo"], correct: [2], note: "Prema uobičajenom pravilu (npr. EN 1011) ispod oko +5 °C ne zavaruje se bez predgrijavanja, barem da se ukloni vlaga i uspori hlađenje." },
        { q: "Za koje se čelike Seferianova metoda koristi za procjenu temperature predgrijavanja?", options: ["visokolegirane", "niskolegirane", "nelegirane", "austenitne"], correct: [1], note: "Séférianova metoda razvijena je za ugljične i niskolegirane konstrukcijske čelike. Za visokolegirane i austenitne čelike ne vrijedi." },
        { q: "Koji materijali pri zavarivanju taljenjem ne mijenjaju kristalnu rešetku?", options: ["aluminij, niskolegirani čelik, bakar", "aluminij, feritni visokolegirani čelici, bakar", "bakar, martenzitni čelici, sivi lijev", "svi čelici"], correct: [1], note: "Aluminij, bakar i feritni visokolegirani čelici nemaju alotropsku pretvorbu pri zagrijavanju i hlađenju, pa ne mijenjaju rešetku (zrno im samo raste). Niskolegirani i martenzitni čelici prolaze kroz pretvorbu." },
        { q: "Zašto se predgrijava osnovni materijal?", options: ["da se spriječi nastanak zakaljene strukture", "da se smanji potrošnja dodatnog materijala", "da se uspori proces zavarivanja", "da se poveća tvrdoća zavara"], correct: [0], note: "Osnovni materijal se predgrijava da se uspori hlađenje i spriječi zakaljena (martenzitna) struktura, a time i hladne pukotine." },
        { q: "Što je zona utjecaja topline?", options: ["dio rastaljenog dodatnog materijala", "zona između osnovnog i dodatnog materijala", "dio osnovnog materijala neposredno uz zavar koji se nije talio, ali mu se promijenila struktura", "cijeli zavareni spoj"], correct: [2], note: "ZUT je dio osnovnog materijala uz zavar koji se nije talio, ali mu se zbog topline promijenila struktura i svojstva." },
        { q: "Pri kojem je ekvivalentu ugljika čelik loše zavarljiv?", options: ["iznad 0,45 %", "ispod 0,35 %", "0,35–0,4 %", "ispod 0,2 %"], correct: [0], note: "Čelici s Cekv iznad oko 0,45 smatraju se loše (uvjetno) zavarljivima i traže predgrijavanje. Ispod oko 0,35–0,4 zavarljivost je dobra." },
        { q: "Što se dobije većom brzinom hlađenja nakon zavarivanja ugljičnih čelika?", options: ["veća čvrstoća, a manja plastičnost i žilavost", "manja čvrstoća, a veća plastičnost i žilavost", "veća čvrstoća i plastičnost, a manja žilavost", "nema promjene svojstava"], correct: [0], note: "Brže hlađenje ugljičnog čelika daje tvrđu strukturu (više bainita, martenzita): veću čvrstoću, ali manju plastičnost i žilavost." },
        { q: "Zašto se predgrijavaju čelici s više ugljika i legirnih elemenata?", options: ["da većim unosom topline poraste zrno", "da se spriječe hladne pukotine i smanji tvrdoća u ZUT-u", "da se poboljša korozijska postojanost", "da se smanji potrošnja plina"], correct: [1], note: "Čelici s više ugljika i legirnih elemenata lakše se zakale, pa se predgrijavaju da se spriječe hladne pukotine i smanji tvrdoća u ZUT-u." },
        { q: "Propisivanjem i uvođenjem t8/5 (prosječne brzine ohlađivanja) nastoji se:", options: ["predvidjeti mikrostrukturu zavarenog spoja", "isključiti utjecaj Cekv", "isključiti pojavu toplih pukotina", "izbjeći potrebu toplinske obrade"], correct: [0], note: "t8/5 uveden je da bi se predvidjela mikrostruktura (i svojstva) ZUT-a pri određenom toplinskom ciklusu. Ne isključuje utjecaj Cekv ni tople pukotine." },
        { q: "Zaostala naprezanja posljedica su lokalnog unošenja topline:", options: ["to je jedna od definicija zaostalih naprezanja", "unos topline nema veze sa zaostalim naprezanjima", "naprezanja su posljedica miješanja osnovnog i dodatnog materijala, a ne lokalnog unosa topline", "ništa od navedenog"], correct: [0], note: "Zaostala naprezanja posljedica su nejednolikog, lokalnog zagrijavanja i hlađenja pri zavarivanju; to je jedna od njihovih definicija." },
        { q: "Ispitivanje sklonosti prema toplim pukotinama provodi se:", options: ["Lehigh metodom", "Varestraint metodom", "Transvarestraint metodom", "Window metodom"], correct: [1, 2], note: "Sklonost toplim pukotinama ispituje se Varestraint i Transvarestraint (i Fisco) probom. Lehigh je proba za hladne pukotine, a Window za lamelarno odvajanje." },
