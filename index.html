        { q: "Kod izbora visokočvrstih čelika za ledolomce treba izabrati čelik:", options: ["koji ima Rp0,2 visok i nisku prijelaznu ϑ", "koji ima otpornost na habanje", "visoku izdržljivost", "visoku žilavost KV (20 °C) i visok Rm"], correct: [0], note: "Ledolomac radi na niskim temperaturama i pod udarima leda, pa treba visoka granica razvlačenja uz nisku prijelaznu temperaturu (bez krhkog loma). Žilavost pri 20 °C ne govori ništa o ponašanju na hladnom." },
        { q: "Najveća senzibilizacija austenitnog čelika postiže se (obzirom na Cr - karbide i IKK) pri grijanju na:", options: ["850 ºC", "700 ºC", "430 ºC", "1100 ºC"], correct: [1], note: "Izlučivanje Cr-karbida (senzibilizacija) odvija se u području oko 450–850 °C, a najbrže oko 650–700 °C, pa je od ponuđenih točno 700 °C. Pri 1100 °C karbidi se otapaju (rastvorno žarenje)." },
        { q: "Koji su osnovni mehanizmi očvrsnuća VČČ za opću primjenu (niske temperature):", options: ["Hall-Petchov mehanizam (sitno zrno)", "Hall-Petchov mehanizam + kristali mješanci", "Orowanov mehanizam + udio perlita", "mehanizam deformacijskog starenja"], correct: [1], note: "Za visokočvrste čelike za niske temperature najpovoljnije je usitnjavanje zrna (Hall-Petch), uz očvršćivanje kristalima mješancima, jer sitno zrno snizuje prijelaznu temperaturu. Perlit je povisuje. (U izvorniku su imena bila iskrivljena: Moll-Peec = Hall-Petch, Orvall = Orowan.)" },
        { q: "Koje su od navedenih tvrdnji istinite:", options: ["površina hladnih pukotina je tamnija", "površina i kod hladnih i trenja može biti ista", "površina kod hladnih pukotina je svjetlija a kod toplih tamnija", "površina toplih pukotina je uvijek sjajna i metalna"], correct: [2], note: "Tople pukotine nastaju na visokoj temperaturi pa su im površine oksidirane i tamne (plave do crne). Hladne pukotine nastaju ispod oko 200 °C pa su svijetle i metalnog sjaja." },
        { q: "Sitnozrnati čelici u odnosu na konstrukcijske čelike:", options: ["imaju veću granicu razvlačenja Rp0,2", "imaju sitnije zrno", "primjenjuju se na visokim temperaturama", "smiruju se s Mg"], correct: [0, 1], note: "Sitnozrnati čelici imaju sitnije zrno i višu granicu razvlačenja od općih konstrukcijskih, a smiruju se aluminijem (AlN). Sitno zrno nije prednost na visokim temperaturama (tamo je bolje krupno zrno zbog puzanja)." },
        { q: "Normalizirani sitnozrnati čelici imaju:", options: ["0,4 %C", "0,2 %C", "smiren Al", "smiren Mg"], correct: [1, 2], note: "Normalizirani sitnozrnati čelici imaju nizak udio ugljika (oko 0,2 % ili manje) i smireni su aluminijem, koji s dušikom stvara AlN i koči rast zrna." },
        { q: "Steliti su:", options: ["materijali na bazi Co", "materijali na bazi željeza", "otporni na eroziju kapljicama", "otporni na visoke temperature"], correct: [0, 2, 3], note: "Steliti su legure na bazi kobalta (Co-Cr-W-C), otporne na trošenje, eroziju kapljicama i visoke temperature. Koriste se za navarivanje sjedišta ventila i lopatica turbina." },
        { q: "Legirani čelici imaju:", options: ["veće minimalno vrijeme inkubacije", "manje minimalno vrijeme inkubacije", "bolju prokaljivost", "lošiju prokaljivost"], correct: [0, 2], note: "Legirni elementi (osim Co) pomiču TTT krivulje udesno, pa je vrijeme inkubacije dulje, a prokaljivost bolja." },
        { q: "Ravnotežni dijagram stanja koristi se za analizu legura kod:", options: ["sporog ugrijavanja", "brzog ugrijavanja", "sporog ohlađivanja", "brzog ohlađivanja"], correct: [0, 2], note: "Ravnotežni dijagram stanja (npr. Fe-C) vrijedi samo za vrlo sporo grijanje i hlađenje, kad difuzija stigne izjednačiti sastav. Za brze promjene koriste se TTT i CCT dijagrami." },
        { q: "Od ultra čvrstih čelika (UČČ) izrađuju se:", options: ["dijelovi trkaćih automobila", "dijelovi batiskafa", "klinovi", "dijelovi ventila"], correct: [0, 1, 2, 3], note: "Ispravljeno: od ultračvrstih čelika izrađuju se dijelovi trkaćih automobila, batiskafa (velik tlak, mala masa), klinovi i dijelovi ventila, tj. mali i jako opterećeni dijelovi." },
        { q: "Maraging čelici su:", options: ["imaju dobru zavarljivost", "imaju minimalnu deformaciju pri starenju", "jako očvršćavanje hladnom deformacijom", "su relativno jeftini"], correct: [0, 1], note: "Maraging čelici (oko 18 % Ni, malo C) imaju mekan Ni-martenzit koji se dobro zavaruje i obrađuje, a starenjem očvrsnu uz vrlo malu promjenu dimenzija. Skupi su (Ni, Co) i ne očvršćuju jako hladnom deformacijom." },
        { q: "Ako se Al - legura koristi na sniženim temperaturama do približno - 200 ºC", options: ["smanjuje im se vlačna čvrstoća sa sniženjem radne temperature", "povećava im se vlačna čvrstoća sa sniženjem radne temperature", "smanjuje im se istezljivost sa sniženjem radne temperature", "povećava im se istezljivost sa sniženjem radne temperature"], correct: [1, 3], note: "Al legure imaju FCC rešetku pa nemaju prijelaz u krhko stanje: pri sniženju temperature do oko −200 °C rastu im i vlačna čvrstoća i istezljivost. Zato se koriste za kriogenske spremnike." },
        { q: "Isoforming u prednosti je prema perliformingu zbog:", options: ["kraćeg trajanja oblikovanja", "veća prijelazna temperatura", "pogonskih mogućnosti izvođenja", "nižeg sadržaja ugljika u čeliku"], correct: [2], note: "Isoforming je u prednosti zbog pogonskih mogućnosti izvođenja: lakše ga je provesti u proizvodnji (Tema 2.10, str. 97)." },
        { q: "Očvršćenje ausforming pretežno potječe od:", options: ["stupanj oblikovanja ε = 70%", "precipitacije sitnih karbidnih zrna", "rekristalizacije austenita", "stvaranja grubog perlita"], correct: [0, 1], note: "Ausforming (deformacija metastabilnog austenita prije martenzitne pretvorbe) očvršćuje velikim stupnjem deformacije (do oko 70 %), koji povećava gustoću dislokacija, i precipitacijom sitnih karbida. Rekristalizacija i perlit poništili bi učinak." },
        { q: "Koje od navedenih svojstava ovisi o strukturi metala?", options: ["elastičnost", "toplinska vodljivost", "koeficijent toplinskog širenja", "istezljivost"], correct: [1, 3], note: "Ispravljeno prema službenom ključu (MI 235): o strukturi (rešetka, zrno, faze, nesavršenosti) ovise toplinska vodljivost i istezljivost. Modul elastičnosti i koeficijent toplinskog širenja ovise o jačini veza među atomima, pa su gotovo neosjetljivi na strukturu." },
        { q: "Metalurgija čelika započinje proizvodnjom sirovog željeza uglavnom u tzv. visokim pećima od sirovina:", options: ["željezne rude", "metalurškog koksa", "vapna koje je sirovinski dodatak", "sivog sirovog željeza"], correct: [0, 1, 2], note: "U visokoj peći sirovo željezo dobiva se od željezne rude, koksa (gorivo i redukcijsko sredstvo) i vapnenca kao dodatka za trosku. Sivo sirovo željezo je proizvod, ne sirovina." },
        { q: "Kod statičkog vlačnog pokusa:", options: ["kontinuirano se mjeri sila i produljenje epruvete", "kontinuirano se mjeri naprezanje i istezanje", "kontinuirano se mjeri sila i naprezanje", "mogu se upotrebljavati epruvete okruglog i četvrtastog poprečnog presjeka"], correct: [0, 3], note: "Kidalica izravno mjeri silu i produljenje; naprezanje i istezanje se iz njih računaju. Epruvete mogu biti okruglog ili pravokutnog presjeka." },
        { q: "Hookeovim zakonom naziva se izraz:", options: ["σ = E · Ɛ", "σ = E / Ɛ", "σ = E² · Ɛ", "σ = E · Ɛ²"], correct: [0], note: "Hookeov zakon: σ = E · ε, naprezanje je proporcionalno deformaciji, a E je modul elastičnosti. Vrijedi samo u elastičnom području." },
        { q: "Puzanje čelika nastaje u uvjetima:", options: ["konstantnog opterećenja tokom duljeg vremena na povišenoj temperaturi", "konstantnog opterećenja tokom duljeg vremena na sobnoj temperaturi", "uporabe čelika u agresivnim medijima", "konstantnog opterećenja tokom duljeg vremena na temperaturi između 100 i 200°C"], correct: [0], note: "Puzanje je spora trajna deformacija pod konstantnim opterećenjem tijekom duljeg vremena na povišenoj temperaturi (kod čelika iznad oko 400–450 °C, općenito T ≥ 0,3·Tt)." },
        { q: "Smithov dijagram daje podatak o iznosu dinamičke izdržljivosti nekog materijala za", options: ["različite tipove promjenjivog naprezanja (simetrično, istosmjerno...)", "samo jedan tip promjenjivog naprezanja uz granični broj ciklusa od 103 titraja", "različite tipove promjenjivog naprezanja uz granični broj ciklusa od 103 titraja", "isključivo statička opterećenja"], correct: [0], note: "Smithov dijagram daje dinamičku izdržljivost za različite tipove promjenjivog naprezanja (različita srednja naprezanja: simetrično, istosmjerno, ...). Wöhlerov dijagram daje izdržljivost za jedan tip naprezanja." },
        { q: "Dendritna struktura se stvara jer", options: ["zrna rastu epitaksijalno u odnosu na osnovni materijal i okomito na izoterme", "postoji istovremeno rast unutar zrna", "granice zrna idu u osnovni materijal od linije staljivanja", "ništa od navedenog nije točno"], correct: [0], note: "Kristali u metalu zavara rastu epitaksijalno, nastavljajući se na zrna osnovnog materijala uz liniju staljivanja, i to okomito na izoterme, prema središtu zavara, pa nastaju stupičasti dendriti." },
        { q: "Točkaste nesavršenosti kristala su:", options: ["granice zrna", "vakancije", "strani atomi", "dislokacije"], correct: [1, 2], note: "Točkaste nesavršenosti su vakancije (prazna mjesta), intersticijski i supstitucijski strani atomi. Granice zrna su površinske, a dislokacije linijske nesavršenosti." },
        { q: "Dislokacije su:", options: ["točkaste nesavršenosti", "linijske nesavršenosti", "površinske nesavršenosti", "volumenske nesavršenosti"], correct: [1], note: "Dislokacije su linijske nesavršenosti; njihovim gibanjem odvija se plastična deformacija." },
        { q: "Granice zrna su:", options: ["točkaste nesavršenosti", "linijske nesavršenosti", "površinske nesavršenosti", "volumenske nesavršenosti"], correct: [2], note: "Granice zrna su površinske (dvodimenzionalne) nesavršenosti kristala." },
        { q: "Koja je razlika između eutektičke i eutektoidne pretvorbe?", options: ["nema razlike", "eutektička pretvorba se odvija pri promjeni tekućeg stanja u kruto, tvoreći dvofaznu strukturu; eutektoidna pretvorba odvija se u krutini, gdje se jedna faza pretvara u mješavinu dviju faza", "eutektoidna pretvorba se odvija pri pretvorbi iz krutine u tekuću fazu, a eutektička pretvorba pri promjeni tekuće faze u krutinu, prva se događa pri grijanju, a druga pri hlađenju", "eutektičke strukture se razvijaju kada su elementi u potpunosti rastvorivi, u protivnom se oblikuje eutektoid"], correct: [1], note: "Eutektička pretvorba: talina prelazi u dvije čvrste faze (npr. ledeburit na 4,3 % C i 1147 °C). Eutektoidna: jedna čvrsta faza prelazi u dvije čvrste faze (austenit u perlit na 0,8 % C i 723 °C)." },
        { q: "Sitnozrnata struktura nastaje kod:", options: ["male brzine stvaranja klica", "velike brzine stvaranja klica", "homogene nukleacije", "heterogene nukleacije (Heterogena javlja se uz rub kalupa - velika brzina hlađenja-sitno zrno)"], correct: [1, 3], note: "Sitno zrno nastaje kad se istodobno stvara mnogo klica: velika brzina nukleacije (brže hlađenje) i heterogena nukleacija na stranim česticama i stijenkama kalupa." },
        { q: "Ljevačke strukture su:", options: ["dendritna", "Widmannstaetten", "trakasta", "normalizirana"], correct: [0, 1], note: "Lijevane strukture su dendritna i Widmanstättenova (igličasti ferit nastao iz grubog austenita). Trakasta struktura nastaje valjanjem, a normalizirana toplinskom obradom." },
        { q: "Kristali mješanci mogu biti:", options: ["intermetalni spojevi", "supstitucijski", "intersticijski", "kemijski spojevi"], correct: [1, 2], note: "Kristali mješanci (čvrste otopine) mogu biti supstitucijski (strani atom zamjenjuje atom osnove, npr. Ni u Fe) i intersticijski (mali atom u međuprostoru, npr. C u Fe). Intermetalni spojevi nisu mješanci." },
        { q: "Metali iste kristalne rešetke i male razlike veličine atoma tvore:", options: ["intersticijske mješance", "smiješane kristale", "supstitucijske mješance", "amorfne strukture"], correct: [2], note: "Supstitucijske mješance s neograničenom topljivošću tvore metali iste rešetke i sličnih atomskih promjera (razlika ispod oko 15 %), npr. Cu-Ni." },
        { q: "Na što najznačajnije utječe brzina hlađenja?", options: ["na ponašanje prilikom pretvorbe iz tekuće faze u krutinu (veća brzina tvrđa struktura)", "na pogrubljenje zrna (veća brzina hlađenja stvara se više klica kristalizacije- manja zrna)", "na naprezanja (veća brzina hlađenja više nečistoća, a i vodik ostaje zarobljen)", "na deformacije"], correct: [0, 1, 2], note: "Brzina hlađenja određuje strukturu koja nastaje pri pretvorbi (brže = tvrđe), veličinu zrna (brže = sitnije) i naprezanja te zarobljeni vodik." },
        { q: "Zaostali austenit se:", options: ["pojavljuje kod čelika s više od 0,6 %C (od 0,6% - 0,8%C kod 20°C)", "pojavljuje kod čelika između 0,3 i 0,5 %C", "eliminira dubokim hlađenjem", "eliminira normalizacijom"], correct: [0, 2], note: "Prema Uptonovom dijagramu zaostali austenit pri 20 °C javlja se kod čelika s više od oko 0,6 % C, jer im temperatura Mf pada ispod sobne. Uklanja se dubokim hlađenjem ispod nule." },
        { q: "TTT-dijagrami koriste se za:", options: ["brzo grijanje", "brzo hlađenje", "određivanje kritične brzine gašenja", "određivanje precipitacijskog žarenja"], correct: [1, 2], note: "TTT dijagrami opisuju pretvorbe pri hlađenju iz austenita (izotermno ili kontinuirano) i iz njih se čita kritična brzina gašenja. Za grijanje se koriste ATA dijagrami." },
        { q: "Krivulje hlađenja nacrtane su u:", options: ["izotermičkim TTT-dijagrarnima", "kontinuiranim TTT-dijagramima", "Fe-C dijagramima", "Schaefflerovom dijagramu"], correct: [1], note: "Ispravljeno: krivulje hlađenja ucrtavaju se u kontinuirane TTT (CCT) dijagrame, koji prikazuju pretvorbe pri kontinuiranom hlađenju. Izotermički TTT dijagram vrijedi za držanje na stalnoj temperaturi, pa se krivulje hlađenja u njega ne crtaju; Fe-C i Schaefflerov dijagram nemaju vremensku os." },
        { q: "Toplinske obrade su postupci koji se primjenjuju na čelicima u cilju:", options: ["promjene njihovog kemijskog sastava", "očuvanja njihove strukture i poboljšanja njihovih mehaničkih svojstava", "promjene njihove strukture, poboljšavajući na taj način njihova mehanička svojstva", "u zavarenim konstrukcijama radi obnavljanja strukture osnovnog materijala u izvorno stanje prije zavarivanja"], correct: [2], note: "Toplinskom obradom mijenja se struktura čelika (bez promjene sastava), a time i mehanička svojstva. Kemijski sastav mijenjaju tek toplinsko-kemijski postupci (cementiranje, nitriranje)." },
        { q: "Prokaljivost konstrukcijskog dijela izrađenog od čelika ovisi o:", options: ["kemijskom sastavu čelika", "uvjetima gašenja (nadkritičnog ohlađivanja)", "udjelu P u čeliku", "udjelu S u čeliku"], correct: [0, 1], note: "Prokaljivost ovisi o kemijskom sastavu (C i legirni elementi) i uvjetima gašenja (sredstvo, dimenzije). P i S su nečistoće bez značajnog utjecaja na prokaljivost." },
        { q: "Kod žarenja za redukciju napetosti:", options: ["smanjuju se unutarnje napetosti nastale mehaničkim i toplinskim naprezanjima pri obradi čelika", "značajno se poboljšava rezljivost čelika", "stupanj redukcije unutarnjih napetosti ovisi o visini temperature i trajanju žarenja", "provodi se zagrijavanjem iznad A3 i gašenjem u vodi"], correct: [0, 2], note: "Žarenje za redukciju napetosti (oko 550–650 °C, sporo hlađenje) smanjuje zaostale napetosti, a učinak raste s temperaturom i trajanjem. Ne mijenja strukturu i ne provodi se iznad A3 uz gašenje." },
        { q: "Rekristalizacijsko žarenje provodi se radi:", options: ["vraćanja deformabilnosti hladno deformacijski očvrsnutom metalu", "povećavanja rezljivosti i oblikovljivosti", "ustinjavanja grubozmate strukture", "ujednačavanja sastava čelika unutar lijevanih poluproizvoda"], correct: [0], note: "Rekristalizacijsko žarenje (iznad temperature rekristalizacije, ispod A1) hladno očvrsnutom metalu vraća deformabilnost. Usitnjavanje grube strukture postiže se normalizacijom, a ujednačavanje sastava homogenizacijom." },
        { q: "Zona uz sam metal zavara zove se:", options: ["zona nepotpunog taljenja", "zona utjecaja topline", "zona normalizacije", "zona plavog loma"], correct: [0], note: "Uz sam metal zavara nalazi se zona nepotpunog (djelomičnog) taljenja, a tek iza nje ostale zone ZUT-a (pregrijavanje, normalizacija, ...)." },
        { q: "Zona utjecaja topline u literaturi se naziva:", options: ["HAZ", "ZUT", "ZMT", "TUZ"], correct: [0, 1], note: "Zona utjecaja topline označava se kao ZUT (hrvatski) i HAZ (Heat Affected Zone)." },
        { q: "Stacionarno, odnosno kvazistacionarno temperaturno polje pri zavarivanju javlja se:", options: ["na dovoljnoj udaljenosti od mjesta početka i kraja zavara, kada je \"uspostavljena ravnoteža\" između količine odvedene i dovedene topline, uz uvjet q / v = konstantno", "na početku i na kraju zavara", "zbog postavljanja ulazno - izlaznih ili nastavnih pločica", "na početku zavara"], correct: [0, 2], note: "Kvazistacionarno polje uspostavlja se kad se izjednače dovedena i odvedena toplina (q/v = konst.), dakle dalje od početka i kraja zavara. Ulazno-izlazne pločice služe tome da se nestacionarni dio prenese izvan radnog komada." },
        { q: "Koje od navedenih legura su najpodložnije krhkosti izazvane vodikom:", options: ["ugljični čelici s 0,38% ugljika", "18Cr8Ni nehrđajući čelici", "2 ¼ CrMo niskolegirani čelici", "Nb-V mikrolegirani čelici"], correct: [0, 2], note: "Ispravljeno prema službenom ključu (MI 367): vodikovoj krhkosti najpodložniji su zakaljivi čelici, tj. ugljični čelik s 0,38 % C i 2¼CrMo niskolegirani čelik. Austenitni 18Cr8Ni (FCC) gotovo nije osjetljiv, a Nb-V mikrolegirani čelici imaju nizak C i sitno zrno." },
        { q: "Koja je od sljedećih tvrdnji istinita:", options: ["viša vrijednost Cekv, znači veću sklonost zakaljivanju i povećanju čvrstoće", "viša vrijednost Cekv, znači bolju zavarljivost", "viša vrijednost Cekv, znači veću sklonost zakaljivanju i višu žilavost", "viša vrijednost Cekv, znači bolju korozijsku postojanost zavarenog spoja"], correct: [0], note: "Viši Cekv znači veću zakaljivost (tvrdoću i čvrstoću ZUT-a), a time lošiju zavarljivost i nižu žilavost. Na korozijsku postojanost ne utječe." },
        { q: "Izraz za Cekv koji je dao IIW:", options: ["je primjenjiv za sve vrste materijala", "je najtočniji pri izračunavanju sklonosti nastanka hladnih pukotina", "je univerzalno primjenjiv", "je primjenjiv samo za jednu grupu čelika"], correct: [1], note: "IIW izraz za Cekv (C + Mn/6 + (Cr+Mo+V)/5 + (Ni+Cu)/15) najviše se koristi za procjenu sklonosti hladnim pukotinama kod ugljičnih i C-Mn čelika. Nije univerzalan; za niskougljične čelike bolji je Pcm." },
        { q: "Pomoću TTT-dijagrama je moguće:", options: ["odrediti približnu kritičnu brzinu hlađenja", "odrediti temperaturu predgrijavanja", "odrediti potrebnu naknadnu toplinsku obradu", "izračunati brzinu širenja pukotine"], correct: [0], note: "Iz TTT dijagrama može se odrediti približna kritična brzina hlađenja (krivulja koja tangira nos dijagrama). Temperaturu predgrijavanja i toplinsku obradu ne daje izravno." },
        { q: "Na visinu zaostalih napetosti (naprezanja) kod zavarivanja utječu:", options: ["debljina osnovnog materijala", "položaj (lokacija) zavarenog spoja na zavarenoj konstrukciji", "oblik žlijeba za zavarivanje", "način i redoslijed polaganja prolaza i slojeva"], correct: [0, 1, 2, 3], note: "Na visinu zaostalih napetosti utječu debljina, položaj spoja, oblik žlijeba i redoslijed prolaza, pa su sva četiri točna." },
        { q: "Optimalni toplinski input u cilju dobivanja kvalitetnog zavarenog spoja može se odrediti na osnovu:", options: ["TTT-dijagrama i podataka o graničnim vrijednostima i optimiziranju vrijednosti trajanja hlađenja od 800 do 500°C", "makro analize strukture zavarenog spoja", "mikro analize strukture zavarenog spoja", "statističkim obradama parametara zavarivanja"], correct: [0], note: "Optimalni unos topline određuje se iz TTT (CCT) dijagrama čelika i dopuštenog raspona t8/5: dovoljno sporo da ne nastane martenzit, a dovoljno brzo da zrno ne naraste." },
        { q: "Normalizirani sitnozrnati čelik S 355N debljine lima 5mm zavaruje se kako je navedeno", options: ["bez predgrijavanja", "primjenjujući dodatni materijal vrste E 35 B 42 H5 prema normi EN 499", "s posebno velikim unosom topline po jedinici dužine zavara", "nakon zavarivanja treba provesti odžarivanje radi odnavljanja sitnozmatih precipitata"], correct: [0, 1], note: "S355N debljine 5 mm ima nizak Cekv i tanak lim, pa predgrijavanje nije potrebno. Preporučuje se niskovodikova bazična elektroda (H5 = najviše 5 ml H2/100 g). Velik unos topline ukrupnio bi zrno." },
        { q: "HSLA čelici su:", options: ["opći konstrukcijski", "ausforming", "sitnozrnati normalizirani", "sitnozrnati poboljšani"], correct: [2, 3], note: "HSLA (visokočvrsti niskolegirani) čelici su sitnozrnati, i normalizirani i poboljšani (te TMCP). Opći konstrukcijski čelici nisu HSLA, a ausforming je termomehanička obrada." },
        { q: "Poboljšani sitnozrnati čelici imaju:", options: ["granicu razvlačenja između 500 i 1000 N/mm2", "granicu razvlačenja između 1000 i 2000 N/mm2", "do 0,6%C", "do 0,2%C"], correct: [0, 3], note: "Poboljšani sitnozrnati čelici imaju granicu razvlačenja oko 500–1000 N/mm² (S500Q–S960Q) i nizak udio ugljika (do oko 0,2 %) radi zavarljivosti." },
        { q: "Temperatura t8/5:", options: ["mjeri se sekundama", "mjeri se °C", "veća je za manje brzine hlađenja", "veća je za veće brzine hlađenja"], correct: [0, 2], note: "t8/5 je vrijeme (u sekundama) hlađenja od 800 do 500 °C. Što je hlađenje sporije, t8/5 je dulje." },
        { q: "Termomeh. obrađ. Č. imaju neke prednosti u odnosu na uobič. normal. Č.. Za koje od navedenih čimb., termomeh. Č. su povoljni izbor?", options: ["zavarljivost", "toplinsko ravnanje (pri temperaturama od oko 650°C)", "granica razvlačenja", "umor"], correct: [0, 2], note: "Ispravljeno: TMCP čelici postižu visoku granicu razvlačenja uz nizak udio C i legirnih elemenata (nizak Cekv), pa su i vrlo dobro zavarljivi, a to je njihova glavna prednost. Toplinsko ravnanje na oko 650 °C im šteti, jer gube čvrstoću dobivenu valjanjem. Zbirka je navodila samo granicu razvlačenja." },
        { q: "Od ultračvrstih čelika izrađuje se:", options: ["dijelovi tokarilica", "dijelovi zrakoplova", "dijelovi kotlova", "dijelovi raketa"], correct: [1, 3], note: "Ultračvrsti čelici koriste se ondje gdje je presudan omjer čvrstoće i mase: zrakoplovi, rakete, trkaći automobili. Kotlovi i alatni strojevi to ne traže." },
        { q: "Najbolju Iomnu žilavost od ultračvrstih čelika imaju:", options: ["poboljšani", "TRIP", "PH austenitni", "ausforming"], correct: [1], note: "TRIP čelici imaju najbolju lomnu žilavost među ultračvrstima: zaostali austenit se pod naprezanjem pretvara u martenzit i tako koči napredovanje pukotine (Tema 2.10)." },
        { q: "Ultračvrsti čelici su:", options: ["maraging", "feritni nehrđajući", "TRIP", "kotlovski"], correct: [0, 2], note: "U ultračvrste čelike spadaju maraging, TRIP, ausformirani i poboljšani niskolegirani čelici. Feritni nehrđajući i kotlovski čelici nisu ultračvrsti." },
        { q: "Koje od navedenih metoda mogu biti učinkovite u smanjenju opasnosti pojave lamelarnog kidanja?", options: ["dozvoliti hlađenje djelomično zavarenog spoja prije njegovog dovršenja", "pravilnim oblikovanjem konstrukcije", "primijeniti spojeve s djelomičnim protaljivanjem umjesto spojeva s punim provarom", "ako su navedeni postupci nedovoljni, može se koristiti navarivanje"], correct: [1, 2, 3], note: "Ispravljeno: lamelarno kidanje smanjuje se oblikovanjem spoja (manje naprezanje u smjeru debljine), djelomičnim provarom umjesto punog (manje metala zavara) i navarivanjem (buttering) mekanog sloja na lim prije zavarivanja; navarivanje je priznata mjera (npr. TWI). Hlađenje dopola zavarenog spoja ne pomaže." },
        { q: "Vjerojatnost nastajanja hladnih pukotina se smanjuje:", options: ["predgrijavanjem (u cilju povećanja trajanja hlađenja zavarenog spoja i otklanjanja površinske vlage)", "sušenjem elektrode, zaštitnog praška", "pravilnim redoslijedom zavarivanja (smanjenje zaostalih naprezanja)", "optimalnim toplinskim inputom"], correct: [0, 1, 2, 3], note: "Sve navedene mjere smanjuju hladne pukotine: predgrijavanje (dulje hlađenje, izlazak vodika), suhe elektrode i prašak (manje vodika), pravilan redoslijed (manje naprezanja) i optimalan unos topline (bez zakaljivanja)." },
        { q: "SCC (Strcss Corrosion Cracking) je posljedica:", options: ["zajedničkog djelovanja mehaničkih i kemijskih čimbenika u radnom okolišu metalne konstrukcije", "isključivo djelovanje kemijskih čimbenika", "isključivo djelovanje mehaničkih čimbenika", "isključivo djelovanje zaostalih naprezanja"], correct: [0], note: "Napetosna korozija (SCC) nastaje samo zajedničkim djelovanjem vlačnog naprezanja (vanjskog ili zaostalog) i korozivnog medija na osjetljivom materijalu. Nijedan čimbenik sam ne uzrokuje SCC." },
        { q: "Hladne pukotine može uzrokovati:", options: ["krhka zakaljena struktura dobivena zavarivanjem", "difuzijski vodik", "zaostala naprezanja", "vrlo visoka žilavost materijala"], correct: [0, 1, 2], note: "Hladne pukotine uzrokuju krhka zakaljena struktura, difuzijski vodik i zaostala naprezanja. Visoka žilavost ih sprječava." },
        { q: "Fisco test je proba sklonosti:", options: ["toplim pukotinama", "hladnim pukotinama", "koroziji", "lamelarnom odvajanju"], correct: [0], note: "FISCO test (kao i Varestraint i Transvarestraint) ispituje sklonost toplim (kristalizacijskim) pukotinama. Za hladne pukotine služe npr. Tekken, CTS i implant test. (U izvorniku je ponuđeno i „vrućim pukotinama“, što je isto što i tople, pa je taj odgovor zamijenjen.)" },
        { q: "Od HSLA čelika izrađuje se:", options: ["zakovice", "vijci", "kuglasti spremnici", "turbinski cjevovodi"], correct: [2, 3], note: "HSLA čelici koriste se za velike zavarene konstrukcije pod tlakom ili opterećenjem: kuglaste spremnike, tlačne cjevovode hidroelektrana, mostove. Zakovice i vijci izrađuju se od drugih čelika." },
        { q: "U gradnji mostova prednosti sitnozrnatih čelika u odnosu na opće konstrukcijske čelike su:", options: ["veći modul elastičnosti", "manji modul elastičnosti", "veća granica razvlačenja", "manja masa za isto opterećenje"], correct: [2, 3], note: "Sitnozrnati čelici imaju višu granicu razvlačenja, pa za isto opterećenje treba manji presjek i manja masa. Modul elastičnosti je za sve čelike praktički isti." },
        { q: "Najopasnija neželjena pojava uporabe čelika pri niskim temperaturama je:", options: ["nagli pad tvrdoće", "nagli pad žilavosti", "nagli pad Rm", "nagli pad Re"], correct: [1], note: "Kod BCC čelika ispod prijelazne temperature žilavost naglo padne i javlja se krhki lom bez upozorenja; to je najopasnije. Rm i Re pri sniženju temperature čak rastu." },
        { q: "Tip rešetke materijala (BCC, FCC ...):", options: ["značajno utječe na žilavost pri niskim temperaturama", "utječe, ali neznatno", "uopće ne utječe na žilavost pri niskim temperaturama", "utječe, ali samo u intervalu od 0°C do -20°C"], correct: [0], note: "Tip rešetke presudno utječe na žilavost na niskim temperaturama: BCC metali (ferit) imaju prijelaz u krhko stanje, a FCC metali (austenit, Al, Cu, Ni) ostaju žilavi do vrlo niskih temperatura." },
        { q: "Koji elementi pridonose povećanju J-faktora?", options: ["Mn", "As", "P", "S"], correct: [0, 2], note: "J-faktor = (Mn + Si)·(P + Sn)·10⁴ procjenjuje krhkost popuštanja CrMo čelika, pa ga povećavaju Mn i P (te Si i Sn). As i S nisu u formuli." },
        { q: "Pokazatelj otpornosti na puzanje je (su):", options: ["udarni rad loma", "granica puzanja", "dinamička izdržljivost", "statička izdržljivost"], correct: [1, 3], note: "Otpornost na puzanje opisuju granica puzanja (Rp1/t, naprezanje za 1 % deformacije u vremenu t) i statička (trajna) izdržljivost (Rm/t, naprezanje koje dovodi do loma u vremenu t). Udarni rad loma i dinamička izdržljivost to ne opisuju." },
        { q: "Visoke temperature za čelike su:", options: ["preko 200°C", "preko 250°C", "preko 300°C", "preko 450°C"], correct: [3], note: "Za čelike se visokim temperaturama smatraju temperature iznad oko 450 °C, kad počinje izraženo puzanje (T ≥ 0,3–0,4·Tt)." },
        { q: "Grubozrnata struktura povoljna je kod:", options: ["puzanja", "umora", "korozije", "trošenja"], correct: [0], note: "Pri puzanju se deformacija odvija klizanjem po granicama zrna, pa je krupno zrno (manje granica) povoljnije. Za umor, žilavost i niske temperature bolje je sitno zrno." },
        { q: "Koji zahvati sprečavaju pojavu interkristalne korozije pri zavarivanju CrNi čelika", options: ["naknadna normalizacija", "kemijsko vezanje ugljika u oblik vrlo otpornih karbida dodavanjem titana, niobija ili tantala", "smanjenje sadržaja ugljika na manje od 0,5% ugljika", "austenitizacija zavarenih sklopova na temperaturi 1050 do 1080 °C i hlađenja u vodi"], correct: [1, 3], note: "Ispravljeno: interkristalnu koroziju sprječava vezanje ugljika titanom, niobijem ili tantalom (stabilizirani čelici) i rastvorno žarenje, tj. austenitizacija na 1050–1080 °C uz brzo hlađenje u vodi, koja otopi karbide. Potreban udio C je ispod 0,03 %, ne 0,5 %, a normalizacija ne pomaže." },
        { q: "Elektrokemijska korozija je korozija u:", options: ["elektrolitima", "neelektrolitima", "vrućim plinovima", "vodi"], correct: [0, 3], note: "Elektrokemijska korozija odvija se u elektrolitima (voda, vlažno tlo, otopine soli), gdje teče struja između anode i katode. U neelektrolitima i vrućim plinovima odvija se kemijska korozija." },
        { q: "Točkasta korozija:", options: ["je opasnija o opće korozije, jer je korozijski proces teže kontrolirati", "manje je opasna od opće korozije, jer dolazi samo do mjestimične korozije", "se javlja samo kod Al legura", "se naziva još i ,,pitting“"], correct: [0, 3], note: "Točkasta (rupičasta) korozija, pitting, opasnija je od opće korozije jer duboko i brzo probija stijenku na malim mjestima, a teško ju je uočiti i predvidjeti. Javlja se kod nehrđajućih čelika, Al i drugih pasivnih metala." },
        { q: "Korozija se sprečava:", options: ["racionalnim izborom konstrukcijskog materijala", "zaštitnim prevlačenjem (metalnih prevlaka, anorganskih nemetalnih prevlaka, organskih prevlaka)", "konstrukcijsko tehnološkim mjerama", "smanjenjem agresivnosti medija"], correct: [0, 1, 2, 3], note: "Korozija se sprječava izborom materijala, zaštitnim prevlakama, konstrukcijskim mjerama (bez procjepa i nakupljanja vode) i smanjenjem agresivnosti medija (inhibitori), a i katodnom zaštitom." },
        { q: "Pri zavarivanju čisto austenitnih vatrootpornih čelika, treba primijeniti slijedeća pravila:", options: ["zavarivanje treba provesti uz mali unos topline, tj. tzv. ,,vrući“ postupci se trebaju izbjegavati", "ploče koje zavarujemo trebaju biti predgrijane na temperaturu 300 do 450°C ovisno o njihovoj debljini", "parametri zavarivanja (unos topline) trebaju biti propisani na temelju stvarnog Cekv", "u cilju izbjegavanja naprezanja zavara, potrebno je primijeniti napetosno odžarivanje"], correct: [0], note: "Čisto austenitni čelici skloni su toplim pukotinama, pa se zavaruju malim unosom topline, bez predgrijavanja i obično bez toplinske obrade. Cekv za njih nema smisla." },
        { q: "Koji je od korozijski postojanih čelika nemagnetičan:", options: ["austenitni", "feritni", "duplex", "martenzitni"], correct: [0], note: "Austenitni nehrđajući čelici (FCC) su nemagnetični. Feritni i martenzitni su magnetični, a duplex je zbog oko 50 % ferita također magnetičan." },
        { q: "Zone utjecaja topline i kod grubozrnatih i finozrnatih čelika su slične u kojem pogledu?", options: ["u području visokih temperatura neposredno uz liniju staljivanja zrna su pogrubljena i približno jednake veličine", "promjene u vlačnoj čvrstoći su približno jednake", "relativno povećanje tvrdoće čelika približno jednakog sastava je praktično jednako", "obje zone pokazuju smanjenje žilavosti od oko 11% u usporedbi s izvornim stanjem osnovnog materijala"], correct: [0], note: "Tik uz liniju staljivanja temperatura je tako visoka (1100–1450 °C) da se i kod sitnozrnatih čelika zrno ukrupni, pa su zrna u toj zoni kod obje vrste čelika približno jednako gruba. Promjene čvrstoće, tvrdoće i žilavosti se razlikuju." },
        { q: "Austenitni nehrđajući čelici između ostalog imaju sljedeća svojstva:", options: ["niske vrijednosti čvrstoće, a izrazito visoke žilavosti (KV)", "dobra svojstva čvrstoće, a slabu žilavost", "niske vrijednosti čvrstoće i slabu žilavost", "dobra svojstva čvrstoće i dobru žilavost"], correct: [0], note: "Austenitni nehrđajući čelici imaju relativno nisku granicu razvlačenja (oko 200–300 N/mm²), ali izrazito visoku žilavost, i to sve do vrlo niskih temperatura (FCC rešetka)." },
        { q: "Feritizacija je pojava karakteristična za zavarivanje:", options: ["austenitnih čelika", "viskoaustenitnih čelika", "martenzitnih čelika", "duplex čelika"], correct: [3], note: "Feritizacija (previše ferita u metalu zavara i ZUT-u zbog brzog hlađenja) tipičan je problem duplex čelika." },
        { q: "Nužni uvjet korozijske postojanosti „min 12% Cr u Fe masi“ vrijedi za:", options: ["opću postojanost", "postojanost na napetosnu koroziju", "postojanost na jamičastu koroziju", "postojanost na selektivnu koroziju"], correct: [0], note: "Najmanje oko 12 % Cr dovoljno je za stvaranje pasivnog sloja i opću korozijsku postojanost. Za otpornost na rupičastu, napetosnu i druge lokalne vrste korozije trebaju dodatno Mo, N, Ni ili viši Cr." },
        { q: "Feritni korozijski postojani čelici u prednosti su prema austenitnim:", options: ["po otpornosti na interkristalnu koroziju", "po otpornosti na reducirajuće kemikalije", "po otpornosti na plinove sa viskoim sadržajem S", "po cijeni"], correct: [2, 3], note: "Ispravljeno: feritni nehrđajući čelici nemaju (ili imaju malo) nikla, pa su jeftiniji i otporniji u plinovima s visokim sadržajem sumpora, jer Ni sa S stvara nisko taljive sulfide. Na interkristalnu koroziju i reducirajuće kemikalije otporniji su austenitni. Zbirka je navodila samo cijenu." },
        { q: "Abrazija se pojavljuje:", options: ["u kliznom kontaktu s mineralima", "u kotrljajućem kontaktu", "pri kavitaciji", "pri eroziji česticama"], correct: [0, 3], note: "Ispravljeno: abrazija se javlja u kliznom kontaktu s tvrdim česticama (minerali) i kod erozije česticama pri malom kutu upada (do oko 30°). Kotrljanje daje umor površine, a kavitacija je erozija kapljevinom." },
        { q: "Adhezija pretežno nastaje kod:", options: ["klizanja", "kotrljanja", "erozije česticama", "kavitacije"], correct: [0], note: "Adhezija (zavarivanje mikrošiljaka i njihovo kidanje) nastaje pretežno pri klizanju metalnih površina bez dovoljnog podmazivanja." },
        { q: "Koje su tvrdnje točne kada se razmatra platiranje:", options: ["u usporedbi s uobičajenim postupcima zavarivanja, kod navarivanja se očekuje manje miješanje", "nema razlike između EPP i EPT navarivanja trakastim elektrodama, praško vi za ove postupke mogu se međusobno zamjeniti", "u cilju izbjegavanja pukotina ili odvajanja sloja tijekom navarivanja može se primijeniti platiranje", "nije nužno primijeniti predgrijavanje pri navarivanju Co-Cr-W legurama"], correct: [0, 2], note: "Navarivanje se izvodi s malim miješanjem (dilucijom), da sloj zadrži svoj sastav, a međusloj (platiranje) sprječava pukotine i odvajanje. EPP i EPT trakom traže različite praškove, a navarivanje Co-Cr-W (stelitom) obično traži predgrijavanje." },
        { q: "Zaštita površine od trošenja provodi se:", options: ["navarivanjem", "pocinčavanjem", "katodnom zaštitom", "naštrcavanjem"], correct: [0, 3], note: "Od trošenja štite tvrdi slojevi: navarivanje (npr. stelit) i naštrcavanje (toplinsko prskanje). Pocinčavanje i katodna zaštita štite od korozije, ne od trošenja." },
        { q: "Modificiranje i prevlačenje površine može se provesti:", options: ["mehaničkim procesima", "toplinskim procesima", "kemijskim i elektrokemijskim procesima", "kombinacijom dva ili više gore navedenih procesa"], correct: [0, 1, 2, 3], note: "Ispravljeno: površina se modificira i prevlači mehaničkim (sačmarenje), toplinskim (kaljenje, navarivanje), kemijskim i elektrokemijskim (nitriranje, galvanizacija) procesima i njihovim kombinacijama. Zbirka je ovdje navodila samo mehaničke i toplinske, a u gotovo istom pitanju točna su sva četiri." },
        { q: "Koje pojave treba uzeti u obzir kada se zavaruju čelici otporni na visoke temperature?", options: ["opasnost od zakaljivanja", "opasnost od pregrijavanja", "gubitak žilavosti", "opasnost od vrućih pukotina"], correct: [0, 1], note: "Čelici otporni na visoke temperature (CrMo, CrMoV) skloni su zakaljivanju (hladne pukotine, treba predgrijavanje) i pregrijavanju (ukrupnjavanje zrna, pukotine pri naknadnom žarenju)." },
        { q: "Superlegure su materijali:", options: ["za jako niske temperature", "za visoke temperature", "na bazi bakra", "na bazi Ni ili Co"], correct: [1, 3], note: "Superlegure su legure na bazi nikla ili kobalta (i Fe-Ni) za rad na visokim temperaturama (oko 800–1100 °C), npr. lopatice plinskih turbina." },
        { q: "Čekićanje se rabi kod zavarivanja:", options: ["sivog lijeva", "mikrolegiranih čelika", "HSLA čelika", "pripoja"], correct: [0], note: "Kod hladnog zavarivanja sivog lijeva svaki kratki prolaz se lagano čekića dok je još topao, da se metal zavara plastično istegne i smanje vlačne napetosti koje bi razbile krhki lijev." },
        { q: "Koju obradu treba primijeniti pri zavarivanju legure Cu-2% Be u cilju postizanja najveće čvrstoće:", options: ["rastopno odžariti i zatim provesti starenje", "samo rastopno odžariti", "provesti odžarivanje u cilju popuštanja napetosti pri 625°C", "uporabiti u zavarenom stanju bez obrade"], correct: [0], note: "Berilijeva bronca (Cu-2 % Be) je precipitacijski očvrstljiva: najveću čvrstoću daje rastvorno žarenje pa starenje (dozrijevanje). Bez starenja ostaje mekana." },
        { q: "Cu i Cu legure imaju slijedeća svojstva:", options: ["vrlo dobra električna vodljivost", "loša toplinska vodljivost", "vrlo dobra korozijska postojanost", "vrlo dobra toplinska vodljivost"], correct: [0, 2, 3], note: "Bakar i njegove legure imaju vrlo dobru električnu i toplinsku vodljivost i dobru korozijsku postojanost. Toplinska vodljivost im je velika, ne loša." },
        { q: "Bronca je legura:", options: ["Cu-Zn", "Cu-Sn", "Cu-Al", "Cu-Zn-Sn-Pb"], correct: [1, 2], note: "Bronce su legure bakra s kositrom (kositrena bronca) ili drugim elementima kao glavnim dodatkom, npr. aluminijem (aluminijska bronca). Cu-Zn je mjed (mesing)." },
        { q: "Za Cu-Ni legure vrijedi:", options: ["velika sklonost otapanja vodika u Cu i Ni stvara teškoće pri zavarivanju", "Cu i Ni imaju oba FCC rešetku sličnih parametara i gustoće", "Cu i Ni imaju oba BCC rešetku sličnih parametara i gustoće", "posebno su otporne na koroziju u svim vodenim otopinama"], correct: [0, 1, 3], note: "Cu i Ni imaju FCC rešetke sličnih parametara pa su potpuno topljivi. Oba otapaju vodik, pa treba paziti na poroznost. Cu-Ni legure su vrlo korozijski postojane, osobito u morskoj vodi. ⚠️ Tvrdnja „u svim vodenim otopinama“ je prejaka, ali je u ključu zbirke." },
        { q: "Zakaljive Ni legure se zavaruju na slijedeći način:", options: ["zavarivanje nakon zakaljivanja (650°C / peć) primjenjujući dodatni materijal istog sastava", "zavarivanje nakon rastopnog žarenja legure, primjenjujući dodatni materijal istog sastava, ali bez elemenata koji potiču zakaljivanje (Ti, Al)", "nakon stabilizacijskog odžarivanja (750-820°C/ peć)", "zavariti u nezakaljenom stanju primjenjujući istovrsni dodatni materijal i zatim zakaliti"], correct: [1, 3], note: "Ispravljeno prema službenom ključu: zakaljive (precipitacijski očvrstive) Ni-legure zavaruju se nakon rastvornog žarenja, s dodatnim materijalom istog sastava, ali bez Ti i Al (da metal zavara ne očvrsne i ne pukne), ili u neočvrsnutom stanju s istovrsnim dodatnim materijalom, nakon čega se cijeli spoj očvrsne. Zavarivanje u očvrsnutom stanju vodi u pukotine." },
        { q: "Zaokružiti točnu(e) tvrdnju(e):", options: ["Ni-legure posjeduju izuzetnu korozijsku postojanost", "Ni-legure nisu zakaljivi materijali", "Ni-legure se mogu zavarivati TIG, MIG, REL, EPP, i EO postupkom", "Ni-legure su zakaljivi materijali"], correct: [0, 1, 2], note: "Ispravljeno: zbirka je kao točne označila i „nisu zakaljive“ i „jesu zakaljive“, a to se isključuje. Ni legure imaju FCC rešetku i ne zakaljuju se martenzitno; neke se očvršćuju starenjem (precipitacijom). Imaju izvrsnu korozijsku postojanost i zavaruju se TIG, MIG, REL, EPP i EO postupkom." },
        { q: "Inconel je Ni legura slijedećeg sastava:", options: ["67% Ni, 30% Cu, 1,5% Fe, 1% Mn", "80% Ni, 15% Cr, 5% Fe", "90% Ni, 5%Cr, 5% Fe", "67% Ni, 3% C, 20% Fe, 10% Cr"], correct: [1], note: "Klasični Inconel (600) ima oko 76–80 % Ni, 15 % Cr i 5–8 % Fe. Sastav 67 % Ni i 30 % Cu je Monel." },
        { q: "Zaokružiti točnu(e) tvrdnju(e):", options: ["sve vrste Ni-legura su zavarljive", "zavarljive su sve vrste Ni-legura osim Ni/Zn legure", "vruće pukotine tipična su pojava kod zavarivanja Ni-legura", "poroznost je tipična greška kod zavarivanja Ni-legura"], correct: [1, 2, 3], note: "Ispravljeno: kod Ni legura tipične su i poroznost i tople (vruće) pukotine (nisko taljivi Ni3S2), kao što stoji i u drugim pitanjima iz zbirke. Zbirka je ovdje tople pukotine označila kao netočne." },
        { q: "Koje od navedenih metoda su korisne u izbjegavanju poroziteta pri elektrolučnom zavarivanju aluminija:", options: ["održavanje odgovarajuće međuslojne temperature", "uklanjanje nečistoća s rubova metala koji se zavaruje", "u slučaju TIG zavarivanja primijeniti plinsku leću", "primijeniti zaštitni plin čije je rosište niže od -60°C"], correct: [1, 3], note: "Ispravljeno: pore u aluminiju stvara vodik, pa pomažu uklanjanje nečistoća, oksida i vlage s rubova i suh zaštitni plin (rosište ispod −60 °C znači gotovo bez vlage). Međuslojna temperatura i plinska leća ne uklanjaju izvor vodika. Zbirka je navodila samo čišćenje." },
        { q: "Kvalitetni postupci zavarivanja aluminijskih legura su:", options: ["plinsko zavarivanje", "MAG zavarivanje", "MIG zavarivanje", "TIG zavarivanje"], correct: [2, 3], note: "Kvalitetni postupci za aluminij su MIG i TIG (inertni plin, katodno čišćenje oksida). MAG koristi aktivni plin (CO2, O2) i ne smije se koristiti, a plinsko zavarivanje daje lošu kvalitetu." },
        { q: "AI-Mg-5 legura je:", options: ["toplinski obradiva", "toplinski neobradiva", "prikladna za očvršćivanje hladnom deformacijom", "prikladna za lijevanje"], correct: [1, 2], note: "AlMg5 (serija 5xxx) je toplinski neobradiva legura koja očvršćuje hladnom deformacijom. Dobro se zavaruje i koristi kao gnječena legura, a ne za lijevanje." },
        { q: "Karakteristične greške u zavarenim spojevima aluminijskih legura su", options: ["pore", "naljepljivanje", "pukotine izazvane vodikom", "uključci oksida"], correct: [0, 1, 3], note: "Ispravljeno: tipične greške kod aluminija su pore (vodik), naljepljivanje (nedostatak spajanja zbog oksida i velike vodljivosti) i uključci oksida. Aluminij nije sklon hladnim pukotinama izazvanim vodikom; vodik u njemu stvara pore." },
        { q: "Aluminijske legure mogu se rezati:", options: ["plinskim plamenom", "plazmom", "ugljenom elektrodom i stlačenim zrakom", "laserom"], correct: [1, 3], note: "Aluminij se reže plazmom i laserom. Plinskim plamenom se ne može rezati, jer oksid ima mnogo višu temperaturu taljenja od metala i ne izgara." },
        { q: "Koje vrste titanskih legura se općenito smatraju nezavarljivim?", options: ["komercijalno čisti titan", "alfa- legure", "alfa-beta legure", "beta- legure"], correct: [3], note: "Ključ iz zbirke (prema predavanju prof. Bauera): komercijalno čisti titan i α legure dobro se zavaruju, α-β legure uz ograničenja, a β legure općenito se smatraju nezavarljivim (krhkost, nestabilna struktura)." },
        { q: "Titan se uobičajno upotrebljava:", options: ["u svemirskoj tehnici", "pri izradi automobilskih karoserija", "izradi ispušnih topova (,,auspuha“) za super sportske motocikle", "u izradi bolida F1"], correct: [0, 2, 3], note: "Titan se koristi gdje je presudan omjer čvrstoće i mase te otpornost na koroziju i temperaturu: svemirska tehnika, F1, ispušni sustavi skupih motocikala. Za karoserije je preskup." },
        { q: "Svojstva zavarenog spoja između ugljičnog i nehrđajučeg čelika temeljno ovise o:", options: ["svojstvima osnovnog materijala", "količini ugljika u osnovnom materijalu", "o primijenjenom dodatnom materijalu", "o protaljivanju i stupnju miješanja"], correct: [2, 3], note: "Svojstva raznorodnog spoja temeljno ovise o dodatnom materijalu (prelegiran, npr. 309) i stupnju miješanja (diluciji), jer oni određuju strukturu metala zavara (Schaeffler)." },
        { q: "Schaefflerov dijagram se uspješno može koristiti kod:", options: ["grafičkog određivanja temperature predgrijavanja u cilju izbjegavanja hladnih pukotina", "zavarivanja raznoronih materijala (čelika)", "procjene naknadne toplinske obrade poslije zavarivanja", "određivanja Cekv"], correct: [1], note: "Schaefflerov dijagram služi za zavarivanje raznorodnih čelika i procjenu strukture metala zavara. Temperaturu predgrijavanja, toplinsku obradu i Cekv iz njega ne određujemo." },
        { q: "Ukoliko je potrebno zavarivati niskolegirani čelik (najčešće potrebno predgrijavanje) i visokolegirani čelik austenitnog tipa (zabranjeno predgrijavanje) zavarivanje:", options: ["uopće nije moguće izvoditi, jer se najednom od čelika mogu pojaviti hladne pukotine, a na drugom može doći do izlučivanja Cr karbida po granicama zrna", "se može izvoditi oblaganjem ivica žlijeba (uz predgrijavanje) niskolegiranog čelika elektrodom austenitnog tipa (npr. Cr-Ni 24/12), nakon čega se provodi priprema žlijeba i zavarivanje bez predgrijavanja sa visokolegiranim austenitnim čelikom", "se izvodi tako da u zavarenom spoju bude obavezno 5-12% delta ferita", "moguće je izvesti, ali samo sa MIG postupkom zavarivanja uz mali dodatak kisika zaštitnom plimnu"], correct: [1], note: "Rubovi žlijeba niskolegiranog čelika navare se (uz predgrijavanje) austenitnom elektrodom (npr. 24/12, tip 309). Nakon toga se spoj zavaruje bez predgrijavanja, kao da su oba dijela austenitna. To je tzv. buttering." },
        { q: "Udjeli (postotci) mješanja pojedinih osnovnih i dodatnih materijala kod primjene Schaefflerovog dijagrama se određuju:", options: ["mjerenjem površine (planimetriranjem) 3 ili više metalografskih makro uzoraka zavarenih spojeva", "procjenjuje se na osnovu iskustva specijaliste zavarivanja", "udijeli (postotci) miješanja nisu bitni za korištenje Schaefflerovog dijagrama", "TTT-dij agrarnom"], correct: [0], note: "Udio miješanja određuje se mjerenjem površina (planimetriranjem) rastaljenog osnovnog i dodatnog materijala na tri ili više makroizbrusaka zavarenih spojeva." },
        { q: "Jedan od dijagrama za određivanje temperature predgrijavanja, granične debljine materijala, toplinskog inputa i trajanja hlađenja od 800 do 500 °C je:", options: ["Dijagram Bragarda", "TTT anizotermički dijagram", "TTT izotermički dijagram", "Dijagram dilacijskih promjena pri zavarivanju"], correct: [0], note: "Bragardov dijagram povezuje temperaturu predgrijavanja, graničnu debljinu, unos topline i t8/5 za 2D i 3D odvođenje topline. TTT dijagrami daju strukture, ne temperaturu predgrijavanja." },
        { q: "Simulacija toplinskog ciklusa zavarivanja može se izvoditi na :", options: ["Thermorestor uređaju", "Gleeble uređaju", "Charpijevom batu", "Smitweld uređaju"], correct: [0, 1, 3], note: "Toplinski ciklus zavarivanja simulira se na uzorcima u laboratorijskim simulatorima: Smitweld, Gleeble, Thermorestor. Charpyjev bat ispituje udarni rad loma, a simulirani uzorci se tek poslije na njemu ispituju." },
        { q: "U zoni-području rekristalizacije zavarenog spoja u zoni utjecaja :", options: ["ne dolazi do strukturnih transformacija, već samo do porasta zrna i usitnjavanja izazvanog '\"međusobnim drobljenjem zrna kod materijala koji su prethodno pretrpjeli plastičnu deformaciju", "dolazi do strukturnih transformacija", "dolazi do pogrubljenja kristalnog zrna", "dolazi do taljenja granica zrna"], correct: [0], note: "U zoni rekristalizacije (oko 500–700 °C, ispod A1) nema faznih pretvorbi; samo se hladno deformirana zrna rekristaliziraju u nova (to vrijedi samo za prethodno hladno deformiran materijal)." },
        { q: "Koje su od sljedećih tvrdnji istinite:", options: ["viša vrijednost ekvivalenta ugljika znači veću sklonost zakaljivanju i povećanju čvrstoće", "viša vrijednost ekvivalenta ugljika znači bolju zavarljivost", "viša vrijednost ekvivalenta ugljika znači veću sklonost zakaljivanju i višu žilavost", "viša vrijednost ekvivalenta ugljika znači lošiju zavarljivost"], correct: [0, 3], note: "Viši Cekv znači veću zakaljivost (porast tvrdoće i čvrstoće ZUT-a), a time lošiju zavarljivost i manju žilavost. Na korozijsku postojanost ne utječe." },
        { q: "Zavarljivost, najjednostavnije predstavlja sposobnost spajanja materijala. U tom se smislu razlikuju operativna, metalurška ili lokalna i konstrukcijska ili globalna zavarljivost. Primjena predgrijavanja, dogrijavanja, \"oblaganja ivica žlijeba za zavarivanje\" razmatra se u okviru;", options: ["metalurške ili lokalna zavarljivosti", "konstrukcijske ili globalne zavarljivosti.", "operativne zavarljivosti", "ekonomske zavarljivosti"], correct: [2], note: "Operativna zavarljivost obuhvaća tehnološke mjere kojima se spoj može izvesti: predgrijavanje, dogrijavanje, navarivanje rubova žlijeba. Metalurška se odnosi na pretvorbe u materijalu, a konstrukcijska na oblik i ponašanje konstrukcije." },
        { q: "Procjena fizikalno-kemijskih transformacija pod utjecajem toplinskog ciklusa zavaivanja razmatra se u okviru:", options: ["metalurške ili lokalna zavarljivosti", "operativne zavarljivosti", "konstrukcijske ili globalne zavarljivosti", "ekonomske zavarljivosti"], correct: [0], note: "Fizikalno-kemijske pretvorbe pod utjecajem toplinskog ciklusa (struktura ZUT-a, zakaljivanje) predmet su metalurške (lokalne) zavarljivosti." },
        { q: "Opća procjena ponašanja zavarenog spoja na zavarenoj konstrukciji (npr. mogućnost izvođenja zavarenog spoja, pristupačnost, zarezna djelovanja i dr.) razmatra se u okviru:", options: ["konstrukcijske ili globalne zavarljivosti.", "operativne zavarljivosti", "metalurške ili lokalna zavarljivosti", "ekonomske zavarljivosti"], correct: [0], note: "Konstrukcijska (globalna) zavarljivost razmatra ponašanje spoja u konstrukciji: izvedivost, pristupačnost, zareze, krutost i naprezanja." },
        { q: "Rast kristalnog zrna u zavarenom spoju posljedica je:", options: ["nedovoljnog toplinskog inputa u zavarenom spoju", "loše naknadne toplinske obrade u zavarenom spoju", "predugog zadržavanja područja uz \"liniju staljivanja\" sa strane zone utjecaja topline na visokim temperaturama (iznad temperature normalizacijskog žarenja), koje se može javiti kao posljedica velikog unošenja topline pri zavarivanju i zavarivanju u više prolaza i slojeva.", "prebrzog hlađenja nakon zavarivanja"], correct: [2], note: "Zrno raste kad je područje uz liniju staljivanja predugo na visokim temperaturama (iznad temperature normalizacije), npr. zbog velikog unosa topline ili mnogo prolaza. Premali unos topline i brzo hlađenje daju sitnije zrno, ali tvrđu strukturu." },
        { q: "Veća brzina hlađenja u zavarenom spoju je posljedica:", options: ["manjeg toplinskog inputa", "većeg toplinskog inputa", "manje temperature predgrijavanja", "veće debljine limova koji se zavaraju"], correct: [0, 2, 3], note: "Brže hlađenje daju manji unos topline, niža temperatura predgrijavanja i deblji lim (više materijala odvodi toplinu)." },
        { q: "Analitička formula za dvodimenzijsko vođenje topline pri zavarivanju (Rykalin, Rosental) dobiju se kada", options: ["pokretni točkasti izvor topline djeluje na polubeskonačno tijelo (debeli lim)", "brzopokretni točksti izvor topline (v → ∞) djeluje na debeli lim", "pokretni linijski izvor topline djeluje na lijelo debljine δ (tanki lim)", "nepomični točkasti izvor topline djeluje u središtu kugle"], correct: [2], note: "2D model (Rykalin, Rosenthal) vrijedi za pokretni linijski izvor topline kroz cijelu debljinu tankog lima δ: toplina se širi samo u ravnini lima." },
        { q: "Analitička formula za trodimenzijsko vođenje topline pri zavarivanju (Rykalin, Rosental) dobiju se kada", options: ["pokretni točkasti izvor topline djeluje na polubeskonačno tijelo (debeli lim)", "pokretni linijski izvor topline djeluje na tijelo debljine δ (tanki lim)", "brzopokretni točksti izvor topline (v → ∞) djeluje na debeli lim", "nepomični linijski izvor topline djeluje na tanki lim"], correct: [0], note: "Ispravljeno: Rykalinov i Rosenthalov 3D model vrijedi za pokretni točkasti izvor na polubeskonačnom tijelu (debeli lim). Brzopokretni izvor (v → ∞) poseban je granični slučaj kod kojeg se toplina praktički širi samo okomito na smjer gibanja, pa se ne ubraja u osnovni 3D model." },
        { q: "Pokretni točkasti izvor topline koji djeluje na limu debljine δ predstavlja", options: ["pojednostavljeno trodimenzijsko vođenje topline", "pojednostavljeno dvodimenzijsko vođenje topline", "tzv. model \"ravnog sloja\" (2,5 D-model), tj. model za slučajeve između 2 i 3 dimenzijskog vođenja topline", "jednodimenzijsko vođenje topline"], correct: [2], note: "Ispravljeno: pokretni točkasti izvor na limu konačne debljine δ je model „ravnog sloja“ (2,5D), između 2D i 3D vođenja topline, jer se toplina odbija od donje površine lima. Zbirka je navodila pojednostavljeni 3D model." },
        { q: "Kada je stvarna debljina ploče koja se zavaruje veća od granične debljine (prema Rykalinovoj formuli za graničnu debljinu između 2 i 3 dimenzijskog vođenja topline pri zavarivanju) primjenjuje se:", options: ["trodimenzijski model vođenja topline", "dvodimenzijski model vođenja topline", "granična debljina nema veze sa izborom modela vođenja topline pri zavarivanju", "model se bira prema vrsti dodatnog materijala"], correct: [0], note: "Ako je stvarna debljina veća od granične, lim je debeo i toplina se odvodi u tri smjera, pa se koristi 3D model. Za debljinu manju od granične vrijedi 2D model. Zbirka je ovdje navodila 2D, pa je ključ ispravljen." },
        { q: "Zaokružite ispravne tvrdnje za t8/5:", options: ["t8/5 upravo je proporcionalno sa q/v", "t8/5 upravo je proporcionalno sa δ", "t8/5 obrnuto je proporcionalno sa δ", "t8/5 obrnuto je proporcionalno sa v"], correct: [0, 3], note: "Ispravljeno prema ključu (Samardžić): t8/5 raste s unosom topline q/v, pa je obrnuto proporcionalno brzini v. O debljini δ ovisnost nije jednoznačna: kod 3D odvođenja (debeli lim) t8/5 ne ovisi o δ, a kod 2D (tanki lim) pada s δ², pa ponude s δ nisu općenito točne." },
        { q: "Ako je temperatura predgrijavanja viša, tada će trajanje hlađenja od 800 do 500 °C biti (t8/5):", options: ["duže", "Kraće", "ovisi o kojem se modelu vođenja topline pri zavarivanju radi", "jednako – ne ovisi o predgrijavanju"], correct: [0], note: "Viša temperatura predgrijavanja znači manju razliku temperature između zavara i okoline, pa se spoj sporije hladi i t8/5 je dulje. To vrijedi i za 2D i za 3D model." },
        { q: "Temperatura predgrijavanja ima jači utjecaj na trajanje hlađenja od 800 do 500 °C (t8/5) kod:", options: ["2-dimenzijskog vođenja topline", "3-dimenzijskog modela vođenja topline", "jednako djeluje i kod 2- i 3- dimenzijskog vođenja topline", "ne utječe ni kod jednog modela"], correct: [0], note: "Ključ iz zbirke je 2D. U 2D izrazu temperatura predgrijavanja T0 ulazi kvadratno (članovi 1/(500 − T0)² i 1/(800 − T0)²), pa ista promjena T0 jače produlji t8/5 nego u 3D izrazu. ⚠️ U jednoj pripremi stoji 3D, pa provjeri na slajdu." },
        { q: "Brzina hlađenja zavarenog spoja je veća što je", options: ["unesena toplina manja", "unesena toplina veća", "debljina ploče koja se zavaruje veća", "debljina ploče koja se zavaruje manja"], correct: [0, 2], note: "Spoj se brže hladi kad je unesena toplina manja i kad je ploča deblja (veća masa i tri smjera odvođenja topline)." },
        { q: "Sto je prijelazna temperatura (iz žilavog u krhko stanje) kod općekonstrukcijskog čelika niža, to je:", options: ["zavareni spoj u eksploataciji manje pouzdan s obzirom na krhki lom", "zavareni spoj u eksploataciji pouzdaniji s obzirom na opasnost od krhkog loma", "veća je mogućnost krhkog loma u eksploataciji", "prijelazna temperatura nema veze s krhkim lomom"], correct: [1], note: "Što je prijelazna temperatura niža, čelik ostaje žilav i na nižim radnim temperaturama, pa je spoj pouzdaniji s obzirom na krhki lom." },
        { q: "Kod većine materijala koji se zavaruju najviše poteškoća može se očekivati u", options: ["ZUT-u u području normalizacije", "ZUT-u u području starenja i plavog loma", "u zoni taljenja, odnosno metalu zavara", "ZUT-u u području pogrubljenja zrna, uz \"liniju staljivanja\", odnosno \"područje staljivanja\""], correct: [3], note: "Najviše problema obično je u ZUT-u tik uz liniju staljivanja: tamo je zrno najgrublje, tvrdoća najveća, a žilavost najmanja (hladne pukotine, krhkost)." },
        { q: "\"Linija staljivanja\" (fusion line) predstavlja:", options: ["granicu između zone utjecaja topline i osnovnog materijala", "granicu između osnovnog materijala i zavarenog spoja", "granicu između zone utjecaja topline i zone taljenja (metala zavara)", "granicu između dva susjedna prolaza zavara"], correct: [2], note: "Linija staljivanja je granica između metala zavara (zona taljenja) i ZUT-a." },
        { q: "Stacionarno, odnosno kvazistacionarno temperaturne polje pri zavarivanju javlja se", options: ["na dovoljnoj udaljenosti od mjesta početka i kraja zavara, kada je \"uspostavljena ravnoteža\" između količine odvedene i dovedene topline, uz uvjet q/v=konstantno", "na početku i na kraju zavara", "zbog postavljanja ulazno-izlaznih ili nastavnih pločica", "samo na samom početku zavara"], correct: [0, 2], note: "Kvazistacionarno polje uspostavlja se dovoljno daleko od početka i kraja zavara, kad je q/v konstantno, a ulazno-izlazne pločice pomiču nestacionarni dio izvan radnog komada." },
        { q: "Nestacionarno temperaturno polje pri zavarivanju se javlja", options: ["na početku i na kraju zavara kada nisu postavljene ili nije moguće postaviti ulazno-izlazne ili nastavne pločice", "na dovoljnoj udaljenosti od mjesta početka i kraja zavara, kada je \"uspostavljena ravnoteža\" između količine odvedene i dovedene topline, uz uvjet q/v=konstantno", "pri zavarivanju ka rubu ili od ruba ploče", "samo kod zavarivanja pod praškom"], correct: [0, 2], note: "Nestacionarno polje javlja se na početku i kraju zavara (ako nema ulazno-izlaznih pločica) i pri zavarivanju prema rubu ploče ili od njega, gdje se odvođenje topline mijenja." },
        { q: "Grafit ima:", options: ["slojastu strukturu", "metalno dipolne veze", "dipolno ionske veze", "kovalentno dipolne veze"], correct: [0, 3], note: "Grafit ima slojastu (heksagonsku) strukturu: unutar slojeva su jake kovalentne veze, a između slojeva slabe Van der Waalsove (dipolne). Zato je mekan i dobro maže." },
        { q: "Widmanstaettenova struktura ima:", options: ["visoku istezljivost", "nisku istezljivost", "zaobljena zrna", "iglicasta zrna"], correct: [1, 3], note: "Widmanstättenova struktura ima igličasti ferit nastao iz grubog austenita pri bržem hlađenju; krhka je, s niskom istezljivošću i žilavošću. Uklanja se normalizacijom." },
        { q: "Grafit se ne pojavljuje u:", options: ["metastabilno skrucenim legurama", "stabilno skrucenim legurama", "čeliku", "sivom lijevu"], correct: [0, 2], note: "Ispravljeno: grafita nema u metastabilno skrućenim legurama (ugljik je vezan u Fe3C) ni u čeliku, gdje je ugljik otopljen ili u cementitu. Grafit se pojavljuje pri stabilnom skrućivanju, npr. u sivom lijevu." },
        { q: "Prilikom hlađenja γ-Fe prelazi u α-Fe pri", options: ["770 ºC", "898 ºC", "911 ºC", "1392 ºC"], correct: [1], note: "Zbog histereze pri hlađenju γ-Fe prelazi u α-Fe na nižoj temperaturi (oko 898 °C) nego pri zagrijavanju (911 °C). 770 °C je Curiejeva točka, a 1392 °C prijelaz γ u δ." },
        { q: "Na što najznačajnije utječe brzina hlađenja", options: ["Na ponašanje prilikom pretvorbe iz tekuće u krutninu", "Na pogrubljenje zrna", "Na naprezanja", "Na deformaciju"], correct: [1], note: "Prema ključu zbirke brzina hlađenja najviše utječe na veličinu zrna: brže hlađenje daje više klica kristalizacije i sitnije zrno. Na naprezanja i deformacije također utječe, ali manje izravno." },
        { q: "Prema Uptonovom dijagramu, koji čelici na sobnoj temperaturi sadrže Az (zaostali austenit)", options: ["s 0.3 %C", "s 0.5 %C", "s 0.7 %C", "s 0.9 %C"], correct: [2, 3], note: "Prema Uptonovom dijagramu kod čelika s više od oko 0,6 % C temperatura kraja martenzitne pretvorbe Mf pada ispod sobne, pa nakon gašenja ostaje zaostali austenit. Čelici s 0,3–0,5 % C ga nemaju." },
        { q: "Metalurgija čelika započinje proizvodnjom sirovog željeza uglavnom u visokim pećima od sirovina:", options: ["željezne rude", "metalurškog koksa", "vapna koje je sirovinski dodatak", "sivog sirovog željeza"], correct: [0, 1, 2], note: "Sirovine za visoku peć su željezna ruda, koks (gorivo i redukcijsko sredstvo) i vapnenac (stvara trosku). Sivo sirovo željezo je proizvod visoke peći." },
        { q: "Zone utjecaja topline kod grubozrnatih i finozrnatih čelika su slične u kojem pogledu", options: ["U području visokih temperatura neposredno uz liniju staljivanja, zrna su pogrubljena i približno jednake veličine", "promjene u vlačnoj čvrstoći su približno jednake", "relativno povećanje tvrdoće čelika približno jednakog sastava je praktički jednako", "obje zone pokazuju smanjenje žilavosti od okok 11% u usporedbi s osnovnim stanjem OM"], correct: [0], note: "Tik uz liniju staljivanja i sitnozrnati čelici dobiju grubo zrno, pa su zrna u toj zoni kod obje vrste čelika približno jednako gruba. Ostala svojstva se ne mijenjaju jednako." },
        { q: "Miješanje osnovnog i dodatnog materijala (dilucija) definira se kao(A... Udio DM, B... Udio OM):", options: ["(A+B)/A x 100", "A/(A+B) x 100", "B/(A+B) x 100", "(A+B)/B x 100"], correct: [2], note: "Dilucija (stupanj miješanja) je udio rastaljenog osnovnog materijala u metalu zavara: D = B/(A + B) · 100 %, gdje je B udio osnovnog, a A udio dodatnog materijala." },
        { q: "Atomarni vodik ostaje zarobljen u zavaru nakon što temperatura zavara pri hlađenju padne ispod:", options: ["723 ºC", "910 ºC", "200 ºC", "20 ºC"], correct: [2], note: "Ispod oko 200 °C difuzija vodika postaje vrlo spora, pa atomarni vodik ostaje zarobljen u rešetki. Zato hladne pukotine nastaju ispod te temperature, a dogrijavanje (200–300 °C) pomaže da vodik izađe." },
        { q: "Ekvivalent ugljika Cekv je značajan za procjenu zavarljivosti čelika. Što se s nim može procjenjivati:", options: ["Sklonost strukture ZT prema zakaljivanju", "Sklonost strukture ZUT prema hladnim pukotinama", "Sklonost prema kristalizacijskim i podsolidusnim/likvacijskim toplim pukotinama", "Sklonost čelika prema zakaljivanju"], correct: [1, 3], note: "Cekv procjenjuje zakaljivost čelika i iz nje sklonost ZUT-a hladnim pukotinama. Tople pukotine ovise o S, P i obliku zavara, ne o Cekv." },
        { q: "Koji je od sljedećih izraza formula za ekvivalent ugljika prema IIW (MIZ)?", options: ["Cekv = C + Mn/5 + (Cr + Mo + V)/6 + (Ni + Cu)/15", "Cekv = C + Mn/6 + (Cr + Mo + V)/5 + (Ni + Cu)/15", "Cekv = C + Si/30 + (Mn + Cu + Cr)/20 + Ni/60 + Mo/15 + V/10 + 5B", "Cekv = C + Mn/6 + (Cr + Ni)/5 + (Mo + V + Cu)/15"], correct: [1], note: "IIW (MIZ) formula: Cekv = C + Mn/6 + (Cr + Mo + V)/5 + (Ni + Cu)/15. Zapamti po redu: Mn dijeli 6, Cr-Mo-V dijele 5, Ni-Cu dijele 15. Treći izraz je Pcm (Ito–Bessyo), druga formula za niskougljične čelike, a prvi i četvrti imaju zamijenjene djelitelje ili elemente." },
        { q: "Kod zavarivanja ugljičnih i ugljično-manganskih općih konstrukcijskih čelika najviše vrijednosti tvrdoće se očekuju u", options: ["metalu zavara", "zoni djelomične prekristalizacije", "zoni pogrubljenja zrna u ZUT-u tik uz liniju staljivanja", "zoni normalizacije"], correct: [2], note: "Najveća tvrdoća kod C i C-Mn čelika je u ZUT-u tik uz liniju staljivanja: grubo zrno austenita pri hlađenju daje najviše zakaljene strukture (martenzit, bainit)." },
        { q: "Prijelazna temperatura se snizuje:", options: ["porastom sadržaja C", "porastom sadržaja Mn", "porastom sadržaja Cr", "porastom sadržaja Ni"], correct: [1, 3], note: "Prijelaznu temperaturu snizuju Ni (najviše) i Mn (te sitno zrno). C, P, Si i (u većoj mjeri) Cr je povisuju." },
        { q: "Poboljšani sitnozrnati čelici spadaju u:", options: ["opće konstukcijske čelike", "čelike povišene čvrstoće", "čelike visoke čvrstoće", "ultračvrste čelike"], correct: [2], note: "Poboljšani sitnozrnati čelici (Re oko 500–1000 N/mm², npr. S690Q) spadaju u čelike visoke čvrstoće. Normalizirani sitnozrnati su čelici povišene čvrstoće, a ultračvrsti imaju Re iznad 1000 N/mm²." },
        { q: "Normalizirani sitnozrnati čelici u strukturi sadrže:", options: ["Ferit", "Perlit", "Bainit", "Martenzit"], correct: [0, 1], note: "Normalizirani sitnozrnati čelici imaju feritno-perlitnu strukturu sa sitnim zrnom. Bainit i martenzit nastaju tek pri bržem hlađenju (poboljšani čelici)." },
        { q: "Kod termomehaničke obrade deformacija se odvija", options: ["prije pretvorbe strukturne faze", "za vrijeme strukturne pretvorbe", "poslije strukturne pretvorbe", "bez pretvorbi strukturnih faza"], correct: [0, 1], note: "Kod termomehaničke obrade deformacija se odvija prije ili za vrijeme fazne pretvorbe, tako da pretvorba krene iz deformiranog, sitnozrnatog austenita." },
        { q: "Postupak perliforming primjenjuje se za", options: ["nelegirane čelike", "nelegirane čelike sa sadržajem ugljika većim od 3%", "visokolegirane čelike", "superlegirane čelike"], correct: [0], note: "Perliforming (deformacija za vrijeme perlitne pretvorbe) primjenjuje se za nelegirane i niskolegirane konstrukcijske čelike. Čelik s više od 3 % C ne postoji (to je lijev)." },
        { q: "Martenzitni nerđajući čelici", options: ["9-10%Cr i 2-3%Ni", "14-17%Cr i 4-6%Ni", "10-12%Cr i 10-12%Ni", "12-13%Cr i 8-9%Ni"], correct: [1], note: "Ključ iz zbirke: mekomartenzitni nehrđajući čelici imaju oko 13–17 % Cr i 4–6 % Ni, uz vrlo malo ugljika (npr. X3CrNiMo13-4)." },
        { q: "Grubozrnata struktura nije povoljna kod", options: ["puzanja", "umora", "korozije", "trošenja"], correct: [1, 2, 3], note: "Grubo zrno je povoljno samo kod puzanja (manje granica zrna za klizanje). Kod umora, korozije i trošenja bolje je sitno zrno." },
        { q: "Pri uporabi čelika u tehnikama dubokog hlađenja (-85 ºC do -196 ºC) mogu/može se upotrijebiti:", options: ["Č0563", "čelici legirani s 5 do 9% Ni", "austenitni čelici", "ST 355 J2G3"], correct: [1, 2], note: "Za duboko hlađenje (−85 do −196 °C) koriste se čelici s 5–9 % Ni (9 % Ni za LNG) i austenitni čelici. Obični konstrukcijski čelici (S355J2, Č0563) postaju krhki." },
        { q: "Čelici koji se koriste za niske temperature su:", options: ["niskolegirani Cr-Mo čelici", "nesmireni", "austenitni čelici ili čelici legirani s Ni", "niskolegirani C-Mn čelici"], correct: [2], note: "Za niske temperature koriste se austenitni čelici (FCC, bez prijelaza u krhko stanje) i čelici legirani s Ni. CrMo čelici su za visoke temperature, a nesmireni čelici su krhki." },
        { q: "Za koju vrstu korozije, proces ovisi isključivo o vrsti materijala i okolišu", options: ["opća korozija (hrđanje)", "korozija u procjepu potaknuta naprezanjem", "korozija u procjepu potaknuta lužnatim medijima", "korozijski umor"], correct: [0], note: "Opća (ravnomjerna) korozija ovisi samo o materijalu i okolišu. Korozija uz naprezanje, korozijski umor i korozija u procjepu traže i dodatne uvjete (naprezanje, geometriju)." },
        { q: "Hrđanje ugljičnog čelika u vodi uzrokuje", options: ["voda s otopljenim kisikom", "sama voda", "HCl otopljen u vodi", "NaOH otopljen u vodi"], correct: [0, 1, 2], note: "Ispravljeno: hrđanje ugljičnog čelika u vodi uzrokuju voda (elektrolit), otopljeni kisik i kiseline (HCl). Lužnata otopina (NaOH) pasivizira čelik i usporava hrđanje." },
        { q: "Na mehanička svojstva pri povišenim temperaturama povoljno utječe", options: ["feritna struktura", "austenitna sutruktura", "sitnije zrno", "krupnije zrno"], correct: [1, 3], note: "Ispravljeno: na visokim temperaturama povoljni su austenitna struktura (FCC, sporija difuzija, veća otpornost na puzanje) i krupnije zrno (manje granica zrna). Zbirka je navodila samo krupnije zrno, iako njen komentar spominje austenitne vatrootporne čelike." },
        { q: "Super 12% Cr čelici toplinski se obrađuju", options: ["normalizacijom", "poboljšavanjem", "žarenjem", "sferodizacijom"], correct: [1], note: "Super 12 % Cr čelici (npr. X20CrMoV12-1) toplinski se obrađuju poboljšavanjem: kaljenje i visokotemperaturno popuštanje daju popušteni martenzit otporan na puzanje." },
        { q: "Mehanička svojstva superlegura postižu se precipitacijom", options: ["martenzita", "bainita", "karbida", "intermetalnih spojeva"], correct: [2, 3], note: "Ni superlegure dobivaju čvrstoću na visokim temperaturama precipitacijom intermetalnih spojeva (γ′, Ni3(Al,Ti)) i karbida. Martenzit i bainit su strukture čelika." },
        { q: "Najlošiju kompatibilnost na osnovi kristalne strukture ima tribološki par s rešetkama:", options: ["BCC/BCC", "FCC/FCC", "BCC/FCC", "HCP/HCP"], correct: [1], note: "FCC/FCC par ima najlošiju tribološku kompatibilnost (najveća sklonost adheziji), jer FCC ima mnogo kliznih sustava i lako se hladno zavaruje u dodiru. HCP/HCP par ima najbolju kompatibilnost." },
        { q: "Kakav je odnos tvrdoća kod nulte abrazije", options: ["tvrdoća abraziva je veća od tvrdoće površine", "tvrdoća abraziva je manja od tvrdoće površine", "tvrdoća abraziva i tvrdoća površine su jednaki", "tvrdoća abraziva je veća od tvrdoće jedne faze površine"], correct: [1], note: "Kod „nulte abrazije“ abraziv je mekši od površine, pa je ne može zarezati; trošenje je zanemarivo." },
        { q: "Modificiranje i prevlačenje površina može se provesti", options: ["mehaničkim procesima", "toplinskim procesima", "kemijskim i elektrokemijskim procesima", "kombinacijom dva i više gore navedenih procesa"], correct: [0, 1, 2, 3], note: "Površina se može modificirati i prevlačiti mehaničkim, toplinskim, kemijskim i elektrokemijskim procesima te njihovim kombinacijama." },
        { q: "Sivi lijev ima slijedeća svojstva", options: ["izvrsno prigušuje vibracije", "dobru vlačnu čvrstoću", "dobru tlačnu čvrstoću", "dobru dinamičku izdržljivost"], correct: [0, 2], note: "Sivi lijev (listićavi grafit) izvrsno prigušuje vibracije i ima dobru tlačnu čvrstoću. Listići grafita djeluju kao zarezi, pa su mu vlačna čvrstoća i dinamička izdržljivost slabe." },
        { q: "Nodularni lijev u odnosu na sivi lijev ima bolja svojstva", options: ["prigušivanje vibracija", "vlačnu čvrstoću", "tlačnu čvrstoču", "dinamičku izdržljivost"], correct: [1, 3], note: "Ispravljeno: nodularni lijev zbog kuglastog grafita (bez oštrih zareza) ima znatno bolju vlačnu čvrstoću i dinamičku izdržljivost od sivog lijeva. Tlačnu čvrstoću i sivi lijev ima vrlo dobru (listići se pod tlakom zatvaraju), a vibracije bolje prigušuje sivi lijev." },
        { q: "Perlitni u odnosu prema feritnom nodularnom lijevu ima", options: ["manju čvrstoću", "veću čvrstoću", "bolju zakaljivost", "manju duktilnost"], correct: [1, 3], note: "Perlitni nodularni lijev ima veću čvrstoću i tvrdoću, a manju duktilnost od feritnog nodularnog lijeva." },
        { q: "Toplinskom obradom nije moguće očvrsnuti", options: ["mjedi", "aluminijevu broncu", "berilijevu broncu", "Cu-Ni legure"], correct: [0, 3], note: "Ispravljeno: toplinskom obradom ne mogu se očvrsnuti mjedi i Cu-Ni legure (očvršćuju se samo hladnom deformacijom). Berilijeva bronca očvrsne precipitacijski, a aluminijske bronce s više od oko 9 % Al mogu se kaliti (martenzitna pretvorba)." },
        { q: "Najbolje su hladno deformabilne:", options: ["monofazne Cu legure", "dvofazne legure s intermetalnim spojem", "Cu-Ni legure", "dvofazne legure"], correct: [0], note: "Jednofazne (monofazne) Cu legure, npr. α-mjed, imaju FCC rešetku i najbolje se hladno oblikuju. Dvofazne legure se obrađuju u toplom stanju." },
        { q: "Poteškoća povezana sa zavarivanjem Ni-legura je uglavnom", options: ["zakaljivost", "smanjenje žilavosti", "hladne pukotine", "poroznost"], correct: [3], note: "Prema ključu zbirke glavna poteškoća kod Ni legura je poroznost (osjetljivost na nečistoće i plinove); uz nju su važne i tople pukotine. Ni legure nisu zakaljive pa nema hladnih pukotina." },
        { q: "Nakon zavarivanja aluminijskih legura, korozijske pojave posebno su prisutne", options: ["u osnovnom materijalu", "u metalu zavara", "u ZUT-u", "u ZUT-u i osnovnom materijalu"], correct: [1], note: "Prema Temi 2.20 kod zavarenih Al legura korozija je najizraženija u metalu zavara, zbog lijevane strukture i razlike u sastavu prema osnovnom materijalu." },
        { q: "Odaberi zavarljivu Al leguru iz serije 7XXX:", options: ["7095", "7075", "7003", "7005"], correct: [2, 3], note: "Većina 7xxx legura (7075, 7095) nije zavarljiva zbog toplih pukotina i napetosne korozije. Iznimke su 7003 i 7005 (Al-Zn-Mg bez Cu)." },
        { q: "Al-Mg-5 legura je", options: ["toplinski obradiva", "toplinski neobradiva", "prikladna za očvršćavanje hladnom deformacijom", "prikladna za lijevanje"], correct: [1, 2], note: "AlMg5 (serija 5xxx) je toplinski neobradiva i očvršćuje hladnom deformacijom. Dobro se zavaruje, a koristi se kao gnječena, ne lijevana legura." },
        { q: "Svako pa i najmanje naprezanje kojem je izloženo čvrsto tijelo izaziva njegovu deformaciju. Ta se deformacija može odvijati", options: ["elastično", "viskoelastično", "kristalno-plastično", "viskozno (staklo-plastično)"], correct: [0, 1, 2, 3], note: "Ispravljeno prema literaturi (FSB, Nauka o materijalima): deformacija čvrstog tijela može biti elastična, viskoelastična (ovisna o vremenu, polimeri), kristalno-plastična (klizanje dislokacija u metalima) i viskozna (tečenje stakla i amorfnih tvari). Zbirka je navodila samo elastičnu." },
        { q: "Wohlerov dijagram daje podatak o dinamičkoj izdržljivosti nekog materijala za", options: ["samo jedan tip promjenjivog naprezanja", "različite tipove promjenjivog naprezanja", "samo jedan tip promjenjivog naprezanja uy granični broj ciklusa od 10³ titraja", "različite tipove promjenjivog naprezanja uy granični broj ciklusa od 10³ titraja"], correct: [0], note: "Wöhlerov dijagram daje dinamičku izdržljivost za jedan tip promjenjivog naprezanja (jedan omjer R). Za različite tipove naprezanja služe Smithov i Haighov dijagram." },
        { q: "Poluumireni odnosno umireni čelici dobivaju se:", options: ["Dodavanjem dezoksidanta (Al)", "Dodavanjem dezoksidanta (Cr)", "Dodavanjem Mn", "Dodavanjem Si"], correct: [0, 2, 3], note: "Ispravljeno: poluumireni i umireni čelici dobivaju se dezoksidacijom s Mn, Si i Al (Al za potpuno umirene). Cr nije dezoksidans za umirivanje." },
        { q: "Linearna ovisnost između naprezanja i deformacije definirana je:", options: ["Hookeovim zakonom", "Woehlerovim dijagramom", "Smithovim dijagramom", "Schaefflerovim dijagramom"], correct: [0], note: "Linearnu ovisnost naprezanja i deformacije u elastičnom području opisuje Hookeov zakon (σ = E · ε)." },
        { q: "Dvije metalografske faze mogu predstavljati kristalne strukture koje su", options: ["segregirane", "nekoherentne", "granice dvojčenja", "koherentne"], correct: [1, 3], note: "Granica između dviju faza može biti koherentna (rešetke se nastavljaju) ili nekoherentna (između je polukoherentna). Segregacija i dvojnici nisu tipovi međufazne granice." },
        { q: "Najčešće kristalne rešetke metala su", options: ["HCP", "FCC", "BCC", "Tetragonska"], correct: [0, 1, 2], note: "Najčešće rešetke metala su BCC (Fe-α, Cr, W), FCC (Al, Cu, Ni, Fe-γ) i HCP (Ti, Mg, Zn). Tetragonska rešetka je rijetka (npr. martenzit)." },
        { q: "Najbolju sposobnost za plastičnu deformaciju ima kristalna rešetka", options: ["HCP", "FCC", "BCC", "Tetragonska"], correct: [1], note: "FCC rešetka ima najviše gusto složenih kliznih sustava (12), koji su i lako pokretljivi, pa ima najbolju sposobnost plastične deformacije (Al, Cu, austenit)." },
        { q: "Koji od navedenih elemenata potiču nastajanje austenita", options: ["Cr", "Mn", "Mo", "Ni"], correct: [1, 3], note: "Austenit stabiliziraju γ-geni elementi: Ni, Mn, Co, Cu, C, N. Cr i Mo su α-geni (stabiliziraju ferit)." },
        { q: "Metalnu atomsku vezu karakterizira", options: ["slobodni elektroni", "dobra vodljivost topline i elektriciteta", "izolacijska svojstva", "razmjena elektrona"], correct: [0, 1], note: "Kod metalne veze valentni elektroni su slobodni („elektronski plin“), pa metali dobro vode toplinu i elektricitet. Razmjena elektrona je ionska veza, a izolacijska svojstva imaju kovalentni i ionski materijali." },
        { q: "Metali su kemijski elementi koji", options: ["imaju mali broj elektrona u vanjskoj ljusci (<4)", "imaju veliki broj elektrona u vanjskoj ljusci (>4)", "tvore anione", "tvore katione"], correct: [0, 3], note: "Metali imaju mali broj valentnih elektrona (manje od 4) koje lako otpuštaju, pa tvore pozitivne ione (katione)." },
        { q: "Međuatomske veze u grafitu su", options: ["kovalentne i Wan der Waalsove", "Metalne", "Ionske", "metalne i ionske"], correct: [0], note: "U grafitu su atomi unutar slojeva povezani jakim kovalentnim vezama, a slojevi međusobno slabim Van der Waalsovim vezama." },
        { q: "Pri kaljenju čelika događa se", options: ["neravnotežna pretvorba", "ravnotežna pretvorba", "potpuna difuzija", "onemogućena difuzija"], correct: [0, 3], note: "Ispravljeno: kaljenje je neravnotežna pretvorba u kojoj je difuzija onemogućena (prebrzo hlađenje), pa ugljik ostane zarobljen u martenzitu. Zbirka je ovdje navodila samo neravnotežnu pretvorbu, a u drugoj verziji istog pitanja oba odgovora." },
        { q: "Martenzit nastaje", options: ["na temperaturi A1", "na temperaturi A3", "Između Ms i Mf", "između likvidusa i solidusa"], correct: [2], note: "Martenzit nastaje pri hlađenju između temperature početka (Ms) i kraja (Mf) martenzitne pretvorbe. A1 i A3 su ravnotežne temperature pretvorbi." },
        { q: "Martenzit ima", options: ["FCC", "Prostorno centriranu tetragonalnu rešetku (BCT)", "visoku tvrdoću", "visoku žilavost"], correct: [1, 2], note: "Martenzit ima prostorno centriranu tetragonsku (BCT) rešetku, prezasićenu ugljikom, pa je vrlo tvrd i krhak (niska žilavost)." },
        { q: "Kada se zavaruje S355, ubičajeno je izvesti predgrijavanje ako je", options: ["debljina materijala manja od 20mm", "debljina materijala veća od 25mm", "okolišna temperatura iznad 20 ºC", "okolišna temperatura ispod 0 ºC"], correct: [1, 3], note: "Prema uobičajenoj praksi S355 se predgrijava kod debljina iznad oko 25 mm i kad je okolišna temperatura ispod 0 °C (tada se barem uklanja vlaga). Tanki lim na sobnoj temperaturi ne treba predgrijavanje." },
