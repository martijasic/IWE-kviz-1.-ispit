        { q: "Zavarivanje Al i Al-legura. Odabrati točnu(e) tvrdnju(e):", options: ["pri zavarivanju legura s više od 2 % magnezija treba izbjegavati dodatne materijale sa silicijem, jer nastaje intermetalni spoj Mg₃Si koji znatno snizuje žilavost spoja", "pri zavarivanju komada čija je temperatura u eksploataciji viša od 65 °C treba izbjegavati dodatne materijale grupe 5xxx s više od 5 % magnezija, jer može nastati spoj Al₂Mg koji uzrokuje napetosnu koroziju", "ako se legure grupe 5xxx s manje od 2 % magnezija zavaruju istovrsnim dodatnim materijalom, vjerojatne su hladne pukotine, pa se preporučuje dodatni materijal s više magnezija (npr. AlMg5)", "pri zavarivanju legura 7xxx dodatni materijal 5039 može pospješiti precipitacijsko očvrsnuće uz malo miješanje"], correct: [0, 1, 3], note: "Legure s više od 2 % Mg ne zavaruju se dodatnim materijalom sa Si (krhki Mg2Si). Iznad 65 °C izbjegava se dodatni materijal s više od 5 % Mg (β-faza Al-Mg, napetosna korozija). Za seriju 7xxx koristi se 5039 uz malo miješanje. Kod niskog Mg prijete tople, a ne hladne pukotine." },
        { q: "Kako mangan utječe na svojstva legure AlMg3?", options: ["smanjuje i vlačnu čvrstoću i sklonost toplim pukotinama", "omogućuje bolju zaštitu taline i u konačnici bolji izgled zavara", "povećava vlačnu čvrstoću bez utjecaja na korozijsku postojanost", "smanjuje vlačnu čvrstoću uz povećanje sklonosti toplim pukotinama"], correct: [2], note: "Mangan u AlMg3 povećava vlačnu čvrstoću (očvrsnuće mješancima i disperzoidima), a korozijsku postojanost ne pogoršava." },
        { q: "Aluminij i Al-legure:", options: ["primjenjuju se prije svega zbog visoke vlačne čvrstoće", "imaju talište niže od 700 °C", "mogu se zavarivati samo postupcima velike gustoće energije (npr. EBW)", "skloni su poroznosti zbog velike količine plinova otopljenih i zarobljenih pri skrućivanju taline"], correct: [1, 3], note: "Aluminij se tali na 660 °C (legure i niže) i sklon je poroznosti jer vodik, otopljen u talini, ostaje zarobljen pri brzom skrućivanju. Ne koristi se zbog visoke čvrstoće nego zbog male gustoće, i zavaruje se i običnim postupcima (TIG, MIG)." },
        { q: "Poroznost pri elektrolučnom zavarivanju Al i Al-legura u zaštitnom plinu:", options: ["nastaje zbog razlike u topljivosti vodika u tekućem i čvrstom stanju", "posljedica je brzog skrućivanja metala zavara", "može nastati zbog vlage u području zavara", "može se izbjeći uporabom čistog He kao zaštitnog plina"], correct: [0, 1, 2], note: "Poroznost Al nastaje jer je topljivost vodika u talini mnogo veća nego u krutom stanju, a brzo skrućivanje ga zarobi. Izvor vodika je vlaga. Čisti He to ne može spriječiti." },
        { q: "Kako toplina zavarivanja djeluje na osnovni materijal (Al-legure)?", options: ["kod hladno očvrsnutih materijala može doći do rekristalizacije", "grubo zrno može se usitniti nekom vrstom normalizacije", "kod toplinski očvrstivih legura čvrstoća se smanjuje zbog koalescencije precipitata", "korozijska postojanost dramatično se smanjuje"], correct: [0, 2], note: "Toplina zavarivanja kod hladno očvrsnutih Al-legura izaziva rekristalizaciju (omekšanje), a kod toplinski očvrstivih okrupnjavanje (koalescenciju) precipitata, pa čvrstoća pada. Aluminij nema faznu pretvorbu, pa normalizacija nije moguća." },
        { q: "Koje greške pri zavarivanju aluminija mogu nastati zbog oksidnog sloja na površini dijela?", options: ["naljepljivanje (nedovoljno spajanje)", "uključci oksida", "poroznost", "tople pukotine"], correct: [0, 1, 2], note: "Oksidni sloj Al2O3 (talište oko 2050 °C) uzrokuje naljepljivanje (nedovoljno spajanje), uključke oksida i poroznost (oksid veže vlagu). Tople pukotine ovise o sastavu i oblikovanju spoja." },
        { q: "Koja je toplinska obrada potrebna za povećanje čvrstoće precipitacijski očvrstivih Al-legura?", options: ["rekristalizacijsko žarenje", "dozrijevanje (prirodno, umjetno)", "žarenje za oporavak", "poboljšavanje (kaljenje i popuštanje)"], correct: [1], note: "Precipitacijski očvrstive Al-legure (2xxx, 6xxx, 7xxx) očvršćuju dozrijevanjem (prirodnim ili umjetnim) nakon rastvornog žarenja i gašenja." },
        { q: "Kod zavarivanja Al-legura mogućnost pojave toplih pukotina može se smanjiti:", options: ["pravilnim oblikovanjem zavarenog spoja", "primjenom odgovarajuće tehnologije zavarivanja", "pravilnim odabirom dodatnog materijala", "dodavanjem do 10 % CO₂ u zaštitnu plinsku mješavinu kod MIG zavarivanja"], correct: [0, 1, 2], note: "Tople pukotine Al-legura smanjuju se pravilnim oblikovanjem spoja, odgovarajućom tehnologijom zavarivanja i pravilnim odabirom dodatnog materijala (npr. 4043 ili 5356). CO2 se nikada ne dodaje zaštitnom plinu za Al." },
        { q: "Kolika je približno temperatura taljenja čistog aluminija?", options: ["460 °C", "2050 °C", "660 °C", "1083 °C"], correct: [2], note: "Čisti aluminij se tali na oko 660 °C. 2050 °C je talište Al2O3, a 1083 °C talište bakra." },
        { q: "Titan i ostali metali i legure. Odabrati točnu(e) tvrdnju(e):", options: ["izvrsna korozijska postojanost Ti, Ta i Zr prema mnogim agresivnim kemikalijama, pri povišenom tlaku i temperaturi, posljedica je gustog oksidnog pasivnog sloja na površini materijala", "Ti ima izvrsnu otpornost na oksidirajuće medije; otpornost na kloride omogućuje njegovu primjenu u morskoj vodi i na offshore objektima, a korozijska postojanost nedostatna je u zagrijanim neoksidirajućim medijima kao što su solna i sumporna kiselina niskog pH", "proizvodni troškovi i troškovi prerade Ti više nisu visoki, pa je danas uporaba Ti i Ti-legura posve uobičajena u metaloprerađivačkoj industriji", "Mg i Mg-legure moguće je zavariti samo elektronskim mlazom, plazmom i laserom"], correct: [0, 1], note: "Ti, Ta i Zr su korozijski postojani zbog gustog pasivnog oksidnog sloja. Ti je otporan na oksidirajuće medije i kloride (more, offshore), ali ne na vruće neoksidirajuće kiseline. Titan je još uvijek skup, a Mg-legure zavaruju se i TIG-om i MIG-om." },
        { q: "Titan i ostali metali i legure. Odabrati točnu(e) tvrdnju(e):", options: ["glavna poteškoća pri zavarivanju Ti, Ta i Zr je ulazak plinova (O, N, H) u talinu pri povišenim temperaturama, što uzrokuje krhkost", "Mg-legure imaju toplinsku vodljivost jednaku ili malo veću od konstrukcijskog čelika; kao i Al-legure, imaju nisko talište i veliku toplinsku rastezljivost", "uporabom He kao zaštitnog plina pri MIG zavarivanju titana u potpunosti se može eliminirati pojava poroznosti", "tantal se može kvalitetno zavariti samo elektronskim mlazom"], correct: [0, 1], note: "Kod Ti, Ta i Zr glavni problem je ulazak O, N i H u talinu pri visokim temperaturama (krhkost). Mg-legure imaju toplinsku vodljivost sličnu ili malo veću od čelika i, kao Al, nisko talište i veliku toplinsku rastezljivost. He ne uklanja poroznost potpuno, a tantal se zavaruje i TIG-om i elektrootporno." },
        { q: "Koje tehnološke mjere treba uzeti u obzir pri zavarivanju titana?", options: ["plinsku zaštitu taline (i zavara) sve dok se ne ohladi ispod 500 °C", "zavarivanje s velikom talinom i plinskom zaštitom", "jednoslojno zavarivanje bez dodatne plinske zaštite", "višeslojno zavarivanje bez dodatne plinske zaštite"], correct: [0], note: "Titan treba štititi plinom (s lica i korijena) sve dok se ne ohladi ispod oko 500 °C (prema nekim izvorima 400 °C), jer na višoj temperaturi upija O i N i postaje krhak." },
        { q: "Pri zavarivanju titana i njegovih legura nastanak krhkih faza povećava se ako:", options: ["je brzina hlađenja mala", "je temperatura predgrijavanja niska", "u osnovnom materijalu nastaju intermetalni spojevi", "nastaje grubozrnata struktura"], correct: [0, 2], note: "Ključ međunarodne banke: krhke faze kod Ti i Ti-legura nastaju lakše pri sporom hlađenju (dulje vrijeme na visokoj temperaturi, izlučivanje faza) i ako u osnovnom materijalu nastaju intermetalni spojevi." },
        { q: "Koje se moguće greške uočavaju pri TIG zavarivanju komercijalno čistog titana?", options: ["pukotine ispod zavara", "lamelarno odvajanje", "poroznost", "onečišćenje zrakom"], correct: [2, 3], note: "Kod TIG zavarivanja komercijalno čistog titana tipične greške su poroznost i onečišćenje zrakom (O, N), koje se vidi po boji. Lamelarno odvajanje i pukotine ispod zavara nisu tipične." },
        { q: "Koje se promjene uočavaju kad se titan drži na zraku pri višoj temperaturi (iznad 600 °C)?", options: ["boja površine mijenja se s vremenom držanja: zlatna, plava, siva, bijela", "duktilnost se smanjuje s vremenom držanja", "boja površine ne mijenja se", "sadržaj O i N u titanu raste s vremenom držanja"], correct: [0, 1, 3], note: "Kad se titan drži na zraku iznad oko 600 °C, upija O i N: boja površine mijenja se od zlatne preko plave i sive do bijele, a duktilnost pada." },
        { q: "Na što treba posebno paziti pri TIG zavarivanju titana?", options: ["treba koristiti produženu (vučenu) plinsku zaštitu iza pištolja", "žlijeb treba očistiti četkom ili otapalom neposredno prije zavarivanja", "žlijeb treba obrusiti brusilicom neposredno prije zavarivanja", "elektroda treba biti na plus polu radi učinka čišćenja luka"], correct: [0, 1], note: "Kod TIG zavarivanja titana koristi se produžena (vučena) plinska zaštita iza pištolja, a žlijeb se čisti četkom od nehrđajućeg čelika ili otapalom neposredno prije zavarivanja. Brusna ploča onečišćuje površinu, a TIG titana radi s elektrodom na minus polu." },
        { q: "Zavarivanje raznorodnih čelika. Odabrati točnu(e) tvrdnju(e):", options: ["Schaefflerov dijagram služi za grafičko određivanje temperature predgrijavanja radi izbjegavanja hladnih pukotina", "Schaefflerov dijagram može se upotrijebiti samo za međusobno zavarivanje visokolegiranih nehrđajućih i nelegiranih (konstrukcijskih) čelika", "na apscisi Schaefflerova dijagrama je Cr-ekvivalent, a na ordinati Ni-ekvivalent", "u Schaefflerovu dijagramu prikazane su, među ostalim, i linije udjela ferita (%)"], correct: [2, 3], note: "Na apscisi Schaefflerova dijagrama je Cr-ekvivalent, a na ordinati Ni-ekvivalent; u dijagramu su i linije udjela ferita. Ne služi za određivanje predgrijavanja i koristi se za različite kombinacije čelika." },
        { q: "Zavarivanje raznorodnih čelika. Odabrati točnu(e) tvrdnju(e):", options: ["na ordinati Schaefflerova dijagrama je Cr-ekvivalent, a na apscisi Ni-ekvivalent", "Schaefflerov dijagram može se upotrijebiti samo za međusobno zavarivanje različitih visokolegiranih nehrđajućih čelika", "jedan od problema pri zavarivanju raznorodnih čelika je migracija ugljika", "posljedice migracije ugljika: u zoni osiromašenoj ugljikom čvrstoća je manja, a u zoni obogaćenoj ugljikom nastaju karbidi, raste čvrstoća i smanjuje se istezljivost"], correct: [2, 3], note: "Kod raznorodnih spojeva ugljik migrira (iz nelegiranog u visokolegirani čelik): zona osiromašena ugljikom ima manju čvrstoću, a u obogaćenoj nastaju karbidi, raste čvrstoća i pada istezljivost. U Schaefflerovu dijagramu Cr-ekvivalent je na apscisi." },
        { q: "Miješanje (dilucija) se povećava povećanjem:", options: ["udjela legirnih elemenata", "napona zavarivanja", "jakosti struje zavarivanja", "brzine zavarivanja"], correct: [1, 2], note: "Ključ međunarodne banke: miješanje (udio rastaljenog osnovnog materijala u zavaru) raste s većom strujom (dublje protaljivanje) i većim naponom (širi luk i talina). Veća brzina zavarivanja i udio legirnih elemenata ga ne povećavaju." },
        { q: "Koji „parametar” treba biti pod kontrolom za pravilno taljenje raznorodnih materijala i dodatnog materijala?", options: ["unos topline", "miješanje", "priprema žlijeba", "postupak zavarivanja"], correct: [1], note: "Kod raznorodnih spojeva najvažnije je kontrolirati miješanje (diluciju), jer o njemu ovisi sastav, a time i struktura metala zavara (Schaefflerov dijagram)." },
        { q: "Zupčanik reduktora turbine: vijenac sa zubima i glavčina izrađeni su od čelika povišene čvrstoće (0,45 % C; 0,37 % Si; 0,8 % Mn; 1,1 % Cr), a spojni diskovi od niskougljičnog nelegiranog čelika. Navarivanje glavčine dodatnim materijalom za niskougljični nelegirani čelik, prije zavarivanja diskova s glavčinom, provodi se radi:", options: ["smanjenja napetosti", "povećanja otpornosti na habanje (trošenje)", "smanjenja sklonosti pucanju", "izvedbe završnog zavara bez toplinske obrade"], correct: [2, 3], note: "Ispravljeno: glavčina od zakaljivog čelika (0,45 % C, Cr) prvo se navari (buttering) niskougljičnim dodatnim materijalom. Sloj se po potrebi toplinski obradi, a završni zavar s diskovima onda se izvodi na mekom sloju, bez opasnosti od pukotina i bez toplinske obrade. Navarivanje mekim dodatnim materijalom ne povećava otpornost na trošenje." },
        { q: "Kako se naziva dijagram prikazan na slici (dijagram s gotovo paralelnim linijama ferit-broja FN, nagnutima pod oko 45°)?", options: ["Schaefflerov dijagram", "Siewert-Kotecki dijagram", "De Longov dijagram", "WRC-1992 dijagram"], correct: [3], note: "Dijagram s gotovo paralelnim linijama ferit-broja (FN) nagnutima pod oko 45° je WRC-1992 dijagram. Schaefflerov ima linije % ferita koje se šire, a De Longov pokriva samo uži dio." },
        { q: "Zavarivanje Ni-legura s čelicima moguće je izvoditi:", options: ["kod zavarivanja Monela s čelikom elektrolučnim postupcima, elektrodom tipa Monel", "kod zavarivanja Inconela s čelikom elektrolučnim postupcima, elektrodom tipa Inconel", "bilo kojom elektrodom na bazi Ni", "isključivo elektrodom od nelegiranog čelika"], correct: [0, 1], note: "Ni-legure zavaruju se s čelikom elektrodom istog tipa kao legura: Monel elektrodom tipa Monel, a Inconel elektrodom tipa Inconel. Ne odgovara bilo koja Ni elektroda, a pogotovo ne nelegirana čelična." },
        { q: "Statički vlačni pokus. Odabrati točnu(e) tvrdnju(e):", options: ["Rp0,2 ovisi o krutosti sustava", "Rp0,2 ovisi o brzini opterećivanja", "mehanička svojstva realnih materijala mogu se točno izračunati iz teorijskog smičnog naprezanja potrebnog za posmicanje kristalnih ravnina idealnog kristala i koeficijenata koji opisuju nepravilnosti kristalne strukture", "presjek ispitnog uzorka smije biti kružan, kvadratičan, pravokutan ili prstenast, a u posebnim slučajevima i drugog oblika"], correct: [0, 1, 3], note: "Rp0,2 ovisi o krutosti ispitnog sustava i brzini opterećivanja. Presjek epruvete može biti kružni, kvadratni, pravokutni ili prstenasti. Mehanička svojstva realnih materijala ne mogu se točno izračunati iz teorijske čvrstoće idealnog kristala, nego se određuju pokusom." },
        { q: "Hookeovim zakonom ne naziva se izraz:", options: ["σ = E · ε", "σ = E / ε", "σ = E² · ε", "σ = E · ε²"], correct: [1, 2, 3], note: "Pazi na negaciju. Hookeov zakon je σ = E · ε. Izrazi σ = E/ε, σ = E²·ε i σ = E·ε² nisu Hookeov zakon, pa su to točni odgovori." },
        { q: "Vlačnim ispitivanjem čelika mogu se izmjeriti:", options: ["udarni rad loma", "lomna žilavost", "granica razvlačenja", "istezljivost"], correct: [2, 3], note: "Vlačnim pokusom mjere se granica razvlačenja, vlačna čvrstoća, istezljivost i kontrakcija. Udarni rad loma mjeri se Charpyjevim batom, a lomna žilavost posebnim ispitivanjem." },
        { q: "Kako se mijenja granica razvlačenja konstrukcijskog čelika S235 s povišenjem radne temperature?", options: ["raste do 320 °C, a zatim pada", "pada s povišenjem temperature", "ostaje stalna do 300 °C, a zatim pada", "raste s povišenjem temperature"], correct: [1], note: "Granica razvlačenja konstrukcijskog čelika S235 pada s porastom temperature. Vlačna čvrstoća može malo porasti oko 200–300 °C (plavi lom), ali granica razvlačenja ne." },
        { q: "Nisu svi čelici zavarljivi u normalnim uvjetima. Kako se zavarljivost čelika može eksperimentalno provjeriti?", options: ["vlačnim ispitivanjem", "tlačnim ispitivanjem", "navari se sloj, a zatim se uzorak ispituje savijanjem", "ispitivanjem materijala na umor"], correct: [2], note: "Zavarljivost se jednostavno provjerava tako da se navari sloj, a uzorak se savija (proba savijanjem navara): pucanje u ZUT-u pokazuje lošu zavarljivost." },
        { q: "Cilj vlačnog ispitivanja je:", options: ["ocijeniti strukturu materijala", "ocijeniti neka mehanička svojstva materijala", "kvantitativno ocijeniti kemijski sastav materijala", "ocijeniti neka kemijska svojstva materijala"], correct: [1], note: "Cilj vlačnog ispitivanja je odrediti neka mehanička svojstva materijala: Re ili Rp0,2, Rm, A, Z i E." },
        { q: "Kolika je najveća razina tvrdoće HV10 za C-Mn čelik radi sprječavanja pukotina?", options: ["450 HV10", "350 HV10", "300 HV10", "500 HV10"], correct: [1], note: "Uobičajena granica tvrdoće ZUT-a C-Mn čelika za izbjegavanje hladnih pukotina je 350 HV10. ISO 15614-1 za S355 bez toplinske obrade dopušta najviše 380 HV10." },
        { q: "Dva komada čelika 42CrMo4 različitog podrijetla i nepoznate obrade imaju jednaku izmjerenu tvrdoću (250 HV30). Nužno ćete utvrditi da:", options: ["oba komada imaju istu mikrostrukturu", "oba komada imaju istu vlačnu čvrstoću", "oba imaju istu žilavost", "oba je proizveo isti proizvođač"], correct: [1], note: "Tvrdoća i vlačna čvrstoća čelika su dobro povezane (Rm ≈ 3,2–3,3 · HV), pa jednaka tvrdoća znači i otprilike jednaku vlačnu čvrstoću. Mikrostruktura i žilavost mogu biti različite." },
        { q: "Faktor intenzivnosti naprezanja (K) pukotine je:", options: ["srednje naprezanje okomito na površinu pukotine u plastičnoj zoni vrha pukotine", "omjer najvećeg naprezanja uz vrh pukotine i srednjeg naprezanja u neto presjeku", "faktor koji predstavlja povećano naprezanje na vrhu pukotine", "razlika povećanog naprezanja na vrhu pukotine i naprezanja u neto presjeku, podijeljena udaljenošću"], correct: [2], note: "Faktor intenzivnosti naprezanja K opisuje povećano naprezanje na vrhu pukotine: K = Y · σ · √(πa)." },
        { q: "Koja je dimenzija faktora intenzivnosti naprezanja (K) pukotine?", options: ["mm", "bez dimenzije", "N/mm²", "N/mm³ᐟ²"], correct: [3], note: "K = Y · σ · √(πa), pa mu je dimenzija naprezanje × √duljina: N/mm² · √mm = N/mm³ᐟ² (ili MPa√m)." },
        { q: "Kod konvencionalne granice razvlačenja Rp0,01 nakon rasterećenja u materijalu ostaje plastična deformacija od:", options: ["0,01%", "0,1%", "1%", "1,1%"], correct: [0], note: "Rp0,01 je naprezanje koje nakon rasterećenja ostavlja trajnu plastičnu deformaciju od 0,01 % (kao što Rp0,2 ostavlja 0,2 %)." },
        { q: "Zašto se provode metalografska ispitivanja zavarenih spojeva?", options: ["za kemijski sastav", "za određivanje strukture", "za mehanička svojstva", "za otkrivanje vodika"], correct: [1], note: "Metalografskim ispitivanjem (makro i mikro) određuje se struktura zavarenog spoja: zone, veličina zrna, faze i greške." },
        { q: "Što označava Rₘ?", options: ["vlačnu čvrstoću", "granicu tečenja", "konvencionalnu granicu 0,2 %", "tvrdoću"], correct: [0], note: "Rm je vlačna čvrstoća: najveća sila u vlačnom pokusu podijeljena s početnim presjekom." },
        { q: "Kako se najtočnije određuje sadržaj ugljika u metalu zavara?", options: ["kemijskom analizom", "metalografskom analizom", "ultrazvukom", "mjerenjem tvrdoće"], correct: [0], note: "Sadržaj ugljika u metalu zavara najtočnije se određuje kemijskom analizom (npr. spektrometrijom ili izgaranjem). Metalografija i tvrdoća daju samo procjenu." },
        { q: "Dimenzije epruvete za ispitivanje udarnog rada loma (Charpy) su:", options: ["10 × 10 × 55 mm", "10 × 20 × 100 mm", "10 × 10 × 50 mm", "10 × 8 × 55 mm"], correct: [0], note: "Standardna Charpy epruveta je 10 × 10 × 55 mm, sa zarezom (V ili U) u sredini." },
        { q: "Lomna žilavost KIC izražava se u:", options: ["MPa√m", "MPa√mm", "N/mm³ᐟ²", "N/mm²"], correct: [0, 1, 2], note: "Lomna žilavost KIC ima dimenziju naprezanje × √duljina: MPa√m, MPa√mm ili N/mm³ᐟ² (1 MPa√m ≈ 31,6 MPa√mm). N/mm² je samo jedinica naprezanja." },
        { q: "Koje vrste mjerenja tvrdoće imamo?", options: ["po Brinellu (HB)", "po Rockwellu (HRB, HRC)", "po Vickersu (HV)", "po Charpyju"], correct: [0, 1, 2], note: "Najčešće metode mjerenja tvrdoće su Brinell (HB), Rockwell (HRB, HRC) i Vickers (HV). Charpyjevim batom ispituje se udarni rad loma, a ne tvrdoća." }

    // Baza 4: Prošireni kviz za 2. ispit (stara pitanja + pitanja iz uvoda/vodiča za učenje i priprema za predavanja 1–28)
    const extendedQuestions2 = [
        ...oldQuestions2,
        { q: "Što vrijedi za prostorno centriranu kubičnu (BCC) rešetku?", options: ["2 atoma po jediničnoj ćeliji", "koordinacijski broj 8", "faktor popunjenosti 74 %", "koordinacijski broj 12"], correct: [0, 1], note: "BCC ima 2 atoma po ćeliji (8 · 1/8 u vrhovima + 1 u sredini), koordinacijski broj 8 i faktor popunjenosti 68 %. Vrijednosti 74 % i 12 vrijede za FCC i HCP." },
        { q: "Što vrijedi za plošno centriranu kubičnu (FCC) rešetku?", options: ["koordinacijski broj 8", "faktor popunjenosti 68 %", "4 atoma po jediničnoj ćeliji", "faktor popunjenosti 74 %"], correct: [2, 3], note: "FCC ima 4 atoma po ćeliji (8 · 1/8 + 6 · 1/2), koordinacijski broj 12 i faktor popunjenosti 74 %. Vrijednosti 8 i 68 % vrijede za BCC." },
        { q: "Koliko kliznih sustava ima HCP rešetka?", options: ["12", "3", "48", "8"], correct: [1], note: "HCP ima samo 3 klizna sustava (bazalna ravnina, 3 smjera), pa je slabo deformabilan (Mg, Zn). FCC ima 12 kliznih sustava." },
        { q: "Koji metali i faze imaju FCC rešetku (najduktilnija rešetka)?", options: ["Al, Cu, Ni", "austenit", "ferit", "martenzit"], correct: [0, 1], note: "FCC rešetku imaju Al, Cu, Ni i austenit (γ-Fe). Ferit je BCC, a martenzit BCT." },
        { q: "Dislokacije su:", options: ["točkaste greške rešetke", "površinske greške rešetke", "linijske greške rešetke", "volumne greške rešetke"], correct: [2], note: "Dislokacije su linijske greške rešetke. Točkaste su praznine i strani atomi, a površinske granice zrna." },
        { q: "Što vrijedi za dislokacije i očvršćivanje metala?", options: ["Gibanje dislokacija predstavlja plastičnu deformaciju", "Svi mehanizmi očvršćivanja ometaju gibanje dislokacija", "Dislokacije postoje samo u talini", "Očvršćivanje se postiže olakšavanjem gibanja dislokacija"], correct: [0, 1], note: "Plastična deformacija je gibanje dislokacija, a svi mehanizmi očvršćivanja (sitno zrno, mješanci, precipitati, hladna deformacija) to gibanje ometaju." },
        { q: "Eutektik u Fe-C dijagramu nalazi se na:", options: ["0,8 % C i 723 °C", "2,03 % C i 1147 °C", "4,3 % C i 1147 °C", "6,67 % C i 723 °C"], correct: [2], note: "Eutektik u Fe-C dijagramu je na 4,3 % C i 1147 °C: talina prelazi u ledeburit (austenit + cementit)." },
        { q: "Eutektoid u Fe-C dijagramu nalazi se na:", options: ["0,8 % C i 723 °C", "4,3 % C i 1147 °C", "0,025 % C i 911 °C", "2,03 % C i 723 °C"], correct: [0], note: "Eutektoid je na 0,8 % C i 723 °C: austenit prelazi u perlit (ferit + cementit)." },
        { q: "Koja je razlika između eutektičke i eutektoidne reakcije?", options: ["Eutektoid: talina prelazi u dvije čvrste faze", "Eutektik: talina prelazi u dvije čvrste faze", "Eutektik: jedna čvrsta faza prelazi u talinu", "Eutektoid: jedna čvrsta faza prelazi u dvije čvrste faze"], correct: [1, 3], note: "Eutektik: talina prelazi u dvije čvrste faze. Eutektoid: jedna čvrsta faza prelazi u dvije čvrste faze." },
        { q: "Maksimalna topljivost ugljika iznosi:", options: ["u austenitu 2,03 %", "u feritu 0,025 % (na 723 °C)", "u austenitu 0,8 %", "u feritu 0,8 %"], correct: [0, 1], note: "Najveća topljivost ugljika u austenitu je 2,03 % (1147 °C), a u feritu 0,025 % (723 °C). 0,8 % je eutektoidni sastav." },
        { q: "Što vrijedi za martenzit?", options: ["Nastaje difuzijskom pretvorbom pri sporom hlađenju", "To je prezasićena otopina C u Fe s BCT rešetkom", "Pretvorba je bezdifuzijska", "Nastaje hlađenjem brzinom većom od kritične"], correct: [1, 2, 3], note: "Martenzit je prezasićena otopina C u Fe s BCT rešetkom. Nastaje bezdifuzijski, kad je hlađenje brže od kritičnog." },
        { q: "Koja je razlika između TTT i CCT dijagrama?", options: ["TTT prikazuje izotermičku pretvorbu", "CCT prikazuje pretvorbu pri kontinuiranom hlađenju", "TTT prikazuje ravnotežne strukture kao Fe-C dijagram", "CCT vrijedi samo za aluminijske legure"], correct: [0, 1], note: "TTT dijagram prikazuje pretvorbe pri izotermnom držanju, a CCT pri kontinuiranom hlađenju. Ravnotežne strukture daje Fe-C dijagram." },
        { q: "Što vrijedi za bainit?", options: ["Postoje gornji i donji bainit", "Daje dobru kombinaciju čvrstoće i žilavosti", "To je ravnotežna faza iz Fe-C dijagrama", "Nastaje isključivo pri temperaturi iznad A3"], correct: [0, 1], note: "Bainit (gornji i donji) je neravnotežna struktura između perlita i martenzita s dobrom kombinacijom čvrstoće i žilavosti. Nije faza iz Fe-C dijagrama." },
        { q: "Kako se čelici dijele prema dezoksidaciji i što ih karakterizira?", options: ["Nesmireni – nehomogeni, lošijih svojstava", "Smireni – dezoksidirani sa Si i Mn", "Posebno smireni – dodatno Al, sitno zrno (AlN), najbolja žilavost", "Posebno smireni – bez ikakve dezoksidacije"], correct: [0, 1, 2], note: "Nesmireni čelici su nehomogeni (segregacije), smireni se dezoksidiraju sa Si i Mn, a posebno smireni još i Al, što daje sitno zrno (AlN) i najbolju žilavost." },
        { q: "Plastična rezerva čelika izražava se omjerom Re/Rm. Što vrijedi?", options: ["Uobičajeno iznosi oko 0,70–0,85", "Manji omjer znači veću plastičnu rezervu i sigurnost od krhkog loma", "Veći omjer znači veću plastičnu rezervu", "Uobičajeno iznosi oko 0,10–0,30"], correct: [0, 1], note: "Omjer Re/Rm obično je oko 0,70–0,85. Manji omjer znači veću plastičnu rezervu prije loma, dakle veću sigurnost od krhkog loma." },
        { q: "Mikrolegirani čelici:", options: ["sadrže Nb, V, Ti u udjelu manjem od oko 0,1 %", "imaju sitno zrno te višu čvrstoću i žilavost", "imaju lošu zavarljivost zbog visokog udjela ugljika", "legirani su s više od 12 % Cr"], correct: [0, 1], note: "Mikrolegirani čelici imaju malo Nb, V i Ti (ispod oko 0,1 %), koji daju sitno zrno, višu čvrstoću i žilavost. Imaju malo ugljika i dobro se zavaruju." },
        { q: "Što snizuje prijelaznu temperaturu čelika (žilavo → krhko)?", options: ["Sitnije zrno", "Dodatak Ni", "Manje P, S i N", "Veći udio P i S"], correct: [0, 1, 2], note: "Prijelaznu temperaturu snizuju sitno zrno, nikal i manji udio P, S i N. Više P i S je povisuje." },
        { q: "Koje se skupine čelika koriste za niske temperature?", options: ["Mikrolegirani sitnozrnati čelici do oko −50 °C", "Ni čelici (1,5–12 % Ni) do oko −200 °C; 9 % Ni za LNG", "Austenitni čelici do blizu apsolutne nule", "Nelegirani čelici s više od 0,6 % C do −196 °C"], correct: [0, 1, 2], note: "Za niske temperature: sitnozrnati mikrolegirani čelici do oko −50 °C, Ni čelici do oko −200 °C (9 % Ni za LNG), austenitni čelici do blizu apsolutne nule. Visokougljični čelici su krhki." },
        { q: "Kako glasi izraz za efektivni unos topline pri zavarivanju?", options: ["Eef = η · U · I · v", "Eef = η · U · I / v", "Eef = U / (η · I · v)", "Eef = η · I² · R"], correct: [1], note: "Efektivni unos topline: Eef = η · U · I / v (J/mm). Brzina zavarivanja je u nazivniku, jer brže zavarivanje unosi manje topline po milimetru." },
        { q: "Što uzrokuje veći unos topline pri zavarivanju čelika?", options: ["Sporije hlađenje (dulje t8/5)", "Grublje zrno u ZUT-u", "Manje zakaljivanja", "Brže hlađenje i više martenzita"], correct: [0, 1, 2], note: "Veći unos topline daje sporije hlađenje (dulje t8/5), pa manje zakaljivanja, ali i grublje zrno u ZUT-u." },
        { q: "Što predstavlja vrijeme t8/5?", options: ["Vrijeme zagrijavanja od 500 do 800 °C", "Vrijeme hlađenja od 800 do 500 °C", "Ključni parametar toplinskog ciklusa zavarivanja", "Vrijeme držanja pri žarenju"], correct: [1, 2], note: "t8/5 je vrijeme hlađenja od 800 do 500 °C; u tom području nastaje struktura ZUT-a, pa je to ključni parametar toplinskog ciklusa." },
        { q: "Kako viša temperatura predgrijavanja utječe na t8/5?", options: ["Skraćuje vrijeme hlađenja t8/5", "Ne utječe na t8/5", "Produljuje vrijeme hlađenja t8/5", "Utječe samo kod aluminija"], correct: [2], note: "Viša temperatura predgrijavanja usporava hlađenje, pa je t8/5 dulje." },
        { q: "Kada se za vođenje topline primjenjuje 2D, a kada 3D model?", options: ["2D (dvodimenzionalno) – tanki lim", "3D (trodimenzionalno) – debeli lim", "2D – debeli lim", "3D – tanki lim"], correct: [0, 1], note: "2D model vrijedi za tanki lim (toplina teče u ravnini), a 3D model za debeli lim (toplina teče u tri smjera)." },
        { q: "Što povećava brzinu hlađenja zavarenog spoja?", options: ["Manji unos topline", "Niža temperatura predgrijavanja", "Veća debljina lima", "Viša temperatura predgrijavanja"], correct: [0, 1, 2], note: "Hlađenje ubrzavaju manji unos topline, niža temperatura predgrijavanja i deblji lim." },
        { q: "Zona pregrijavanja u ZUT-u čelika:", options: ["zagrijana je na oko 1100–1450 °C", "ima grubo zrno", "ima najsitnije zrno u cijelom ZUT-u", "zagrijana je na 200–500 °C"], correct: [0, 1], note: "Zona pregrijavanja (oko 1100–1450 °C) je uz liniju staljivanja i ima grubo zrno; zato je najosjetljivija zona ZUT-a." },
        { q: "Zonu normalizacije u ZUT-u karakterizira:", options: ["grubo zrno", "sitno zrno", "rastaljeni metal", "plavi lom"], correct: [1], note: "Zona normalizacije zagrijana je malo iznad A3, pa pri hlađenju dobiva sitno zrno." },
        { q: "Zona starenja i plavog loma u ZUT-u nalazi se u temperaturnom području:", options: ["1100–1450 °C", "723–911 °C", "200–500 °C", "ispod 100 °C"], correct: [2], note: "Zona starenja i plavog loma je na oko 200–500 °C, najudaljenija od zavara. Tamo može doći do starenja i krhkosti." },
        { q: "Koje vrste zavarljivosti razlikujemo?", options: ["operativnu", "metaluršku (lokalnu)", "konstrukcijsku", "magnetsku"], correct: [0, 1, 2], note: "Razlikujemo operativnu, metaluršku (lokalnu) i konstrukcijsku (globalnu) zavarljivost." },
        { q: "Metalurška (lokalna) zavarljivost odnosi se na:", options: ["procjenu fizikalno-kemijskih pretvorbi u ZUT-u", "krutost i oblik konstrukcije", "dostupnost opreme i položaj zavarivanja", "cijenu dodatnog materijala"], correct: [0], note: "Metalurška zavarljivost razmatra fizikalno-kemijske pretvorbe u ZUT-u i metalu zavara. Oblik konstrukcije pripada konstrukcijskoj, a oprema operativnoj zavarljivosti." },
        { q: "Što se postiže predgrijavanjem?", options: ["Smanjuje se brzina hlađenja (veći t8/5)", "Omogućuje se izlazak vodika", "Smanjuju se naprezanja", "Povećava se brzina hlađenja"], correct: [0, 1, 2], note: "Predgrijavanje smanjuje brzinu hlađenja (dulje t8/5), omogućuje izlazak vodika i smanjuje naprezanja." },
        { q: "O čemu ovisi potrebna temperatura predgrijavanja?", options: ["Veći ekvivalent ugljika zahtijeva višu temperaturu", "Veća debljina zahtijeva višu temperaturu", "Veća debljina zahtijeva nižu temperaturu", "Ne ovisi o kemijskom sastavu"], correct: [0, 1], note: "Što su veći ekvivalent ugljika i debljina, to je potrebna viša temperatura predgrijavanja." },
        { q: "Koja tri uvjeta moraju biti ispunjena za nastanak hladnih pukotina?", options: ["Zakaljiva (krhka) struktura", "Difuzijski vodik", "Vlačno naprezanje", "Nisko taljivi filmovi S i P"], correct: [0, 1, 2], note: "Za hladne pukotine moraju istodobno postojati zakaljiva struktura, difuzijski vodik i vlačno naprezanje. Nisko taljivi filmovi S i P uzrok su toplih pukotina." },
        { q: "Kada i gdje nastaju hladne pukotine?", options: ["Ispod oko 200 °C", "Ponekad i nekoliko dana nakon zavarivanja", "U zoni taljenja i u ZUT-u", "Isključivo tijekom skrućivanja taline"], correct: [0, 1, 2], note: "Hladne pukotine nastaju ispod oko 200 °C, ponekad i nekoliko dana nakon zavarivanja, u zoni taljenja i ZUT-u." },
        { q: "Što smanjuje opasnost od hladnih pukotina?", options: ["Predgrijavanje", "Suhe / niskovodikove elektrode", "Dogrijavanje i PWHT", "Veća ukrućenost spoja i viši CE"], correct: [0, 1, 2], note: "Hladne pukotine smanjuju predgrijavanje, suhe niskovodikove elektrode, dogrijavanje i PWHT. Veća ukrućenost i viši CE ih povećavaju." },
        { q: "Gdje nastaju pojedine vrste toplih pukotina?", options: ["Kristalizacijske – u zoni taljenja", "Likvacijske – u ZUT-u", "Kristalizacijske – u osnovnom materijalu daleko od zavara", "Likvacijske – samo ispod 200 °C"], correct: [0, 1], note: "Kristalizacijske tople pukotine nastaju u zoni taljenja pri skrućivanju, a likvacijske u ZUT-u zbog rastaljenih filmova po granicama zrna." },
        { q: "Koji su uzroci toplih pukotina?", options: ["S i P (nisko taljivi filmovi po granicama zrna)", "Naprezanja pri skrućivanju", "Nepovoljan oblik zavara (odnos širine i dubine)", "Difuzijski vodik"], correct: [0, 1, 2], note: "Tople pukotine uzrokuju S i P (nisko taljivi filmovi), naprezanja pri skrućivanju i nepovoljan oblik zavara. Vodik uzrokuje hladne pukotine." },
        { q: "Što uzrokuje lamelarno odvajanje i kako se sprječava?", options: ["Naprezanje u smjeru debljine lima", "Nehomogenosti (sulfidi) u osnovnom materijalu", "Sprječava se primjenom čelika Z-kvalitete", "Sprječava se povećanjem udjela sumpora"], correct: [0, 1, 2], note: "Lamelarno odvajanje uzrokuju naprezanje u smjeru debljine i sulfidni uključci. Sprječava se čelikom Z-kvalitete (malo S) i oblikovanjem spoja." },
        { q: "Pukotine zbog naknadnog zagrijavanja tipične su za:", options: ["CrMo i CrMoV čelike pri toplinskoj obradi", "nelegirane čelike pri zavarivanju bez predgrijavanja", "aluminijske legure serije 5xxx", "sivi lijev"], correct: [0], note: "Pukotine zbog naknadnog zagrijavanja tipične su za CrMo i CrMoV čelike pri toplinskoj obradi nakon zavarivanja." },
        { q: "U kojim se jedinicama izražava difuzijski vodik u metalu zavara?", options: ["mg/kg", "ml/100 g metala zavara", "% volumena", "ppm po mm²"], correct: [1], note: "Difuzijski vodik izražava se u ml na 100 g metala zavara (npr. H5)." },
        { q: "Što je linija staljivanja?", options: ["Granica između zone taljenja i ZUT-a", "Granica između ZUT-a i nepromijenjenog osnovnog materijala", "Os simetrije zavara", "Linija na TTT dijagramu"], correct: [0], note: "Linija staljivanja je granica između zone taljenja (metala zavara) i ZUT-a." },
        { q: "Koji su uvjeti za kaljenje čelika?", options: ["Više od oko 0,35 % C", "Temperatura austenitizacije A3 + 30–70 °C (podeutektoidni čelici)", "Brzina hlađenja veća od kritične", "Brzina hlađenja manja od kritične"], correct: [0, 1, 2], note: "Za kaljenje treba dovoljno ugljika (više od oko 0,35 %), austenitizacija na A3 + 30–70 °C i hlađenje brže od kritične brzine." },
        { q: "Poboljšavanje čelika je:", options: ["kaljenje + visoko popuštanje", "normalizacija + sferoidizacija", "postupak kojim se postiže čvrstoća uz dobru žilavost", "žarenje za redukciju naprezanja"], correct: [0, 2], note: "Poboljšavanje je kaljenje i visoko popuštanje; daje visoku čvrstoću uz dobru žilavost." },
        { q: "Koja žarenja spadaju u žarenja I. vrste (ispod A1)?", options: ["Žarenje za redukciju naprezanja (400–650 °C)", "Rekristalizacijsko žarenje (500–650 °C)", "Normalizacijsko žarenje", "Homogenizacijsko žarenje"], correct: [0, 1], note: "Žarenja I. vrste (ispod A1) su žarenje za redukciju naprezanja i rekristalizacijsko žarenje. Normalizacija i homogenizacija su iznad A1/A3." },
        { q: "Koja žarenja spadaju u žarenja II. vrste (iznad A1)?", options: ["Normalizacijsko", "Homogenizacijsko", "Žarenje na grubo zrno", "Žarenje za redukciju naprezanja"], correct: [0, 1, 2], note: "Žarenja II. vrste (iznad A1) su normalizacijsko, homogenizacijsko, žarenje na grubo zrno i sferoidizacijsko." },
        { q: "Što vrijedi za toplinsku obradu nakon zavarivanja (PWHT)?", options: ["Smanjuje zaostala naprezanja i tvrdoću ZUT-a", "Omogućuje izlazak vodika", "Držanje na 600 °C traje oko 2–2,5 min/mm debljine", "Brzina zagrijavanja treba biti što veća (iznad 1000 °C/h)"], correct: [0, 1, 2], note: "PWHT smanjuje zaostala naprezanja i tvrdoću ZUT-a te omogućuje izlazak vodika. Držanje na 600 °C traje oko 2–2,5 min/mm. Zagrijavanje mora biti sporo (oko 50–250 °C/h)." },
        { q: "Što je puzanje?", options: ["Spora, nepovratna deformacija pri konstantnom opterećenju i visokoj temperaturi", "Javlja se pri T ≥ 0,3·Tt (kod čelika iznad oko 400–450 °C)", "Trenutni krhki lom pri niskoj temperaturi", "Elastična deformacija koja nestaje rasterećenjem"], correct: [0, 1], note: "Puzanje je spora, nepovratna deformacija pri konstantnom opterećenju na visokoj temperaturi (T ≥ 0,3·Tt, kod čelika iznad oko 400–450 °C)." },
        { q: "Koji su stadiji puzanja?", options: ["Primarni", "Sekundarni (stacionarni)", "Tercijarni (završava lomom)", "Eutektoidni"], correct: [0, 1, 2], note: "Puzanje ima tri stadija: primarni (usporavanje), sekundarni (stacionarni, konstantna brzina) i tercijarni (ubrzavanje do loma)." },
        { q: "Koji legirni elementi povećavaju otpornost na puzanje?", options: ["Mo", "V i W", "Cr", "S i P"], correct: [0, 1, 2], note: "Otpornost na puzanje povećavaju Mo, V, W i Cr (očvršćivanje mješanaca i stabilni karbidi). S i P su štetne nečistoće." },
        { q: "Do kojih se radnih temperatura koriste pojedine skupine čelika?", options: ["Nelegirani do oko 450 °C", "Mo i CrMo čelici do oko 550 °C", "Austenitni čelici oko 600–800 °C", "Nelegirani do oko 800 °C"], correct: [0, 1, 2], note: "Nelegirani čelici koriste se do oko 450 °C, Mo i CrMo do oko 550 °C, 12 % Cr do oko 600 °C, a austenitni oko 600–800 °C." },
        { q: "Što čini čelik nehrđajućim?", options: ["Više od oko 12 % Cr", "Pasivni oksidni sloj Cr2O3 debljine nekoliko nanometara", "Više od 2 % C", "Sloj cinka debljine 60 µm"], correct: [0, 1], note: "Čelik je nehrđajući kad ima više od oko 12 % Cr, jer se tada stvara pasivni sloj Cr2O3 debljine nekoliko nanometara." },
        { q: "Koji je tipičan problem pri zavarivanju pojedinih skupina nehrđajućih čelika?", options: ["Austenitni – tople pukotine i deformacije", "Feritni – grubo zrno u ZUT-u i krhkost", "Martenzitni – hladne pukotine, potrebna toplinska obrada", "Duplex – potpuno austenitna struktura zavara"], correct: [0, 1, 2], note: "Austenitni: tople pukotine i deformacije; feritni: grubo zrno i krhkost; martenzitni: hladne pukotine i potrebna toplinska obrada; duplex: feritizacija (previše ferita), ne austenit." },
        { q: "Što je senzibilizacija nehrđajućih čelika?", options: ["Izlučivanje Cr23C6 po granicama zrna (oko 500–850 °C)", "Osiromašenje kromom uz granice zrna i interkristalna korozija", "Stvaranje martenzita pri brzom hlađenju", "Izlučivanje grafita u obliku listića"], correct: [0, 1], note: "Senzibilizacija je izlučivanje Cr23C6 po granicama zrna (oko 500–850 °C); uz granice zrna ostaje premalo kroma, pa nastaje interkristalna korozija." },
        { q: "Kako se sprječava senzibilizacija (interkristalna korozija)?", options: ["Udio C manji od 0,03 %", "Stabilizacija s Ti i Nb", "Rastvorno žarenje 1050–1100 °C i gašenje", "Dugo zadržavanje na 650 °C"], correct: [0, 1, 2], note: "Senzibilizacija se sprječava niskim ugljikom (ispod 0,03 %), stabilizacijom s Ti i Nb i rastvornim žarenjem (1050–1100 °C) s gašenjem. Zadržavanje na 650 °C ju izaziva." },
        { q: "Po čemu se razlikuju Schaefflerov, De Longov i WRC-1992 dijagram?", options: ["De Long uzima u obzir dušik (N)", "WRC-1992 uzima u obzir bakar (Cu)", "WRC-1992 ne prikazuje martenzit", "Schaeffler se koristi samo za aluminij"], correct: [0, 1, 2], note: "De Longov dijagram uzima u obzir dušik, a WRC-1992 i bakar; WRC-1992 ne prikazuje martenzit. Schaeffler se koristi za čelike, ne za aluminij." },
        { q: "Kako glasi izraz za PREN (otpornost na rupičastu koroziju)?", options: ["PREN = %Cr + 3,3·%Mo + 16·%N", "PREN = %Ni + 30·%C + 0,5·%Mn", "PREN = C + Mn/6", "PREN = %Cr + %Mo + 1,5·%Si"], correct: [0], note: "PREN = %Cr + 3,3·%Mo + 16·%N; što je veći, čelik je otporniji na rupičastu koroziju." },
        { q: "Kako glase ekvivalenti prema WRC-1992 dijagramu?", options: ["Cr-ekv. = Cr + Mo + 0,7·Nb", "Ni-ekv. = Ni + 35·C + 20·N + 0,25·Cu", "Cr-ekv. = C + Mn/6", "Ni-ekv. = Ni + Cr"], correct: [0, 1], note: "WRC-1992: Cr-ekv. = Cr + Mo + 0,7·Nb, Ni-ekv. = Ni + 35·C + 20·N + 0,25·Cu." },
        { q: "Koji se feritni broj (FN) preporučuje za otpornost na tople pukotine kod austenitnog metala zavara?", options: ["FN ≈ 0", "FN ≈ 5", "FN ≈ 50", "FN ≈ 100"], correct: [1], note: "Za otpornost austenitnog metala zavara na tople pukotine preporučuje se FN oko 5 (otprilike 3–10 % δ-ferita)." },
        { q: "Kada postoji rizik izlučivanja sigma faze?", options: ["Pri udjelu Cr većem od oko 20 %", "Pri dugom zadržavanju na 500–900 °C", "Pri udjelu Cr manjem od 5 %", "Pri hlađenju ispod −50 °C"], correct: [0, 1], note: "Sigma faza (krhka intermetalna faza Fe-Cr) prijeti kod čelika s više od oko 20 % Cr pri dugom zadržavanju na 500–900 °C." },
        { q: "Što vrijedi za duplex čelike?", options: ["Imaju približno 50 % ferita i 50 % austenita", "Tipičan problem pri zavarivanju je feritizacija zavara / ZUT-a", "Imaju potpuno martenzitnu strukturu", "Za njih je najprikladniji WRC-1992 dijagram"], correct: [0, 1, 3], note: "Duplex čelici imaju oko 50 % ferita i 50 % austenita; tipičan problem je feritizacija, a strukturu najbolje predviđa WRC-1992 dijagram." },
        { q: "Što je važno pri zavarivanju raznorodnih čelika (nehrđajući na ugljični)?", options: ["Prelegirani dodatni materijal (tip 309)", "Što manja dilucija", "Migracija ugljika i različito toplinsko istezanje", "Što veća dilucija"], correct: [0, 1, 2], note: "Kod spoja nehrđajućeg i ugljičnog čelika koristi se prelegirani dodatni materijal (309), što manja dilucija, a treba paziti na migraciju ugljika i različito toplinsko istezanje." },
        { q: "Koliko je toplinsko istezanje austenitnog čelika u odnosu na feritni?", options: ["Oko 1,5–1,7 puta veće", "Jednako", "Oko 2 puta manje", "Oko 10 puta veće"], correct: [0], note: "Austenitni čelik ima oko 1,5–1,7 puta veće toplinsko istezanje od feritnog, a manju toplinsku vodljivost, pa se pri zavarivanju više deformira." },
        { q: "Kako se određuje dilucija na zavarenom spoju?", options: ["Mjerenjem površina (planimetriranjem) na 3 ili više metalografskih makro-snimaka", "Mjerenjem tvrdoće po Vickersu", "Vlačnim pokusom", "Charpyjevim ispitivanjem"], correct: [0], note: "Dilucija se određuje planimetriranjem površina na tri ili više metalografskih makroizbrusaka." },

    // POPIS ISPITA – za novi ispit dodaj novu bazu pitanja i jedan unos ovdje
    // =====================================================================
    const exams = [
        {
            name: "1. ispit – Postupci zavarivanja i oprema",
            icon: "🔥",
            quizzes: [
                { key: 'old', label: "📜 Stara ispitna pitanja", title: "1. ispit – Stara ispitna pitanja", questions: oldQuestions },
                { key: 'extended', label: "🚀 Prošireni kviz (Stara pitanja + Skripte + Predavanja)", title: "1. ispit – Prošireni kviz", questions: extendedQuestions }
            ]
        },
        {
            name: "2. ispit – Materijali",
            icon: "🧪",
            quizzes: [
                { key: 'old', label: "📜 Stara ispitna pitanja (ispit 2013. A i B + zbirka)", title: "2. ispit – Stara ispitna pitanja", questions: oldQuestions2 },
                { key: 'extended', label: "🚀 Prošireni kviz (Stara pitanja + Pripreme za predavanja)", title: "2. ispit – Prošireni kviz", questions: extendedQuestions2 }
            ]
        }
    ];

    let currentExam = null;
    let activeQuestions = [];
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    // Statistika kruga: broj pitanja i bodovi po vrsti odgovora
    let stats = { correct: 0, partial: 0, wrong: 0, voided: 0, skipped: 0, partialPts: 0 };
    let currentSessionQuestions = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    const ALL_SCREENS = ['main-menu-screen', 'type-menu-screen', 'sub-menu-screen', 'quiz-screen', 'results-screen', 'review-screen'];

    function showScreen(id) {
        ALL_SCREENS.forEach(s => {
            document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
        });
        document.querySelector('.container').scrollTop = 0;
    }

    // Glavni izbornik: popis ispita
    function renderExamButtons() {
        const container = document.getElementById('exam-buttons-container');
        container.innerHTML = '';
        exams.forEach((exam, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `${exam.icon} ${exam.name}`;
            btn.onclick = () => selectExam(idx);
            container.appendChild(btn);
        });
    }

    // Korak 1: Korisnik bira ispit
    function selectExam(idx) {
        currentExam = exams[idx];
        goToTypeMenu();
    }

    function goToTypeMenu() {
        if (!currentExam) { goToMainMenu(); return; }
        document.getElementById('app-title').innerText = currentExam.name;

        const container = document.getElementById('type-buttons-container');
        container.innerHTML = '';
        currentExam.quizzes.forEach(quiz => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `${quiz.label} – ${quiz.questions.length} pitanja`;
            btn.onclick = () => selectQuizType(quiz.key);
            container.appendChild(btn);
        });

        showScreen('type-menu-screen');
    }

    // Korak 2: Korisnik bira vrstu kviza (stara pitanja / prošireni)
    function selectQuizType(type) {
        const quiz = currentExam.quizzes.find(qz => qz.key === type);
        activeQuestions = quiz.questions;
        document.getElementById('app-title').innerText = quiz.title;
        document.getElementById('sub-menu-desc').innerText = "Izaberite koliko pitanja želite rješavati:";

        const subMenuContainer = document.getElementById('sub-menu-buttons-container');
        subMenuContainer.innerHTML = '';

        const totalAvailable = activeQuestions.length;
        // Dinamički prilagođavamo opcije broja pitanja ovisno o bazi
        let optionsCount = [30, 60, 90, 150, 200].filter(c => c < totalAvailable);
        optionsCount.push(totalAvailable);

        optionsCount.forEach(count => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            if (count >= totalAvailable) {
                btn.innerText = `Sve (ukupno ${totalAvailable} pitanja)`;
            } else {
                btn.innerText = `${count} pitanja`;
            }
            btn.onclick = () => startQuiz(count);
            subMenuContainer.appendChild(btn);
        });

        showScreen('sub-menu-screen');
    }

    function goToMainMenu() {
        renderExamButtons();
        showScreen('main-menu-screen');
        document.getElementById('app-title').innerText = "IWE Kviz - Glavni Izbornik";
    }

    // Napomena uz pitanje (polje "note") – prikazuje se nakon odgovora
    function appendNote(parent, q) {
        if (!q.note) return;
        const noteDiv = document.createElement('div');
        noteDiv.className = 'q-note';
        noteDiv.innerText = `💡 Objašnjenje: ${q.note}`;
        parent.appendChild(noteDiv);
    }

    function goToSubMenu() {
        showScreen('sub-menu-screen');
    }

    function startQuiz(limit) {
        let shuffledAll = JSON.parse(JSON.stringify(activeQuestions));
        shuffle(shuffledAll);
        
        questions = shuffledAll.slice(0, Math.min(limit, shuffledAll.length));
        currentSessionQuestions = questions;
        
        currentIndex = 0;
        score = 0;
        stats = { correct: 0, partial: 0, wrong: 0, voided: 0, skipped: 0, partialPts: 0 };

        showScreen('quiz-screen');
        loadQuestion();
    }

    function confirmCancel() {
        if (confirm("Jeste li sigurni da želite odustati od ovog kruga i vratiti se nazad?")) {
            goToSubMenu();
        }
    }

    function openReviewAllFromMenu() {
        showReviewScreen(activeQuestions, "Pregled svih pitanja i točnih odgovora izabranog kviza");
    }

    function openReviewCurrentSession() {
        showReviewScreen(currentSessionQuestions, "Pregled pitanja i točnih odgovora iz ovog kruga");
    }

    function showReviewScreen(questionsArray, titleText) {
        showScreen('review-screen');

        document.getElementById('review-title').innerText = titleText;
        const container = document.getElementById('review-container');
        container.innerHTML = '';

        questionsArray.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'review-card';

            const title = document.createElement('div');
            title.className = 'review-q-title';
            title.innerText = `${idx + 1}. ${q.q}`;
            card.appendChild(title);

            q.options.forEach((opt, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'review-opt';
                
                let isCorrectAns = q.correct.includes(optIdx);
                if (isCorrectAns) {
                    optDiv.classList.add('is-correct');
                    optDiv.innerText = `✓ ${opt} (Točan odgovor)`;
                } else {
                    optDiv.innerText = `• ${opt}`;
                }
                card.appendChild(optDiv);
            });

            appendNote(card, q);
            container.appendChild(card);
        });
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        document.getElementById('question-counter').innerText = `Pitanje: ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('current-score').innerText = `Bodovi: ${score.toFixed(2)}`;
        
        const progressPercent = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;

        document.getElementById('question-text').innerText = q.q;

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        q.options.forEach((opt, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.id = `opt-item-${index}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'option-content';

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = 'quiz-option';
            input.value = index;
            input.id = `opt-${index}`;

            const label = document.createElement('label');
            label.htmlFor = `opt-${index}`;
            label.innerText = opt;
            label.style.width = '100%';
            label.style.cursor = 'pointer';

            contentDiv.appendChild(input);
            contentDiv.appendChild(label);
            li.appendChild(contentDiv);

            const tagSpan = document.createElement('span');
            tagSpan.id = `tag-${index}`;
            li.appendChild(tagSpan);
            
            li.onclick = (e) => {
                if (!input.disabled) {
                    if (e.target !== input) {
                        input.checked = !input.checked;
                    }
                }
            };

            optionsList.appendChild(li);
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'none';
        feedback.className = 'feedback';
        
        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `
            <button class="btn btn-cancel btn-small" id="cancel-btn" onclick="confirmCancel()">Odustani</button>
            <button class="btn btn-skip btn-small" id="skip-btn" onclick="skipQuestion()">Preskoči</button>
            <button class="btn btn-main" id="submit-btn" onclick="checkAnswer()">Potvrdi</button>
        `;
    }

    function skipQuestion() {
        const q = questions[currentIndex];
        const correctSet = new Set(q.correct);

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);

            if (isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '✓ Točan odgovor';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        feedback.innerText = `Pitanje je preskočeno (+0.00 bodova).`;
        feedback.className = 'feedback skipped';
        stats.skipped++;
        q.userSel = [];
        q.outcome = 'skipped';
        q.pts = 0;
        appendNote(feedback, q);

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function checkAnswer() {
        const q = questions[currentIndex];
        const inputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        
        if (inputs.length === 0) {
            alert("Molimo odaberite odgovor ili kliknite 'Preskoči' / 'Odustani'!");
            return;
        }

        let selectedIndices = Array.from(inputs).map(inp => parseInt(inp.value));
        
        let correctSet = new Set(q.correct);
        let selectedSet = new Set(selectedIndices);

        let points = 0;
        let totalCorrectNeeded = q.correct.length;
        let hasWrongSelection = false;

        selectedIndices.forEach(idx => {
            if (!correctSet.has(idx)) {
                hasWrongSelection = true;
            }
        });

        // Bodovanje: bez krivih = udio točnih; ima krivih: krivi > točni = -1, inače 0 (poništeno)
        const selCorrect = selectedIndices.filter(i => correctSet.has(i)).length;
        const selWrong = selectedIndices.length - selCorrect;
        let outcome;
        if (selWrong === 0) {
            points = selCorrect / totalCorrectNeeded;
            outcome = (selCorrect === totalCorrectNeeded) ? 'correct' : 'partial';
        } else if (selWrong > selCorrect) {
            points = -1;
            outcome = 'wrong';
        } else {
            // ima krivih, ali ne više od točnih -> poništeno (0 bodova)
            points = 0;
            outcome = 'void';
        }

        score += points;
        q.userSel = selectedIndices;
        q.outcome = outcome;
        q.pts = points;

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);
            let isSelected = selectedSet.has(index);

            if (isSelected && isCorrect) {
                itemElement.classList.add('user-correct');
                tagElement.className = 'tag tag-user-correct';
                tagElement.innerText = '✓ Tvoj odabir (Točno)';
            } else if (!isSelected && isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '⚠ Propušteno (Točno)';
            } else if (isSelected && !isCorrect) {
                itemElement.classList.add('user-wrong');
                tagElement.className = 'tag tag-user-wrong';
                tagElement.innerText = '✗ Tvoj odabir (Krivo)';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        
        if (outcome === 'correct') {
            stats.correct++;
            feedback.innerText = `Potpuno točno! Osvojeno bodova: +${points.toFixed(2)}`;
            feedback.className = 'feedback correct';
        } else if (outcome === 'partial') {
            stats.partial++;
            stats.partialPts += points;
            feedback.innerText = `Djelomično točno! Nisi označio/la sve točne odgovore. Bodovi: +${points.toFixed(2)}`;
            feedback.className = 'feedback partial';
        } else if (outcome === 'void') {
            stats.voided++;
            feedback.innerText = `Poništeno! Označen je i krivi odgovor (točnih: ${selCorrect}, krivih: ${selWrong}). Bodovi: 0.00`;
            feedback.className = 'feedback voided';
        } else {
            stats.wrong++;
            feedback.innerText = `Netočno! Više krivih nego točnih odgovora. Bodovi: ${points.toFixed(2)}`;
            feedback.className = 'feedback incorrect';
        }
        appendNote(feedback, q);

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function renderStats() {
        const boxes = [
            { cls: 'stat-correct', num: stats.correct, label: '✓ Točno', pts: `+${stats.correct.toFixed(2)} bodova` },
            { cls: 'stat-partial', num: stats.partial, label: '◐ Djelomično točno', pts: `+${stats.partialPts.toFixed(2)} bodova` },
            { cls: 'stat-wrong', num: stats.wrong, label: '✗ Netočno', pts: `−${stats.wrong.toFixed(2)} bodova` },
            { cls: 'stat-voided', num: stats.voided, label: '⊘ Poništeno', pts: '0 bodova' },
            { cls: 'stat-skipped', num: stats.skipped, label: '⏭ Preskočeno', pts: '0 bodova' }
        ];
        const grid = document.getElementById('stats-grid');
        grid.innerHTML = '';
        boxes.forEach(b => {
            const box = document.createElement('div');
            box.className = `stat-box ${b.cls}${b.cls === 'stat-skipped' ? ' full' : ''}`;
            box.innerHTML = `<div class="stat-num">${b.num}</div><div class="stat-label">${b.label}</div><div class="stat-pts">${b.pts}</div>`;
            grid.appendChild(box);
        });
    }

    function scrollToTop() {
        document.querySelector('.container').scrollTop = 0;
        window.scrollTo(0, 0);
    }

    const OUTCOME_LABEL = {
        correct: '✓ Točno',
        partial: '◐ Djelomično',
        wrong: '✗ Netočno',
        void: '⊘ Poništeno',
        skipped: '⏭ Preskočeno'
    };

    function renderResultList(mode) {
        document.getElementById('tab-mistakes').classList.toggle('active', mode === 'mistakes');
        document.getElementById('tab-all').classList.toggle('active', mode === 'all');

        const list = document.getElementById('result-list');
        list.innerHTML = '';

        const items = questions
            .map((q, idx) => ({ q, idx }))
            .filter(({ q }) => q.outcome && (mode === 'all' || q.outcome !== 'correct'));

        const mistakesCount = questions.filter(q => q.outcome && q.outcome !== 'correct').length;
        document.getElementById('tab-mistakes').innerText = `❌ Za ponoviti (${mistakesCount})`;
        document.getElementById('tab-all').innerText = `📋 Sva pitanja (${questions.filter(q => q.outcome).length})`;

        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'rv-empty';
            empty.innerText = 'Sve točno, nema pitanja za ponoviti! 🎉';
            list.appendChild(empty);
            return;
        }

        items.forEach(({ q, idx }) => {
            const card = document.createElement('div');
            card.className = 'review-card';

            const head = document.createElement('div');
            head.className = 'rv-head';
            const num = document.createElement('span');
            num.innerText = `Pitanje ${idx + 1}`;
            const badge = document.createElement('span');
            badge.className = `rv-badge ${q.outcome}`;
            const sign = q.pts > 0 ? '+' : '';
            badge.innerText = `${OUTCOME_LABEL[q.outcome]} (${sign}${q.pts.toFixed(2)})`;
            head.appendChild(num);
            head.appendChild(badge);
            card.appendChild(head);

            const title = document.createElement('div');
            title.className = 'review-q-title';
            title.innerText = q.q;
            card.appendChild(title);

            const sel = new Set(q.userSel || []);
            q.options.forEach((opt, i) => {
                const isC = q.correct.includes(i);
                const isS = sel.has(i);
                const row = document.createElement('div');
                row.className = 'rv-opt';
                const txt = document.createElement('span');
                txt.innerText = opt;
                row.appendChild(txt);
                let tag = '';
                if (isC && isS) { row.classList.add('ok'); tag = '✓ Tvoj odabir (točno)'; }
                else if (isC && !isS) { row.classList.add('missed'); tag = q.outcome === 'skipped' ? '✓ Točan odgovor' : '⚠ Točno – nisi označio'; }
                else if (!isC && isS) { row.classList.add('bad'); tag = '✗ Tvoj odabir (krivo)'; }
                if (tag) {
                    const t = document.createElement('span');
                    t.className = 'rv-tag';
                    t.innerText = tag;
                    row.appendChild(t);
                }
                card.appendChild(row);
            });

            appendNote(card, q);
            list.appendChild(card);
        });
    }

    function showResults() {
        showScreen('results-screen');
        
        let maxPossibleScore = questions.length;
        let percentage = (score / maxPossibleScore) * 100;
        if (percentage < 0) percentage = 0;

        document.getElementById('final-score').innerText = `Ukupno bodova: ${score.toFixed(2)} / ${maxPossibleScore}`;
        document.getElementById('percentage-display').innerText = `Postotak uspješnosti: ${percentage.toFixed(1)}%`;
        renderStats();
        renderResultList('mistakes');
    }

    window.onload = goToMainMenu;
</script>

</body>
</html>
