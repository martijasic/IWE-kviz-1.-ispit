        { q: "Pukotine zbog naknadnog zagrijavanja ili naknadne toplinske obrade zavarenog spoja. Odabrati točnu(e) tvrdnju(e):", options: ["najčešće nastaju u tzv. visokotemperaturnom području zbog prevelike brzine zagrijavanja", "najčešće nastaju u tzv. niskotemperaturnom području zbog prevelike brzine zagrijavanja", "pukotine ispod platiranog sloja spadaju u navedenu vrstu pukotina", "BWRA metoda je metoda za ispitivanje sklonosti prema nastajanju navedenih pukotina"], correct: [1, 2, 3], note: "Prema predavanju (2.7) pukotine zbog naknadnog zagrijavanja najčešće nastaju u niskotemperaturnom području (do oko 300 °C) zbog prebrzog zagrijavanja ili hlađenja. U njih spadaju i pukotine ispod platiranog sloja, a ispituju se BWRA metodom." },
        { q: "Napetosna korozija (SCC). Odabrati točnu(e) tvrdnju(e):", options: ["ne javlja se kod austenitnog nehrđajućeg čelika", "ne javlja se kod Al-legura", "javlja se kod niskougljičnog čelika ako je okoliš natrijev hidroksid, otopina nitrata, natrijev silikat + kalcijev nitrat", "minimalna vrijednost naprezanja kod koje dolazi do napetosne korozije određena je vrstom metala ili legure, temperaturom i korozivnim okolišem"], correct: [2, 3], note: "Napetosna korozija javlja se i kod austenitnih nehrđajućih čelika (kloridi) i kod Al legura. Niskougljični čelik napetosno korodira u lužnatim otopinama (NaOH), otopinama nitrata i silikata. Granično naprezanje ovisi o metalu, temperaturi i okolišu." },
        { q: "Tople pukotine uzrokuju:", options: ["naprezanja koja djeluju tijekom skrućivanja taline zavara", "zaostala naprezanja", "niskotaljive faze u interkristalnim zonama", "ništa od navedenog"], correct: [0, 2], note: "Tople pukotine uzrokuju naprezanja tijekom skrućivanja taline i nisko taljive faze (S, P) u interkristalnim zonama. Zaostala naprezanja nakon hlađenja nisu njihov uzrok." },
        { q: "Tople pukotine nastaju:", options: ["pri visokim temperaturama tijekom zagrijavanja", "pri visokim temperaturama tijekom hlađenja", "tijekom toplinske obrade", "na granicama zrna"], correct: [1, 3], note: "Tople pukotine nastaju pri visokim temperaturama tijekom hlađenja (skrućivanja) i to po granicama zrna (interkristalno)." },
        { q: "Koje se greške mogu naći u metalu zavara?", options: ["pukotine zbog krhkosti popuštanja", "tople pukotine", "lamelarno odvajanje", "vodikove mikropukotine"], correct: [0, 1, 3], note: "U metalu zavara mogu biti tople pukotine, vodikove mikropukotine i pukotine zbog krhkosti popuštanja. Lamelarno odvajanje nastaje u osnovnom materijalu, ispod ZUT-a." },
        { q: "Srednje- i visokougljični čelici mogu imati probleme zavarljivosti povezane s:", options: ["toplim pukotinama", "hladnim pukotinama", "porastom zrna", "prevelikom osjetljivošću na toplinski ciklus zavarivanja"], correct: [0, 1, 3], note: "Srednje- i visokougljični čelici skloni su toplim pukotinama (C i S), hladnim pukotinama (zakaljivanje) i jako su osjetljivi na toplinski ciklus zavarivanja (ključ MI 1251)." },
        { q: "Poroznost pri zavarivanju može nastati zbog:", options: ["ostataka masnoće na materijalu", "prevelike struje zavarivanja", "temeljnog premaza (primera) na materijalu", "premalog napona zavarivanja"], correct: [0, 2], note: "Pore nastaju zbog plinova iz nečistoća: masnoće, vlage, temeljnog premaza (primera), rđe. Struja i napon utječu na oblik zavara, a ne izravno na pore." },
        { q: "Koje se od sljedećih mjera mogu primijeniti za sprječavanje hladnih pukotina pri zavarivanju sitnozrnatih čelika?", options: ["određivanje unosa energije po jedinici duljine", "izbjegavanje koncentracije naprezanja", "posebno mjerenje brzog hlađenja nakon zavarivanja", "zavarivanje s predgrijavanjem (za veće debljine)"], correct: [0, 1, 3], note: "Hladne pukotine kod sitnozrnatih čelika sprječavaju se kontroliranim unosom topline (energija po duljini), izbjegavanjem koncentracije naprezanja i predgrijavanjem kod većih debljina." },
        { q: "Glavna svrha dogrijavanja (postupka uklanjanja vodika) je da vodik brzo izađe iz zavara i smanji se njegov sadržaj u zavaru i ZUT-u, radi sprječavanja:", options: ["hladnih pukotina", "toplih pukotina", "pukotine uslijed predgrijavanja", "likvacijske pukotine"], correct: [0], note: "Dogrijavanje (npr. 200–300 °C nekoliko sati odmah nakon zavarivanja) ubrzava izlazak vodika, pa sprječava hladne (vodikove) pukotine." },
        { q: "Hladne pukotine:", options: ["nastaju tijekom hlađenja", "nastaju zbog brzog hlađenja", "mogu nastati i nakon nekoliko dana", "nastaju zbog vodika"], correct: [0, 1, 2, 3], note: "Hladne pukotine nastaju pri hlađenju (ispod oko 200 °C), potiče ih brzo hlađenje (zakaljena struktura) i vodik, a mogu se pojaviti i nekoliko dana nakon zavarivanja (zakašnjele pukotine)." },
        { q: "Kako se objašnjavaju pukotine koje se javljaju pri katodnoj zaštiti?", options: ["Zn²⁺ prelazi u zavareni spoj i s Fe tvori intermetalni spoj koji pokreće pukotine", "to je problem austenitnih čelika", "plinoviti vodik stvara pore u metalu zavara i uzrokuje pukotine", "to je problem konstrukcijskih čelika: vodik difundira u ZUT i uz zaostala naprezanja i zakaljenu mikrostrukturu nastaju vodikove pukotine"], correct: [3], note: "Pri katodnoj zaštiti na čeliku se razvija vodik; on difundira u zakaljeni ZUT i uz zaostala naprezanja stvara vodikove pukotine. To je problem konstrukcijskih čelika." },
        { q: "Metode (probe) za procjenu sklonosti pojedinim tipovima pukotina u zavarenom spoju:", options: ["hladne pukotine: Tekken, Implant, CTS, Lehigh, TRC, RRC", "tople pukotine: Varestraint, Transvarestraint, Fisco, KSLA, LTP", "lamelarno odvajanje: Z-proba (IIW), Window metoda, Kanazawa metoda", "pukotine zbog naknadnog zagrijavanja: BWRA metoda, Cadmanova metoda, Vinckierova metoda"], correct: [0, 1, 2, 3], note: "Hladne pukotine: Tekken, Implant, CTS, Lehigh, TRC, RRC. Tople: Varestraint, Transvarestraint, Fisco. Lamelarno odvajanje: Z-proba, Window, Kanazawa. Naknadno zagrijavanje: BWRA, Cadman, Vinckier. Točne su sve četiri tvrdnje." },
        { q: "Opasnost od loma uslijed puzanja moguće je smanjiti:", options: ["odabirom sitnozrnatog čelika", "smanjivanjem radne temperature", "smanjivanjem narinutog naprezanja", "pretaljivanjem zavara TIG postupkom"], correct: [1, 2], note: "Lom zbog puzanja smanjuje se nižom radnom temperaturom i manjim naprezanjem. Za puzanje je povoljnije krupnije zrno, a ne sitnozrnati čelik." },
        { q: "Lom uslijed napetosne korozije (SCC). Odabrati točnu(e) tvrdnju(e):", options: ["vrijeme do loma općenito se smanjuje povećanjem naprezanja u području iznad granične vrijednosti naprezanja", "u početku je brzina širenja pukotine konstantna, a kako se pukotina širi, površina presjeka se smanjuje, a naprezanje po jedinici površine raste; brzina širenja pukotine također raste sve do loma", "vrijeme do loma općenito se povećava povećanjem naprezanja u području iznad granične vrijednosti naprezanja", "legure su puno otpornije na SCC nego čisti metali (uz iznimku Al)"], correct: [0, 1], note: "Iznad graničnog naprezanja vrijeme do loma zbog SCC-a skraćuje se s većim naprezanjem. Pukotina se ubrzava jer se presjek smanjuje i naprezanje raste. Čisti metali su u pravilu otporniji na SCC od legura." },
        { q: "Koji je pratilac čelika odlučujući za sklonost krhkosti u toplom (toplim pukotinama)?", options: ["Pb", "H₂", "Mn", "S"], correct: [3], note: "Za tople pukotine (krhkost u toplom) odlučujući je sumpor: s Fe stvara nisko taljivi FeS po granicama zrna. Mn ga veže u MnS i tako štiti." },
        { q: "Opasnost od pukotina izazvanih vodikom može se smanjiti:", options: ["predgrijavanjem", "primjenom „hladnijeg” postupka zavarivanja", "većim unosom topline", "manjim unosom topline"], correct: [0, 2], note: "Vodikove pukotine smanjuju predgrijavanje i veći unos topline, jer sporije hlađenje daje manje tvrdu strukturu i više vremena za izlazak vodika. „Hladniji“ postupak i manji unos topline povećavaju opasnost." },
        { q: "Koji spojevi mogu biti skloni lamelarnom odvajanju?", options: ["sučeoni spoj ugljičnog čelika", "T-spoj ugljičnog čelika", "sučeoni spoj nehrđajućeg čelika", "T-spoj nehrđajućeg čelika"], correct: [1], note: "Lamelarno odvajanje nastaje kad je lim opterećen u smjeru debljine, tipično kod T-spoja i kutnih spojeva ugljičnog čelika (sulfidni uključci). Nehrđajući čelici imaju malo S i nisu skloni." },
        { q: "Tople pukotine mogu se pojaviti:", options: ["u metalu zavara", "na liniji staljivanja", "u pregrijanom području ZUT-a", "u području nepotpune austenitizacije ZUT-a"], correct: [0, 1, 2], note: "Tople pukotine nastaju u metalu zavara (kristalizacijske), na liniji staljivanja i u pregrijanom dijelu ZUT-a (likvacijske). U području nepotpune austenitizacije temperatura je preniska za taljenje filmova po granicama." },
        { q: "Za izbjegavanje hladnih pukotina preporučuje se:", options: ["predgrijavanje", "primjena postupaka zavarivanja koji osiguravaju nizak udio difuzijskog vodika", "osigurati što veću krutost zavarene konstrukcije", "prethodno sušenje obloženih elektroda"], correct: [0, 1, 3], note: "Hladne pukotine sprječavaju predgrijavanje, postupci s malo difuzijskog vodika i sušenje obloženih elektroda. Veća krutost konstrukcije povećava naprezanja i opasnost." },
        { q: "Lamelarno odvajanje posljedica je:", options: ["kemijskog sastava", "nedovoljnih svojstava u smjeru osi Z (po debljini)", "nedovoljnih mehaničkih svojstava u smjeru X-Y", "preniskih vrijednosti udarnog rada loma"], correct: [0, 1], note: "Lamelarno odvajanje posljedica je kemijskog sastava (S, sulfidni uključci) i loših svojstava u smjeru debljine (os Z, mala kontrakcija Z)." },
        { q: "Hladne pukotine ugljičnih čelika posljedica su:", options: ["prisutnosti vodika", "strukture visoke tvrdoće", "prisutnosti naprezanja (upetosti)", "istodobnog djelovanja svih triju navedenih čimbenika"], correct: [3], note: "Hladne pukotine nastaju samo uz istodobno djelovanje sva tri čimbenika: vodika, tvrde (zakaljene) strukture i vlačnih naprezanja (upetosti)." },
        { q: "Koji ključni čimbenici uzrokuju hladne pukotine u čeliku?", options: ["atomarni vodik + tlačna deformacija + martenzit", "atomarni vodik + vlačno naprezanje + austenit", "atomarni vodik + vlačno naprezanje + martenzit", "plinoviti kisik + vlačno naprezanje + martenzit"], correct: [2], note: "Hladne pukotine uzrokuju atomarni vodik, vlačno naprezanje i krhka martenzitna struktura. Austenit (FCC) nije osjetljiv na vodik, a tlačna naprezanja ne otvaraju pukotine." },
        { q: "U kojem se području ZUT-a hladne pukotine najčešće pojavljuju?", options: ["u području s vršnom temperaturom između A1 i A3", "u području grubog zrna", "u području sitnog zrna", "u području popuštanja"], correct: [1], note: "Hladne pukotine najčešće nastaju u zoni grubog zrna ZUT-a uz liniju staljivanja, gdje je struktura najtvrđa." },
        { q: "Tople i hladne pukotine razlikuju se po tome što su:", options: ["tople pukotine transkristalne, a hladne interkristalne", "tople pukotine interkristalne, a hladne transkristalne", "tople pukotine nalaze se u ZUT-u", "hladne pukotine nalaze se u metalu zavara"], correct: [1], note: "Tople pukotine idu po granicama zrna (interkristalno), jer su tamo nisko taljivi filmovi, a hladne najčešće kroz zrna (transkristalno)." },
        { q: "Tople pukotine u visokolegiranom metalu zavara nastaju ako:", options: ["metal zavara skrućuje prebrzo", "metal zavara primarno skrućuje austenitno", "metal zavara nakon hlađenja ima prevelika vlačna naprezanja", "se metal zavara previše zagrije"], correct: [1], note: "Kod visokolegiranog (austenitnog) metala zavara tople pukotine nastaju kad skrućuje primarno austenitno: austenit slabo otapa S i P, pa se oni izlučuju po granicama. Primarni δ-ferit to sprječava." },
        { q: "Zašto sumpor stvara probleme pri zavarivanju čelika?", options: ["dodatak sumpora toliko povećava čvrstoću da čelik pri brzom hlađenju prekomjerno očvrsne", "dodatak sumpora čeliku ne uzrokuje probleme pri zavarivanju", "sumpor i željezo tvore eutektik koji skrućuje pri mnogo nižoj temperaturi od smjese željeza i ugljika", "sumpor i mangan tvore spoj koji slabi čelik jer uklanja mangan iz čvrste otopine"], correct: [2], note: "Sumpor i željezo tvore eutektik (Fe-FeS) koji se tali na oko 988 °C, mnogo niže od čelika, pa se pri skrućivanju zadržava kao tekući film po granicama zrna i uzrokuje tople pukotine." },
        { q: "Krhkost u toplom (tople pukotine) je:", options: ["promjena volumena zbog pretvorbe", "sklonost pukotinama zbog visokog sadržaja sumpora", "nekontrolirana pretvorba perlita u austenit", "ništa od navedenog"], correct: [1], note: "Krhkost u toplom je sklonost toplim pukotinama zbog visokog sadržaja sumpora (nisko taljivi FeS po granicama zrna)." },
        { q: "Pri većini zavarivačkih primjena brzine hlađenja pri visokim temperaturama su velike, pa legure sa širokim intervalom skrućivanja pokazuju izraženo konstitucijsko pothlađenje. Koja pojava može iz toga proizaći?", options: ["nerazmjerne deformacije", "nastanak zarobljenih plinskih mjehura", "tople pukotine", "prevelika tvrdoća"], correct: [2], note: "Široki interval skrućivanja i konstitucijsko pothlađenje ostavljaju tekuće filmove između dendrita dugo vremena, pa nastaju tople (kristalizacijske) pukotine." },
        { q: "Koja od navedenih nepravilnosti najviše povećava koncentraciju naprezanja?", options: ["pukotina", "poroznost", "uključci troske", "površinska obrada"], correct: [0], note: "Najveću koncentraciju naprezanja izaziva pukotina (oštar vrh). Slijede greške vezivanja, uključci troske, poroznost, a najmanje površinska obrada." },
        { q: "Tople pukotine su:", options: ["pukotine po sredini zavara; mogu nastati i u ZUT-u i u metalu zavara", "pukotine koje nastaju tek ispod 200 °C", "pukotine uzrokovane difuzijskim vodikom", "pukotine koje nastaju samo u osnovnom materijalu"], correct: [0], note: "Tople pukotine često su po sredini zavara (kristalizacijske), a mogu nastati i u ZUT-u (likvacijske). Pukotine ispod 200 °C i od vodika su hladne pukotine." },
        { q: "Pukotine zbog naknadne toplinske obrade i/ili naknadnog zagrijavanja zavarenog spoja su:", options: ["kristalizacijske pukotine", "SCC pukotine", "pukotine u tzv. niskotemperaturnom području (pri zagrijavanju do približno 300 °C i pri hlađenju)", "pukotine ispod platiranog sloja"], correct: [2, 3], note: "Prema predavanju pukotine zbog naknadnog zagrijavanja ili toplinske obrade uključuju pukotine u niskotemperaturnom području (do oko 300 °C, pri zagrijavanju i hlađenju) i pukotine ispod platiranog sloja (te precipitacijske)." },
        { q: "Koji bi se od sljedećih čimbenika trebali kontrolirati radi sprječavanja pukotina pri skrućivanju?", options: ["oblik spoja", "čistoća osnovnog materijala", "redoslijed zavarivanja", "brzina zavarivanja"], correct: [0, 1, 2, 3], note: "Pukotine pri skrućivanju sprječavaju se kontrolom oblika spoja (omjer dubine i širine), čistoće materijala (S, P), redoslijeda zavarivanja (upetost) i brzine zavarivanja (oblik taline)." },
        { q: "Koji čimbenici utječu na nastajanje toplih pukotina?", options: ["stupanj miješanja", "nejednoliko miješanje", "faktor oblika zavara (omjer dubine i širine)", "predgrijavanje"], correct: [0, 1, 2, 3], note: "Na tople pukotine utječu stupanj miješanja i nejednoliko miješanje (unos S, P i sastav), faktor oblika zavara i predgrijavanje (naprezanja pri skrućivanju)." },
        { q: "Koje su pojave uzrokovane upijanjem vodika u talini zavara pri zavarivanju nelegiranog čelika?", options: ["stvaranje poroznosti", "postupni pad žilavosti", "povećanje čvrstoće metala zavara", "nastanak zakašnjelih (hladnih) pukotina"], correct: [0, 3], note: "Vodik upijen u talinu stvara pore (izdvaja se pri skrućivanju) i zakašnjele (hladne) pukotine. Ne povećava čvrstoću." },
        { q: "Koji su osnovni preduvjeti za nastanak hladnih pukotina?", options: ["difuzijski vodik, zaostala naprezanja i sklonost strukture zakaljivanju", "difuzijski vodik, zaostala naprezanja, loša priprema žlijeba i previsoko predgrijavanje", "difuzijski vodik, loša žilavost zone taljenja i sklonost zakaljivanju", "sumpor, fosfor i velik unos topline"], correct: [0], note: "Preduvjeti za hladne pukotine su difuzijski vodik, zaostala naprezanja i sklonost strukture zakaljivanju. S, P i velik unos topline vezani su uz tople pukotine." },
        { q: "Za ispitivanje sklonosti čemu se koristi implant metoda?", options: ["toplim pukotinama", "hladnim pukotinama", "lamelarnom cijepanju", "koroziji"], correct: [1], note: "Implant metoda ispituje sklonost hladnim (vodikovim) pukotinama: zarezana epruveta umetne se u ploču, zavari i optereti." },
        { q: "Na kojim se temperaturama pojavljuju hladne pukotine?", options: ["ispod oko 250 °C", "iznad 500 °C", "oko 634 °C", "samo iznad 1000 °C"], correct: [0], note: "Hladne pukotine nastaju na niskim temperaturama, ispod oko 200–250 °C, kad vodik više ne može izaći iz rešetke." },
        { q: "Mjesta nastajanja toplih pukotina su:", options: ["samo u ZUT-u", "i u ZUT-u i u zoni taljenja", "samo u zoni taljenja", "samo u osnovnom materijalu izvan ZUT-a"], correct: [1], note: "Kristalizacijske tople pukotine nastaju u zoni taljenja (metalu zavara), a likvacijske (podsolidusne) u ZUT-u, pa se tople pukotine javljaju u obje zone." },
        { q: "Koja je tvrdnja o hladnim pukotinama točna?", options: ["poprečne pukotine u ZUT-u najčešće nastaju u visokougljičnom martenzitu pod djelovanjem uzdužnih naprezanja", "pukotine nastaju u metalu zavara ako je difuzija ugljika u metalu zavara slaba", "pukotine se pojavljuju u ZUT-u jer dodatni materijal sadrži malo ugljika, pa metal zavara nije zakaljiv", "pukotine u korijenu počinju u području velikog naprezanja, ali samo uz osjetljivu mikrostrukturu i visok sadržaj vodika"], correct: [2], note: "Ključ međunarodne banke: dodatni materijal obično ima manje ugljika od osnovnog, pa metal zavara nije zakaljiv; vodik difundira u zakaljeni ZUT, gdje nastaju hladne pukotine. Ostali odgovori su loše prevedeni s engleskog." },
        { q: "Sumpor je glavni element koji uzrokuje tople pukotine zato što:", options: ["sumpor ima nisko talište", "sumpor ima visok specifični toplinski kapacitet", "sumpor se lako otapa u talini čelika", "sumpor i željezo tvore niskotaljivi eutektik (FeS) koji se izlučuje po granicama zrna"], correct: [2, 3], note: "Sumpor se dobro otapa u talini, a gotovo ne otapa u krutom željezu, pa se pri skrućivanju izdvaja kao nisko taljivi eutektik FeS po granicama zrna. Sam sumpor nema bitno nisko talište u čeliku." },
        { q: "Homogenizacijsko žarenje. Odabrati točnu(e) tvrdnju(e):", options: ["provodi se na temperaturi malo ispod solidusa uz trajanje od nekoliko dana", "svrha žarenja je lokalna homogenizacija kemijskog sastava, uklanjanje kristalnih segregacija i izjednačavanje svojstava po volumenu", "provodi se na temperaturi malo ispod solidusa uz trajanje od nekoliko sati", "naziva se još i žarenje na grubo zrno"], correct: [0, 1], note: "Homogenizacijsko žarenje provodi se malo ispod solidusa i traje dugo (i više dana), da difuzija izjednači sastav i ukloni kristalne segregacije. Žarenje na grubo zrno je drugi postupak." },
        { q: "Varijante termomehaničkog valjanja su:", options: ["valjano samo u austenitnom području", "valjano i u austenitnom i u mješovitom (γ + α) području", "valjano u austenitnom i mješovitom (γ + α) području uz ubrzano hlađenje", "valjano samo u martenzitnom području"], correct: [0, 1, 2], note: "Termomehaničko valjanje može biti samo u austenitnom području, u austenitnom i dvofaznom (γ + α) području, ili tome dodano ubrzano hlađenje. U martenzitnom području se ne valja." },
        { q: "Mjerenje, regulacija i zapis toplinske obrade. Odabrati točne tvrdnje:", options: ["temperatura se pri toplinskoj obradi najčešće mjeri termoparovima, izravno na obrađivanom dijelu", "regulacija temperature najčešće se provodi P- i D-regulacijom", "proces se programira mikroprocesorskim programatorima različitih funkcija", "zapis provedenog procesa dokaz je provedene tehnologije"], correct: [0, 1, 2, 3], note: "Temperatura se mjeri termoparovima izravno na dijelu, regulira (P, PID) regulacijom, proces se programira mikroprocesorskim programatorima, a zapis je dokaz provedene tehnologije." },
        { q: "Na kojoj se temperaturi žare čelici radi smanjenja zaostalih naprezanja?", options: ["100–150 °C", "250–450 °C", "550–650 °C (do 680 °C)", "1050–1100 °C"], correct: [2], note: "Žarenje za smanjenje zaostalih naprezanja (PWHT) čelika najčešće se provodi na oko 550–650 °C (do oko 680 °C), ispod A1." },
        { q: "Koje su najčešće vrste toplinske obrade poslije zavarivanja?", options: ["predgrijavanje i držanje na temperaturi predgrijavanja", "zagrijavanje na 950 °C i brzo hlađenje", "žarenje, normalizacija i dr.", "kaljenje u vodi"], correct: [2], note: "Najčešća toplinska obrada nakon zavarivanja je žarenje (za redukciju naprezanja), a ponekad normalizacija. Gašenje i kaljenje se ne primjenjuju na zavarene konstrukcije." },
        { q: "Zašto se provodi žarenje za smanjenje zaostalih naprezanja poslije zavarivanja?", options: ["da se grubo zrno pretvori u sitno", "da se poboljša korozijska otpornost", "da se smanje unutarnja naprezanja u konstrukciji", "da se poveća tvrdoća"], correct: [2], note: "Žarenje nakon zavarivanja provodi se da se smanje unutarnja (zaostala) naprezanja u konstrukciji. Usitnjavanje zrna postiže normalizacija." },
        { q: "Normalizacijsko žarenje (podeutektoidnih čelika) provodi se na temperaturi:", options: ["500–600 °C", "iznad A1 linije", "iznad A3 linije", "iznad linije solidusa"], correct: [2], note: "Normalizacija podeutektoidnih čelika provodi se na A3 + 30–50 °C (iznad A3), uz hlađenje na zraku." },
        { q: "Postupak poboljšavanja provodi se uobičajeno na čelicima sa sadržajem ugljika:", options: ["0,025–0,2 %", "0,3–0,6 %", "0,6–0,8 %", "0,8–2,03 %"], correct: [1], note: "Poboljšavaju se čelici s oko 0,3–0,6 % C (čelici za poboljšavanje, npr. 42CrMo4): dovoljno C za kaljenje, a ne previše za žilavost." },
        { q: "Postupak poboljšavanja sastoji se od:", options: ["kaljenja i visokotemperaturnog popuštanja", "kaljenja i niskotemperaturnog popuštanja", "kaljenja i ohlađivanja na −70 °C", "popuštanja zaostalih napetosti i rekristalizacijskog žarenja"], correct: [0], note: "Poboljšavanje je kaljenje i visokotemperaturno popuštanje (oko 500–680 °C). Niskotemperaturno popuštanje daje kaljeno i nisko popušteno stanje (alati)." },
        { q: "Ekvivalent ugljika Ceq moguće je izračunati metodom:", options: ["Seferiana", "„Ivo-Tanake”", "BWRA", "IIW-a i CEN-a (IIW – International Institute of Welding; CEN – European Committee for Standardization)"], correct: [0, 3], note: "Ekvivalent ugljika računa se npr. prema IIW-u i CEN-u, a vlastiti izraz ima i Séférianova metoda. BWRA je proba za pukotine zbog naknadnog zagrijavanja." },
        { q: "Zašto je zakaljivanje (otvrdnjavanje) nepoželjno u zavarenom spoju?", options: ["zato što materijal postaje žilaviji", "zato što uzrokuje krhkost", "zato što se tople pukotine pojavljuju duž granica zrna", "zato što se zaostala naprezanja ne mogu ukloniti plastičnom deformacijom"], correct: [1, 3], note: "Zakaljena struktura je krhka, a zaostala naprezanja ne mogu se razgraditi plastičnom deformacijom (nema duktilnosti), pa se lako stvaraju pukotine (ključ IIW 1228)." },
        { q: "Koji od četiri čelika imaju dobru zavarljivost, uz pretpostavku jednake debljine i jednakog udjela ostalih elemenata?", options: ["C = 0,08 %, Mn = 0,90 %", "C = 0,45 %, Mn = 1,20 %", "C = 0,08 %, Mn = 1,60 %", "C = 0,45 %, Mn = 0,90 %"], correct: [0, 2], note: "Dobru zavarljivost imaju čelici s niskim ugljikom (0,08 % C); i s 1,6 % Mn Cekv ostaje nizak (oko 0,35). Čelici s 0,45 % C su zakaljivi i loše zavarljivi." },
        { q: "Koji važni čimbenici utječu na čvrstoću i žilavost konstrukcijskih čelika?", options: ["sitno zrno, očvrsnuće kristala mješanaca s Mn i Si, udio perlita, nizak sadržaj S + P", "precipitacijsko i disperzijsko očvrsnuće česticama sekundarnih faza, sitno zrno", "kontrolirano valjanje i ubrzano hlađenje", "mikrolegiranje, nizak sadržaj ugljika, kontrolirani oblik sulfida i kontrolirano valjanje"], correct: [0, 1, 2, 3], note: "Na čvrstoću i žilavost utječu sitno zrno, mješanci (Mn, Si), udio perlita, čistoća (S, P), precipitacija i disperzija čestica, kontrolirano valjanje i ubrzano hlađenje te mikrolegiranje i kontrolirani oblik sulfida. Točna su sva četiri." },
        { q: "Koja je uloga mangana u kemijskom sastavu čelika legiranog manganom?", options: ["poboljšava mehanička svojstva (otpornost na lom, granicu razvlačenja…)", "sprječava puhanje luka", "osigurava dobru oksidaciju taline", "otapa se u feritu i povećava njegovu čvrstoću"], correct: [0, 3], note: "Mangan se otapa u feritu i očvršćuje ga, pa poboljšava mehanička svojstva (granica razvlačenja, žilavost); veže i sumpor u MnS. S puhanjem luka nema veze (ključ MI 368)." },
        { q: "Kojim redoslijedom treba polagati prolaze završnog (pokrivnog) sloja pri zavarivanju C-Mn čelika?", options: ["u jednom prolazu, njihanjem lijevo-desno dok se spoj ne ispuni", "uskim prolazima duž zavara, počevši od sredine spoja, naizmjenično lijevo i desno do zatvaranja spoja", "uskim prolazima duž zavara, od rubova spoja prema osi, s posljednjim prolazom u sredini; svaki prolaz prekriva oko 40 % prethodnog", "tankim prolazima poprečno na spoj, od jednog ruba do drugog"], correct: [2], note: "Završni sloj polaže se uskim prolazima od rubova prema osi, a zadnji prolaz je u sredini; svaki prekriva oko 40 % prethodnog, pa sljedeći prolazi popuštaju i usitnjavaju prethodne." },
        { q: "Što se preporučuje kao kriterij granice zavarljivosti C-Mn čelika?", options: ["ekvivalent ugljika (CE)", "sadržaj Mn", "debljina", "sadržaj Ni"], correct: [0], note: "Kao kriterij granice zavarljivosti C-Mn čelika preporučuje se ekvivalent ugljika (Cekv), jer obuhvaća utjecaj C i legirnih elemenata na zakaljivost." },
        { q: "Kada se pogoršava zavarljivost čelika s obzirom na sadržaj ugljika?", options: ["iznad 0,4 % C", "iznad 0,25 % C", "iznad 0,1 % C", "iznad 1 % C"], correct: [1], note: "Zavarljivost se pogoršava iznad oko 0,22–0,25 % C; tada treba predgrijavanje i druge mjere." },
        { q: "Kako ugljik utječe na zavarljivost?", options: ["s više ugljika zavarljivost se smanjuje", "povećava sklonost toplim pukotinama i pukotinama zbog zakaljivanja", "povećava zavarljivost", "nema utjecaja"], correct: [0, 1], note: "Više ugljika znači lošiju zavarljivost: raste zakaljivost (hladne pukotine) i sklonost toplim pukotinama." },
        { q: "Kakav treba biti dodatni materijal za nelegirane konstrukcijske čelike?", options: ["takav da zavar ima veću čvrstoću od osnovnog materijala", "približno istog kemijskog sastava kao osnovni materijal", "kemijski sastav nije bitan", "sa što više ugljika"], correct: [0], note: "Dodatni materijal za nelegirane konstrukcijske čelike bira se tako da metal zavara ima čvrstoću jednaku ili veću od osnovnog materijala (overmatching), uz dovoljnu žilavost i manje ugljika." },
        { q: "Za ocjenu zavarljivosti čelika koriste se:", options: ["Cr ekvivalent", "C ekvivalent", "pukotinski parametar", "stupanj tetragonalnosti"], correct: [1, 2], note: "Zavarljivost se ocjenjuje ekvivalentom ugljika i pukotinskim parametrom (npr. Pcm, koji uzima u obzir i debljinu i vodik). Cr-ekvivalent služi za Schaefflerov dijagram." },
        { q: "Prijelazna temperatura se povisuje:", options: ["porastom sadržaja ugljika", "porastom sadržaja mangana", "porastom sadržaja kroma", "porastom sadržaja nikla"], correct: [0, 2], note: "Prijelaznu temperaturu povisuju ugljik (više perlita) i većina legirnih elemenata, npr. Cr. Snizuju je samo usitnjenje zrna, Ni i Mn." },
        { q: "Najnižu lomnu žilavost od navedenih čelika imaju:", options: ["poboljšani čelici", "TRIP čelici", "PH austenitni čelici", "čelici proizvedeni ausforming postupkom"], correct: [0], note: "Od navedenih čelika najnižu lomnu žilavost imaju poboljšani (kaljeni i popušteni) ultračvrsti čelici. TRIP čelici imaju najveću lomnu žilavost, a ausforming i PH čelici također su žilaviji pri istoj čvrstoći." },
        { q: "Postupak marforming. Odabrati točnu(e) tvrdnju(e):", options: ["prikladni su čelici s 0,3–0,4 % C, tj. oni kod kojih u kaljenoj strukturi prevladava masivni, a ne igličasti martenzit", "postupak uzrokuje znatno povišenje granice razvlačenja uz vrlo malo snižavanje istezljivosti", "postupak uzrokuje znatno povišenje granice razvlačenja uz znatno snižavanje istezljivosti", "prikladni su čelici s 0,6–0,7 % C, tj. oni kod kojih u kaljenoj strukturi prevladava igličasti martenzit"], correct: [0, 1], note: "Marforming (deformacija martenzita pa popuštanje) prikladan je za čelike s 0,3–0,4 % C, s masivnim (letvičastim) martenzitom. Znatno povisuje granicu razvlačenja, a istezljivost se tek malo snizuje." },
        { q: "Sitnozrnati čelici. Odabrati točnu(e) tvrdnju(e):", options: ["mikrolegirni elementi povećavaju tvrdoću ferita jer nastaju kristali mješanci", "mikrolegirni elementi smanjuju zrno jer nastaju klice (spojevi izlučeni u austenitu)", "mikrolegirni elementi smanjuju zrno jer ubrzavaju rekristalizaciju austenita", "mikrolegirni elementi su Al, Mn i Si"], correct: [0, 1], note: "Mikrolegirni elementi (Nb, V, Ti) izlučuju se kao karbonitridi u austenitu i djeluju kao klice, pa usitnjavaju zrno; dio ostaje otopljen i očvršćuje ferit. Rekristalizaciju austenita koče, a ne ubrzavaju. Mn i Si nisu mikrolegirni elementi." },
        { q: "Zavarljivi sitnozrnati čelici odlikuju se:", options: ["visokom žilavošću", "visokom tvrdoćom", "visokim ekvivalentom ugljika", "niskim sadržajem Mn"], correct: [0], note: "Zavarljivi sitnozrnati čelici imaju sitno zrno, nisko C i nizak Cekv, pa im je glavna odlika visoka žilavost uz povišenu granicu razvlačenja. Mn im je povišen (do oko 1,5 %)." },
        { q: "Koje su prednosti normaliziranih sitnozrnatih čelika u usporedbi s čelicima prema EN 10025?", options: ["povećana otpornost prema krhkom lomu", "manja debljina dijelova zbog veće granice razvlačenja", "povećana korozijska otpornost", "pojednostavljeno zavarivanje"], correct: [0, 1], note: "U usporedbi s čelicima prema EN 10025 normalizirani sitnozrnati čelici imaju veću otpornost krhkom lomu (sitno zrno) i veću granicu razvlačenja, pa dijelovi mogu biti tanji (ključ MI 1259)." },
        { q: "Koja je razlika u žilavosti ZUT-a između klasičnog ugljičnog čelika i niskougljičnog HSLA čelika pri vrlo malom unosu topline?", options: ["ugljični čelici daju martenzit niske žilavosti, a niskougljični HSLA čelici donji bainit visoke žilavosti", "ugljični čelici daju martenzit niske žilavosti, a niskougljični HSLA čelici martenzit visoke žilavosti", "ugljični čelici daju martenzit visoke žilavosti, a niskougljični HSLA čelici bainit visoke žilavosti", "ugljični čelici daju gornji bainit visoke žilavosti, a niskougljični HSLA čelici donji bainit visoke žilavosti"], correct: [1], note: "Pri vrlo malom unosu topline oba čelika daju martenzit u ZUT-u, ali je martenzit ugljičnog čelika (više C) krhak, a niskougljični martenzit HSLA čelika žilav." },
        { q: "Koji se mikrolegirni element dodaje čeliku kako bi se uklonilo područje grubog zrna u ZUT-u neposredno uz liniju staljivanja?", options: ["molibden", "titan", "aluminij", "bakar"], correct: [1], note: "Titan stvara stabilne nitride (TiN) koji se ne otapaju ni pri najvišim temperaturama ZUT-a, pa koče rast zrna uz liniju staljivanja. Al-nitridi i Nb-karbonitridi se ondje otapaju." },
        { q: "Kako se uobičajeno razvrstavaju sitnozrnati čelici?", options: ["normalizirani (N)", "gašeni u tekućini i popušteni (Q)", "visokolegirani", "termomehanički obrađeni (M)"], correct: [0, 1, 3], note: "Sitnozrnati čelici se dijele na normalizirane (N, npr. S355N), gašene i popuštene (Q, npr. S690Q) i termomehanički valjane (M, npr. S420M)." },
        { q: "Koji su glavni rizici pri zavarivanju debelih sitnozrnatih čelika?", options: ["prekratko vrijeme hlađenja t8/5", "pad čvrstoće (omekšavanje)", "pad tvrdoće", "rizik od hladnih pukotina"], correct: [1, 2, 3], note: "Ključ zbirke: kod debelih sitnozrnatih čelika (posebno Q i M) prevelik unos topline smanjuje čvrstoću i tvrdoću u ZUT-u (omekšavanje), a debljina povećava rizik od hladnih pukotina. ⚠️ Kod debelih limova i prekratko t8/5 (premali unos topline) vodi u tvrdu strukturu i hladne pukotine, pa je i a) zapravo rizik; pamti po ključu." },
        { q: "S kemijskog stajališta sitnozrnati C-Mn čelici općenito imaju:", options: ["C manje od 0,18–0,2 %", "C više od 0,18–0,2 %", "Mn povišen do 1–1,5 %", "mikrolegirne elemente koji tvore nitride i/ili karbonitride"], correct: [0, 2, 3], note: "Sitnozrnati C-Mn čelici imaju nizak C (ispod oko 0,18–0,2 %), povišen Mn (1–1,5 %) i mikrolegirne elemente (Nb, V, Ti, Al) koji tvore nitride i karbonitride." },
        { q: "Postupkom zerolling pri sobnoj temperaturi dio austenita pretvara se u:", options: ["deformacijski ferit", "deformacijski perlit", "deformacijski bainit", "deformacijski martenzit"], correct: [3], note: "Zerolling je deformacija austenitnog (metastabilnog) čelika pri sobnoj temperaturi: deformacijom dio austenita prelazi u deformacijski martenzit." },
        { q: "S obzirom na fazne pretvorbe, termomehanički obrađivani čelici mogu biti:", options: ["TMO", "TLO", "MTO", "MLO"], correct: [0, 2], note: "S obzirom na fazne pretvorbe razlikuje se TMO (termomehanička obrada: deformacija prije ili za vrijeme pretvorbe) i MTO (mehanotermička obrada: deformacija bez fazne pretvorbe). TLO i MLO ne postoje." },
        { q: "Postupak perliforming provodi se nakon:", options: ["kontinuiranog gašenja", "kontinuiranog grijanja", "izotermičke pretvorbe", "izobarne pretvorbe"], correct: [0, 2], note: "Perliforming je oblikovanje perlita: provodi se nakon kontinuirane pretvorbe austenita u perlit (na slajdu „nakon kontinuiranog gašenja“, nelegirani čelici) ili nakon izotermičke pretvorbe u perlit (legirani čelici)." },
        { q: "Za postupak ausforming posebno su prikladni:", options: ["visokolegirani čelici s odvojenim područjima austenita i perlita", "visokolegirani čelici s odvojenim područjima austenita i martenzita", "visokolegirani čelici s odvojenim područjima austenita i bainita", "visokolegirani čelici s odvojenim područjima perlita i bainita"], correct: [3], note: "Ausforming je deformacija pothlađenog austenita u „zaljevu“ TTT dijagrama između perlitnog i bainitnog područja, pa su prikladni visokolegirani čelici kod kojih su ta dva područja jasno odvojena." },
        { q: "Termomehaničke obrade su:", options: ["perliforming", "patentiranje", "kaljenje", "isoforming"], correct: [0, 3], note: "U podjeli ultračvrstih čelika termomehanički obrađeni su perliforming, isoforming, ausforming, TRIP i marforming. Patentiranje i kaljenje su klasične toplinske obrade." },
        { q: "Termomehaničke obrade su:", options: ["rekristalizacija", "ausforming", "izotermičko poboljšavanje", "marforming"], correct: [1, 3], note: "Ausforming i marforming ubrajaju se u termomehaničke obrade ultračvrstih čelika. Rekristalizacija i izotermičko poboljšavanje (austempering) su toplinske obrade bez deformacije." },
        { q: "Postupak TRIP daje odličnu kombinaciju:", options: ["tvrdoće i čvrstoće", "istezljivosti i tvrdoće", "čvrstoće i žilavosti", "krhkosti i deformabilnosti"], correct: [2], note: "TRIP (Transformation Induced Plasticity): austenit se pri deformaciji pretvara u martenzit, pa čelik ima odličnu kombinaciju čvrstoće i žilavosti (i istezljivosti)." },
        { q: "Koja je optimalna temperatura postupka isoforming?", options: ["400 °C", "500 °C", "600 °C", "700 °C"], correct: [2], note: "Isoforming se provodi u području perlitne pretvorbe; optimalna temperatura je oko 600 °C." },
        { q: "Pri postupku isoforming očvrsnuće nastaje očvrsnućem austenita i nastankom:", options: ["grubozrnatog martenzita", "sitnozrnatog bainita", "grubozrnatog perlita", "sitnozrnatog perlita"], correct: [3], note: "Kod isoforminga deformacija se izvodi za vrijeme izotermičke pretvorbe austenita u perlit, pa očvrsnuće daje deformirani austenit i nastanak sitnozrnatog perlita." },
        { q: "Kod postupka TRIP austenit se pretvara u martenzit:", options: ["grijanjem", "gašenjem", "deformiranjem", "kugličarenjem"], correct: [2], note: "Kod TRIP postupka metastabilni austenit se pretvara u martenzit deformiranjem (deformacijom inducirana pretvorba)." },
        { q: "TRIP je varijanta postupka:", options: ["perliforming", "isoforming", "ausforming", "marforming"], correct: [2], note: "TRIP je varijanta ausforminga: deformira se austenit, a pretvorba u martenzit događa se kasnije deformacijom pri uporabi ili oblikovanju." },
        { q: "Oblikovanje deformacijskog martenzita (zerolling) odvija se pri:", options: ["visokoj temperaturi", "povišenoj temperaturi", "sobnoj temperaturi", "sniženoj temperaturi"], correct: [2], note: "Zerolling (oblikovanje deformacijskog martenzita) provodi se pri sobnoj temperaturi." },
        { q: "Termomehanička obrada kombinira učinke:", options: ["površinske zaštite i toplinske obrade", "obrade deformiranjem i toplinske obrade", "obrade odvajanjem čestica i obrade deformiranjem", "lijevanja i obrade odvajanjem čestica"], correct: [1], note: "Termomehanička obrada kombinira obradu deformiranjem (oblikovanje) i toplinsku obradu (fazne pretvorbe), pa se postižu svojstva koja nijedna od njih ne daje sama." },
        { q: "Jedan od postupaka termomehaničke obrade je:", options: ["popuštanje", "izotermičko žarenje", "austempering", "marforming"], correct: [3], note: "Marforming (deformacija martenzita pa popuštanje) jedan je od postupaka termomehaničke obrade. Popuštanje, izotermičko žarenje i austempering su toplinske obrade." },
        { q: "Na kojim se temperaturama provodi oblikovanje kod postupka perliforming?", options: ["100–300 °C", "300–500 °C", "500–700 °C", "700–900 °C"], correct: [2], note: "Kod perliforminga perlit se oblikuje na 500–700 °C." },
        { q: "Postupak isoforming izvodi se u temperaturnom području:", options: ["ferita", "perlita", "austenita", "martenzita"], correct: [1], note: "Isoforming se izvodi u temperaturnom području perlita (oko 600 °C), za vrijeme izotermičke pretvorbe austenita u perlit." },
        { q: "Koji je optimalni stupanj oblikovanja kod postupka ausforming?", options: ["10 %", "30 %", "50 %", "70 %"], correct: [3], note: "Kod ausforminga stupanj deformacije pothlađenog austenita treba biti velik, najmanje oko 70 %." },
        { q: "Porastom stupnja deformacije kod postupka ausforming:", options: ["raste Rm i pada Rp0,2", "pada Rm i raste Rp0,2", "pada Rm i pada Rp0,2", "raste Rm i raste Rp0,2"], correct: [3], note: "Kod ausforminga s većim stupnjem deformacije rastu i vlačna čvrstoća Rm i granica razvlačenja Rp0,2 (finiji martenzit, više dislokacija)." },
        { q: "Postupak marforming:", options: ["znatno snizuje granicu razvlačenja, malo snizuje istezljivost", "znatno povisuje granicu razvlačenja, malo snizuje istezljivost", "znatno snizuje granicu razvlačenja, malo povisuje istezljivost", "znatno povisuje granicu razvlačenja, malo povisuje istezljivost"], correct: [1], note: "Marforming znatno povisuje granicu razvlačenja, a istezljivost se tek malo snizuje." },
        { q: "Za postupak marforming prikladni su čelici s:", options: ["0,1–0,2 % C", "0,0–0,3 % C", "0,3–0,4 % C", "0,4–0,5 % C"], correct: [2], note: "Za marforming su prikladni čelici s 0,3–0,4 % C, kod kojih u kaljenoj strukturi prevladava masivni (letvičasti) martenzit." },
        { q: "Austenitni PH čelici imaju granicu razvlačenja Rp0,2:", options: ["700–800 N/mm²", "1000–1100 N/mm²", "1300–1500 N/mm²", "1600–1700 N/mm²"], correct: [0], note: "Austenitni PH čelici imaju najnižu granicu razvlačenja od PH čelika, oko 700–800 N/mm². Martenzitni i poluaustenitni PH čelici dosežu više od 1000 N/mm²." },
        { q: "Kod mehanotermičke obrade deformacija se ostvaruje:", options: ["prije pretvorbe ili za vrijeme pretvorbe", "bez faznih pretvorbi", "za vrijeme pretvorbe ili nakon pretvorbe", "nakon pretvorbe"], correct: [1], note: "Kod mehanotermičke obrade (MTO) deformacija se ostvaruje bez faznih pretvorbi, npr. oblikovanje martenzita ili perlita." },
        { q: "Do kojeg stupnja oblikovanja kod perliforminga očekujemo porast očvrsnuća?", options: ["≤ 50 %", "≤ 60 %", "≤ 70 %", "≤ 80 %"], correct: [2], note: "Kod perliforminga očvrsnuće raste do stupnja oblikovanja od oko 70 %; dalje ne raste bitno." },
        { q: "Snižavanje žilavosti kod perliforminga događa se ako je temperatura oblikovanja:", options: ["oko 400 °C", "oko 500 °C", "oko 600 °C", "oko 700 °C"], correct: [1], note: "Kod perliforminga žilavost pada ako se oblikuje na nižoj temperaturi, oko 500 °C, kad je očvrsnuće najjače." },
        { q: "Od ultračvrstih čelika izrađuju se dijelovi:", options: ["dječjih kolica", "trkaćih automobila", "batiskafa", "bicikala"], correct: [1, 2], note: "Ultračvrsti čelici (Re > 1000 N/mm²) koriste se za vrlo opterećene i lagane dijelove: trkaće automobile, batiskafe, rakete, zrakoplovne dijelove. Za dječja kolica i bicikle nisu potrebni." },
        { q: "U ultračvrste čelike za poboljšavanje ubrajamo sljedeće skupine čelika:", options: ["niskolegirani niskopopušteni čelici", "niskolegirani visokopopušteni čelici", "visokolegirani niskopopušteni čelici", "visokolegirani visokopopušteni čelici"], correct: [0, 3], note: "Ultračvrsti čelici za poboljšavanje su niskolegirani niskopopušteni (npr. 4340) i visokolegirani visokopopušteni (npr. alatni čelici tipa H11 sa sekundarnom tvrdoćom)." },
        { q: "Od niskolegiranih niskopopuštenih ultračvrstih čelika izrađuju se dijelovi:", options: ["ručnog alata", "tijela svemirskih raketa", "rampi za lansiranje", "usisivača za prašinu"], correct: [1, 2], note: "Od niskolegiranih niskopopuštenih ultračvrstih čelika rade se tijela svemirskih raketa, rampe za lansiranje, podvozja zrakoplova i slični jako opterećeni dijelovi." },
        { q: "U ultračvrste korozijski postojane precipitacijski očvrsnute (PH) čelike ubrajamo:", options: ["austenitne PH čelike", "feritne PH čelike", "ledeburitne PH čelike", "martenzitne PH čelike"], correct: [0, 3], note: "Korozijski postojani PH čelici dijele se na martenzitne, poluaustenitne i austenitne. Feritni i ledeburitni PH čelici ne postoje." },
        { q: "Maraging čelici daju odličnu kombinaciju:", options: ["plastičnosti i zavarljivosti", "istezljivosti i krhkosti", "čvrstoće i žilavosti", "krhkosti i kontrakcije"], correct: [0, 2], note: "Maraging čelici (18 % Ni, Co, Mo, Ti; vrlo malo C) imaju vrlo visoku čvrstoću uz dobru žilavost i plastičnost te izvrsnu zavarljivost, jer niskougljični Fe-Ni martenzit nije krhak." },
        { q: "Koja je optimalna temperatura popuštanja visokolegiranih visokopopuštenih ultračvrstih čelika?", options: ["400–450 °C", "500–550 °C", "600–650 °C", "700–750 °C"], correct: [1], note: "Ključ izvora: visokolegirani visokopopušteni ultračvrsti čelici popuštaju se u području najveće sekundarne tvrdoće, oko 500–550 °C." },
        { q: "Toplinska obrada austenitnog PH čelika sastoji se od:", options: ["kaljenja i žarenja", "kaljenja i normalizacije", "rastvornog žarenja i starenja", "žarenja i cementiranja"], correct: [2], note: "Austenitni PH čelici rastvorno se žare (otope precipitati) i zatim umjetno stare (izlučuju se precipitati koji očvršćuju)." },
        { q: "Legirni elementi visokolegiranih visokopopuštenih čelika imaju ulogu stvaranja:", options: ["nitrida", "karbida", "borida", "oksida"], correct: [1], note: "Kod visokolegiranih visokopopuštenih čelika legirni elementi (Cr, Mo, V, W) stvaraju fine karbide pri popuštanju, pa daju sekundarnu tvrdoću." },
        { q: "Austenitni PH čelici imaju:", options: ["9–10 % Cr i 2–3 % Ni", "14–18 % Cr i 25 % Ni", "10–12 % Cr i 10–12 % Ni", "12–13 % Cr i 8–9 % Ni"], correct: [1], note: "Austenitni PH čelici (npr. A286) imaju oko 14–18 % Cr i oko 25 % Ni, uz Ti i Al za precipitaciju." },
        { q: "Precipitacija kod martenzitnih PH čelika odvija se iz:", options: ["martenzita", "perlita", "ferita", "austenita"], correct: [0], note: "Kod martenzitnih PH čelika (npr. 17-4 PH) precipitati (npr. Cu) izlučuju se pri starenju iz martenzita." },
        { q: "Maraging čelici „otkriveni” su:", options: ["prije I. svjetskog rata", "prije II. svjetskog rata", "60-ih godina XX. stoljeća", "u XIX. stoljeću"], correct: [2], note: "Maraging čelici razvijeni su krajem 1950-ih i početkom 1960-ih (INCO), pa se kao otkriće uzimaju 60-e godine XX. stoljeća." },
        { q: "Sekundarna tvrdoća javlja se kada nakon kaljenja imamo veliki udio zaostalog:", options: ["ferita", "bainita", "austenita", "karbida"], correct: [2], note: "Sekundarna tvrdoća: nakon kaljenja visokolegiranih čelika ostaje mnogo zaostalog austenita, koji se pri popuštanju raspada u martenzit, a izlučuju se i fini karbidi, pa tvrdoća raste." },
        { q: "Ultračvrsti čelici su oni koji imaju:", options: ["Rp0,2 < 1000 N/mm²", "Rp0,2 = 1000 N/mm²", "Rp0,2 > 1000 N/mm²", "Rp0,2 > 2000 N/mm²"], correct: [2], note: "Ultračvrsti čelici imaju granicu razvlačenja Rp0,2 veću od 1000 N/mm²." },
        { q: "Primjena konstrukcijskih čelika. Odabrati točnu(e) tvrdnju(e):", options: ["nelegirani čelici rabe se za jako opterećene dijelove strojeva i vozila", "čelici za nosive konstrukcije trebaju ispuniti zahtjeve nosivosti i sigurnosti, što se ostvaruje dovoljno visokom granicom razvlačenja, vlačnom, tlačnom, savojnom i smičnom čvrstoćom te žilavošću; zavarljivost je jedno od glavnih tehnoloških svojstava tih čelika", "u brodogradnji se isključivo upotrebljavaju čelici povišene čvrstoće", "za izradu visokotlačnog plinovoda upotrijebit ćemo HSLA čelik"], correct: [1, 3], note: "Čelici za nosive konstrukcije moraju zadovoljiti nosivost i sigurnost (Re, Rm, žilavost), a zavarljivost im je glavno tehnološko svojstvo. HSLA čelici (npr. API X70) standard su za visokotlačne plinovode. Nelegirani čelici nisu za jako opterećene dijelove, a u brodogradnji se koriste i obični brodograđevni čelici." },
        { q: "Poželjno je da omjer Rp0,2/Rm bude 0,7–0,9. Zašto se pri istoj vlačnoj čvrstoći traži da taj omjer ne bude 1?", options: ["niža granica razvlačenja ostavlja rezervu za plastičnu deformaciju prije loma", "viša granica razvlačenja povećava žilavost", "omjer 1 olakšava hladno oblikovanje", "omjer 1 smanjuje sklonost hladnim pukotinama"], correct: [0], note: "Omjer Rp0,2/Rm manji od 1 ostavlja rezervu: nakon početka tečenja materijal se može još plastično deformirati i očvrsnuti prije loma, pa konstrukcija upozorava deformacijom. Omjer 1 znači lom odmah nakon tečenja." },
        { q: "Puzanje. Odabrati točnu(e) tvrdnju(e):", options: ["lom uslijed puzanja može biti transkristalni i interkristalni", "pri višim temperaturama dolazi do interkristalnog loma", "pri nižim temperaturama dolazi do transkristalnog loma", "vrsta loma ne ovisi o temperaturi"], correct: [0, 1, 2], note: "Lom zbog puzanja može biti transkristalni i interkristalni: pri nižim temperaturama (i većim naprezanjima) transkristalni, a pri višim temperaturama interkristalni (granice zrna su tada slabije od zrna)." },
        { q: "Mo i Mo-Cr niskolegirani čelici za rad pri visokim temperaturama (< 550 °C). Odabrati točnu(e) tvrdnju(e):", options: ["pri dugotrajnom radu iznad 450 °C dolazi do slabljenja zbog rekristalizacije matrice i koagulacije karbida, ponajprije Fe₃C", "legiraju se karbidotvorcima (Mo, Cr, V) i elementima koji povisuju temperaturu rekristalizacije (Mo)", "pri dugotrajnom radu iznad 450 °C dolazi do slabljenja zbog koagulacije matrice i rekristalizacije karbida, ponajprije Fe₃C₂O₂", "mehanička svojstva postižu se precipitacijom intermetalnih spojeva i/ili karbida"], correct: [0, 1, 3], note: "Dugotrajnim radom iznad 450 °C čelici slabe zbog rekristalizacije matrice i koagulacije karbida (Fe3C). Mo i Mo-Cr čelici legiraju se karbidotvorcima (Mo, Cr, V) i elementima koji povisuju temperaturu rekristalizacije, a svojstva postižu precipitacijom karbida i intermetalnih spojeva. Ponuda c) zamjenjuje pojmove i navodi nepostojeći spoj." },
        { q: "Čelici predviđeni za rad pri povišenim temperaturama moraju se odlikovati sljedećim tehnološkim svojstvima:", options: ["dobra zavarljivost i dobra oblikovljivost u hladnom i toplom stanju", "visoka tvrdoća", "dobra prokaljivost i zakaljivost", "povišena otpornost na istezanje pri visokim temperaturama"], correct: [0], note: "Čelici za povišene temperature moraju se dobro zavarivati i oblikovati u hladnom i toplom stanju (tehnološka svojstva). Visoka tvrdoća i prokaljivost nisu zahtjev." },
        { q: "Kakva je struktura pogodnija s obzirom na otpornost puzanju?", options: ["malozrnata", "sitnozrnata", "srednjezrnata", "grubozrnata"], correct: [3], note: "Pri visokim temperaturama lom je interkristalan i puzanje teče klizanjem po granicama zrna, pa je grubozrnata struktura (manje granica) otpornija puzanju." },
        { q: "Od superlegura izrađuju se dijelovi:", options: ["radijatora", "brodskih turbina", "avionskih turbina", "kotlova"], correct: [1, 2], note: "Superlegure (Ni, Co) koriste se za najopterećenije dijelove na visokim temperaturama: lopatice avionskih i brodskih (plinskih) turbina." },
        { q: "Austenitni toplinski visokopostojani čelici primjenjuju se za rad pri temperaturama:", options: ["400–450 °C", "500–550 °C", "600–800 °C", "900–1000 °C"], correct: [2], note: "Austenitni toplinski visokopostojani čelici rabe se na oko 600–800 °C, gdje feritni i martenzitni čelici više ne zadovoljavaju." },
        { q: "Koje su povišene, a koje visoke radne temperature?", options: ["0,25 Tt < Tr < 0,4 Tt", "0,15 Tt < Tr < 0,3 Tt", "Tr > 0,25 Tt", "Tr > 0,4 Tt"], correct: [0, 3], note: "Povišene radne temperature su 0,25 Tt < Tr < 0,4 Tt (za Fe-legure oko 180–450 °C), a visoke Tr > 0,4 Tt (iznad oko 450 °C); Tt je talište u K." },
        { q: "Pri dugotrajnom radu iznad 450 °C nelegirani čelici slabe zbog:", options: ["rekristalizacije matrice", "koagulacije karbida, ponajprije Fe₃C", "umora materijala", "otapanja ferita"], correct: [0, 1], note: "Dugotrajnim radom iznad 450 °C nelegirani čelici slabe zbog rekristalizacije matrice i koagulacije (okrupnjavanja) karbida, ponajprije Fe3C." },
        { q: "Superlegure se kratkotrajno mogu opteretiti pri temperaturama do:", options: ["0,7 Tt", "0,8 Tt", "0,9 Tt", "1,0 Tt"], correct: [1], note: "Superlegure se mogu kratkotrajno opteretiti do oko 0,8 Tt (dugotrajno do oko 0,7 Tt)." },
        { q: "Proces, a i dijagram puzanja, podijeljen je na:", options: ["2 stadija", "3 stadija", "4 stadija", "5 stadija"], correct: [1], note: "Krivulja puzanja ima tri stadija: primarno (usporeno), sekundarno (stacionarno) i tercijarno (ubrzano) puzanje do loma." },
        { q: "Superlegure su legure:", options: ["Cr i/ili Co", "Ni i/ili Mo", "Ni i/ili Co", "Mo i/ili V"], correct: [2], note: "Superlegure su legure na bazi nikla i/ili kobalta (npr. Nimonic, Inconel, Hastelloy, Stellite)." },
        { q: "Utvrđivanje granice puzanja RDVM traje:", options: ["10 sati", "45 sati", "100 sati", "155 sati"], correct: [1], note: "Granica puzanja prema DVM-u određuje se kratkotrajnim pokusom od 45 sati (brzina puzanja u određenom intervalu)." },
        { q: "Kako se zove pojava kod materijala izloženih visokoj temperaturi i stalnom opterećenju?", options: ["puzanje", "umor", "korozija", "trošenje"], correct: [0], note: "Puzanje je polagana, trajna plastična deformacija materijala izloženog visokoj temperaturi i stalnom opterećenju." },
        { q: "Visokolegirani čelici otporni na visoke temperature su:", options: ["kotlovski čelici", "sitnozrnati čelici", "super 12 % Cr čelici", "austenitni CrNi čelici"], correct: [2, 3], note: "Visokolegirani čelici za visoke temperature su super 12 % Cr (martenzitni, do oko 600 °C) i austenitni CrNi čelici. Kotlovski i sitnozrnati čelici su nelegirani ili niskolegirani." },
        { q: "Kakvu strukturu imaju super 12 % Cr čelici?", options: ["martenzitnu", "feritnu", "austenitnu", "perlitnu"], correct: [0], note: "Super 12 % Cr čelici razvijeni su iz martenzitnog X20Cr13: gase se u ulju i visoko popuštaju, pa imaju martenzitnu (popuštenu) strukturu." },
        { q: "Austenitni toplinski visokopostojani čelici u odnosu na austenitne korozijski postojane čelike imaju:", options: ["manji udio Cr", "veći udio Cr", "manji udio Ni", "veći udio Ni"], correct: [0, 3], note: "Austenitni toplinski visokopostojani čelici imaju manje Cr i više Ni od korozijski postojanih austenitnih čelika (ne treba ih miješati s vatrootpornima, koji imaju više Cr i Ni)." },
        { q: "Koji se materijal(i) ne može (ne mogu) primijeniti za pogonske temperature −50 °C?", options: ["sivi lijev", "visokougljični čelici", "sitnozrnati čelici", "feritni nehrđajući čelici"], correct: [0, 1, 3], note: "Na −50 °C ne mogu se primijeniti krhki materijali: sivi lijev, visokougljični čelici i feritni nehrđajući čelici (BCC, visoka prijelazna temperatura). Sitnozrnati čelici rade i do oko −50 °C (IIW 16018)." },
        { q: "Austenitni čelici za uporabu na niskim temperaturama. Odabrati točnu(e) tvrdnju(e):", options: ["zahvaljujući FCC rešetki zadržavaju žilavost i do temperatura blizu apsolutne nule", "problem pri oblikovanju deformiranjem i pri uporabi na niskim temperaturama je pretvorba austenita u tzv. deformacijski ε-martenzit", "teško su zavarljivi", "postojanost prema toplim pukotinama osigurava se velikim udjelom δ-ferita"], correct: [0, 1], note: "Austenitni čelici zahvaljujući FCC rešetki zadržavaju žilavost i blizu apsolutne nule; problem je pretvorba austenita u deformacijski martenzit. Dobro su zavarljivi, a δ-ferit se za kriogene primjene ograničava jer smanjuje žilavost." },
        { q: "Legirani čelici s 3–9 % Ni primjenjuju se prije svega zbog svojstava:", options: ["pri povišenim temperaturama (otpornost na puzanje)", "pri sobnoj temperaturi", "pri radnim temperaturama nižim od −60 °C", "pri vrlo niskim temperaturama (kriogene primjene)"], correct: [2, 3], note: "Čelici s 3–9 % Ni koriste se zbog žilavosti na niskim temperaturama: 3,5 % Ni do oko −100 °C, a 9 % Ni do −196 °C (LNG, kriogene primjene)." },
        { q: "Koji kemijski element daje čeliku kriogena svojstva?", options: ["krom", "nikal", "molibden", "tantal"], correct: [1], note: "Nikal snizuje prijelaznu temperaturu i daje čeliku žilavost na vrlo niskim (kriogenim) temperaturama." },
        { q: "Koje su tvrdnje o zavarivanju čelika s 9 % Ni točne?", options: ["zavaruje se ponajprije istovrsnim dodatnim materijalom", "zavaruje se uz temperaturu predgrijavanja i međuprolaznu temperaturu od najmanje 250 °C", "puhanje luka velik je problem zbog visoke razine zaostalog magnetizma", "visok sadržaj Ni čini ih praktično neosjetljivima na tople pukotine"], correct: [2], note: "Čelici s 9 % Ni su feromagnetični i jako se magnetiziraju, pa je puhanje luka velik problem. Zavaruju se dodatnim materijalom na bazi Ni (ne istovrsnim), bez predgrijavanja." },
        { q: "Kriogene čelike preporučuje se zavarivati:", options: ["sa što manjim unosom topline", "s unosom topline od čak 50 kJ/cm", "tehnikom njihanja uz unos topline ne veći od 25 kJ/cm", "uskim zavarima koji djelomično prekrivaju prethodni, bez ograničenja unosa topline"], correct: [0, 2], note: "Kriogene čelike treba zavarivati sa što manjim unosom topline; tehnika njihanja je dopuštena uz unos topline do oko 25 kJ/cm. Velik unos topline smanjuje žilavost ZUT-a." },
        { q: "Koji se dodatni materijal i temperatura predgrijavanja preporučuju za TIG zavarivanje čelika s 9 % Ni?", options: ["žica od čelika s 9 % Ni, bez predgrijavanja", "austenitna žica 18Cr10Ni, bez predgrijavanja", "žica 70Ni-20Mo-3W uz predgrijavanje na 100 °C", "žica 70Ni-20Mo-3W, bez predgrijavanja"], correct: [3], note: "Za TIG zavarivanje čelika s 9 % Ni koristi se žica na bazi nikla (npr. 70Ni-20Mo-3W) i ne predgrijava se. Žica s 9 % Ni ne daje dovoljnu žilavost metala zavara." },
        { q: "Sitnozrnati čelici za vrlo niske temperature imaju:", options: ["0,2 % C; 0,5 % P", "0,5 % C; 0,25 % S", "0,2 % C; 0,025 % P", "0,5 % C; 0,025 % P"], correct: [2], note: "Sitnozrnati čelici za niske temperature imaju malo ugljika (do oko 0,2 %) i vrlo malo nečistoća (P, S do oko 0,025 %)." },
        { q: "Austenitni čelici u kriogenoj tehnici ne smiju sadržavati (mnogo) δ-ferita zbog:", options: ["toplih pukotina", "σ-faze", "korozijskih pojava", "smanjenja žilavosti (duktilnosti) pri niskim temperaturama"], correct: [3], note: "Malo δ-ferita (3–6 %) štiti od toplih pukotina, ali veći udio smanjuje žilavost pri niskim temperaturama, jer δ-ferit ima BCC rešetku. σ-faza nastaje iz δ-ferita na 600–800 °C, a ne pri kriogenoj uporabi." },
        { q: "Toplinska obrada austenitnih, feritnih i dupleks čelika sastoji se od:", options: ["poboljšavanja (kaljenja i popuštanja)", "izotermičkog poboljšavanja (austempering)", "rastvornog žarenja i gašenja", "gašenja"], correct: [2], note: "Austenitni, feritni i dupleks čelici ne mogu se kaliti; toplinska obrada im je rastvorno žarenje (otapanje karbida i intermetalnih faza) i gašenje." },
        { q: "Visokolegirani nehrđajući čelici. Odabrati točnu(e) tvrdnju(e):", options: ["čelik oznake 304 sadrži 18–20 % Cr i 8–10 % Ni", "čelik 304L u odnosu na 304 sadrži manje ugljika radi smanjenja osjetljivosti na senzibilizaciju", "čelik 316L u odnosu na 304 sadrži i Mn radi postojanosti na rupičastu koroziju", "od svih vrsta visokolegiranih nehrđajućih čelika najviše se primjenjuju martenzitni"], correct: [0, 1], note: "Čelik 304 ima 18–20 % Cr i 8–10 % Ni, a 304L manje ugljika radi otpornosti na senzibilizaciju (interkristalnu koroziju). 316L sadrži molibden (ne mangan), a najviše se koriste austenitni, ne martenzitni čelici." },
        { q: "Feritni čelici. Odabrati točnu(e) tvrdnju(e):", options: ["primjenjuju se u postrojenjima s povišenom opasnošću od napetosne korozije", "sadrže 12–30 % Cr, niže su čvrstoće od austenitnih čelika, ograničena im je zavarljivost", "pri zavarivanju dolazi do pogrubljenja mikrostrukture u ZUT-u", "moguća je pojava krhkosti"], correct: [0, 1, 2, 3], note: "Feritni nehrđajući čelici (12–30 % Cr) nisu skloni napetosnoj koroziji, pa se koriste gdje ona prijeti. Imaju nižu čvrstoću od austenitnih i ograničenu zavarljivost: zrno u ZUT-u raste, a moguća je krhkost (475 °C, σ-faza)." },
        { q: "Martenzitni čelici. Odabrati točnu(e) tvrdnju(e):", options: ["sadrže 11,5–13,5 % Cr", "nužna je toplinska obrada nakon zavarivanja", "moguća je pojava hladnih pukotina", "moguća je pojava austenitizacije"], correct: [0, 1, 2], note: "Martenzitni nehrđajući čelici imaju oko 11,5–13,5 % Cr (do 16 %), lako se zakale, pa su skloni hladnim pukotinama i nakon zavarivanja nužna je toplinska obrada (popuštanje)." },
        { q: "Čelici za uporabu na povišenim temperaturama. Odabrati točnu(e) tvrdnju(e):", options: ["najefikasnija mjera za povećanje otpornosti na puzanje je legiranje molibdenom, vanadijem i/ili volframom, jer njihovi karbidi otežavaju klizanje granica zrna", "toplinska naprezanja: povišenjem temperature snizuju se modul elastičnosti E i modul smicanja G, a raste faktor toplinske dilatacije", "toplinska naprezanja: povišenjem temperature povisuje se modul elastičnosti E, snizuje modul smicanja G, a raste faktor toplinske dilatacije", "termički šokovi i termički umor oblik su dinamičkog naprezanja zavarene konstrukcije; za razliku od dinamičkih naprezanja, ovdje je određivanje djelujućih naprezanja znatno jednostavnije"], correct: [0, 1], note: "Otpornost na puzanje najviše povećava legiranje Mo, V i W (karbidi koče klizanje granica zrna). S porastom temperature E i G padaju, a toplinska dilatacija raste. Kod termičkih šokova i termičkog umora određivanje naprezanja je složenije, a ne jednostavnije." },
        { q: "Čelici za uporabu na povišenim temperaturama. Odabrati točnu(e) tvrdnju(e):", options: ["za radnu temperaturu 400–500 °C moguća je uporaba feritno-perlitnog čelika", "za radnu temperaturu 600–700 °C moguća je uporaba austenitnog čelika", "za radnu temperaturu 800–1000 °C moguća je uporaba martenzitnog čelika", "feritno-perlitni čelik nije moguće upotrebljavati na povišenim temperaturama"], correct: [0, 1], note: "Za 400–500 °C mogu se koristiti feritno-perlitni (niskolegirani) čelici, a za 600–700 °C austenitni. Martenzitni čelici ne rade na 800–1000 °C (rade do oko 600 °C)." },
        { q: "Interkristalna korozija nehrđajućeg čelika najvjerojatnija je kod:", options: ["rastvorno žarene strukture", "sporo hlađene strukture", "nehrđajućeg čelika s visokim udjelom ugljika", "nehrđajućeg čelika s niskim udjelom ugljika"], correct: [1, 2], note: "Interkristalna korozija prijeti kad se Cr-karbidi izlučuju po granicama zrna: pri sporom hlađenju kroz 450–850 °C i kod čelika s više ugljika. Rastvorno žarena struktura i niski C (L-čelici) su otporni." },
        { q: "Što je dupleks nehrđajući čelik?", options: ["nehrđajući čelik s dva sloja, feritnim i austenitnim", "nehrđajući čelik feritno-austenitne strukture (50 % ferita i 50 % austenita)", "obični čelik s međuslojem od nehrđajućeg čelika", "nehrđajući čelik s dvije faze"], correct: [1, 3], note: "Dupleks nehrđajući čelik ima dvofaznu feritno-austenitnu strukturu, otprilike 50 % ferita i 50 % austenita. To nije čelik s dva sloja ni s međuslojem." },
        { q: "Uz zavare austenitnih nehrđajućih čelika pojavljuje se interkristalna korozija. Što treba poduzeti da se to izbjegne?", options: ["primijeniti prelegirani dodatni materijal", "provesti toplinsku obradu na 600 °C kroz 1 h odmah nakon zavarivanja", "koristiti zaštitni plin s CO₂", "odabrati nehrđajući čelik s manje od 0,03 % C"], correct: [3], note: "Interkristalna korozija izbjegava se niskougljičnim (L) nehrđajućim čelikom s manje od 0,03 % C (ili stabiliziranim čelikom). Žarenje na 600 °C upravo izaziva senzibilizaciju, a CO2 unosi ugljik." },
        { q: "Rupičasta korozija može biti posljedica:", options: ["nedovoljne pripreme spoja", "nepravilnog bajcanja/pasiviranja", "prevelike struje zavarivanja", "premalog napona zavarivanja"], correct: [1], note: "Rupičasta korozija nehrđajućih čelika često je posljedica nepravilnog bajcanja i pasiviranja: ostaju obojeni oksidi i osiromašen sloj bez zaštitnog pasivnog filma." },
        { q: "Kako se zavaruje lim od austenitnog CrNi čelika stabiliziranog titanom?", options: ["Nb-stabiliziranim obloženim elektrodama", "obloženim elektrodama uz što dulji luk", "prelegiranom Ti-stabiliziranom obloženom elektrodom", "uz velik unos topline te visoku temperaturu predgrijavanja i međuprolaznu temperaturu"], correct: [0], note: "Titan slabo prelazi kroz električni luk (izgara), pa se Ti-stabilizirani čelik zavaruje elektrodama stabiliziranima niobijem. Zavaruje se kratkim lukom i s malim unosom topline." },
        { q: "Kada je nužno zavarivati martenzitne čelike, količinu difuzijskog vodika u zavaru treba ograničiti na:", options: ["najviše 5 cm³/100 g", "najviše 10 cm³/100 g", "najviše 1 cm³/100 g", "najviše 100 cm³/100 g"], correct: [0], note: "Za martenzitne čelike difuzijski vodik u zavaru treba ograničiti na najviše oko 5 cm³/100 g (niskovodične elektrode, sušenje, predgrijavanje)." },
        { q: "Zašto su martenzitni nehrđajući čelici lošije zavarljivi?", options: ["zbog velike kritične brzine hlađenja", "zbog male kritične brzine hlađenja (lako se zakale)", "zbog srednje kritične brzine hlađenja", "zbog malog sadržaja kroma"], correct: [1], note: "Martenzitni nehrđajući čelici imaju malu kritičnu brzinu hlađenja: zakale se već na zraku, pa su skloni hladnim pukotinama i lošije zavarljivi." },
        { q: "Vatrootporni čelici dijele se u skupine:", options: ["austenitnih čelika", "martenzitnih čelika", "perlitnih čelika", "feritnih čelika"], correct: [0, 3], note: "Vatrootporni (otporni na ogorijevanje) čelici dijele se na feritne i austenitne. Martenzitni i perlitni čelici nisu vatrootporni." },
        { q: "Kakvu strukturu imaju čelici za ventile motora?", options: ["perlitnu", "martenzitnu", "feritnu", "austenitnu"], correct: [1, 3], note: "Čelici za ventile motora su martenzitni (npr. X45CrSi9-3, usisni ventili) i austenitni (npr. X53CrMnNiN21-9, ispušni ventili)." },
        { q: "Mehanizam trošenja opisuje se uz pomoć jediničnih:", options: ["pokreta", "sila", "momenata", "događaja"], correct: [3], note: "Mehanizam trošenja opisuje se jediničnim događajima: slijedom događaja koji odvajaju jednu česticu trošenja (npr. adhezija u tri faze)." },
        { q: "Trošenje. Odabrati točnu tvrdnju:", options: ["adhezija nastaje prodiranjem mekšeg materijala u površinu tvrđeg, pri čemu nastaju mikrozavareni spojevi i brazde na površini", "umor površine je odvajanje čestica s površine uslijed cikličkih promjena naprezanja", "abrazija nastaje trenjem dvaju tijela u dodiru, pri čemu se razvija toplina i nastaju mikrozavareni spojevi", "tribokorozija je klizanje ili kotrljanje triboelemenata u korozijskom okruženju"], correct: [1, 3], note: "Umor površine je odvajanje čestica zbog cikličkih naprezanja, a tribokorozija trošenje (klizanje, kotrljanje) u korozijskom okruženju. Ponude a) i c) zamijenile su opise abrazije i adhezije." },
        { q: "Najbolji izbor za navarivanje kotača dizalice je:", options: ["čelik s 14 % Mn", "nisko- ili srednjelegirani kromov i/ili manganov čelik", "tvrda legura na bazi željeza", "visokokromni čelik"], correct: [1], note: "Kotači dizalice opterećeni su kotrljanjem i udarima, pa se navaruju nisko- ili srednjelegiranim Cr i/ili Mn čelikom (žilav i dovoljno tvrd). Tvrde legure i visokokromni čelici su prekrhki, a 14 % Mn čelik očvrsne tek pri jakim udarima." },
        { q: "Kako se zove erozija česticama kod koje je kut upada čestica u trošenu površinu malen (do 30°)?", options: ["abrazivna erozija", "udarna erozija", "kavitacijska erozija", "kotrljajuća erozija"], correct: [0], note: "Pri malom kutu upada čestica (do oko 30°) prevladava abrazija (abrazivna erozija), a pri velikom kutu (iznad oko 60°) umor površine (udarna erozija)." },
        { q: "Što ne spada u jednostavan tribosustav?", options: ["funkcionalni dijelovi", "međumedij", "buka", "okoliš"], correct: [2], note: "Jednostavan tribosustav čine funkcionalni dijelovi (osnovno i protutijelo), međumedij i okoliš. Buka je posljedica rada sustava, a ne njegov dio." },
        { q: "Karakteristični primjeri djelovanja kavitacijske erozije su:", options: ["propeleri", "centrifugalne pumpe", "pjeskarilice", "cjevovodi za transport zrnate ili praškaste robe"], correct: [0, 1], note: "Kavitacijska erozija nastaje urušavanjem mjehurića pare u kapljevini, pa su tipični primjeri propeleri, centrifugalne pumpe i turbine. Pjeskarilice i cjevovodi za zrnatu robu primjeri su erozije česticama." },
        { q: "Tipični primjeri abrazijskog trošenja su:", options: ["ventili", "alati za obradu odvajanjem čestica", "radni dijelovi poljoprivredne, građevinske i rudarske mehanizacije", "propelerske turbine"], correct: [1, 2], note: "Abrazijsko trošenje tipično je za alate za obradu odvajanjem čestica i radne dijelove poljoprivrednih, građevinskih i rudarskih strojeva (tlo, kamen). Ventili i propelerske turbine više su izloženi eroziji i kavitaciji." },
        { q: "Kako se zove metoda kojom se pomoću rabljenog maziva utvrđuje stanje istrošenosti zatvorenog sustava?", options: ["metalografija", "keramografija", "mikroskopija", "ferografija"], correct: [3], note: "Ferografija iz rabljenog maziva izdvaja čestice trošenja (magnetski) i po njima procjenjuje stanje istrošenosti zatvorenog sustava (motori, reduktori)." },
        { q: "Kako se zove metoda kojom se iz rabljenog maziva izdvajaju čestice trošenja po veličini?", options: ["metalografija", "keramografija", "mikroskopija", "ferografija"], correct: [3], note: "Ferografija izdvaja čestice trošenja iz rabljenog maziva i razvrstava ih po veličini (ferogram)." },
        { q: "Indeks intenziteta trošenja (ferografija) dobiva se na osnovi omjera:", options: ["volumena velikih i malih čestica trošenja", "površina pokrivenih velikim i malim česticama trošenja", "broja velikih i malih čestica trošenja", "boje velikih i malih čestica trošenja"], correct: [1], note: "Ferograf s izravnim očitanjem mjeri koliki dio površine prekrivaju velike, a koliki male čestice, pa se indeks intenziteta trošenja računa iz omjera tih površina. Izvor nema ključ, ovo je odgovor prema literaturi." },
        { q: "Koji je dominantni mehanizam trošenja kod fretinga?", options: ["abrazija", "adhezija", "umor površine", "tribokorozija"], correct: [3], note: "Kod fretinga (malih vibracijskih pomaka) odnesene čestice oksidiraju i ostaje praškasti sloj oksida, pa je dominantan mehanizam tribokorozija." },
        { q: "Lopatica pjeskarilice primjer je:", options: ["kliznog trošenja", "kotrljajućeg trošenja", "erozije česticama", "erozije kapljevinom"], correct: [2], note: "Lopatica pjeskarilice izložena je udarima čestica pijeska u struji zraka: to je erozija česticama." },
        { q: "Kod erozije česticama izuzetno je utjecajan parametar:", options: ["put sudara čestica", "visina sudara čestica", "kut sudara čestica", "dubina sudara čestica"], correct: [2], note: "Kod erozije česticama najutjecajniji je kut sudara: o njemu ovisi prevladava li abrazija (mali kut) ili umor površine (veliki kut)." },
        { q: "Izravni gubici kao negativne posljedice trenja i trošenja očituju se u:", options: ["gubicima energije i materijala", "duljini zastoja", "troškovima održavanja", "utjecaju na okoliš"], correct: [0], note: "Izravni gubici trenja i trošenja su gubici energije (trenje) i materijala (trošenje). Zastoji, održavanje i utjecaj na okoliš su neizravni gubici." },
        { q: "Znanost koja se bavi problemima trenja i trošenja zove se:", options: ["tribologija", "trošologija", "trenjologija", "trebologija"], correct: [0], note: "Tribologija je znanost o trenju, trošenju i podmazivanju površina u relativnom gibanju." },
        { q: "Adhezijsko trošenje (jedinični događaj adhezije) opisano je kroz:", options: ["jednu fazu", "dvije faze", "tri faze", "četiri faze"], correct: [2], note: "Jedinični događaj adhezije ima tri faze: nastanak adhezijskog spoja (mikrozavarivanje), raskidanje spoja i otkidanje čestice." },
        { q: "Naziv tribologija prvi se put spominje u Jostovu izvješću:", options: ["1906. godine", "1926. godine", "1946. godine", "1966. godine"], correct: [3], note: "Naziv tribologija prvi se put pojavio u Jostovu izvješću u Velikoj Britaniji 1966. godine." },
        { q: "Prvim tribologom znanstvenikom, koji se bavio fenomenom trenja, smatra se:", options: ["Leonardo DiCaprio", "Leonardo da Vinci", "Leonardo D'Avicii", "Leonard D. White"], correct: [1], note: "Prvim znanstvenikom koji je proučavao trenje smatra se Leonardo da Vinci (zakoni trenja, oko 1500. godine)." },
        { q: "Kod kojeg osnovnog mehanizma trošenja prevladavaju kemijske reakcije s okolinom?", options: ["abrazije", "adhezije", "umora površine", "tribokorozije"], correct: [3], note: "Kod tribokorozije prevladavaju kemijske (elektrokemijske) reakcije površine s okolinom, uz mehaničko djelovanje." },
        { q: "Kuglični ležaj primjer je:", options: ["kliznog trošenja", "kotrljajućeg trošenja", "erozije česticama", "erozije kapljevinom"], correct: [1], note: "U kugličnom ležaju kuglice se kotrljaju po stazama, pa je to kotrljajuće trošenje (prevladava umor površine)." },
        { q: "Testom „suhi pijesak/gumeni kotač” ispituje se:", options: ["otpornost na abrazijsko trošenje", "otpornost na adhezijsko trošenje", "otpornost na erozijsko trošenje", "otpornost na freting"], correct: [0], note: "Test „suhi pijesak/gumeni kotač“ (ASTM G65) ispituje otpornost na abrazijsko trošenje." },
        { q: "Koja vrsta željeznog lijeva ima dobru zavarljivost?", options: ["brzo hlađeni sivi lijev", "kaljeni lijev s kuglastim grafitom", "kromom legirani bijeli lijev", "bijeli temper lijev"], correct: [3], note: "Bijeli temper lijev je razugljičen žarenjem, pa ima malo ugljika na površini i dobru zavarljivost. Brzo hlađeni sivi lijev, kaljeni nodularni i Cr bijeli lijev vrlo su krhki i loše zavarljivi." },
        { q: "Zavarivanje debelih odljevaka od željeznog lijeva najmanje je problematično kod:", options: ["feritnog sivog lijeva", "običnog sivog lijeva", "feritnog nodularnog lijeva", "bijelog temper lijeva"], correct: [2], note: "Od navedenih najmanje problema pri zavarivanju debelih odljevaka ima feritni nodularni lijev: kuglasti grafit i feritna matrica daju duktilnost, pa lakše podnosi naprezanja." },
        { q: "Za zavarivanje željeznog lijeva mogu se primijeniti tehnike:", options: ["hladno zavarivanje", "toplo zavarivanje", "kombinacija navedenih", "ni jedna od navedenih ne daje dobre rezultate"], correct: [0, 1, 2], note: "Željezni lijev može se zavarivati hladno (bez predgrijavanja, kratkim zavarima i Ni elektrodama), toplo (predgrijavanje na oko 600 °C) i kombinacijom tih tehnika." },
        { q: "Kakav učinak može imati široka, djelomično rastaljena zona zavara na duktilni (nodularni) lijev?", options: ["metal zavara se ne veže u potpunosti s osnovnim metalom", "grafit se u cijelosti rastvori", "dolazi do gubitka kontrole oblika grafita", "duktilni lijev se pretvara u kovkasti lijev"], correct: [2], note: "U širokoj djelomično rastaljenoj zoni nodularnog lijeva grafit se otapa i ponovno izlučuje, pa se gubi kontrola nad njegovim (kuglastim) oblikom i nastaju krhki karbidi." },
        { q: "Kako se može zavariti sivi lijev?", options: ["samo „na toplo”", "samo „na hladno”", "i „na hladno” i „na toplo”", "bilo kojom tehnikom kao konstrukcijski čelik"], correct: [2], note: "Sivi lijev može se zavarivati i „na hladno“ (Ni elektrode, kratki zavari, iskivanje) i „na toplo“ (predgrijavanje oko 600 °C, istovrsni dodatni materijal), ali ne kao konstrukcijski čelik." },
        { q: "Zašto se pri hladnom zavarivanju sivog lijeva iskiva metal zavara?", options: ["da se smanje zaostala naprezanja", "da se smanje mehanička svojstva", "da se poveća korozijska otpornost", "da se ukloni troska"], correct: [0], note: "Metal zavara se pri hladnom zavarivanju sivog lijeva iskiva (čekićanjem) dok je još topao, da se smanje zaostala naprezanja i spriječe pukotine." },
        { q: "Metastabilno skrućene Fe-C legure s više od 2,03 % C zovu se:", options: ["bijeli tvrdi lijev", "sivi lijev", "čelični lijev", "nodularni lijev"], correct: [0], note: "Metastabilno skrućene Fe-C legure s više od 2,03 % C su bijeli (tvrdi) lijev: ugljik je vezan u cementit, pa je prijelom bijel. Sivi i nodularni lijev skrućuju stabilno (grafit)." },
        { q: "Koji metalurški problemi mogu nastati pri zavarivanju taljenjem čistog bakra?", options: ["vodikova krhkost", "stvaranje i održavanje taline", "krhkost zbog utjecaja sumpora", "opasnost od plinskih mjehura (poroznosti)"], correct: [0, 2, 3], note: "Pri zavarivanju čistog bakra prijeti vodikova krhkost (kod bakra s kisikom vodik i Cu2O daju vodenu paru), krhkost zbog sumpora i poroznost. Stvaranje taline je teško zbog vodljivosti, ali to nije metalurški problem." },
        { q: "Koji su od navedenih bakrenih materijala zavarljivi?", options: ["E-Cu58 (elektrolitički bakar s kisikom)", "SF-Cu (dezoksidirani bakar)", "CuNi10Fe", "CuAl5"], correct: [1, 2, 3], note: "Zavarljivi su dezoksidirani bakar (SF-Cu), CuNi10Fe i aluminijska bronca CuAl5. Elektrolitički bakar s kisikom (E-Cu58) sklon je vodikovoj krhkosti i nije prikladan za zavarivanje." },
        { q: "Što uzrokuje pore pri zavarivanju tehničkog bakra?", options: ["prisutnost dušika u talini", "prisutnost kisika i vodika u talini", "istodobna prisutnost helija i kisika u talini", "prisutnost dušika u zraku"], correct: [1], note: "Pore u tehničkom bakru uzrokuju kisik i vodik u talini: vodik reagira s Cu2O i stvara vodenu paru, a vodik se i sam izdvaja pri skrućivanju." },
        { q: "Aluminijske bronce CuAl8 mogu se zavarivati:", options: ["MIG postupkom sa žicom SG-CuSn (0,7 % Sn); spojevi su postojani u morskoj vodi", "MIG postupkom sa žicom SG-CuAl8; spojevi su postojani u morskoj vodi", "postupkom 111 s obloženim elektrodama E CuSn6; spojevi nisu postojani u morskoj vodi", "plinskim zavarivanjem (311); spojevi su postojani u morskoj vodi"], correct: [1, 2], note: "Aluminijska bronca CuAl8 zavaruje se MIG postupkom istovrsnom žicom SG-CuAl8, pa je spoj postojan u morskoj vodi. Elektrodom E CuSn6 može se zavariti, ali spoj (raznorodni metal) nije postojan u morskoj vodi." },
        { q: "Bakar ima visoku toplinsku vodljivost (9 puta veću od čelika i dvostruko veću od aluminija). Kakva je posljedica toga za zavarivanje?", options: ["specifični unos topline mora biti velik", "specifični unos topline mora ostati malen", "predgrijavanje nije potrebno", "nakon zavarivanja potrebno je gašenje u vodi radi lakšeg hlađenja"], correct: [0], note: "Zbog vrlo velike toplinske vodljivosti bakra toplina brzo odlazi iz zone zavara, pa specifični unos topline mora biti velik, a deblji komadi predgrijavaju se." },
        { q: "Što je LC-Ni99?", options: ["primarni nikal s 99 % Ni za legiranje čelika i obojenih metala", "poluproizvodi od čistog nikla (limovi, cijevi, šipke) s najmanje 99 % Ni i najviše 0,02 % C", "legura nikla s 99 % Ni, ostatak ugljik", "poluproizvod od čistog nikla dobre zavarljivosti"], correct: [1, 3], note: "LC-Ni99 su poluproizvodi (limovi, cijevi, šipke) od čistog nikla s najmanje 99 % Ni i najviše 0,02 % C (LC = Low Carbon). Zbog niskog C dobro se zavaruju." },
        { q: "Koji problemi uvjetovani materijalom mogu nastati pri zavarivanju taljenjem čistog nikla?", options: ["opasnost od krhkog loma pri niskim temperaturama", "krhkost zbog utjecaja sumpora", "vodikova krhkost", "krhkost zbog ugljika"], correct: [1, 3], note: "Pri zavarivanju čistog nikla problem je krhkost zbog sumpora (nisko taljivi Ni-NiS po granicama zrna) i zbog ugljika (izlučivanje grafita po granicama). Nikal je FCC, pa nema krhkog loma pri niskim temperaturama." },
        { q: "Kako se mogu očvrsnuti Ni-legure?", options: ["sve Ni-legure mogu se očvrsnuti kristalima mješancima (čvrstom otopinom)", "Ni-legure mogu se precipitacijski očvrsnuti", "Ni-legure mogu se očvrsnuti hladnom deformacijom", "Ni-legure uopće se ne mogu očvrsnuti"], correct: [0, 1, 2], note: "Ni-legure mogu se očvrsnuti kristalima mješancima (sve), precipitacijom (npr. Inconel 718, Nimonic) i hladnom deformacijom." },
        { q: "Superlegure su:", options: ["Nimonic", "Vidia", "Hastelloy", "dural"], correct: [0, 2], note: "Nimonic i Hastelloy su superlegure na bazi nikla. Vidia je tvrdi metal (WC-Co), a dural Al-legura (AlCuMg)." },
        { q: "Koje Al-legure spadaju u legure koje se prerađuju postupcima plastične deformacije?", options: ["EN AC-42100KT6", "EN AW-5083", "EN AM-AlSiMg", "EN AB-22400"], correct: [1], note: "Oznaka AW (wrought) označava gnječene (plastično prerađene) Al-legure, npr. EN AW-5083. AC su lijevane legure, a AB ingoti za lijevanje." },
