<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWE Kviz - Kompletna Priprema (1. i 2. ispit)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #334155;
            --skip-bg: #64748b;
            --skip-hover: #475569;
            --cancel-bg: #991b1b;
            --cancel-hover: #7f1d1d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .main-menu-screen, .type-menu-screen, .sub-menu-screen, .quiz-screen, .results-screen, .review-screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background-color: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .option-content {
            display: flex;
            align-items: center;
            width: 100%;
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary);
        }
        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
            pointer-events: auto;
        }
        .tag {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 10px;
            white-space: nowrap;
        }
        
        .option-item.user-correct {
            border-color: var(--success) !important;
            background-color: rgba(34, 197, 94, 0.15) !important;
        }
        .tag-user-correct {
            background-color: var(--success);
            color: #000;
        }

        .option-item.missed-correct {
            border-color: var(--warning) !important;
            background-color: rgba(245, 158, 11, 0.15) !important;
        }
        .tag-missed-correct {
            background-color: var(--warning);
            color: #000;
        }

        .option-item.user-wrong {
            border-color: var(--error) !important;
            background-color: rgba(239, 68, 68, 0.15) !important;
        }
        .tag-user-wrong {
            background-color: var(--error);
            color: #fff;
        }

        .review-card {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .review-q-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .review-opt {
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .review-opt.is-correct {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border-left: 4px solid var(--success);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-main {
            flex: 2;
            font-size: 1.1rem;
        }
        .btn-small {
            flex: 1;
            font-size: 0.9rem;
            padding: 12px 10px;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-skip {
            background-color: var(--skip-bg);
        }
        .btn-skip:hover {
            background-color: var(--skip-hover);
        }
        .btn-cancel {
            background-color: var(--cancel-bg);
        }
        .btn-cancel:hover {
            background-color: var(--cancel-hover);
        }
        .btn-secondary {
            background-color: #475569;
            width: 100%;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .feedback.correct {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .feedback.partial {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        .feedback.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .feedback.voided {
            background-color: rgba(168, 85, 247, 0.18);
            color: #d8b4fe;
            border: 1px solid #a855f7;
        }
        .feedback.skipped {
            background-color: rgba(100, 116, 139, 0.2);
            color: #cbd5e1;
            border: 1px solid #64748b;
        }
        .q-note {
            margin-top: 10px;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px dashed #64748b;
            background-color: rgba(100, 116, 139, 0.15);
            color: #f1f5f9;
            font-size: 1.1rem;
            line-height: 1.55;
            font-weight: 400;
            text-align: left;
        }
        .results-screen {
            text-align: center;
        }
        .sticky-nav {
            position: sticky;
            bottom: -30px;
            margin: 20px -30px -30px -30px;
            padding: 10px 12px;
            background-color: rgba(15, 23, 42, 0.97);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .sticky-nav .btn {
            flex: 1;
            padding: 10px 6px;
            font-size: 0.9rem;
            margin: 0;
        }
        .result-review {
            text-align: left;
            margin-top: 25px;
        }
        .result-review h3 {
            text-align: center;
            margin-bottom: 12px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            padding: 10px 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .tab.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .rv-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .rv-badge {
            padding: 3px 8px;
            border-radius: 5px;
            white-space: nowrap;
        }
        .rv-badge.correct { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .rv-badge.partial { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .rv-badge.wrong { background-color: rgba(239, 68, 68, 0.2); color: var(--error); }
        .rv-badge.void { background-color: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
        .rv-badge.skipped { background-color: rgba(100, 116, 139, 0.25); color: #cbd5e1; }
        .rv-opt {
            padding: 9px 11px;
            margin: 6px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .rv-opt.ok { border-color: var(--success); background-color: rgba(34, 197, 94, 0.15); }
        .rv-opt.missed { border-color: var(--warning); background-color: rgba(245, 158, 11, 0.12); }
        .rv-opt.bad { border-color: var(--error); background-color: rgba(239, 68, 68, 0.15); }
        .rv-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .rv-opt.ok .rv-tag { background-color: var(--success); color: #052e16; }
        .rv-opt.missed .rv-tag { background-color: var(--warning); color: #451a03; }
        .rv-opt.bad .rv-tag { background-color: var(--error); color: #ffffff; }
        .rv-empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }
        .results-screen h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0 10px 0;
        }
        .stat-box {
            border-radius: 8px;
            padding: 12px 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
        }
        .stat-box .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .stat-box .stat-label {
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .stat-box .stat-pts {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 3px;
        }
        .stat-correct { border-color: var(--success); }
        .stat-correct .stat-num { color: var(--success); }
        .stat-partial { border-color: var(--warning); }
        .stat-partial .stat-num { color: var(--warning); }
        .stat-wrong { border-color: var(--error); }
        .stat-wrong .stat-num { color: var(--error); }
        .stat-voided { border-color: #a855f7; }
        .stat-voided .stat-num { color: #d8b4fe; }
        .stat-box.full { grid-column: 1 / -1; }
        .stat-skipped { border-color: #64748b; }
        .stat-skipped .stat-num { color: #cbd5e1; }
        .score-display {
            font-size: 1.5rem;
            margin: 20px 0;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">IWE Kviz - Glavni Izbornik</h1>
    
    <!-- 1. GLAVNI MENI (ODABIR ISPITA) -->
    <div id="main-menu-screen" class="main-menu-screen active-screen">
        <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Izaberite ispit za koji želite vježbati:</p>
        <div class="menu-buttons" id="exam-buttons-container"></div>
    </div>

    <!-- 1b. MENI VRSTE KVIZA (STARA PITANJA / PROŠIRENI KVIZ) -->
    <div id="type-menu-screen" class="type-menu-screen">
        <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Izaberite koji kviz želite rješavati:</p>
        <div class="menu-buttons" id="type-buttons-container"></div>
        <button class="btn btn-cancel" onclick="goToMainMenu()" style="margin-top: 15px; width: 100%;">⬅ Nazad na odabir ispita</button>
    </div>

    <!-- 2. POD-MENI (ODABIR BROJA PITANJA) -->
    <div id="sub-menu-screen" class="sub-menu-screen">
        <p id="sub-menu-desc" style="text-align: center; color: #94a3b8; margin-bottom: 20px;"></p>
        <div class="menu-buttons" id="sub-menu-buttons-container"></div>
        <button class="btn btn-secondary" onclick="openReviewAllFromMenu()" style="margin-top: 15px;">📚 Pregled svih pitanja s odgovorima</button>
        <button class="btn btn-cancel" onclick="goToTypeMenu()" style="margin-top: 10px; width: 100%;">⬅ Nazad na odabir kviza</button>
    </div>

    <!-- KVIZ EKRAN -->
    <div id="quiz-screen" class="quiz-screen">
        <div class="stats">
            <span id="question-counter">Pitanje: 1 / 30</span>
            <span id="current-score">Bodovi: 0.00</span>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="question-box" id="question-text">Učitavanje pitanja...</div>
        
        <ul class="options-list" id="options-list"></ul>
        
        <div class="btn-group" id="action-buttons">
            <button class="btn btn-cancel btn-small" id="cancel-btn" onclick="confirmCancel()">Odustani</button>
            <button class="btn btn-skip btn-small" id="skip-btn" onclick="skipQuestion()">Preskoči</button>
            <button class="btn btn-main" id="submit-btn" onclick="checkAnswer()">Potvrdi</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- REZULTATI -->
    <div id="results-screen" class="results-screen">
        <h2>Kviz je završen!</h2>
        <div class="score-display" id="final-score"></div>
        <p id="percentage-display"></p>
        <div class="stats-grid" id="stats-grid"></div>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
            <button class="btn" style="width: 100%;" onclick="goToSubMenu()">Nazad na meni kviza</button>
            <button class="btn btn-cancel" style="width: 100%;" onclick="goToMainMenu()">Glavni izbornik (Odabir ispita)</button>
        </div>
        <div class="result-review">
            <h3>📝 Pregled odgovora iz ovog kruga</h3>
            <div class="tabs">
                <button class="tab active" id="tab-mistakes" onclick="renderResultList('mistakes')">❌ Za ponoviti</button>
                <button class="tab" id="tab-all" onclick="renderResultList('all')">📋 Sva pitanja</button>
            </div>
            <div id="result-list"></div>
        </div>
        <div class="sticky-nav">
            <button class="btn btn-secondary" onclick="scrollToTop()">⬆ Na vrh</button>
            <button class="btn" onclick="goToSubMenu()">⬅ Meni kviza</button>
            <button class="btn btn-cancel" onclick="goToMainMenu()">🏠 Početni meni</button>
        </div>
    </div>

    <!-- PREGLED PITANJA EKRAN -->
    <div id="review-screen" class="review-screen">
        <h2 id="review-title" style="text-align: center; margin-bottom: 20px;">Pregled pitanja</h2>
        <div id="review-container"></div>
        <div class="sticky-nav">
            <button class="btn btn-secondary" onclick="scrollToTop()">⬆ Na vrh</button>
            <button class="btn" onclick="goToSubMenu()">⬅ Meni kviza</button>
            <button class="btn btn-cancel" onclick="goToMainMenu()">🏠 Početni meni</button>
        </div>
    </div>
</div>

<script>
    // =====================================================================
    // 1. ISPIT – PODRUČJE 1: POSTUPCI ZAVARIVANJA I OPREMA
    // =====================================================================
    // Baza 1: Stara ispitna pitanja (1 - 127)
    const oldQuestions = [
        { q: "Pri zavarivanju istosmjernom strujom više se zagrijava na:", options: ["anoda", "katoda", "obje jednako", "katoda kod TIG, a anoda kod MIG"], correct: [0] },
        { q: "Najveći napon el.luka uz istu struju bit će kod zaštitnog plina:", options: ["Argona", "Vodika", "Dušika", "mješavine Ar/CO2"], correct: [1] },
        { q: "REL zavarivanje elektrode s bazičnom oblogom:", options: ["nisu osjetljive na vlagu", "u pravilu se koriste na (-) polu istosmjerne struje", "dužina el. luka jednaka je polovici promjera elektrode", "obloga sadrži veću količinu CaF2 od drugih elektroda"], correct: [2, 3] },
        { q: "Najčešći razlozi pora od N2 u zavaru pri MAG zavarivanju:", options: ["kada u boci ima do 1% N2", "kontaminacija sa N2 iz zraka zbog loše zaštite taline", "loša tehnika rada", "masnoće i organske nečistoće na žici i radnom komadu"], correct: [1, 2, 3] },
        { q: "Plinski plamen (C2H2/O2) kod zavarivanja debelih limova koristi se:", options: ["desna tehnika", "lijeva tehnika", "lijeva tehnika uz primjenu debljeg dodatnog materijala", "nije bitno koja tehnika"], correct: [0] },
        { q: "Kod EPP zavarivanja punom žicom Ø5 mm treba koristiti izvore struje sa:", options: ["padajućom karakteristikom", "ravnom karakteristikom", "ravnom ali s većom strujom zavarivanja", "mogu se obje koristiti"], correct: [0] },
        { q: "Najveća temperatura plinskog plamena dobije se primjenom ovih gorivih plinova:", options: ["Propan/Butan", "Acetilen 3200C", "Metan", "Vodik"], correct: [1] },
        { q: "Kod rezanja plinskim postupkom, rezljivost metala ovisi o:", options: ["temperaturi taljenja", "odnos temperature taljenja i paljenja materijala", "vrsti upotrebljivog plina", "odnosu temperature taljenja i oksida"], correct: [1, 3] },
        { q: "Dezoksidansi pri MAG zavarivanju čelika:", options: ["Al", "Mn", "Si", "W"], correct: [0, 1, 2] },
        { q: "Pri MIG/MAG zavarivanju Cr-Ni čelika najveća penetracija:", options: ["Ar", "Ar+3%O2", "Ar+0,5%O2", "Ar+5%O2O2+0.5%CO2"], correct: [1] },
        { q: "Primjena mješavine Ar+18%CO2 u odnosu na CO2 kod zavarivanja običnih ugljičnih čelika", options: ["veća penetracija", "lošiji prijenos metala", "lošiji prijenos metala i veća penetracija", "bolji prijenos metala i manja penetracija"], correct: [3] },
        { q: "Kod MAG (CO2) zavarivanja žicom Ø 1.2 mm rasponi napona luka i struje zavarivanja", options: ["120A<I<360A ; 17V<U<34V", "80A<I<300A ; 15V<U<27V", "150A<I<500A ; 17V<U<34V", "170A<I<700A ; 19V<U<34V"], correct: [1] },
        { q: "TVRDO lemljenje je tehnologija spajanja gdje je:", options: ["tvrdoća lema veća od 90HB", "tvrdoća lema veća od 180HB", "temperatura lemljenja >250°C", "temperatura lemljenja >450°C"], correct: [3] },
        { q: "Pri lemljenju lemova na bazi srebra, razmak između površina za lemljenje treba biti", options: ["manji od 0,01 mm", "veći od 0,5 mm", "od 0,05 - 0,2 mm", "od 0,5-1 mm"], correct: [2] },
        { q: "Tehnologija ljepljenja", options: ["mogućnost spajanja raznorodnih materijala, je prednost ljepljenja u usporedbi s ostalim", "postizanje visokih čvrstoća spojeva prednost ljepljenja", "neznatno toplinsko djelovanje na spoj prednost ljepljenja", "otpornost na visoke temperature je glavna prednost ljepljenja"], correct: [0, 2] },
        { q: "Vrijednost čvrstoće ljepljenog spoja kod konstrukcijskih ljepila iznosi:", note: "Tipično oko 30–80 N/mm2.", options: ["do 80 N/mm2", "od 100-200N/mm2", "od 200-300N/mm2", ">300N/mm2"], correct: [0] },
        { q: "Za robotsko zavarivanje Laserom povoljnije je koristiti:", options: ["Nd-YAG kruti laser", "CO2 laser", "N2 plinski laser", "nije bitna vrsta lasera"], correct: [0] },
        { q: "Pri rezanju običnih čelika laserom - kao pomoćni plin za rezanje koristi se", note: "Za aluminij se kao pomoćni plin koristi dušik (N2).", options: ["Vodik (H2)", "Kisik (O2)", "Acetilen (C2H2)", "Mješavina Vodik/Dušik (H2/N2)"], correct: [1] },
        { q: "Da bi se robotska ruka mogla postaviti u neku točku potrebna su minimalno:", options: ["3 (tri) stupnja slobode", "3 (tri) stupnja slobode rotacije i 3 (tri) translacije", "5 (pet) stupnjeva rotacije", "3 (tri) stupnja rotacije i 5 (tri) translacije"], correct: [0] },
        { q: "Najviša temperatura plinskog plamena ovisi o:", options: ["vrsti gorivog plina", "obliku sapnice", "veličini sapnice", "omjeru gorivog plina i O2"], correct: [0, 3] },
        { q: "Pri TIG zavarivanju bakra velikih debljina - zaštitni plin je:", options: ["Argon", "mješavina N2/H2...80%/20%", "mješavina He/Ar... 60%/40%", "mješavina He/Ar...10%/90%"], correct: [2] },

        { q: "Koji spoj(evi) se koriste u cilju smanjenja nečistoća (npr. S i P) u čeliku?", options: ["Fe2C", "SiO2", "TiO2", "CaCO3"], correct: [3], note: "CaCO3 (vapnenac) se dodaje kao talitelj: u peći stvara bazičnu trosku (CaO) koja veže sumpor i fosfor iz taline. SiO2 je kiseli oksid i ne odsumporava, a Fe2C i TiO2 nemaju tu ulogu." },
        { q: "Kristalna struktura dvije različite metalografske faze u materijalu može biti:", options: ["segregirana", "nekoherentna", "granice dvojnika", "koherentna"], correct: [1, 3], note: "Granica između dviju faza može biti koherentna (rešetke se nastavljaju jedna u drugu), polukoherentna ili nekoherentna. Segregacija i granice dvojnika nisu vrste granice između dviju faza." },
        { q: "Koji od sljedećih elemenata ima največi utjecaj na prokaljivost čelika?", options: ["Cr", "Mn", "Al", "Cu"], correct: [0], note: "Ključ iz zbirke je Cr. Krom snažno pomiče TTT krivulje udesno pa povećava prokaljivost; jak utjecaj ima i Mn, pa se ovo pitanje smatra nesigurnim. Al i Cu imaju mali utjecaj." },
        { q: "Koja(e) od navedenih tvrdnji je(su) ispravna(e) za TTT dijagram čelika?", options: ["TTT dijagrami se koriste za predviđanje mikrostruktura u uvjetima kontinuiranog hlađenja", "kemijski sastav čelika utječe na TTT dijagrame", "TTT dijagrami se koriste za predviđanje ravnotežnih struktura čelika", "TTT dijagrami se koriste za procjenu količine bainita i martenzita u mikrostrukturi"], correct: [1, 3], note: "TTT (izotermički) dijagram ovisi o kemijskom sastavu i iz njega se procjenjuje udio bainita i martenzita. Za kontinuirano hlađenje služi CCT dijagram, a ravnotežne strukture daje Fe-C dijagram, ne TTT." },
        { q: "Popuštanje zavara na čeliku je toplinski postupak koji se primjenjuje u cilju:", options: ["djelomičnog obnavljanja strukture zrna metala u stanje prije zavarivanja", "sačuvanja njihove strukture uz mijenjanje mehaničkih svojstava", "promjene njihove strukture, poboljšavajući na taj način njihova mehanička svojstva", "obnavljajući u potpunosti strukture metala na njihovo stanje prije zavarivanja"], correct: [0, 2], note: "Popuštanje nakon zavarivanja djelomično vraća strukturu (smanjuje zakaljenost i napetosti) i tako poboljšava mehanička svojstva. Potpuno vraćanje strukture u stanje prije zavarivanja nije moguće." },
        { q: "Što od navedenog u potpunosti određuje kemijski sastav metala zavara?", options: ["osnovni materijal, dodatni materijal i svaki metal sadržan u prašku ili oblozi", "dodatni materijal u obliku elektrode ili taljive žice", "za većinu postupaka zavarivanja koji se sada koriste, metal zavara se u potpunosti sastoji od upotrebljenih dodatnih materijala", "općenito, pretopljeni osnovni materijal"], correct: [0], note: "Metal zavara je mješavina rastaljenog osnovnog i dodatnog materijala, uz elemente iz praška ili obloge (dilucija). Samo dodatni ili samo osnovni materijal ne određuju sastav u potpunosti." },
        { q: "Materijal se opisuje kao uvjetno zavarljiv:", options: ["kada su opisane zavarivačke procedure, postoje specijalne procedure koje su potrebne (predgrijavanje, toplinska obrada, ...)", "kada se materijal jako deformira tijekom zavarivanja", "kada se zahtijeva primjena posebnih postupaka zavarivanja", "u pravilu, svi su materijali dobro zavarljivi"], correct: [0, 2], note: "Uvjetno zavarljiv materijal može se zavarivati samo uz posebne mjere: predgrijavanje, kontrolirani unos topline, toplinsku obradu ili poseban postupak. Deformacija pri zavarivanju nije kriterij zavarljivosti." },
        { q: "Koja od navedenih tvrdnji je(su) ispravna(e) u slučaju zavarivanja sitnozrnatog konstrukcijskog čelika S690QL?", options: ["može se zavarivati kad termokreda koja pokazuje temperature predgrijavanja i međuslojne temperature promijeni boju", "može se zavarivati kada nijedna od termokreda ne promijeni boju", "može se zavarivati samo kad termokreda koja pokazuje temperaturu predgrijavanja promijeni boju", "pri primjeni postupka 111 uz upotrebu odgovarajućeg dodatnog materijala uvjek je preporučljivo predgrijati osnovni materijal u cilju izbjedavanja pojave pukotina izazvanih vodikom"], correct: [2], note: "Termokreda za temperaturu predgrijavanja mora se rastaliti (promijeniti boju), a ona za maksimalnu međuslojnu temperaturu ne smije. Kod S690QL je važna i gornja granica temperature, jer prevelik unos topline smanjuje čvrstoću i žilavost poboljšanog čelika." },
        { q: "Najvažniji parametri za učinkovitu TMO obradu čelika su:", options: ["temperatura austenitizacije", "temperatura kaljenja", "temperatura valjanja", "stupanj deformacije"], correct: [2, 3], note: "Kod termomehaničke obrade (TMO) ključni su temperatura valjanja (deformacija u području bez rekristalizacije) i stupanj deformacije, jer oni daju sitno zrno. Temperatura kaljenja nije parametar TMO-a." },
        { q: "Koji od materijala je(su) osjetljiv(i) na lamelarno odvajanje?", options: ["Re = 460 N/mm2; A5 = 20; ZD = 35 %", "Re = 235 N/mm2; A5 = 30; ZD = 40 %", "Re = 235 N/mm2; A5 = 30; ZD = 10 %", "Re = 355 N/mm2; A5 = 25; ZD = 10 %"], correct: [2, 3], note: "Na lamelarno odvajanje upozorava mala kontrakcija u smjeru debljine (ZD, tj. Z-svojstvo). ZD = 10 % je loše (traži se Z15, Z25, Z35), dok je ZD od 35–40 % dobar bez obzira na čvrstoću." },
        { q: "U gradnji mostova, prednost(i) čelika povišene čvrstoće u odnosu na uobičajene konstrukcijske čelike je(su):", options: ["jednostavnija korozijska zaštita", "visoka granica razvlačenja", "niska prijelazna temperatura", "veliki Yangov modul (modul elastičnosti)"], correct: [1, 2], note: "Čelici povišene čvrstoće imaju višu granicu razvlačenja (tanji presjeci, manja masa) i obično nižu prijelaznu temperaturu. Modul elastičnosti E je za sve čelike praktički isti (oko 210 GPa), a korozijska zaštita nije lakša." },
        { q: "Zavareni sklopovi koji rade na niskim temperaturama mogu biti izrađeni od:", options: ["niskolegiranih čelika otpornih na puzanje", "martenzitnih modificiranih čelika s 9 do 12% Cr", "konstrukcijskih ugljičnih čelika sa sadržajem ugljika iznad 0,2%", "ovisno o najnižoj radnoj temperaturi: CrNi čelici, duplex s 3 ili 9% Ni ili niskougljičnih niskolegiranih konstrukcijskih čelika"], correct: [3], note: "Za niske temperature izbor ovisi o najnižoj radnoj temperaturi: sitnozrnati niskougljični čelici do oko −50 °C, Ni čelici (3,5–9 % Ni) do −196 °C, austenitni CrNi čelici do blizu apsolutne nule. Čelici otporni na puzanje i 9–12 % Cr čelici su za visoke temperature." },
        { q: "Koji od sljedećih elemenata pridonose J faktoru?", options: ["Mn", "As", "P", "S (Tu nikad nismo bili sigurni niušta)"], correct: [0, 2], note: "J-faktor procjenjuje sklonost krhkosti popuštanja CrMo čelika: J = (Mn + Si)·(P + Sn)·10⁴. Zato pridonose Mn i P (i Si, Sn)." },
        { q: "Koji čimbenik(ci) uzrokuje(u) pukotine izazvane napetostnom korozijom u CrNi čeliku?", options: ["visok sadržaj ugljika", "velika tlačna naprezanja", "elektroliti koji sadrže kloride ili fluoride", "velika vlačna naprezanja ili zaostala naprezanja nakon zavarivanja"], correct: [2, 3], note: "Napetosna korozija austenitnih CrNi čelika traži tri uvjeta: osjetljiv materijal, medij s kloridima (ili fluoridima) i vlačna naprezanja, često zaostala od zavarivanja. Tlačna naprezanja je sprječavaju, a ugljik je vezan uz interkristalnu koroziju." },
        { q: "Kako se koristi Schafflerov dijagram kada se zavaruje nehrđajući čelik?", options: ["izračunavanjem Ni i Cr ekvivalenta može se predvidjeti mikrostruktura metala zavara", "iz Schafflerovog dijagrama može se predvidjeti razvoj duplex gama i delta struktue, ako je prva faza koja se skrućuje delta ferit", "uz pomoć Schafflerovog dijagrama može se predvidjeti količina delta ferita zavara", "Schafflerov dijagram omogućava procjenu topljivosti vodika u metalu zavara"], correct: [0, 2], note: "Iz Cr- i Ni-ekvivalenta Schaefflerov dijagram predviđa mikrostrukturu metala zavara (A, F, M) i približan udio δ-ferita. O topljivosti vodika ne govori ništa." },
        { q: "Koje(a) svojstvo(a) određujemo kada će jedno tijelo prodirati trenjem u drugo?", options: ["gustoća", "tvrdoća", "čvrstoća", "žilavost"], correct: [1], note: "Ispravljeno: otpor prodiranju jednog tijela u drugo je definicija tvrdoće (tako je i u engleskom izvorniku: hardness). Zbirka je kao točnu navodila čvrstoću." },
        { q: "Debljina sloja nanesenog vrućim pocinčavanjem je oko:", options: ["1 µm", "60 µm", "300 µm", "5 µm"], correct: [1], note: "Vrućim pocinčavanjem nanosi se sloj od oko 50–100 µm, tipično oko 60–85 µm. Galvansko (elektrolitičko) pocinčavanje daje tanje slojeve, oko 5–25 µm." },
        { q: "Koji se čelici otporni na puzanje koriste pri temperaturama iznad 700 °C?", options: ["nelegirani feritni čelici", "nelegirani feritno-perlitni čelici", "Cr-Mo-V-W-Nb-Ti čelici vrste P91 – P92", "potpuno austenitni čelici"], correct: [3], note: "Ispravljeno: iznad 700 °C koriste se potpuno austenitni čelici (i superlegure). Martenzitni čelici P91 i P92 koriste se do oko 600–620 °C, pa zbirka griješi kad ih navodi kao točne." },
        { q: "Kako se kuglasti grafit može oblikovati u sivom ljevu?", options: ["dodavanjem Si", "legiranjem s Al", "dodavanjem Mg + Ce", "brzim hlađenjem tijekom skrućivanja"], correct: [2], note: "Kuglasti (nodularni) grafit dobiva se cijepljenjem taline magnezijem (i cerijem). Si potiče grafitizaciju, ali daje listićavi grafit, a brzo hlađenje daje bijeli lijev s cementitom." },
        { q: "Kada se zavaruje bakar, mora se uzeti u obzir:", options: ["malo toplinsko istezanje", "velika toplinska vodljivost", "mala topljivost vodika", "stvaranje oksida"], correct: [1, 3], note: "Bakar ima vrlo veliku toplinsku vodljivost (oko 7–8 puta veću od čelika), pa treba predgrijavanje i velik unos topline. Sklon je stvaranju oksida (Cu2O) i vodikovoj bolesti. Toplinsko istezanje mu je veće od čeličnog, ne manje." },
        { q: "Kada se zavaruju Ni i legure nikla, potrebno je:", options: ["predgrijavanje na 150 0C prije zavarivanja", "odmastiti i očistiti dijelove prije zavarivanja", "zavariti bez posebnih priprema", "uvrstiti naknadnu toplinsku obradu zavara"], correct: [1], note: "Nikal i legure nikla vrlo su osjetljivi na nečistoće (S, P, Pb), koje daju tople pukotine i pore, pa je temeljito odmašćivanje i čišćenje nužno. Predgrijavanje i naknadna toplinska obrada obično nisu potrebni." },
        { q: "Tijekom primarnog postupka proizvodnje Al", options: ["najvažnija je sirovina hematit", "čisti hidratizirani aluminijev oksid se proizvodi iz boksita primjenom Bayerovog postupka", "aluminij se izdvaja iz aluminijskog oksida primjenom ugljika kao reducirajuće tvari", "aluminij se rastvara u rastaljenu talinu ili raspada u Al i O primjenom elektrolize"], correct: [1, 3], note: "Bayerovim postupkom iz boksita se dobiva glinica (Al2O3), a ona se otopljena u rastaljenom kriolitu elektrolizom razlaže na Al i O. Sirovina je boksit, ne hematit (to je željezna ruda), a Al se ne može reducirati ugljikom." },
        { q: "Zavarljivost raznorodnih spojeva između ugljičnog i nehrđajućeg čelika ovisi o:", options: ["sastavima osnovnog materijala", "razini ugljika u osnovnom materijalu", "sastavu dodatnog materijala", "omjeru miješanja"], correct: [0, 2, 3], note: "Kod raznorodnog spoja struktura metala zavara ovisi o sastavu oba osnovna materijala, sastavu dodatnog materijala i stupnju miješanja (diluciji), što se provjerava Schaefflerovim dijagramom." },
        { q: "Koji se element(i) može koristiti u svrhu dezoksidacije u MAG zavarivanju čelika?", options: ["Mn", "Si", "Al", "W"], correct: [0, 1, 2], note: "Dezoksidanti u žici za MAG zavarivanje su Mn, Si (i Al, Ti, Zr): vežu kisik iz disociranog CO2 u okside koji odlaze u trosku. Volfram nije dezoksidans." },
        { q: "Materijal koji ima visok koeficijent otvrdnuća:", options: ["pretrpjet će veliku deformaciju prije loma.", "pokazat će značajnu usmjerenost u mehaničkim svojstvima u žarenom stanju", "ima tendenciju da bude manje osjetljiv na brze stope hlađenja do kojih dolazi tijekom ciklusa zavarivanja", "ima visoku sposobnost povećanja čvrstoće plastičnom deformacijom."], correct: [3], note: "Koeficijent deformacijskog očvršćivanja (n) pokazuje koliko materijal očvršćuje plastičnom deformacijom. Ne govori izravno o deformaciji do loma ni o osjetljivosti na brzinu hlađenja." },
        { q: "Ugljik u željezu je prisutan kao:", options: ["međuprostorni legirajući element", "čvrsta otopina ograničene topljivosti", "supstitucijski legirajući element", "potpuna topljivost čvrste čvrste otopine"], correct: [0], note: "Atom ugljika je malen pa ulazi u međuprostore rešetke željeza (intersticijski element). U zbirci je kao točno navedeno samo to, iako je i topljivost C u Fe ograničena (u feritu najviše 0,025 %, u austenitu 2,03 %)." },
        { q: "Druga faza eutektike je sferna, ako:", options: ["lakoća kristalizacije i površinska entalpija su visoke", "lakoća kristalizacije je velika, a površinska entalpija niska", "lakoća kristalizacije je niska, a površinska entalpija visoka", "lakoća kristalizacije i površinska entalpija su niske"], correct: [1], note: "Ključ iz zbirke (nesigurno pitanje): sferna druga faza eutektika nastaje kad faza lako kristalizira, a površinska energija granice je niska. Za ispit je dovoljno zapamtiti ovaj par." },
        { q: "Željezo ima posebno svojstvo postojanja u različitim kristalografskim oblicima u čvrstom stanju. U kojem temperaturnom rasponu postoji kao kubični (FCC) raspored?", options: ["iznad 1390°C", "između 910°C i 1390°C", "ispod 910°C", "Između 723°C i 1390°C"], correct: [1], note: "Željezo je FCC (γ-Fe, austenit) između 911 i 1392 °C. Ispod 911 °C i iznad 1392 °C je BCC (α, odnosno δ). 723 °C je eutektoidna temperatura čelika, ne čistog željeza." },
        { q: "Razlog(i) zašto bi višeprolazni zavar obično bio žilaviji (tougher) od jednoprolaznog zavara je(su) jer:", options: ["stvara se nešto martenzita", "toplina iz jednog prolaza normalizira prethodni prolaz", "toplina iz jednog prolaza pročišćava zrna prethodnog prolaza", "toplina iz jednog prolaza povećava veličinu zrna prethodnog prolaza"], correct: [1, 2], note: "Kod višeprolaznog zavara svaki sljedeći prolaz zagrijava prethodni iznad A3 i tako ga normalizira, odnosno usitnjava zrno, pa je zavar žilaviji. Martenzit i grubo zrno smanjuju žilavost." },
        { q: "Zašto se kaljenje zbog ciklusa zavarivanja smatra nepoželjnim?", options: ["Zato što metal zavara postaje žilav", "Jer uzrokuje lomljivost", "Zato što se vruće pukotine javljaju duž primarnih granica zrna", "Zato što uzrokuje neželjeni stres skupljanja"], correct: [1, 3], note: "Zakaljivanje u zavarenom spoju daje tvrdu, krhku strukturu (martenzit) sklonu hladnim pukotinama, a promjena volumena pri pretvorbi dodaje neželjena naprezanja. Tople pukotine nisu posljedica zakaljivanja." },
        { q: "Koji se postupci trebaju koristiti pri zavarivanju fino zrnatih čelika?", options: ["Namakanje 3 dana nakon zavarivanja 2 sata na 250 °C", "Namakanje odmah nakon zavarivanja 2 sata na 250 °C", "Zavarivanje s vremenom t8/5 od najmanje 30 sekundi", "Zavarivanje korijena s dodatkom manje čvrstoće, kada će se korijen izdubiti"], correct: [1, 3], note: "Kod sitnozrnatih čelika visoke čvrstoće provodi se dogrijavanje odmah nakon zavarivanja (oko 2 h na 200–300 °C) da vodik izađe prije hlađenja. Korijen koji će se izžlijebiti smije se zavariti dodatnim materijalom manje čvrstoće. Dugo t8/5 (≥ 30 s) bi im pokvarilo zrno." },
        { q: "Kod zavarivanja termomehanički obrađenog čelika debljine veće od 15 mm treba koristiti:", options: ["veliki unos topline bez predgrijavanja", "veliki unos topline s predgrijavanjem", "mali unos topline bez predgrijavanja", "mali unos topline s predgrijanjem"], correct: [3], note: "TMCP čelik ima sitno zrno postignuto valjanjem, pa velik unos topline ukrupnjava zrno i smanjuje čvrstoću. Zato se zavaruje malim unosom topline, a kod debljina iznad oko 15 mm uz predgrijavanje zbog vodika." },
        { q: "Koji je/su preduvjet(i) za pojavu pucanja od korozije u nehrđajućim Cr-Ni čelicima bez Mo?", options: ["Čelik mora imati visok sadržaj ugljika", "Čelik mora imati visoka tlačna naprezanja", "Mora postojati medij koji sadrži klorid", "Mora postojati visoka vlačna zaostala naprezanja zavarivanja"], correct: [2, 3], note: "Napetosna korozija CrNi čelika bez Mo nastaje u mediju s kloridima uz vlačna, najčešće zaostala naprezanja od zavarivanja. Tlačna naprezanja je sprječavaju (zato pomaže sačmarenje)." },
        { q: "U izgradnji mostova, prednost(i) čelika visoke čvrstoće u odnosu na uobičajene konstrukcijske čelike je(su):", options: ["lakša zaštita od korozije", "visoka granica razvlačenja", "niska prijelazna temperatura", "visoki Youngov modul"], correct: [1, 2], note: "Isto kao kod ranijeg pitanja: prednosti su visoka granica razvlačenja i niska prijelazna temperatura. Youngov modul je za sve čelike praktički isti, pa nije prednost." },
        { q: "Rizik od krhkog loma tijekom zavarivanja kriogenih Ni čelika je veći kada:", options: ["debljina ploče je povećana", "udarna žilavost zavarenog materijala manja je od 27J", "zavareni spoj je rasterećen", "temperatura zavarivanja je viša"], correct: [0, 1], note: "Krhkom lomu pogoduju veća debljina (troosno stanje naprezanja, sporije hlađenje) i niska žilavost (KV ispod 27 J). Rasterećen spoj (manja zaostala naprezanja) smanjuje rizik." },
        { q: "Nakon zavarivanja Cr-Mo čelika, optimalna svojstva mogu se postići:", options: ["oslobađanje od stresa", "kaljenje i popuštanje", "normaliziranje", "popuštanje"], correct: [3], note: "CrMo čelici nakon zavarivanja se popuštaju (PWHT, npr. 680–750 °C): smanjuje se tvrdoća ZUT-a, napetosti i vodik. Normalizacija ili kaljenje cijele konstrukcije nisu praktični i nisu cilj." },
        { q: "Pukotinska korozija u području korijena zavarenih cijevi od nehrđajućeg čelika uzrokovana je:", options: ["nepasivirani osnovni metal", "nedostatak brige u pripremi utora", "nedostatak plinske zaštite korijena", "previsoka struja zavarivanja"], correct: [2], note: "Bez plinske zaštite korijena (formiranja) korijen nehrđajuće cijevi oksidira i gubi kromom bogat pasivni sloj, pa tamo počinje korozija. Zato se korijen štiti argonom ili N2/H2." },
        { q: "Feritizacija u ZUT je karakteristika:", options: ["austenitni čelici", "feritni čelici", "duplex čelici", "martenzitni čelici"], correct: [2], note: "Kod duplex čelika brzo hlađenje u ZUT-u ne ostavlja vremena za stvaranje austenita, pa ZUT postane pretjerano feritan (feritizacija). Austenitni i feritni čelici nemaju tu dvofaznu ravnotežu." },
        { q: "Ponavljano cikličko trljanje između dvije površine poznato je kao", options: ["umor", "fretting (zajedanje)", "vibracija", "trenje"], correct: [1], note: "Fretting (zajedanje) je trošenje pri malim cikličkim relativnim pomacima dviju površina u dodiru (npr. vibracije u steznom spoju). Umor je lom zbog promjenjivog opterećenja, ne trljanje." },
        { q: "Nitriranje je dobra zaštita od:", options: ["površinski zamor", "abrazija", "erozija", "adhezija"], correct: [0, 3], note: "Ispravljeno: nitriranje daje tvrd, tanak površinski sloj s tlačnim napetostima, pa je dobra zaštita od adhezije i umora površine (tako stoji i u skripti i na predavanjima). Zbirka je navodila abraziju i eroziju, ali za njih je tanak nitrirani sloj slab izbor." },
        { q: "Koji su od sljedećih čelika prikladni za rad na visokim temperaturama iznad 600°C?", options: ["13CrMo 4-5", "X10CrAl 24", "X15CrNiSi25-20", "S235J2G3"], correct: [1, 2], note: "Iznad 600 °C trebaju vatrootporni čelici: feritni X10CrAl24 (Cr i Al daju zaštitni oksid) i austenitni X15CrNiSi25-20. 13CrMo4-5 je za oko 500–550 °C, a S235 za sobne temperature." },
        { q: "Što je od sljedećeg ispravno kada se razmatraju željezno-ugljični materijali za lijevanje?", options: ["Temperatura predgrijavanja određena je ugljikovim ekvivalentom osnovnog materijala i/ili debljinom komada", "Postoje različite vrste grafita u lijevanom željezu.", "C postoji u obliku Fe3C u sivim ljevovima", "Lamelarni grafit postoji u temperiranom lijevanom željezu"], correct: [0, 1], note: "Kod lijevova temperatura predgrijavanja ovisi o ekvivalentu ugljika i debljini, a grafit može biti listićav, kuglast, vermikularan ili čvorast. U sivom lijevu C je u obliku grafita (Fe3C je u bijelom lijevu), a temper lijev ima čvorasti grafit." },
        { q: "Što može uzrokovati poroznost kod zavarivanja mesinga?", options: ["Otapanje dušika u metalu šava", "Otapanje vodika u metalu šava", "Cink isparava zbog niske točke vrenja", "Nedovoljno titana u metalu zavara"], correct: [2], note: "Cink vrije na oko 907 °C, ispod tališta mjedi, pa pri zavarivanju isparava i ostavlja pore. Zato se mjed zavaruje oksidirajućim plamenom ili lemi." },
        { q: "Kod zavarivanja čistog nikla TIG-om, koji će od sljedećih koraka vjerojatno smanjiti poroznost?", options: ["Korištenje metala za punjenje koji sadrži mali postotak titana", "Provjerite jesu li ploče savršeno čiste prije zavarivanja", "Korištenje pažljivo kontroliranog predgrijanja", "Pažljiv odabir tehnike i zaštitnog plina"], correct: [0, 1, 3], note: "Kod nikla pore stvara dušik ili vodik: pomažu dodatni materijal s malo Ti (veže N), savršeno čiste površine i dobra plinska zaštita. Predgrijavanje ne smanjuje poroznost nikla." },
        { q: "Što uzrokuje gubitak čvrstoće zavarenih spojeva od hladno očvrsnutih (deformacijski očvrsnutih) Al legura?", options: ["Žarenje hladno obrađene strukture", "Pretjerano staranje precipitata", "Rast zrna u ZUT", "Kao lijevana struktura u metalu šava"], correct: [0, 2, 3], note: "Kod hladno očvrsnutih legura toplina zavarivanja žari (rekristalizira) strukturu, u ZUT-u raste zrno, a metal zavara ima lijevanu strukturu. Prestarenje precipitata vrijedi za toplinski očvrsnute legure (6xxx, 7xxx), ne za hladno očvrsnute." },
        { q: "Za spajanje unutarnje obložene cijevi bez pristupa za zavarivanje iznutra:", options: ["koristite materijale za punjenje koji odgovaraju osnovnom materijalu nosača", "morate koristiti materijale za punjenje na bazi Ni", "U većini slučajeva potrebno je koristiti visokolegirani materijal za punjenje preko cijele debljine stijenke cijevi", "Zbog opasnosti od pucanja takvi spojevi nisu prihvatljivi"], correct: [2], note: "Kad se platirana cijev ne može zavariti iznutra, cijela se debljina zavaruje visokolegiranim dodatnim materijalom (tip 309/Ni), jer bi nelegirani dodatni materijal razrijedio i uništio korozijski otporan sloj." },
        { q: "Udio δ-ferita u metalu zavara kod aust.čel. koji povoljno djeluje na sprječ. toplih pukotina:", options: ["0-2%", "2-12%", "5-10%", "10-25%"], correct: [1], note: "Austenitni metal zavara treba oko 2–12 % δ-ferita (FN oko 5): ferit otapa S i P i tako sprječava tople pukotine. Previše ferita (iznad oko 12 %) smanjuje žilavost i korozijsku postojanost i povećava rizik od sigma faze." },
        { q: "Dendritna i Witmanstetenova (beningna) struktura nastaje:", options: ["gnječenjem", "lijevanjem", "toplinskom obradom", "zavarivanjem"], correct: [1, 3], note: "Dendritna i Widmanstättenova struktura nastaju skrućivanjem i hlađenjem iz pregrijanog stanja, dakle pri lijevanju i zavarivanju. Gnječenje (deformacija) i toplinska obrada ih uklanjaju." },
        { q: "Smirivanje čelika je:", options: ["postupak žarenja", "postupak vezanja N2 i O2", "postupak plastičnog deformiranja", "postupak legiranja kromom"], correct: [1], note: "Smirivanje (dezoksidacija) čelika je vezanje kisika i dušika iz taline dodavanjem Mn, Si i Al. Smireni čelik je homogeniji, a s Al i sitnozrnat." },
        { q: "Normalizacija nakon zavarivanja:", options: ["eliminira ljevačku strukturu (veliko zrno) zavara iz zone zav.", "eliminira Witmanstet.u strukt. u dijelu ZUT-a koji je bio ugrijan iznad A3 linije", "blagotvorno utječe na cijeli zavar i strukturu", "povećava tvrdoću i krhkost ZUT-a"], correct: [0, 1], note: "Normalizacija (iznad A3, hlađenje na zraku) uklanja grubu lijevanu strukturu metala zavara i Widmanstättenovu strukturu u pregrijanom dijelu ZUT-a, jer usitnjava zrno. Ne povećava krhkost." },
        { q: "Sto utječe na zaostale napetosti:", options: ["debljina OM koji se zavaruje", "oblik žlijeba za zavarivanje", "način i redoslijed polaganja prolaza i spojeva", "položaj (lokacija) zavarenog spoja na zavarenoj konstrukciji"], correct: [0, 1, 2, 3], note: "Na zaostale napetosti utječu sve navedene stvari: debljina (upetost), oblik žlijeba (količina metala zavara), redoslijed prolaza i položaj spoja na konstrukciji." },
        { q: "Glavni cilj visokog popuštanja je:", options: ["smanjenja tvrdoće", "smanjenje napetosti", "eliminacija napetosti", "povećanje tvrdoće"], correct: [0], note: "Ključ iz zbirke je smanjenje tvrdoće. Visoko popuštanje nakon kaljenja (poboljšavanje) smanjuje tvrdoću i krhkost martenzita uz porast žilavosti, a usput smanjuje i napetosti. Napetosti se ne mogu potpuno eliminirati. ⚠️ U nekim izvorima kao glavni cilj stoji smanjenje napetosti, pa provjeri na slajdu." },
        { q: "Martenzitna pretvorba odvija se:", options: ["samo uz difuziju", "samo pretvorbom austenitne rešetke", "uz difuziju preko austenitne rešetke", "ništa od navedenog"], correct: [1], note: "Martenzitna pretvorba je bezdifuzijska: austenitna rešetka se smicanjem preklopi u tetragonsku (BCT) i zadrži sav ugljik. Zato nastaje samo pri hlađenju brzinom većoj od kritične." },
        { q: "Prethodno poboljšane čelike treba nakon zavarivanja", options: ["žariti na temperaturu na kojoj su prije popuštan", "žariti na temperaturu popuštanja", "žariti ispod temperature popuštanja", "kaliti u vodi"], correct: [2], note: "Ispravljeno: poboljšani čelici (kaljeni i popušteni) nakon zavarivanja žare se nešto ispod temperature popuštanja (oko 20–30 °C niže). Na temperaturi popuštanja ili iznad nje dodatno bi se popustili i izgubili čvrstoću. Zbirka je kao točno navodila žarenje na temperaturi popuštanja." },
        { q: "Feritizacija u ZUT-u je karakteristična za:", options: ["austenitni čelik", "duplex čelike", "visokougljični čelik", "martenzitni nehrđajući čelik"], correct: [1], note: "Feritizacija ZUT-a tipična je za duplex čelike: brzim hlađenjem ZUT ostane s previše ferita jer se austenit ne stigne izlučiti. Rješenje je dovoljan unos topline i dodatni materijal s više Ni." },
        { q: "U oznaci St420 (CRO) brojčani dio oznake znači", options: ["minimalnu čvrstoću Rm", "maksimalnu čvrstoću Rm", "minimalnu granicu razvlačenja Rp0,2 (420 N/mm2)", "maksimalnu granicu razvalčenja Rp0,2"], correct: [2], note: "Kod oznake St420 broj 420 je minimalna granica razvlačenja Rp0,2 u N/mm². Tako i kod EN oznake S355 broj označava minimalni Re, a ne čvrstoću Rm." },
        { q: "Osnovni cilj termomehaničke obrade je", options: ["proizvesti čelik novog sastava", "postići oblikovanjem što višu Rm", "što viši Rp0,2 s istom visinom žilavosti KV (20 °C) i nižim temperaturama sa čelikom postojećeg sastava", "postići što višu žilavost KV i što veću Rm, ne vodeći računa o ekonomskom momentu"], correct: [2], note: "Cilj TMO-a je s postojećim kemijskim sastavom postići višu granicu razvlačenja uz istu žilavost i nižu prijelaznu temperaturu, jer valjanje daje sitno zrno. Ne mijenja se sastav i ne ide se na čvrstoću pod svaku cijenu." },
        { q: "Pri izboru čel. za konstr.dijelove široke primj., pri sobnim i sniž. temp., prednost dati č. koji očvršćavaju mehanizmom:", options: ["stvaranjem mješanaca i udjelom perlita", "unosom novih dislokacija i Orowanovim mehanizmom", "stvaranjem mješanaca i Orowanovoim mehanizmom precipitacije", "Orowana (percipitacije) i Hall-Petch (sitno zrno)"], correct: [3], note: "Za konstrukcijske čelike pri sobnim i sniženim temperaturama najbolji su precipitacijsko očvršćivanje (Orowan) i usitnjavanje zrna (Hall-Petch), jer jedino sitno zrno povisuje čvrstoću i istodobno snizuje prijelaznu temperaturu. Perlit i nove dislokacije smanjuju žilavost." },
        { q: "Kako H2 utječe na mehanička svojstva zavarenog spoja:", options: ["povećava žilavost", "smanjuje žilavost", "povećava tvrdoću", "smanjuje čvrstoću"], correct: [1, 3], note: "Vodik uzrokuje vodikovu krhkost: pada žilavost i deformabilnost, a time i nosivost spoja. Tvrdoću ne povećava. Zbirka je ovdje navodila i odgovor kojeg nema među ponuđenima." },
        { q: "Sadržaj H2 u zavarenom spoju se smanjuje:", options: ["odgovarajućim sušenjem dodatnog materijala za zavarivanje", "predgrijavanjem", "pravilnim redoslijedom zavarivanja", "kvalitetnom pripremom i čišćenjem žlijebova za zavarivanje"], correct: [0, 1, 3], note: "Vodik se smanjuje sušenjem dodatnog materijala, predgrijavanjem (i dogrijavanjem), jer vodik ima više vremena izaći, te čišćenjem žlijeba od vlage, masti i rđe. Redoslijed zavarivanja utječe na napetosti, ne na vodik." },
        { q: "Sadržaj difuzijskog H2 u metalu zavara se iskazuje:", options: ["ml/100 gram metala zavara", "mg/100 gram metala zavara", "bezdimenzijska vrijednost", "cm3/100 gram metala zavara"], correct: [0, 3], note: "Difuzijski vodik izražava se u ml (cm³) vodika na 100 g metala zavara (npr. H5 = najviše 5 ml/100 g). To je ista jedinica, samo različito napisana." },
        { q: "Dobro zavarljiv čelik koji ima vrijednost C ekv do:", options: ["0,45", "0,02", "0,25", "2-3"], correct: [2], note: "Ključ iz zbirke (prema slajdu): čelik s Cekv do oko 0,25 smatra se dobro zavarljivim bez posebnih mjera. ⚠️ Prema IIW-u i u drugim izvorima granica je oko 0,4–0,45, pa pazi kako je pitanje zadano." },
        { q: "Na toplinsku histerezu najjače utječu:", options: ["brzina grijanja", "brzina hlađenja", "volumen epruvete", "tlak okolnog zraka"], correct: [1], note: "Toplinska histereza je razlika temperatura pretvorbe pri grijanju i hlađenju (Ac i Ar), a ovisi o brzini promjene temperature, prema ključu najjače o brzini hlađenja: što je hlađenje brže, pretvorba kasni do nižih temperatura." },
        { q: "Problemi koji nastaju u zavaru Ni legura su:", options: ["smanjenje žilavosti", "zakaljivost", "tople pukotine", "poroznost"], correct: [2, 3], note: "Kod legura nikla glavni su problemi tople pukotine (nisko taljivi Ni3S2 na oko 637 °C) i poroznost (N2, H2, O2). Ni legure nisu zakaljive i ostaju žilave." },
        { q: "Omjer Rp0,2 / Rm = 0.7 do 0.9, 0.9 se ne prekoračuje jer:", options: ["Povišenje Rp0.2 izaziva ureznu osjetljivost", "Niži Rp0.2 omogućuje lokalnu trajnu deformaciju i razgradnju šiljaka naprezanja", "Povišenje Rp0.2 daje i sniženje žilavosti KV (20 ºC)", "Povišenje granice razvlačenja Rm izaziva povišenje temperature"], correct: [0, 1, 2], note: "Omjer Re/Rm ne smije biti blizu 1, jer bi materijal izgubio plastičnu rezervu: viša granica razvlačenja znači veću osjetljivost na zareze i manju žilavost. Niži Re dopušta lokalno tečenje koje razgrađuje vršna naprezanja." },
        { q: "Pri određivanju konvencionalne granice razvlačenja Rp0.5, 0.5 znači:", options: ["trajnu deformaciju nakon rastezanja", "ukupnu deformaciju u opterećenom stanju", "pedeset posto trajne deformacije nakon rastezanja", "produljenje epruvete od 0,5 mm"], correct: [0], note: "Rp0,5 je naprezanje pri kojem nakon rasterećenja ostaje 0,5 % trajne (plastične) deformacije. Isto vrijedi za Rp0,2 (0,2 % trajne deformacije)." },
        { q: "Normalizacija podeutektoidnih čelika podrazumijeva:", options: ["zagrijavanje iznad 1450 °C", "zagrijavanje na temperaturu iznad A3", "zagrijavanje na t = 600 °C", "zagrijavanje na 1350 - 1450 °C"], correct: [1], note: "Normalizacija podeutektoidnog čelika: zagrijavanje na A3 + 30–70 °C i hlađenje na mirnom zraku, čime se dobiva sitno, jednoliko zrno. Temperature od 1350 °C i više dovele bi do pregrijavanja." },
        { q: "Izbjegavanje senzibilizacije (izlučivanje Cr - karbida) kao posljedica zavarivanja visokolegiranih čelika se postiže:", options: ["sniženjem % C", "legiranjem s Mo", "povišenjem % Cr", "smanjenjem % Ni"], correct: [0], note: "Ispravljeno: senzibilizacija se sprječava sniženjem ugljika (L kvalitete, C < 0,03 %), stabilizacijom s Ti ili Nb i rastvornim žarenjem. Mo povisuje otpornost na rupičastu koroziju, ali ne sprječava izlučivanje Cr-karbida; zato zbirka ovdje griješi." },
        { q: "Primjenjivost čelika povišene ili visoke čvrstoće u praksi je", options: ["neograničeno", "ograničeno samo ekonomski", "ograničeno tehničkim razlozima (E = konst.)", "ograničeno ekonomskim i tehničkim razlozima (E = konst.)"], correct: [3], note: "Primjena čelika visoke čvrstoće ograničena je ekonomski (cijena, zavarivanje) i tehnički: modul elastičnosti E je isti, pa tanji presjeci daju veće progibe i manju stabilnost (izvijanje)." },
        { q: "\"Jarak tvrdoće\" karakterističan je za:", options: ["normalizacija sitnozrnatih čelika, kao posljedica zavarivanja", "poboljšane sitnozmate čelike, kao posljedica kaljenja i popuštanja", "normalizirane sitnozmate čelike t.o.", "poboljšane sitnozmate čelike, kao posljedica pojava pri zavarivanju"], correct: [3], note: "„Jarak tvrdoće“ je omekšana zona u ZUT-u poboljšanih (kaljenih i popuštenih) čelika: zagrijavanje iznad temperature popuštanja dodatno popusti strukturu, pa tvrdoća i čvrstoća padnu." },
        { q: "Oblik grafitnog (nodulamog) žilavog lijeva je:", options: ["igiličasti", "lisnati", "kuglasti", "valjkasti"], correct: [2], note: "Nodularni (žilavi) lijev ima grafit u obliku kuglica, pa je mnogo žilaviji od sivog lijeva s listićavim (lamelarnim) grafitom." },
        { q: "Koji čimbenici utječu na strukturne promjene u materijalu:", options: ["brzina zagrijavanja", "brzina ohladivanja", "Q unosenja", "vrsta materijala"], correct: [1, 2, 3], note: "Strukturne promjene ovise o brzini hlađenja, unosu topline i vrsti (sastavu) materijala. Brzina zagrijavanja ima manji utjecaj, pa je ključ izostavlja." },
        { q: "Koroziju ugljičnog čelika u vodi uzrokuje:", options: ["voda", "O2 otopljen u vodi", "sadrzaj soli u vodi", "sadrzaj kiselina u vodi"], correct: [0, 1, 2, 3], note: "Ugljični čelik u vodi korodira zbog elektrokemijske reakcije: voda je elektrolit, otopljeni kisik je oksidans, a soli i kiseline ubrzavaju koroziju. Zato su točna sva četiri odgovora." },
        { q: "Procjena fizikalno-kemijskih transformacija pod utjecajem toplinskog ciklusa zavarivanja razmatra se u okviru:", options: ["operativne zavarljivosti", "metalurške ili lokalne zavarljivosti", "konstrukcije ili globalne zavarljivosti", "ekonomske zavarljivosti"], correct: [1], note: "Metalurška (lokalna) zavarljivost razmatra fizikalno-kemijske pretvorbe u ZUT-u i metalu zavara. Operativna je izvedivost (postupak, predgrijavanje), a konstrukcijska ponašanje spoja u konstrukciji." },
        { q: "„Linija staljivanja“ predstavlja:", options: ["granicu između ZUT-a i OM", "granicu između ZUT-a i zone taljenja (MZ)", "granicu između OM i ZS", "granicu između dva susjedna prolaza zavara"], correct: [1], note: "Linija staljivanja je granica između rastaljenog metala zavara (zona taljenja) i ZUT-a. Granica ZUT-a i osnovnog materijala nema poseban naziv." },
        { q: "Napetosti u zavarenom spoju sastoje se od:", options: ["samo pretvorbenih napetosti", "od pretvorbenih i toplinskih napetosti", "samo od toplinskih napetosti", "samo od napetosti zbog vanjskog opterećenja"], correct: [1], note: "Napetosti u zavarenom spoju zbroj su toplinskih napetosti (nejednoliko zagrijavanje i hlađenje) i pretvorbenih napetosti (promjena volumena pri faznoj pretvorbi, npr. martenzit)." },
        { q: "Kemijski sastav nelegiranog čelika:", options: ["ne utječe na čvrstoću čelika", "ne utječe na tvrdoću čelika", "utječe na mehanička svojstva", "utječe na tvrdoću čelika"], correct: [2, 3], note: "Kod nelegiranog čelika najvažniji je udio ugljika: više C znači veću čvrstoću i tvrdoću, a manju žilavost i zavarljivost. Zato sastav utječe i na mehanička svojstva i na tvrdoću." },
        { q: "Analizom makrosnimke zavarenog spoja utvrđuje se:", options: ["broj slojeva zavara", "širina ZUT-a", "makro nehomogenosti", "vrsta dodatnog materijala"], correct: [0, 1, 2], note: "Na makroizbrusku se vide broj slojeva, širina ZUT-a i makronehomogenosti (pore, uključci, neprovar). Vrsta dodatnog materijala se iz makroizbruska ne može odrediti, a mikropukotine traže mikroskop." },
        { q: "Dislokacije su:", options: ["točkaste nepravilnosti", "linijske nepravilnosti", "površinske nepravilnosti", "volumenske nepravilnosti"], correct: [1], note: "Dislokacije su linijske greške kristalne rešetke. Točkaste su praznine i intersticijski atomi, a površinske granice zrna." },
        { q: "Najgušći mogući raspored atoma u rešetci imaju:", options: ["FCC rešetka", "BCC rešetka", "Tetragonalna", "HCP rešetka"], correct: [0, 3], note: "FCC i HCP imaju isti, najveći faktor popunjenosti (74 %, koordinacijski broj 12). BCC ima 68 %. Zbirka je kao točan navodila samo FCC, pa je ključ ispravljen." },
        { q: "Veličina zrna može se iskazati", options: ["ekvivalentnim promjerom", "brojem zrna prema ASTM", "brojem zrna na jedinicu površine", "udjelom nečistoća"], correct: [0, 1, 2], note: "Veličina zrna iskazuje se ekvivalentnim promjerom, ASTM brojem (G) ili brojem zrna po jedinici površine. Udio nečistoća nije mjera veličine zrna." },
        { q: "Čisto željezo ima alotropske modifikacije", options: ["α", "β", "γ", "ρ"], correct: [0, 2], note: "Alotropske modifikacije željeza su α (BCC, do 911 °C), γ (FCC, 911–1392 °C) i δ (BCC, iznad 1392 °C). β-Fe se danas ne smatra posebnom modifikacijom (to je nemagnetično α iznad 768 °C), a ρ ne postoji." },
        { q: "α-geni elementi su:", options: ["Mn", "Ni", "Cr", "Si"], correct: [2, 3], note: "α-geni elementi šire područje ferita: Cr, Si, Mo, W, Al, V, Ti. γ-geni šire područje austenita: Ni, Mn, Co, Cu, C, N." },
        { q: "Od HSLA - čelika izrađuju se:", options: ["kuglasti spremnici", "naftne platforme", "zupčanici", "osovine"], correct: [0, 1], note: "HSLA (mikrolegirani) čelici koriste se za zavarene konstrukcije: spremnike, naftne platforme, mostove, cjevovode. Zupčanici i osovine izrađuju se od čelika za poboljšavanje ili cementiranje." },
        { q: "Mikrostruktura podeutektoidnog čelika na sobnoj temperaturi sastoji se od:", options: ["ferit primarni - α'", "primami austenit", "ledeburit", "perlit"], correct: [0, 3], note: "Podeutektoidni čelik (C < 0,8 %) na sobnoj temperaturi sastoji se od primarnog (proeutektoidnog) ferita i perlita. Ledeburit postoji tek iznad 2,03 % C (lijevovi), a austenit se pri sporom hlađenju pretvori." },
        { q: "Veliko minimalno vrijeme inkubacije u TTT dijagramu znači da je čelik", options: ["slabo prokaljiv", "dobro prokaljiv", "legiran", "nelegiran"], correct: [1], note: "Veliko vrijeme inkubacije (TTT krivulja pomaknuta udesno) znači da se martenzit može dobiti i sporijim hlađenjem, dakle čelik je dobro prokaljiv. ⚠️ U jednom starom ispitu stoji „slabo“; provjeri na slajdu." },
        { q: "Najpovoljniji mehanizam očvršćenja obzirom na prijelaznu temperaturu", options: ["precipitacija", "Usitnjenjem zrna", "Legiranjem Mn i Ni", "Povećanjem udjela perlita"], correct: [1, 2], note: "Usitnjavanje zrna jedini je mehanizam koji povisuje čvrstoću i istodobno snizuje prijelaznu temperaturu. Ni (i Mn) također snizuju prijelaznu temperaturu. Precipitacija i perlit je povisuju." },
        { q: "Procjena strukture zavarenog spoja u Schafflerovom dijagramu, pomoću", options: ["Cr-ekvivalent", "Ni-ekvivalent", "Cr/Ni ekvivalent", "Stupanj miješanja osnovnog i dodatnog materijala"], correct: [0, 1, 3], note: "U Schaefflerov dijagram ucrtavaju se točke iz Cr- i Ni-ekvivalenta osnovnih i dodatnog materijala, a položaj metala zavara određuje se prema stupnju miješanja (diluciji). Omjer Cr/Ni nije os dijagrama." },
        { q: "Čelik sa koji ima vrijednost Cekv = 0,65 je:", options: ["lakše zavarljiv", "teže zavarljiv", "ne utječe na zavarivanje", "nezavarljiv ni pod kojim uvjetima"], correct: [1], note: "Cekv od 0,65 je visok, pa je čelik teže zavarljiv (sklon zakaljivanju i hladnim pukotinama). Može se zavarivati, ali uz predgrijavanje, kontrolirani unos topline i niskovodikove dodatne materijale." },
        { q: "Feritizacija u ZUT-u karakteristična je za", options: ["austenitni čelik", "feritni čelik", "duplex čelike s malim postotkom N2", "duplex čelike s većim postotkom N2"], correct: [2], note: "Dušik je jak austenitotvorac, pa duplex čelici s malo N u ZUT-u lakše ostanu pretjerano feritni (feritizacija). Moderni duplex čelici zato imaju više N, a dodaje se i u zaštitni plin." },
        { q: "Po visini granice razvlačenja u prednosti su u skupini korozijski postojanih čelika:", options: ["austenitni čelici", "duplex čelici", "feritni čelici", "potpuno austenitni Cr-Ni-Mo čelici s dodatkom Ti"], correct: [1], note: "Duplex čelici imaju oko dvostruko višu granicu razvlačenja (oko 450–550 N/mm²) od austenitnih (oko 200–300 N/mm²), zahvaljujući dvofaznoj strukturi i dušiku." },
        { q: "Za procjenu strukture zavarenih spojeva s povećanim udjelom feritne strukture kod duplex čelika najpouzdaniji je sljedeći strukturni dijagram", options: ["Shafflerov dijagram", "De Longov dijagram", "WRC dijagram", "Fe-C dijagram"], correct: [2], note: "WRC-1992 dijagram najtočnije predviđa udio ferita (FN) do visokih vrijednosti i uzima u obzir N i Cu, pa je najbolji za duplex. Schaeffler i De Long su manje točni u feritnom području." },
        { q: "Duplex čelici spadaju grupi korozijski postojanih materijala:", options: ["struktura im je feritna", "struktura im je austenitna", "struktura im je feritno martenzitna", "struktura im je austenitno feritna y/α'—> 60/40 ili 40/60"], correct: [3], note: "Duplex čelici imaju dvofaznu austenitno-feritnu strukturu, otprilike u omjeru 50 : 50 (dopušteno oko 40–60 %). Nisu ni čisto feritni ni martenzitni." },
        { q: "Austenit je:", options: ["kristal mješanac (čvrsta otopina C u γ-Fe)", "ima FCC rešetku", "može rastvoriti više od 1 % C", "ne može rastvoriti više od 1 % C"], correct: [0, 1, 2], note: "Austenit je kristal mješanac, intersticijska čvrsta otopina C u γ-Fe s FCC rešetkom, i može otopiti do 2,03 % C (na 1147 °C)." },
        { q: "Austenit se pri hlađenju može pretvoriti:", options: ["martenzit", "feriti perlit", "cementit čisti", "bainit"], correct: [0, 1, 3], note: "Ovisno o brzini hlađenja austenit prelazi u ferit i perlit (sporo), bainit (srednje brzo) ili martenzit (brže od kritične brzine). Čisti cementit ne nastaje iz austenita podeutektoidnog čelika." },
        { q: "Kakvu rešetku ima austenit:", options: ["α", "β", "γ - FCC", "ρ"], correct: [2], note: "Austenit je γ-željezo s plošno centriranom kubičnom (FCC) rešetkom. α i δ su BCC." },
        { q: "Prve mikro pukotine se pojavljuju kod umora:", options: ["na površini", "ispod površine", "na početku rada", "nakon većeg broja ciklusa"], correct: [1, 3], note: "Ključ iz zbirke vrijedi za umor površine (kontaktni umor, npr. ležajevi, zupčanici): najveća smična naprezanja su malo ispod površine, pa se tamo pojave prve mikropukotine, i to nakon većeg broja ciklusa. ⚠️ Kod klasičnog umora (savijanje, vlak) pukotine najčešće počinju na površini." },
        { q: "Tople pukotine u metalu zavara su nerijetko posljedica zavarivanja austenitnih čelika i izbjegavaju se:", options: ["predgrijavanjem", "naknadnom toplinskom obradom", "udjelom δ-ferita (2 - 12%) u strukturi metala zavara", "dodatnim legiranjem cinkom"], correct: [2], note: "Tople pukotine austenitnog metala zavara sprječava 2–12 % δ-ferita, koji otapa S i P. (U izvorniku je pogrešno pisalo γ-ferit.) Predgrijavanje kod austenitnih čelika ne pomaže, a cink je štetan." },
        { q: "Hlađenje austenitnog čelika donjim kritičnim intenzitetom postiže se:", options: ["potpuno martenzitna struktura", "djelomično martenzitna struktura", "bezmartenzitna struktura", "potpuno ledeburitna struktura"], correct: [2], note: "Donji kritični intenzitet (brzina) hlađenja je najveća brzina pri kojoj još ne nastaje martenzit, pa je struktura bez martenzita. Gornjim kritičnim intenzitetom dobiva se potpuno martenzitna struktura." },
        { q: "Debljina pocinčanog sloja je", options: ["1 μm", "20-30 μm", "25-35 μm", "0,5 μm"], correct: [1, 2], note: "Ključ iz zbirke je 20–35 µm; takve debljine daje galvansko pocinčavanje i tanji vruće pocinčani slojevi. ⚠️ U drugom pitanju (međunarodni ispit) za vruće pocinčavanje točno je oko 60 µm, pa pazi kako je pitanje zadano." },
        { q: "U gradnji nosača, mostova, dizalica, krovova, visokočvrsti čelici su čelici u prednosti pred običnim zbog:", options: ["visoke granice razvlačenja i otpornosti na izvijanje", "visoke granice razvlačenja Rp0,2 i niske prijelazne temperature", "lakše zaštite od korozijskih djelovanja i njihovih troškova", "povoljnog modula elastičnosti E i koeficijenta toplinskog istezanja"], correct: [1], note: "Kod nosača i mostova prednost čelika visoke čvrstoće je viša granica razvlačenja Rp0,2 (manja masa) uz nisku prijelaznu temperaturu. Otpornost na izvijanje ovisi o modulu E, koji je isti za sve čelike, a korozijska zaštita nije lakša." },
        { q: "U izboru poboljšanih sitnozrnatih čelika za sanduke radničkih vagoneta i građevinskih kamina odlučujuća je bila spoznaja", options: ["pogoduje oblikovanju deformiranjem", "ovisi o dobroj zavarljivosti", "o dobroj otpornosti na trošenje", "o visokoj žilavosti prekaljenog lima"], correct: [2], note: "Sanduci vagoneta i kamiona trpe abrazijsko trošenje (kamen, šljunak), pa je presudna otpornost na trošenje koju daje visoka tvrdoća poboljšanog čelika." },
        { q: "Za izradu pramčanog dijela oplate ledolomca, prednost imaju čelici:", options: ["visoke čvrstoće Rm i granice razvlačenja Rp0,2", "nizak koeficijent prijelazne topline i visoke Rp0,2", "visoke žilavosti KV (20°C) i visoke čvrstoće Rm", "visoke otpornosti na trošenje i niske prelazne temperature"], correct: [3], note: "Pramac ledolomca trlja se o led (trošenje) i radi na temperaturama ispod nule (opasnost od krhkog loma), pa trebaju otpornost na trošenje i niska prijelazna temperatura." },
        { q: "Za efikasnost termomehaničkih obrada općenito u najvišem stupnju su odlučujući parametri:", options: ["temperatura austenizacije i gašenje", "trajanje oblikovanja i njegova temperatura", "stupanj oblikovanja (perliforming)", "temperatura oblikovanja"], correct: [0, 2, 3], note: "Kod termomehaničkih obrada odlučuju temperatura austenitizacije i gašenje, stupanj oblikovanja i temperatura oblikovanja (Tema 2.10). Trajanje oblikovanja nije presudno." },
        { q: "Za korozijsku postojanost zavarenih spojeva od nehrđajućeg čelika od značajnih utjecaja su:", options: ["uvjeti zavarivanja", "položaj u kojem je izvedeno zavarivanje", "naknadna obrada površine", "brušenje i poliranje"], correct: [0, 2, 3], note: "Korozijska postojanost nehrđajućeg spoja ovisi o uvjetima zavarivanja (unos topline, zaštita korijena) i obradi površine: uklanjanju oksida brušenjem, poliranjem i kemijskim nagrizanjem (pasiviranje). Položaj zavarivanja nema izravan utjecaj." },
        { q: "Koje su vrste korozijskih pojava tipične za područje zavarenog spoja kod visokolegiranih (nehrđajućih) čelika?", options: ["interkristalna korozija (IKK)", "rupičasta korozija (pitting)", "napetosna korozija", "vodikova bolest"], correct: [0, 1, 2], note: "Kod nehrđajućih čelika u zavarenom spoju tipične su interkristalna, rupičasta i napetosna korozija (te galvanska i korozija u procjepu). Vodikova bolest je pojava kod bakra koji sadrži kisik." },
        { q: "Na korozijsku postojanost zavarenih spojeva imaju utjecaja:", options: ["postupak zavarivanja", "unos topline", "brzina hladenja", "hrapavost povrsine"], correct: [0, 1, 2, 3], note: "Postupak zavarivanja, unos topline i brzina hlađenja određuju strukturu i izlučivanje karbida, a hrapava površina lakše zadržava medij i nečistoće. Zato sva četiri čimbenika utječu na korozijsku postojanost." },
        { q: "Je li tvrdoća najbolji pokazatelj otpornosti na trošenje?", options: ["da, uvijek", "ne – otpornost na trošenje ovisi o mehanizmu trošenja i tribosustavu", "da, ali samo kod adhezije", "da, ali samo kod umora površine"], correct: [1], note: "Otpornost na trošenje ovisi o mehanizmu trošenja (abrazija, adhezija, umor površine, tribokorozija) i cijelom tribosustavu. Tvrdoća pomaže kod abrazije, ali nije univerzalni pokazatelj." },
        { q: "Pri MIG zavarivanju Al legura koriste se sljedeći zaštitni plinovi:", options: ["Ar", "He", "Ar/He", "He/CO2"], correct: [0, 1, 2], note: "Aluminij se MIG zavaruje isključivo u inertnim plinovima: Ar, He ili Ar/He. CO2 (i O2) oksidira aluminij i daje pore, pa se ne smije koristiti." },
        { q: "Čelici sa 3 - 9 %Ni i sa oko 0,1 - 0,15 %C prikladni su za rad pri vrlo niskim temperaturama zahvaljujući", options: ["poboljšanoj Ni - Martenzitnoj strukturi", "izotermički poboljšanoj bainitnoj strukturi", "austenitnoj strukturi", "feritno-perlitnoj strukturi s grubim zrnom"], correct: [0], note: "Ključ iz zbirke (Tema 2.13): čelici s 3–9 % Ni i oko 0,1 % C dobivaju žilavost na niskim temperaturama poboljšanom (kaljenom i popuštenom) Ni-martenzitnom strukturom s malo zaostalog austenita. Nisu potpuno austenitni." },
        { q: "Kod normaliziranih mikrolegiranih (HSLA) čelika treba područje o načinu povišenja primjenjivosti dati prednost:", options: ["mehanizmu očvršćenja usitnjenjem zrna", "mehanizmu očvršćenja novim dislokacijama", "mehanizmu očvršćenja mješancima", "mehanizmu očvršćenja hladnom deformacijom"], correct: [0], note: "Normalizirani HSLA čelici dobivaju čvrstoću prvenstveno usitnjavanjem zrna (mikrolegiranjem s Nb, V, Ti), jer ono povisuje čvrstoću i istodobno žilavost. Hladna deformacija i mješanci smanjuju žilavost." },
        { q: "Glavni uzročnik poroznosti u zavarenim spojevima kod Al i njegovih legura:", options: ["N2", "H2", "O2", "CO2"], correct: [1], note: "Glavni uzrok pora u aluminiju je vodik: rastaljeni Al otapa oko 20 puta više vodika nego kruti, pa se pri skrućivanju vodik izdvaja u mjehuriće. Izvor su vlaga, oksidi i masnoće." },
        { q: "Za primjenu za rad pri povišenim temperaturama biraju se prije svega Mo čelici zbog toga što", options: ["Mo povisuje granicu razvlačenja Rp0,2 (očvršćivanje kristala mješanca)", "Mo sprječava ogaranje (oksidaciju) pri povišenim temperaturama", "Mo povisuje postojanost na rupičastu koroziju", "Mo poboljšava žilavost"], correct: [0, 2, 3], note: "Mo očvršćuje ferit (viša granica razvlačenja i otpornost na puzanje), povisuje otpornost na rupičastu koroziju i smanjuje krhkost popuštanja. Od oksidacije (ogaranja) štite Cr, Si i Al, ne Mo." },
        { q: "Ulazne veličine koje su potrebne za ocjenjivanje očekivane strukture zavarenog spoja u Shafferovom dijagramu su:", options: ["Cr ekvivalent", "Cr/Ni ekvivalent", "Ni ekvivalent", "C ekvivalent"], correct: [0, 2], note: "Schaefflerov dijagram ima Cr-ekvivalent na apscisi i Ni-ekvivalent na ordinati, pa su to ulazne veličine. Omjer Cr/Ni i Cekv nisu osi dijagrama." },
        { q: "Primjenom Schafflerovog dijagrama kod zavarivanja raznorodnih materijala pojedinih vrsta dodatnog materijala može se kvalitetno:", options: ["procijeniti vjerojatnost nastanka hladnih pukotina", "procijeniti vjerojatnost nastanka toplih pukotina", "procijeniti vjerojatnost pogrubljenja zrna područja ZUT-a iznad 1100 °C", "procijeniti vjerojatnost povećane krhkosti poslije toplinske obrade 500 - 900°C"], correct: [0, 1, 2, 3], note: "Schaefflerov dijagram ima četiri opasna područja: martenzit (hladne pukotine), potpuni austenit (tople pukotine), ferit (pogrubljenje zrna iznad 1100 °C) i previše ferita (sigma faza, krhkost na 500–900 °C). Zato su točna sva četiri odgovora." },
        { q: "Schafflerov dijagram se može uspješno koristiti kod:", options: ["grafičkog određivanja temperaturnog područja u cilju izbjegavanja hladnih pukotina", "zavarivanja raznorodnih materijala (čelika)", "procjene naknadne toplinske obrade poslije zavarivanja", "određivanja vremena hlađenja t8/5"], correct: [1], note: "Schaefflerov dijagram koristi se za zavarivanje raznorodnih čelika: iz sastava oba osnovna i dodatnog materijala te dilucije predviđa strukturu metala zavara. Temperaturu predgrijavanja, toplinsku obradu ni t8/5 iz njega ne čitamo." },
        { q: "Inicijalno mjesto za lamelamo odvajanje je:", options: ["zona taljenja (metal zavara)", "zona utjecaja topline ili zona taljenja", "zona utjecaja topline (ZUT)", "lice zavara (površina metala zavara)"], correct: [2], note: "Lamelarno odvajanje počinje u ZUT-u ili tik ispod njega, u osnovnom materijalu oko izduženih sulfidnih uključaka, i širi se stepenasto paralelno s površinom lima. Ne nastaje u metalu zavara." },
        { q: "Navedi dvije osnovne tople pukotine", options: ["kristalizacijske pukotine", "podsolidosne (likvacijske) pukotine", "vodikove (zakašnjele) pukotine", "lamelarno odvajanje"], correct: [0, 1], note: "Tople pukotine dijele se na kristalizacijske (u metalu zavara pri skrućivanju) i podsolidusne, odnosno likvacijske (u ZUT-u, rastaljeni filmovi po granicama zrna). Vodikove pukotine su hladne." },
        { q: "Hladne pukotine mogu nastati:", options: ["samo u ZUT-u", "mogu nastati i u ZUT-u i u ZT", "samo u ZT", "samo u osnovnom materijalu daleko od zavara"], correct: [1], note: "Hladne pukotine nastaju ondje gdje se susretnu zakaljena struktura, vodik i naprezanja, dakle i u ZUT-u i u metalu zavara (ZT), najčešće u ZUT-u." },
        { q: "Vjerojatnost nastajanja hladnih pukotina se smanjuje:", options: ["predgrijavanjem", "normalizacijskim žarenjem", "sušenjem elektroda, zaštitnog praška", "pravilnim redoslijedom zavarivanja"], correct: [0, 2, 3], note: "Hladne pukotine smanjuju predgrijavanje (sporije hlađenje, izlazak vodika), sušenje elektroda i praška (manje vodika) i pravilan redoslijed zavarivanja (manje naprezanja). Normalizacijsko žarenje nije mjera protiv njih." },
        { q: "Glavni uzročnici nastajanja hladnih pukotina su:", options: ["visok sadržaj difuzijskog H2, visoka prijelazna temp. i primjena neumirenih čelika", "sklonost strukture OM i ZS zakaljivanju, visok sadržaj difuzijskog H2 u ZS i visoka razina zaostali naprezanja u ZS", "visok Cekv za OM i materijal ZS, visok sadržaj difuzijskog H2 u ZS i visoka razina zaostalih naprezanja u ZS", "Cekv > 0,3 i visoka zaostala naprezanja u ZS"], correct: [1, 2], note: "Hladne pukotine uzrokuju tri čimbenika zajedno: zakaljiva struktura (koju izražava i visok Cekv), difuzijski vodik i zaostala naprezanja. Neumireni čelik i prijelazna temperatura nisu uzroci." },
        { q: "Na visinu zaostalih napetosti (naprezanja) kod zavarivanja utječu:", options: ["debljina materijala koji se zavaruje", "sadržaj difuzijskog H2", "položaj zavarenog spoja na zavarenom komadu", "oblik žlijeba za zavarivanje"], correct: [0, 2, 3], note: "Na zaostale napetosti utječu debljina, položaj spoja i oblik žlijeba (i redoslijed prolaza). Difuzijski vodik utječe na hladne pukotine, ne na visinu zaostalih napetosti." },
        { q: "Debljina pasivnog sloja kod CrNi čelika se kreće:", options: ["0,1 - 0,5 nm", "0,1 - 0,5 mm", "0,5 - 0,8 mm", "1 - 10 nm"], correct: [3], note: "Pasivni sloj (Cr2O3) na CrNi čelicima vrlo je tanak, oko 1–10 nm, a obnavlja se sam u prisutnosti kisika. Milimetarske debljine su nemoguće." },
        { q: "Ekvivalent ugljika C može poslužiti za:", options: ["određivanje žilavosti u ZS", "procjenu sklonosti hladnim pukotinama", "procjenu tvrdoće u ZS", "određivanje temperature taljenja čelika"], correct: [1, 2], note: "Ekvivalent ugljika procjenjuje zakaljivost, odnosno tvrdoću u zavarenom spoju, a time i sklonost hladnim pukotinama. Zbirka je ovdje navodila samo tvrdoću, pa je ključ dopunjen." },
        { q: "Bakar koji sadrži O2:", options: ["prikladan je za REL i MIG zavarivanje:", "nije prikladan za REL i MIG zavarivanje dijelova gdje se pojavljuju povišene temperature više od 500°C", "prikladan za toplinsku obradu", "sadržaj O2 < 1% nema utjecaja na prikladnost za zavarivanje"], correct: [1], note: "Bakar s kisikom (Cu2O) iznad oko 500 °C upija vodik, koji s kisikom stvara vodenu paru pod tlakom i razara granice zrna (vodikova bolest). Zato se za zavarivanje i rad na visokim temperaturama koristi bakar bez kisika." },
        { q: "Brzinu korozije izraženu gubitkom mase (g/m²) da bi se preračunala u brzinu prodiranja (mm/a) treba:", options: ["pomnožiti s gustoćom materijala ρ", "podijeliti s gustoćom materijala ρ", "pomnožiti s modulom elastičnosti E", "nije ju moguće preračunati"], correct: [1], note: "Gubitak mase po površini (g/m²) podijeljen s gustoćom (g/cm³) daje debljinu, pa brzinu prodiranja (mm/a) dobivamo dijeljenjem s gustoćom materijala." },
        { q: "Kod izbora visokočvrstih čelika za ledolomce treba izabrati čelik:", options: ["koji ima Rp0,2 visok i nisku prijelaznu ϑ", "koji ima otpornost na habanje", "visoku izdržljivost", "visoku žilavost KV (20 °C) i visok Rm"], correct: [0], note: "Ledolomac radi na niskim temperaturama i pod udarima leda, pa treba visoka granica razvlačenja uz nisku prijelaznu temperaturu (bez krhkog loma). Žilavost pri 20 °C ne govori ništa o ponašanju na hladnom." },
