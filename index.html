<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWE Kviz - Kompletna Priprema</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #334155;
            --skip-bg: #64748b;
            --skip-hover: #475569;
            --cancel-bg: #991b1b;
            --cancel-hover: #7f1d1d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .main-menu-screen, .sub-menu-screen, .quiz-screen, .results-screen, .review-screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background-color: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .option-content {
            display: flex;
            align-items: center;
            width: 100%;
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary);
        }
        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
            pointer-events: auto;
        }
        .tag {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 10px;
            white-space: nowrap;
        }
        
        .option-item.user-correct {
            border-color: var(--success) !important;
            background-color: rgba(34, 197, 94, 0.15) !important;
        }
        .tag-user-correct {
            background-color: var(--success);
            color: #000;
        }

        .option-item.missed-correct {
            border-color: var(--warning) !important;
            background-color: rgba(245, 158, 11, 0.15) !important;
        }
        .tag-missed-correct {
            background-color: var(--warning);
            color: #000;
        }

        .option-item.user-wrong {
            border-color: var(--error) !important;
            background-color: rgba(239, 68, 68, 0.15) !important;
        }
        .tag-user-wrong {
            background-color: var(--error);
            color: #fff;
        }

        .review-card {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .review-q-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .review-opt {
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .review-opt.is-correct {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border-left: 4px solid var(--success);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-main {
            flex: 2;
            font-size: 1.1rem;
        }
        .btn-small {
            flex: 1;
            font-size: 0.9rem;
            padding: 12px 10px;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-skip {
            background-color: var(--skip-bg);
        }
        .btn-skip:hover {
            background-color: var(--skip-hover);
        }
        .btn-cancel {
            background-color: var(--cancel-bg);
        }
        .btn-cancel:hover {
            background-color: var(--cancel-hover);
        }
        .btn-secondary {
            background-color: #475569;
            width: 100%;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .feedback.correct {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .feedback.partial {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        .feedback.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .feedback.skipped {
            background-color: rgba(100, 116, 139, 0.2);
            color: #cbd5e1;
            border: 1px solid #64748b;
        }
        .results-screen {
            text-align: center;
        }
        .results-screen h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .score-display {
            font-size: 1.5rem;
            margin: 20px 0;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">IWE Kviz - Glavni Izbornik</h1>
    
    <!-- 1. GLAVNI MENI (ODABIR KVIZA) -->
    <div id="main-menu-screen" class="main-menu-screen active-screen">
        <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Izaberite koji kviz želite rješavati:</p>
        <div class="menu-buttons">
            <button class="btn" onclick="selectQuizType('old')">📜 Stara ispitna pitanja (127 pitanja)</button>
            <button class="btn" onclick="selectQuizType('extended')">🚀 Novi prošireni kviz (Stara pitanja + Skripte + Predavanja)</button>
        </div>
    </div>

    <!-- 2. POD-MENI (ODABIR BROJA PITANJA) -->
    <div id="sub-menu-screen" class="sub-menu-screen">
        <p id="sub-menu-desc" style="text-align: center; color: #94a3b8; margin-bottom: 20px;"></p>
        <div class="menu-buttons" id="sub-menu-buttons-container"></div>
        <button class="btn btn-secondary" onclick="openReviewAllFromMenu()" style="margin-top: 15px;">📚 Pregled svih pitanja s odgovorima</button>
        <button class="btn btn-cancel" onclick="goToMainMenu()" style="margin-top: 10px; width: 100%;">⬅ Nazad na odabir kviza</button>
    </div>

    <!-- KVIZ EKRAN -->
    <div id="quiz-screen" class="quiz-screen">
        <div class="stats">
            <span id="question-counter">Pitanje: 1 / 30</span>
            <span id="current-score">Bodovi: 0.00</span>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="question-box" id="question-text">Učitavanje pitanja...</div>
        
        <ul class="options-list" id="options-list"></ul>
        
        <div class="btn-group" id="action-buttons">
            <button class="btn btn-cancel btn-small" id="cancel-btn" onclick="confirmCancel()">Odustani</button>
            <button class="btn btn-skip btn-small" id="skip-btn" onclick="skipQuestion()">Preskoči</button>
            <button class="btn btn-main" id="submit-btn" onclick="checkAnswer()">Potvrdi</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- REZULTATI -->
    <div id="results-screen" class="results-screen">
        <h2>Kviz je završen!</h2>
        <div class="score-display" id="final-score"></div>
        <p id="percentage-display"></p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
            <button class="btn btn-secondary" onclick="openReviewCurrentSession()">📝 Pregled pitanja i točnih odgovora iz ovog kruga</button>
            <button class="btn" style="width: 100%;" onclick="goToSubMenu()">Nazad na meni kviza</button>
            <button class="btn btn-cancel" style="width: 100%;" onclick="goToMainMenu()">Glavni izbornik (Odabir kviza)</button>
        </div>
    </div>

    <!-- PREGLED PITANJA EKRAN -->
    <div id="review-screen" class="review-screen">
        <h2 id="review-title" style="text-align: center; margin-bottom: 20px;">Pregled pitanja</h2>
        <div id="review-container"></div>
        <button class="btn" onclick="goToSubMenu()" style="margin-top: 20px; width: 100%;">Nazad na meni kviza</button>
    </div>
</div>

<script>
    // Baza 1: Stara ispitna pitanja (1 - 127)
    const oldQuestions = [
        { q: "Pri zavarivanju istosmjernom strujom više se zagrijava na:", options: ["anoda", "katoda", "obje jednako", "katoda kod TIG, a anoda kod MIG"], correct: [0] },
        { q: "Najveći napon el.luka uz istu struju bit će kod zaštitnog plina:", options: ["Argona", "Vodika", "Dušika", "mješavine Ar/CO2"], correct: [1] },
        { q: "REL zavarivanje elektrode s bazičnom oblogom:", options: ["nisu osjetljive na vlagu", "u pravilu se koriste na (-) polu istosmjerne struje", "dužina el. luka jednaka je polovici promjera elektrode", "obloga sadrži veću količinu CaF2 od drugih elektroda"], correct: [2, 3] },
        { q: "Najčešći razlozi pora od N2 u zavaru pri MAG zavarivanju:", options: ["kada u boci ima do 1% N2", "prejaka struja zavarivanja", "kontaminacija sa N2 iz zraka zbog loše zaštite taline", "loša tehnika rada", "vlaga iz boce, vlaga iz radnog komada i žice", "masnoće i organske masnoće na žici i radnom komadu"], correct: [2, 3, 5] },
        { q: "Plinski plamen (C2H2/O2) kod zavarivanja debelih limova koristi se:", options: ["desna tehnika", "lijeva tehnika", "lijeva tehnika uz primjenu debljeg dodatnog materijala", "nije bitno koja tehnika"], correct: [0] },
        { q: "Kod EPP zavarivanja punom žicom Ø5 mm treba koristiti izvore struje sa:", options: ["padajućom karakteristikom", "ravnom karakteristikom", "ravnom ali s većom strujom zavarivanja", "mogu se obje koristiti"], correct: [0] },
        { q: "Najveća temperatura plinskog plamena dobije se primjenom ovih gorivih plinova:", options: ["Propan/Butan", "Acetilen 3200C", "Metan", "Vodik"], correct: [1] },
        { q: "Kod rezanja plinskim postupkom, rezljivost metala ovisi o:", options: ["temperaturi taljenja", "odnos temperature taljenja i paljenja materijala", "vrsti upotrebljivog plina", "odnosu temperature taljenja i oksida"], correct: [1, 3] },
        { q: "Dezoksidansi pri MAG zavarivanju čelika:", options: ["Al", "Mn", "Si", "W"], correct: [0, 1, 2] },
        { q: "Pri MIG/MAG zavarivanju Cr-Ni čelika najveća penetracija:", options: ["Ar", "Ar+3%O2", "Ar+0,5%O2", "Ar+5%O2O2+0.5%CO2"], correct: [1] },
        { q: "Primjena mješavine Ar+18%CO2 u odnosu na CO2 kod zavarivanja običnih ugljičnih čelika", options: ["veća penetracija", "lošiji prijenos metala", "lošiji prijenos metala i veća penetracija", "bolji prijenos metala i manja penetracija"], correct: [3] },
        { q: "Kod MAG (CO2) zavarivanja žicom Ø 1.2 mm rasponi napona luka i struje zavarivanja", options: ["120A<I<360A ; 17V<U<34V", "80A<I<300A ; 15V<U<27V", "150A<I<500A ; 17V<U<34V", "170A<I<700A ; 19V<U<34V"], correct: [0] },
        { q: "TVRDO lemljenje je tehnologija spajanja gdje je:", options: ["tvrdoća lema veća od 90HB", "tvrdoća lema veća od 180HB", "temperatura lemljenja >250°C", "temperatura lemljenja >450°C"], correct: [3] },
        { q: "Pri lemljenju lemova na bazi srebra, razmak između površina za lemljenje treba biti", options: ["manji od 0,01 mm", "veći od 0,5 mm", "od 0,05 - 0,2 mm", "od 0,5-1 mm"], correct: [2] },
        { q: "Tehnologija ljepljenja", options: ["mogućnost spajanja raznorodnih materijala, je prednost ljepljenja u usporedbi s ostalim", "postizanje visokih čvrstoća spojeva prednost ljepljenja", "neznatno toplinsko djelovanje na spoj prednost ljepljenja", "otpornost na visoke temperature je glavna prednost ljepljenja"], correct: [0, 2] },
        { q: "Vrijednost čvrstoće ljepljenog spoja kod konstrukcijskih ljepila iznosi:", options: ["do 80N/mm2 (napomena od 30-80)", "od 100-200N/mm2", "od 200-300N/mm2", ">300N/mm2"], correct: [0] },
        { q: "Za robotsko zavarivanje Laserom povoljnije je koristiti:", options: ["Nd-YAG kruti laser", "CO2 laser", "N2 plinski laser", "nije bitna vrsta lasera"], correct: [0] },
        { q: "Pri rezanju običnih čelika laserom - kao pomoćni plin za rezanje koristi se", options: ["Vodik (H2)", "Kisik (O2), (napomena: Dušik N2 za Aluminij)", "Acetilen (C2H2)", "Mješavina Vodik/Dušik (H2/N2)"], correct: [1] },
        { q: "Da bi se robotska ruka mogla postaviti u neku točku potrebna su minimalno:", options: ["3 (tri) stupnja slobode", "3 (tri) stupnja slobode rotacije i 3 (tri) translacije", "5 (pet) stupnjeva rotacije", "3 (tri) stupnja rotacije i 5 (tri) translacije"], correct: [0] },
        { q: "Najviša temperatura plinskog plamena ovisi o:", options: ["vrsti gorivog plina", "obliku sapnice", "veličini sapnice", "omjeru gorivog plina i O2"], correct: [0, 3] },
        { q: "Pri TIG zavarivanju bakra velikih debljina - zaštitni plin je:", options: ["Argon", "mješavina N2/H2...80%/20%", "mješavina He/Ar... 60%/40%", "mješavina He/Ar...10%/90%"], correct: [2] },
        { q: "Kod zavarivanja pod troskom:", options: ["struktura zavara je sitnozrnata", "struktura zavara je krupnozrnata", "zavarivanje u vertikalnom položaju"], correct: [1, 2] },
        { q: "Obložene elektrode se čuvaju u skladištu?", options: ["s kontrolom vlažnosti koja mora biti ispod 43%", "s kontrolom vlažnosti koja mora biti ispod 55%", "vlažnost u skladištu nije bitna, ali temperatura treba biti 10°C od vanjske temperature", "vlažnost treba biti ispod 70%, a temperatura 30-40°C"], correct: [0] },
        { q: "Kod zavarivanja bazičnom elektrodom u odnosu na zavarivanje rutilnom elektrodom dobiju se:", options: ["zavari s većom udarnom radnjom loma", "blaži zavari s manjim nadvišenjem", "zavari s manjim nadvšenjem kod kutnih zavara i većim nadvišenjem kod sučeljenih zavara", "zavari s većom prekidnom čvrstoćom"], correct: [0] },
        { q: "Kod TIG zavarivanja Cr-Ni čelika zaštita korjenskog zavara vrši se plinovima?", options: ["Argon (skuplji od dušik/vodik)", "Dušik/Vodik (vodika <20%)", "Argon/CO2 (CO2 10-20%)", "Dušik/Vodik (vodik 50-80%)"], correct: [0, 1] },
        { q: "Kod TIG zavarivanja odozgo na dolje zavarivanje se izvodi:", options: ["bez dodatnog materijala", "s dodatnim materijalom ako je kutni spoj", "nije bitno ako se koristi dodatni materijal", "s dodatnim materijalom ako je sučelleni spoj"], correct: [0] },
        { q: "Padovi napona u električnom luku mogu biti:", options: ["za REL zavarivanje 15-18V", "za CO2 zavarivanje 18-25V", "za EPP zavarivanje 15-30V", "za EPT zavarivanje 26 - 40V"], correct: [1, 3] },
        { q: "Kod impulsnog MAG zavarivanja čelika žicom Ø1.2 mm, srednjom vrednošću struje 340A, zavarivanje u nadglavnom položaju:", options: ["moguće je bez problema", "nije moguće", "moguće je uz niže napone električnog luka", "moguće kod velikih brzina zavarivanja i njihanje el. luka"], correct: [1] },
        { q: "MIG zavarivanje može se koristiti za zavarivanje", options: ["Aluminija ako se koristi plin Ar", "Aluminija ako se koristi mješavina plina Ar+He", "Cr-Ni čelika kod koga se koristi plin Ar+2% O2", "Ugljični čelik s Ar+12%CO2"], correct: [0, 1] },
        { q: "Kod zavarivanja plinskim plamenom C2H2+O2 kod debelih limova koristi se:", options: ["desna tehnika", "lijeva tehnika", "lijeva tehnika uz primjenu debljeg dodatnog materijala", "nije bitno koja tehnika"], correct: [0] },
        { q: "Kod MIG/MAG zavarivanja Cr-Ni čelika najbolje je koristiti ove plinove i mješavine", options: ["Ar+1-10%O2; Ar+2-3%CO2", "Ar", "Ar+6%CO2", "Ar+20%N2"], correct: [0] },
        { q: "Kod EPP zavarivanja napon električnog luka ovisi:", options: ["jakosti struje i vrsti praška", "samo o jakosti struje", "samo o vrsti praška", "o brzini zavarivanja i jakosti struje"], correct: [0] },
        { q: "Kvašenje površina metala kod lemljenja najbolje je kada je kut kvašenja", options: ["10°", "20°", "60°", "90°"], correct: [0] },
        { q: "Kod REL zavarivanja", options: ["BAZIČNA elektroda drži se na desnu stranu, a dužina luka je jednaka ½Ø elektrode", "BAZIČNA elektroda se drži pod kutem 80 - 85°u smjeru zavarivanja a dužina luka jednaka je 1/2 Ø elektrode", "KISELA elektroda se drži vertikalno, dužina luka jednaka je promjeru elektrode", "RUTILNA elektroda se drži pod kutem od 70-80°, dužina el. Luka jednaka je Ø elektrode"], correct: [1, 3] },
        { q: "Kod elektrootpornog točkastog zavarivanja, vremena zavarivanja su najčešća:", options: ["do 0,01 s", "od 0,05 - 0,08 s", "od 0,1 - 0,5 s", "1-5 s"], correct: [2] },
        { q: "Kod zavarivanja običnih konstrukcijskih čelika koristi se mješavina plinova Ar+18% CO2", options: ["dobije se bolja penetracija", "dobije se lošiji prijenos metala", "dobije se lošiji prijenos metala i veća penetracija", "dobije se bolji prijenos metala i manja penetracija"], correct: [2] },
        { q: "Korekcija promjene napona električne mreže, ugrađen el. sklop koji automatski regulira napon, moguće je napraviti sa izvorima struje:", options: ["Ispravljač s pomičnom kotvom", "Ispravljač s promjenom broja zavoja", "Ispravljač s tiristorima", "Ispravljač s tranzistorima"], correct: [2, 3] },
        { q: "Prema EN standardu označavaju se postupci zavarivanja:", options: ["112 REL", "131 MIG", "135 MAG", "141 TIG"], correct: [1, 2, 3] },
        { q: "Na dubinu penetracije kod MAG zavarivanja bitno utječu ovi parametri i ove kombinacije parametara:", options: ["struja zavarivanja", "brzina zavarivanja", "struja i brzina zavarivanja u kombinacijama", "napon i slobodni kraj žice"], correct: [0, 1, 2] },
        { q: "Uvjet da bude zavarljiv plastomer:", options: ["da bude niže gustoće", "da postoji termo plastično stanje", "da ima dovoljnu istezljivost", "da ima veliki modul elastičnosti"], correct: [1] },
        { q: "Glavni uzroci pora kod zavarivanja Al legura:", options: ["nečist osnovni i dodatni materijal", "nečist plin", "loši parametri", "loša tehnika rada"], correct: [0, 1, 2, 3] },
        { q: "Koji su kvalitetni postupci zavarivanja Al", options: ["Plinsko", "MAG", "MIG", "TIG"], correct: [2, 3] },
        { q: "Kod izvora istosmjerne struje prema EN HR normama, maksimalni napon praznog hoda može biti:", options: ["(=) Istosmjerna struja do 110 V", "(=) Istosmjerna struja do 70 V", "(~) Izmjenična struja do 90 V", "(~) Izmjenična struja do 70 V"], correct: [0] },
        { q: "Svojstva elektroda za REL zavarivanje s bazičnom elektrodom:", options: ["nisu osjetljive na vlagu", "u pravilu se koriste na (+) polu istosmjerne struje", "dužina elek. luka jednaka je 1½ promjera elektrode", "dobiju se zavari loših mehaničkih svojstava"], correct: [1, 2] },

        { q: "Što je to 'Ozon' (O3) i kakav miris ima u blizini mjesta zavarivanja?", options: ["Oštar plin plavkaste boje", "Karakterističan 'miris svježine / električnog izbijanja'", "Plin koji jako nadražuje oči i pluća", "Plin bez mirisa koji uspavljuje radnika"], correct: [0, 1, 2] },
        { q: "Koji postupak zavarivanja generira NAJVEĆU količinu UV zračenja i ozona u okolni zrak?", options: ["REL zavarivanje bazičnom elektrodom na niskim strujama", "TIG zavarivanje aluminija", "MIG zavarivanje aluminija visoko-strujnim lukom u argonu", "Zavarivanje pod praškom (EPP)"], correct: [1, 2] },
        { q: "Zašto zavarivanje pod praškom (EPP) generira NAJMANJE UV zračenja i dima u radionici?", options: ["Jer EPP ne koristi električnu struju", "Električni luk je u potpunosti prekriven slojem granuliranog praška", "Sloj praška blokira zračenje i plinove", "Jer se rad izvodi u vodenom bazenu"], correct: [1, 2] },
        { q: "Koji je osnovni nedostatak EPP postupka s ekološkog i zdravstvenog stajališta pri čišćenju troske?", options: ["Stvaranje opasnih količina zapaljivog vodika", "Stvaranje fine prašine od praška i troske", "Prašina sadrži fluoride i silikate te zahtijeva nošenje maske i usisavanje", "Velika buka pri izgaranju praška"], correct: [1, 2] },
        { q: "Što propisuje norma EN ISO 14175 u tehnologiji zavarivanja?", options: ["Normu za ispitivanje tvrdoće metala", "Klasifikaciju i označavanje zaštitnih plinova i mješavina plinova", "Pravila za lučno zavarivanje i rezanje", "Dimenzije plinskih boca i navoja"], correct: [1, 2] },
        { q: "Prema EN ISO 14175, kojoj skupini plinova pripadaju čisti Argon i Helij te njihove mješavine?", options: ["Skupini M (Mješoviti aktivni plinovi)", "Skupini I (Inertni plinovi - I1, I2, I3)", "Skupini C (Aktivni plinovi na bazi CO2)", "Skupini R (Reducirajući plinovi)"], correct: [1] },
        { q: "Prema EN ISO 14175, kojoj skupini plinova pripadaju mješavine Argona s CO2 i/ili Kisikom za MAG zavarivanje?", options: ["Skupini I (Inertni plinovi)", "Skupini M (Mješoviti aktivni plinovi - M1, M2, M3)", "Skupini F (Zapaljivi plinovi)", "Skupini N (Dušični plinovi)"], correct: [1] },
        { q: "Prema EN ISO 14175, kojoj skupini plinova pripada čisti Ugljični dioksid (CO2)?", options: ["Skupini I1", "Skupini C (Aktivni plin C1)", "Skupini R1", "Skupini M2"], correct: [1] },
        { q: "Prema EN ISO 14175, kojoj skupini plinova pripadaju mješavine s dodatkom Vodika (H2)?", options: ["Skupini C", "Skupini R (Reducirajući plinovi - R1, R2)", "Skupini I", "Skupini M3"], correct: [1] },
        { q: "Koji je osnovni razlog što se plin skupine R1 (Ar + H2) NE SMIJE koristiti za zavarivanje feritnih i nelegiranih čelika?", options: ["Vodik reagira s čelikom i pretvara ga u aluminij", "Rizik od unosa vodika u metal zavara", "Rizik od nastanka teških vodikovih (hladnih) pukotina u čeliku", "Vodik ugasi električni luk unutar 1 sekunde"], correct: [1, 2] },
        { q: "Koja je uloga malo postotka O2 (1-2%) u argonu pri MIG zavarivanju nehrđajućih austenitnih čelika (skupina M11)?", options: ["Ugljičenje metala zavara", "Poboljšanje stabilnosti luka", "Smanjenje površinske napetosti i bolje kvašenje rubova bez gubitka korozijske otpornosti", "Bojenje zavara u crvenu boju"], correct: [1, 2] },
        { q: "Što je to 'Ekvivalent Dušika' ili utjecaj Dušika u zaštitnom plinu pri zavarivanju Duplex nehrđajućih čelika?", options: ["Dušik u plinu sprječava gubitak dušika iz taline", "Pomaže obnavljanju austenitne faze u metalu zavara i ZUT-u", "Dušik uzrokuje tešku poroznost i izbacuje se iz uporabe", "Dušik pretvara duplex u čisti ferit"], correct: [0, 1] },
        { q: "Koja je glavna uloga Bakrenog podloška (Copper backing bar) pri zavarivanju?", options: ["Slaganje iskri u redove", "Odvajanje topline i oblikovanje korijenskog zavara", "Sprječavanje prokapljivanja bez privarivanja za čelik", "Ispravljanje napona struje iz mreže"], correct: [1, 2] },
        { q: "Zašto se bakreni podložak često hladi VODOM pri automatskom zavarivanju lima uzdužnim šavom?", options: ["Da bi se bakar pretvorio u led", "Radi brzog odvođenja topline", "Radi sprječavanja progorijevanja samog bakra i održavanja konstantnih uvjeta hlađenja", "Radi smanjenja mase aparata"], correct: [1, 2] },
        { q: "Koja je opasnost ako se bakreni podložak pretjerano rastali i pomiješa s tekućim čelikom pod lukom?", options: ["Zavar postaje nehrđajući", "Ulazak bakra na granice zrna čelika uzrokuje tešku bakrenu krhkost", "Pojavljuju se 'tople pukotine' u metalu zavara", "Čelik dobiva zlatnu boju i veću vrijednost"], correct: [1, 2] },
        { q: "Što je to 'Keramička mlaznica' (Ceramic nozzle) na TIG ili MIG/MAG pištolju i zašto se izrađuje od keramike?", options: ["Mlaznica koja se spaja na vodovod", "Mlaznica koja usmjerava zaštitni plin", "Izrađuje se od Al2O3 keramike jer je izvrstan električni izolator i otporna na visoke temp.", "Mlaznica koja sakuplja trosku iz zraka"], correct: [1, 2] },
        { q: "Što je to 'Gas Lens' (Plinske leće) u TIG gorioniku?", options: ["Optička leća za povećanje slike zavara", "Sklop od finih mrežica od nehrđajućeg čelika unutar sapnice", "Pretvara turbulentno strujanje plina u savršeno LAMINARNO strujanje", "Filter za čišćenje argona iz boce"], correct: [1, 2] },
        { q: "Koje su prednosti uporabe Plinske leće (Gas Lens) pri TIG zavarivanju?", options: ["Bolja i stabilnija plinska zaštita", "Mogućnost većeg izvlačenja elektrode (do 20 mm) i rad u uskim žlijebovima", "Ušteda zaštitnog plina", "Smanjenje struje zavarivanja za 90%"], correct: [0, 1, 2] },
        { q: "Što je to 'Turbulentno strujanje' zaštitnog plina i zašto je ŠTETNO pri zavarivanju?", options: ["Strujanje plina u obliku krugova koje hladi gorionik", "Miješanje zaštitnog plina s okolnim zrakom uslijed prevelikog protoka ili loše mlaznice", "Uzrokuje oksidaciju i pojavu pora u zavaru", "Strujanje plina pod vodom"], correct: [1, 2] },
        { q: "Što se događa ako zavarivač podesi PREVELIK protok zaštitnog plina na regulatoru (npr. 50 l/min na maloj TIG mlaznici)?", options: ["Zaštita postaje 10 puta bolja", "Laminarno strujanje prelazi u turbulentno", "Povlači okolni zrak u zonu luka uzrokujući oksidaciju i poroznost", "Brzina zavarivanja se poveća 3 puta"], correct: [1, 2] },
        { q: "Koliki je pravilan raspon protoka argona pri standardnom ručnom TIG zavarivanju čelika mlaznicom br. 6 ili 7?", options: ["1 do 2 l/min", "6 do 10 l/min", "30 do 50 l/min", "Točno 100 l/min"], correct: [1] },
        { q: "Koja je funkcija 'Pre-flow' (Pred-protok) vremena plina na TIG/MIG aparatu?", options: ["Protok plina nakon završetka rada", "Protok plina nekoliko sekundi PRIJE paljenja luka", "Služi za istiskivanje zraka iz crijeva i zaštitu mjesta početka zavara", "Protok plina tijekom pauze za ručak"], correct: [1, 2] },
        { q: "Koja je funkcija 'Post-flow' (Poslije-protok) vremena plina na TIG aparatu?", options: ["Protok plina za čišćenje stola", "Protok plina nakon gašenja luka", "Štiti vruću talinu i vrh volframove elektrode od oksidacije dok se ne ohlade", "Grijanje vode u aparatu"], correct: [1, 2] },
        { q: "Koliko bi otprilike trebalo trajati 'Post-flow' vrijeme plina pri TIG zavarivanju strujom od 150 A s volfram elektrodom Ø2.4 mm?", options: ["Točno 0.1 sekundu", "Oko 8 do 15 sekundi", "Računa se kao otprilike 1 sekunda po svakih 10-15 A struje", "Post-flow nije potreban"], correct: [1, 2] },
        { q: "Što označava pojava da je vrh volframove elektrode nakon gašenja TIG luka CRN ili TAMNO SMEĐ?", options: ["Da je elektroda vrhunske kvalitete", "Prekratko post-flow vrijeme plina ili propuštanje zraka u gorioniku", "Vrh je oksidirao na zraku dok je bio vruć", "Da je upotrijebljen čisti helij"], correct: [1, 2] },
        { q: "Koji je izgled pravilno zaštićenog i ohlađenog vrha volframove elektrode nakon gašenja TIG luka?", options: ["Potpuno crni mat vrh s pepelom", "Sjajan, srebrnkasto-metalni vrh", "Vrh bez ikakvih oksida i boja popuštanja", "Zeleni vrh od korozije"], correct: [1, 2] }
    ];

    let activeQuestions = [];
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let currentSessionQuestions = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Korak 1: Korisnik bira vrstu kviza
    function selectQuizType(type) {
        if (type === 'old') {
            activeQuestions = oldQuestions;
            document.getElementById('app-title').innerText = "Stara ispitna pitanja";
            document.getElementById('sub-menu-desc').innerText = "Izaberite koliko stara pitanja želite rješavati:";
        } else {
            activeQuestions = extendedQuestions;
            document.getElementById('app-title').innerText = "Novi prošireni kviz (Skripte i Predavanja)";
            document.getElementById('sub-menu-desc').innerText = "Izaberite koliko pitanja iz proširenog gradiva želite rješavati:";
        }

        document.getElementById('main-menu-screen').style.display = 'none';
        
        const subMenuContainer = document.getElementById('sub-menu-buttons-container');
        subMenuContainer.innerHTML = '';

        const totalAvailable = activeQuestions.length;
        // Dinamički prilagođavamo opcije broja pitanja ovisno o bazi
        let optionsCount = totalAvailable > 150 ? [30, 60, 90, 150, 200, totalAvailable] : [30, 60, 90, totalAvailable];

        optionsCount.forEach(count => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            if (count >= totalAvailable) {
                btn.innerText = `Sve (ukupno ${totalAvailable} pitanja)`;
            } else {
                btn.innerText = `${count} pitanja`;
            }
            btn.onclick = () => startQuiz(count);
            subMenuContainer.appendChild(btn);
        });

        document.getElementById('sub-menu-screen').style.display = 'block';
    }

    function goToMainMenu() {
        document.getElementById('sub-menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('review-screen').style.display = 'none';
        document.getElementById('main-menu-screen').style.display = 'block';
        document.getElementById('app-title').innerText = "IWE Kviz - Glavni Izbornik";
    }

    function goToSubMenu() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('review-screen').style.display = 'none';
        document.getElementById('sub-menu-screen').style.display = 'block';
    }

    function startQuiz(limit) {
        let shuffledAll = JSON.parse(JSON.stringify(activeQuestions));
        shuffle(shuffledAll);
        
        questions = shuffledAll.slice(0, Math.min(limit, shuffledAll.length));
        currentSessionQuestions = questions;
        
        currentIndex = 0;
        score = 0;

        document.getElementById('sub-menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function confirmCancel() {
        if (confirm("Jeste li sigurni da želite odustati od ovog kruga i vratiti se nazad?")) {
            goToSubMenu();
        }
    }

    function openReviewAllFromMenu() {
        showReviewScreen(activeQuestions, "Pregled svih pitanja i točnih odgovora izabranog kviza");
    }

    function openReviewCurrentSession() {
        showReviewScreen(currentSessionQuestions, "Pregled pitanja i točnih odgovora iz ovog kruga");
    }

    function showReviewScreen(questionsArray, titleText) {
        document.getElementById('main-menu-screen').style.display = 'none';
        document.getElementById('sub-menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'none';
        
        const reviewScreen = document.getElementById('review-screen');
        reviewScreen.style.display = 'block';

        document.getElementById('review-title').innerText = titleText;
        const container = document.getElementById('review-container');
        container.innerHTML = '';

        questionsArray.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'review-card';

            const title = document.createElement('div');
            title.className = 'review-q-title';
            title.innerText = `${idx + 1}. ${q.q}`;
            card.appendChild(title);

            q.options.forEach((opt, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'review-opt';
                
                let isCorrectAns = q.correct.includes(optIdx);
                if (isCorrectAns) {
                    optDiv.classList.add('is-correct');
                    optDiv.innerText = `✓ ${opt} (Točan odgovor)`;
                } else {
                    optDiv.innerText = `• ${opt}`;
                }
                card.appendChild(optDiv);
            });

            container.appendChild(card);
        });
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        document.getElementById('question-counter').innerText = `Pitanje: ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('current-score').innerText = `Bodovi: ${score.toFixed(2)}`;
        
        const progressPercent = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;

        document.getElementById('question-text').innerText = q.q;

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        q.options.forEach((opt, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.id = `opt-item-${index}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'option-content';

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = 'quiz-option';
            input.value = index;
            input.id = `opt-${index}`;

            const label = document.createElement('label');
            label.htmlFor = `opt-${index}`;
            label.innerText = opt;
            label.style.width = '100%';
            label.style.cursor = 'pointer';

            contentDiv.appendChild(input);
            contentDiv.appendChild(label);
            li.appendChild(contentDiv);

            const tagSpan = document.createElement('span');
            tagSpan.id = `tag-${index}`;
            li.appendChild(tagSpan);
            
            li.onclick = (e) => {
                if (!input.disabled) {
                    if (e.target !== input) {
                        input.checked = !input.checked;
                    }
                }
            };

            optionsList.appendChild(li);
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'none';
        feedback.className = 'feedback';
        
        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `
            <button class="btn btn-cancel btn-small" id="cancel-btn" onclick="confirmCancel()">Odustani</button>
            <button class="btn btn-skip btn-small" id="skip-btn" onclick="skipQuestion()">Preskoči</button>
            <button class="btn btn-main" id="submit-btn" onclick="checkAnswer()">Potvrdi</button>
        `;
    }

    function skipQuestion() {
        const q = questions[currentIndex];
        const correctSet = new Set(q.correct);

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);

            if (isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '✓ Točan odgovor';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        feedback.innerText = `Pitanje je preskočeno (+0.00 bodova).`;
        feedback.className = 'feedback skipped';

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function checkAnswer() {
        const q = questions[currentIndex];
        const inputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        
        if (inputs.length === 0) {
            alert("Molimo odaberite odgovor ili kliknite 'Preskoči' / 'Odustani'!");
            return;
        }

        let selectedIndices = Array.from(inputs).map(inp => parseInt(inp.value));
        
        let correctSet = new Set(q.correct);
        let selectedSet = new Set(selectedIndices);

        let points = 0;
        let totalCorrectNeeded = q.correct.length;
        let hasWrongSelection = false;

        selectedIndices.forEach(idx => {
            if (!correctSet.has(idx)) {
                hasWrongSelection = true;
            }
        });

        if (hasWrongSelection) {
            points = -1;
        } else {
            selectedIndices.forEach(idx => {
                if (correctSet.has(idx)) {
                    points += (1 / totalCorrectNeeded);
                }
            });
        }

        score += points;

        q.options.forEach((opt, index) => {
            const itemElement = document.getElementById(`opt-item-${index}`);
            const inputElement = document.getElementById(`opt-${index}`);
            const tagElement = document.getElementById(`tag-${index}`);
            inputElement.disabled = true;

            let isCorrect = correctSet.has(index);
            let isSelected = selectedSet.has(index);

            if (isSelected && isCorrect) {
                itemElement.classList.add('user-correct');
                tagElement.className = 'tag tag-user-correct';
                tagElement.innerText = '✓ Tvoj odabir (Točno)';
            } else if (!isSelected && isCorrect) {
                itemElement.classList.add('missed-correct');
                tagElement.className = 'tag tag-missed-correct';
                tagElement.innerText = '⚠ Propušteno (Točno)';
            } else if (isSelected && !isCorrect) {
                itemElement.classList.add('user-wrong');
                tagElement.className = 'tag tag-user-wrong';
                tagElement.innerText = '✗ Tvoj odabir (Krivo)';
            }
        });

        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        
        let isTotallyCorrect = !hasWrongSelection && selectedSet.size === correctSet.size && [...selectedSet].every(val => correctSet.has(val));

        if (isTotallyCorrect) {
            feedback.innerText = `Potpuno točno! Osvojeno bodova: +${points.toFixed(2)}`;
            feedback.className = 'feedback correct';
        } else if (!hasWrongSelection && selectedIndices.length < totalCorrectNeeded) {
            feedback.innerText = `Djelomično točno! Nisi označio/la sve točne odgovore. Bodovi: +${points.toFixed(2)}`;
            feedback.className = 'feedback partial';
        } else {
            feedback.innerText = `Netočno! Odabran je krivi odgovor. Bodovi: ${points.toFixed(2)}`;
            feedback.className = 'feedback incorrect';
        }

        const actionButtons = document.getElementById('action-buttons');
        actionButtons.innerHTML = `<button class="btn btn-main" style="width: 100%;" onclick="nextQuestion()">Sljedeće pitanje</button>`;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        
        let maxPossibleScore = questions.length;
        let percentage = (score / maxPossibleScore) * 100;
        if (percentage < 0) percentage = 0;

        document.getElementById('final-score').innerText = `Ukupno bodova: ${score.toFixed(2)} / ${maxPossibleScore}`;
        document.getElementById('percentage-display').innerText = `Postotak uspješnosti: ${percentage.toFixed(1)}%`;
    }

    window.onload = goToMainMenu;
</script>
